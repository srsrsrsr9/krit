<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Miswanting — The Photographer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFF7ED;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,sans-serif}
#w{position:relative;width:100%;max-width:720px}
svg{width:100%;height:auto;display:block}
#rb{position:absolute;bottom:12px;right:12px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.75}
#rb:hover{opacity:1}
#ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(31,41,55,0.52);backdrop-filter:blur(3px);border-radius:12px;z-index:20;cursor:pointer}
#ov-btn{background:#FFF7ED;border-radius:50%;width:72px;height:72px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(0,0,0,0.28);transition:transform .15s}
#ov:hover #ov-btn{transform:scale(1.1)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="w">
<svg id="svg" viewBox="0 0 720 490" xmlns="http://www.w3.org/2000/svg"
     aria-label="Brain photographer animation: only PEAK and END memories are saved">

  <rect width="720" height="490" fill="#FFF7ED"/>

  <!-- LEFT PANEL: title + strips + brain + camera + bin (x 0-440) -->
  <!-- RIGHT PANEL: corkboard (x 455-715) -->

  <!-- Title (left-aligned over left panel) -->
  <text x="220" y="40" text-anchor="middle" font-size="21" font-weight="700" fill="#1F2937">Your brain remembering yesterday.</text>
  <text x="220" y="60" text-anchor="middle" font-size="13" fill="#9CA3AF">(allegedly)</text>

  <!-- CORKBOARD — right panel, fixed, never moves -->
  <rect x="455" y="72" width="255" height="400" rx="12" fill="#C8A882" stroke="#92683A" stroke-width="2.5"/>
  <rect x="466" y="83" width="233" height="378" rx="7" fill="#D4A96A" opacity="0.28"/>
  <text x="583" y="102" text-anchor="middle" font-size="11" font-weight="700" fill="#7C5C2E">MEMORY BOARD</text>
  <!-- Cork texture dots -->
  <circle cx="478" cy="88" r="3" fill="#92683A" opacity="0.2"/>
  <circle cx="690" cy="88" r="3" fill="#92683A" opacity="0.2"/>
  <circle cx="478" cy="460" r="3" fill="#92683A" opacity="0.2"/>
  <circle cx="690" cy="460" r="3" fill="#92683A" opacity="0.2"/>

  <!-- PEAK frame — inside corkboard -->
  <g id="pk" opacity="0" transform="translate(528,215)">
    <rect x="-40" y="-52" width="80" height="62" rx="5" fill="#1F2937"/>
    <rect x="-32" y="-44" width="64" height="44" rx="3" fill="#059669" opacity="0.9"/>
    <text x="0" y="-18" text-anchor="middle" font-size="11" fill="white" font-weight="700" font-family="ui-monospace,monospace">PEAK</text>
    <text x="0" y="-5"  text-anchor="middle" font-size="8" fill="white" opacity="0.85">best moment</text>
    <rect x="-40" y="-18" width="8"  height="28" rx="2" fill="#374151"/>
    <rect x="32"  y="-18" width="8"  height="28" rx="2" fill="#374151"/>
    <circle id="pk-tack" cx="0" cy="-54" r="6" fill="#F43F5E" opacity="0"/>
  </g>

  <!-- END frame — inside corkboard -->
  <g id="en" opacity="0" transform="translate(635,345)">
    <rect x="-40" y="-52" width="80" height="62" rx="5" fill="#1F2937"/>
    <rect x="-32" y="-44" width="64" height="44" rx="3" fill="#0369A1" opacity="0.9"/>
    <text x="0" y="-18" text-anchor="middle" font-size="11" fill="white" font-weight="700" font-family="ui-monospace,monospace">END</text>
    <text x="0" y="-5"  text-anchor="middle" font-size="8" fill="white" opacity="0.85">last moment</text>
    <rect x="-40" y="-18" width="8"  height="28" rx="2" fill="#374151"/>
    <rect x="32"  y="-18" width="8"  height="28" rx="2" fill="#374151"/>
    <circle id="en-tack" cx="0" cy="-54" r="6" fill="#F59E0B" opacity="0"/>
  </g>

  <!-- FILMSTRIPS — 8 strips, y=108, x-centers: 28+i*48  (i=0→28, i=7→364)
       Right edge of last strip: 364+19=383 — well clear of corkboard at 455 -->
  <g id="strips-row"/>

  <!-- BRAIN — center (178,290), clear below strips (y>130) and left of corkboard -->
  <g transform="translate(178,290)">
    <ellipse cx="0" cy="0" rx="50" ry="46" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2.5"/>
    <path d="M-22,-28 Q-36,-48 -20,-52 Q-5,-56 2,-44 Q8,-56 24,-52 Q40,-48 22,-28"
          fill="#EDE9FE" stroke="#8B5CF6" stroke-width="2"/>
    <ellipse cx="-14" cy="-7" rx="5" ry="6" fill="white" stroke="#1F2937" stroke-width="1.5"/>
    <ellipse cx="14"  cy="-7" rx="5" ry="6" fill="white" stroke="#1F2937" stroke-width="1.5"/>
    <circle cx="-13" cy="-6" r="2.5" fill="#1F2937"/>
    <circle cx="15"  cy="-6" r="2.5" fill="#1F2937"/>
    <path d="M-20,-15 Q-14,-18 -8,-15" fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M8,-15 Q14,-18 20,-15"   fill="none" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-8,13 Q0,17 8,13"      fill="none" stroke="#1F2937" stroke-width="2"   stroke-linecap="round"/>
    <path d="M-46,8 Q-56,20 -46,30"  fill="none" stroke="#8B5CF6" stroke-width="3"   stroke-linecap="round"/>
    <path d="M46,8  Q56,20  46,30"   fill="none" stroke="#8B5CF6" stroke-width="3"   stroke-linecap="round"/>
  </g>

  <!-- CAMERA — at (178,362), directly below brain -->
  <g id="camera" transform="translate(178,364)">
    <rect x="-28" y="-18" width="56" height="38" rx="8" fill="#374151" stroke="#1F2937" stroke-width="2"/>
    <circle cx="0" cy="3" r="12" fill="#111827" stroke="#6B7280" stroke-width="2"/>
    <circle cx="0" cy="3" r="7" fill="#1e3a5f"/>
    <circle cx="0" cy="3" r="3.5" fill="#0EA5E9" opacity="0.7"/>
    <rect x="-9" y="-22" width="18" height="6" rx="3" fill="#F59E0B"/>
    <circle cx="18" cy="-20" r="4" fill="#6B7280"/>
    <rect x="20" y="3" width="7" height="12" rx="2" fill="#111827" stroke="#6B7280" stroke-width="1"/>
    <rect id="card-glow" x="21" y="4" width="5" height="10" rx="1" fill="#F43F5E"/>
    <rect x="-27" y="-16" width="7" height="5" rx="2" fill="#6B7280"/>
  </g>

  <!-- WASTEBIN — bottom-left, well clear of brain (brain bottom ≈ 336, bin top ≈ 396) -->
  <g id="bin" transform="translate(72,444)">
    <rect x="-28" y="-48" width="56" height="52" rx="5" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="2"/>
    <line x1="-10" y1="-42" x2="-10" y2="-2" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="0"   y1="-42" x2="0"   y2="-2" stroke="#D1D5DB" stroke-width="1.5"/>
    <line x1="10"  y1="-42" x2="10"  y2="-2" stroke="#D1D5DB" stroke-width="1.5"/>
    <rect x="-32" y="-54" width="64" height="10" rx="4" fill="#D1D5DB" stroke="#9CA3AF" stroke-width="1.5"/>
    <rect x="-8"  y="-60" width="16" height="8"  rx="3" fill="#9CA3AF"/>
  </g>

  <!-- Flash overlay -->
  <rect id="flash" x="0" y="0" width="720" height="490" fill="white" opacity="0" pointer-events="none"/>

  <!-- Caption — very bottom, full-width centered -->
  <text id="cap" x="220" y="480" text-anchor="middle" font-size="12" fill="#6B7280" opacity="0">
    Two frames out of eight. The other six become the future you forgot to plan for.
  </text>

</svg>
<button id="rb">↺ reset</button>
<div id="ov"><div id="ov-btn"><svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M7 4l18 10L7 24V4z" fill="#1F2937"/></svg></div></div>
</div>

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';

// ── AUDIO ENGINE ──────────────────────────────────────
let AC=null,bgTimer=null,bgIdx=0;
function getAC(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
document.addEventListener('click',()=>{ try{getAC();}catch(e){}},{passive:true});

function tone(freq,dur,delay,type,vol){
  delay=delay||0;type=type||'sine';vol=vol||0.2;
  try{
    const c=getAC(),t=c.currentTime+delay;
    const osc=c.createOscillator(),g=c.createGain();
    osc.connect(g);g.connect(c.destination);
    osc.type=type;osc.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,0.05));
    osc.start(t);osc.stop(t+dur+0.12);
  }catch(e){}
}
function nz(dur,delay,fc,vol){
  delay=delay||0;fc=fc||1000;vol=vol||0.28;
  try{
    const c=getAC(),sr=c.sampleRate,t=c.currentTime+delay;
    const buf=c.createBuffer(1,Math.ceil(sr*Math.max(dur,0.05)),sr);
    const d=buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    const src=c.createBufferSource();src.buffer=buf;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;f.Q.value=1;
    const g=c.createGain();
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,0.05));
    src.connect(f);f.connect(g);g.connect(c.destination);
    src.start(t);src.stop(t+dur+0.12);
  }catch(e){}
}
function sfxShutter(){ nz(0.06,0,5000,0.45);nz(0.1,0.06,600,0.25);tone(100,0.12,0.05,'sine',0.18);}
function sfxWhoosh(){ try{const c=getAC(),t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sawtooth';o.frequency.setValueAtTime(700,t);o.frequency.exponentialRampToValueAtTime(100,t+0.5);g.gain.setValueAtTime(0.08,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);o.start(t);o.stop(t+0.55);}catch(e){}}
function sfxBonk(){ tone(260,0.2,0,'sine',0.5);nz(0.08,0,500,0.22);try{const c=getAC(),t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.type='sine';o.frequency.setValueAtTime(260,t);o.frequency.exponentialRampToValueAtTime(60,t+0.22);g.gain.setValueAtTime(0.45,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.25);o.start(t);o.stop(t+0.3);}catch(e){}}
function sfxPin(){ tone(1400,0.06,0,'square',0.1);tone(700,0.2,0.05,'sine',0.2);}
function sfxDing(){ tone(880,0.55,0,'sine',0.25);tone(1320,0.4,0.04,'sine',0.14);}

const BG=[261.63,329.63,392,523.25,659.25,523.25,392,329.63];
function startBg(){
  if(bgTimer) return;
  function beat(){
    const f=BG[bgIdx%BG.length];
    tone(f,2.5,0,'sine',0.032);
    tone(f*1.498,2,0,'triangle',0.016);
    bgIdx++;
    bgTimer=setTimeout(beat,2000);
  }
  beat();
}
function stopBg(){clearTimeout(bgTimer);bgTimer=null;}

// ── UTILS ────────────────────────────────────────────
function $id(id){return document.getElementById(id);}
function setOp(id,v){const e=$id(id);if(e)e.setAttribute('opacity',String(v));}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOut(t){return 1-Math.pow(1-t,3);}
function animOp(id,a,b,dur,cb){
  const e=$id(id);if(!e)return;
  const s=performance.now();
  function tick(now){
    const t=Math.min((now-s)/dur,1),v=lerp(a,b,easeOut(t));
    e.setAttribute('opacity',String(v));
    if(t<1) requestAnimationFrame(tick); else if(cb) cb();
  }
  requestAnimationFrame(tick);
}

let tms=[];
function after(ms,fn){tms.push(setTimeout(fn,ms));}
function clearAll(){tms.forEach(clearTimeout);tms=[];stopBg();}

// Glow pulse
let glowRaf=null;
function startGlow(){
  function tick(){
    const v=0.35+0.65*Math.abs(Math.sin(performance.now()/650));
    const e=$id('card-glow');if(e)e.setAttribute('opacity',String(v));
    glowRaf=requestAnimationFrame(tick);
  }
  glowRaf=requestAnimationFrame(tick);
}
function stopGlow(){if(glowRaf){cancelAnimationFrame(glowRaf);glowRaf=null;}}

function doFlash(cb){
  const f=$id('flash');let s=null;
  function tick(now){
    if(!s)s=now;
    const t=Math.min((now-s)/180,1);
    f.setAttribute('opacity',t<0.5?t*1.6:(1-t)*1.6);
    if(t<1)requestAnimationFrame(tick);else{f.setAttribute('opacity','0');if(cb)cb();}
  }
  requestAnimationFrame(tick);
}

// FILMSTRIPS
const COLORS=['#F59E0B','#10B981','#0EA5E9','#8B5CF6','#F43F5E','#D97706','#059669','#6366F1'];
const LABELS=['morn','brunch','call','lunch','nap','shop','coffee','home'];

function stripCX(i){return 28+i*48;}  // i=0→28, i=7→364, right edge=383 < 455
const SY=108;

let strips=[];
function buildStrips(){
  const row=$id('strips-row');
  while(row.firstChild)row.removeChild(row.firstChild);
  strips=[];
  for(let i=0;i<8;i++){
    const g=document.createElementNS(NS,'g');
    g.setAttribute('transform',`translate(${stripCX(i)},${SY})`);
    function mk(tag,attrs){
      const e=document.createElementNS(NS,tag);
      Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));
      return e;
    }
    g.appendChild(mk('rect',{x:-19,y:-16,width:38,height:32,rx:4,fill:'#1F2937'}));
    g.appendChild(mk('rect',{x:-13,y:-11,width:26,height:22,rx:3,fill:COLORS[i],'fill-opacity':0.9}));
    g.appendChild(mk('rect',{x:-19,y:-6,width:5,height:12,rx:1,fill:'#374151'}));
    g.appendChild(mk('rect',{x:14,y:-6,width:5,height:12,rx:1,fill:'#374151'}));
    g.appendChild(mk('circle',{cx:-15,cy:0,r:1.5,fill:'#1F2937'}));
    g.appendChild(mk('circle',{cx:-15,cy:6,r:1.5,fill:'#1F2937'}));
    g.appendChild(mk('circle',{cx:15,cy:0,r:1.5,fill:'#1F2937'}));
    g.appendChild(mk('circle',{cx:15,cy:6,r:1.5,fill:'#1F2937'}));
    const txt=document.createElementNS(NS,'text');
    txt.setAttribute('x',0);txt.setAttribute('y',5);
    txt.setAttribute('text-anchor','middle');txt.setAttribute('font-size','6');
    txt.setAttribute('fill','white');txt.setAttribute('font-family','ui-monospace,monospace');
    txt.textContent=LABELS[i];
    g.appendChild(txt);
    row.appendChild(g);
    strips.push(g);
  }
}

function floatStripTo(stripEl,tx,ty,cb){
  const m=stripEl.getAttribute('transform');
  const mm=m.match(/translate\(([^,]+),([^)]+)\)/);
  if(!mm)return;
  const sx=parseFloat(mm[1]),sy=parseFloat(mm[2]);
  const dur=720,s=performance.now();
  function tick(now){
    const t=Math.min((now-s)/dur,1),e=easeOut(t);
    stripEl.setAttribute('transform',`translate(${lerp(sx,tx,e)},${lerp(sy,ty,e)})`);
    if(t<1)requestAnimationFrame(tick);
    else{stripEl.setAttribute('opacity','0');if(cb)cb();}
  }
  requestAnimationFrame(tick);
}

function dropStripToBin(stripEl,delayMs){
  const m=stripEl.getAttribute('transform');
  const mm=m.match(/translate\(([^,]+),([^)]+)\)/);
  if(!mm)return;
  const sx=parseFloat(mm[1]),sy=parseFloat(mm[2]);
  const tx=72,ty=406;
  const dur=460,launch=performance.now()+delayMs;
  let launched=false;
  function tick(now){
    if(now<launch){requestAnimationFrame(tick);return;}
    if(!launched){launched=true;sfxWhoosh();}
    const t=Math.min((now-launch)/dur,1),e=t*t;
    const rot=lerp(0,22,t);
    stripEl.setAttribute('transform',`translate(${lerp(sx,tx,e)},${lerp(sy,ty,e)}) rotate(${rot})`);
    stripEl.setAttribute('opacity',String(Math.max(0,1-t*0.85)));
    if(t<1)requestAnimationFrame(tick);
    else{
      stripEl.setAttribute('opacity','0');
      sfxBonk();
      // Bounce bin
      const b=$id('bin');let bs=null;
      function bounceTick(nn){
        if(!bs)bs=nn;
        const bt=Math.min((nn-bs)/300,1);
        b.setAttribute('transform',`translate(72,${444-Math.sin(bt*Math.PI)*10})`);
        if(bt<1)requestAnimationFrame(bounceTick);
        else b.setAttribute('transform','translate(72,444)');
      }
      requestAnimationFrame(bounceTick);
    }
  }
  requestAnimationFrame(tick);
}

function run(){
  clearAll();stopGlow();
  buildStrips();
  setOp('pk',0);setOp('en',0);setOp('pk-tack',0);setOp('en-tack',0);
  setOp('cap',0);setOp('flash',0);
  $id('bin').setAttribute('transform','translate(72,444)');
  startGlow();startBg();

  // t=2.6s: flash → PEAK strip floats to board
  after(2600,()=>{
    sfxShutter();
    doFlash(()=>{
      sfxDing();sfxWhoosh();
      floatStripTo(strips[3],528,215,()=>{
        setOp('pk',1);
        after(80,()=>{setOp('pk-tack',1);sfxPin();});
      });
    });
  });

  // t=5.1s: flash → END strip floats to board
  after(5100,()=>{
    sfxShutter();
    doFlash(()=>{
      sfxDing();sfxWhoosh();
      floatStripTo(strips[7],635,345,()=>{
        setOp('en',1);
        after(80,()=>{setOp('en-tack',1);sfxPin();});
      });
    });
  });

  // t=6.4s: drop remaining 6 strips (indices 0,1,2,4,5,6)
  [0,1,2,4,5,6].forEach((si,idx)=>{
    dropStripToBin(strips[si], 6400+idx*380);
  });

  // t=9.2s: caption
  after(9200,()=>animOp('cap',0,1,700,null));

  // t=12.2s: loop
  after(12200,()=>animOp('cap',1,0,500,()=>{ after(300,run); }));
}

$id('rb').addEventListener('click',()=>{clearAll();stopGlow();run();});
document.getElementById('ov').addEventListener('click',()=>{
  getAC();
  document.getElementById('ov').style.display='none';
  run();
},{once:true});
})();
</script>
</body>
</html>
