<script>
(function(){
'use strict';

// ── AUDIO ─────────────────────────────────────────────
let AC=null,bgTimer=null,bgIdx=0;
function getAC(){
  if(!AC) AC=new(window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume().catch(()=>{});
  return AC;
}
document.addEventListener('click',()=>{try{getAC();}catch(e){}},{passive:true});

function tone(freq,dur,delay,type,vol){
  delay=delay||0;type=type||'sine';vol=vol||0.2;
  try{
    const c=getAC(),t=c.currentTime+delay;
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,0.05));
    o.start(t);o.stop(t+dur+0.1);
  }catch(e){}
}
function nz(dur,delay,fc,vol){
  delay=delay||0;fc=fc||1000;vol=vol||0.2;
  try{
    const c=getAC(),sr=c.sampleRate,t=c.currentTime+delay;
    const buf=c.createBuffer(1,Math.ceil(sr*Math.max(dur,0.05)),sr);
    const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=fc;f.Q.value=1;
    const g=c.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+Math.max(dur,0.05));
    const s=c.createBufferSource();s.buffer=buf;s.connect(f);f.connect(g);g.connect(c.destination);
    s.start(t);s.stop(t+dur+0.1);
  }catch(e){}
}

function sfxAlarm(){
  // Beep beep beep
  for(let i=0;i<3;i++) tone(880,0.15,i*0.22,'square',0.15);
}
function sfxSuccess(){
  tone(523.25,0.2,0,'sine',0.22);
  tone(659.25,0.2,0.15,'sine',0.18);
  tone(783.99,0.3,0.3,'sine',0.15);
}
function sfxClick(){nz(0.04,0,2000,0.15);tone(1200,0.05,0,'square',0.08);}
function sfxWhoosh(){
  try{
    const c=getAC(),t=c.currentTime;
    const o=c.createOscillator(),g=c.createGain();
    o.connect(g);g.connect(c.destination);o.type='sawtooth';
    o.frequency.setValueAtTime(500,t);o.frequency.exponentialRampToValueAtTime(80,t+0.4);
    g.gain.setValueAtTime(0.07,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
    o.start(t);o.stop(t+0.45);
  }catch(e){}
}
function sfxStreak(){
  for(let i=0;i<3;i++) tone(523.25*(1+i*0.2),0.18,i*0.14,'sine',0.18);
  nz(0.06,0.3,600,0.12);
}

const BG=[196,246.94,293.66,369.99,440,369.99,293.66,246.94];
function startBg(){
  if(bgTimer)return;
  function beat(){
    const f=BG[bgIdx%BG.length];
    tone(f,2.2,0,'sine',0.028);
    bgIdx++;bgTimer=setTimeout(beat,1800);
  }beat();
}
function stopBg(){clearTimeout(bgTimer);bgTimer=null;}

// ── UTILS ─────────────────────────────────────────────
function $id(id){return document.getElementById(id);}
function setOp(id,v){const e=$id(id);if(e)e.setAttribute('opacity',String(v));}
function lerp(a,b,t){return a+(b-a)*t;}
function easeOut(t){return 1-Math.pow(1-t,3);}
let tms=[];
function after(ms,fn){tms.push(setTimeout(fn,ms));}
function clearAll(){tms.forEach(clearTimeout);tms=[];stopBg();}

function animOp(id,a,b,dur,cb){
  const e=$id(id);if(!e)return;
  const s=performance.now();
  function tick(now){
    const t=Math.min((now-s)/dur,1);
    e.setAttribute('opacity',String(lerp(a,b,easeOut(t))));
    if(t<1)requestAnimationFrame(tick);else if(cb)cb();
  }
  requestAnimationFrame(tick);
}

function setStep(n){
  $id('chipnum').textContent=String(n);
  animOp('chip',0,1,300,null);
}

function run(){
  clearAll();
  setOp('lzzz',0);setOp('linsta',0);setOp('lfail',0);
  setOp('rs1',0);setOp('rs2',0);setOp('rs3',0);setOp('rs4',0);
  setOp('chip',0);setOp('rcheck',0);setOp('rcap',0);
  startBg();

  // LEFT: alarm rings, fall asleep
  after(400,()=>{
    sfxAlarm();
    animOp('lzzz',0,1,500,null);
  });
  after(1500,()=>animOp('linsta',0,1,500,null));
  after(3000,()=>{sfxWhoosh();animOp('lfail',0,1,600,null);});

  // RIGHT: Step 1 — CUE
  after(600,()=>{
    setStep(1);
    sfxAlarm();
    animOp('rs1',0,1,500,null);
    const cap=$id('rcap');cap.textContent='1. Cue: alarm is across the room.';
    animOp('rcap',0,1,500,null);
  });

  // Step 2 — FRICTION REDUCTION
  after(4500,()=>{
    animOp('rs1',1,0,300,null);
    sfxClick();
    after(350,()=>{
      setStep(2);
      animOp('rs2',0,1,500,null);
      const cap=$id('rcap');cap.textContent='2. Friction reduction: clothes + shoes ready.';
      animOp('rcap',0,1,400,null);
    });
  });

  // Step 3 — TINY FIRST STEP
  after(7800,()=>{
    animOp('rs2',1,0,300,null);
    sfxClick();
    after(350,()=>{
      setStep(3);
      animOp('rs3',0,1,500,null);
      const cap=$id('rcap');cap.textContent='3. Tiny first step: cross the doorway.';
      animOp('rcap',0,1,400,null);
      after(1200,()=>{animOp('rcheck',0,1,400,null);sfxSuccess();});
    });
  });

  // Step 4 — ACCOUNTABILITY
  after(11200,()=>{
    animOp('rs3',1,0,300,null);
    after(350,()=>{
      setStep(4);
      animOp('rs4',0,1,500,null);
      const cap=$id('rcap');cap.textContent='4. Log + accountability: streak is the dopamine.';
      animOp('rcap',0,1,400,null);
      sfxStreak();
    });
  });

  // Loop
  after(14500,()=>{
    animOp('rs4',1,0,400,null);
    animOp('lfail',1,0,400,null);
    animOp('linsta',1,0,400,null);
    animOp('lzzz',1,0,400,null);
    animOp('chip',1,0,400,null);
    animOp('rcap',1,0,400,null);
    after(600,run);
  });
}

$id('rb').addEventListener('click',()=>{clearAll();run();});
function $id(id){return document.getElementById(id);}
document.getElementById('ov').addEventListener('click',()=>{
  getAC();
  document.getElementById('ov').style.display='none';
  run();
},{once:true});
})();
</script>
