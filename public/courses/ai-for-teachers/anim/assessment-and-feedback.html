<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Assessment and feedback — two timelines</title>
<style>
  :root{--bg:#FFF7ED;--ink:#1F2937;--mute:#6B7280;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .wrap{position:relative;width:100%;max-width:840px;}
  svg{width:100%;height:auto;display:block;}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--mute);margin-top:8px;padding:0 8px;}
  #rb{position:absolute;bottom:8px;right:8px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.78;}
  #rb:hover{opacity:1;}
  .gtxt{font-family:ui-monospace,"SFMono-Regular",monospace;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<main class="stage">
<div class="wrap">
<svg viewBox="0 0 840 510" aria-label="Two timelines for grading 32 essays. Without AI: 8 hours, quality drops by essay 20. With AI plus rubric: 3.5 hours, quality stays consistent.">
  <rect width="840" height="510" fill="#FFF7ED"/>

  <!-- title -->
  <text x="420" y="28" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">32 essays. Two ways to give feedback.</text>
  <text x="420" y="46" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">Same teacher, same rubric, different workflow.</text>

  <!-- Stack of essays icon -->
  <g transform="translate(420,72)">
    <rect x="-44" y="-12" width="88" height="22" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.4"/>
    <text x="0" y="3" text-anchor="middle" font-size="10.5" fill="#92400E" font-weight="700" class="gtxt">32 essays</text>
  </g>

  <!-- ── ROW 1: WITHOUT AI ───────────────────────────────────── -->
  <text x="32" y="120" font-size="12" font-weight="700" fill="#9F1239" letter-spacing="0.8">WITHOUT AI · manual grading</text>
  <text x="808" y="120" text-anchor="end" font-size="11" fill="#9F1239" class="gtxt" id="t1Time">0.0 h</text>

  <!-- timeline track -->
  <rect x="32" y="130" width="776" height="56" rx="10" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2"/>

  <!-- 32 essays as bars; quality drops after 20 -->
  <g id="row1bars"></g>

  <!-- progress fill -->
  <rect id="row1fill" x="32" y="130" width="0" height="56" rx="10" fill="#F43F5E" opacity="0.12"/>

  <!-- teacher avatar -->
  <g id="t1Avatar" transform="translate(40,158)">
    <circle cx="0" cy="0" r="11" fill="#FBBF24" stroke="#1F2937" stroke-width="1.4"/>
    <circle cx="-3" cy="-2" r="1.3" fill="#1F2937"/>
    <circle cx="3" cy="-2" r="1.3" fill="#1F2937"/>
    <path id="t1Mouth" d="M-4,3 Q0,5 4,3" fill="none" stroke="#1F2937" stroke-width="1.3" stroke-linecap="round"/>
  </g>

  <!-- markers at hour ticks -->
  <g font-size="9" fill="#9F1239" class="gtxt" text-anchor="middle">
    <line x1="32" y1="190" x2="32" y2="194" stroke="#9F1239" stroke-width="1"/><text x="32" y="204">0h</text>
    <line x1="226" y1="190" x2="226" y2="194" stroke="#9F1239" stroke-width="1"/><text x="226" y="204">2h</text>
    <line x1="420" y1="190" x2="420" y2="194" stroke="#9F1239" stroke-width="1"/><text x="420" y="204">4h</text>
    <line x1="614" y1="190" x2="614" y2="194" stroke="#9F1239" stroke-width="1"/><text x="614" y="204">6h</text>
    <line x1="808" y1="190" x2="808" y2="194" stroke="#9F1239" stroke-width="1"/><text x="808" y="204">8h</text>
  </g>

  <!-- annotations -->
  <g id="r1Note" opacity="0">
    <line x1="517" y1="130" x2="517" y2="113" stroke="#9F1239" stroke-width="1.2" stroke-dasharray="3 2"/>
    <rect x="430" y="78" width="180" height="32" rx="6" fill="white" stroke="#F43F5E" stroke-width="1.3"/>
    <text x="520" y="92" text-anchor="middle" font-size="10" fill="#9F1239" font-weight="700">essay #20: focus drops</text>
    <text x="520" y="104" text-anchor="middle" font-size="9.5" fill="#9F1239" font-style="italic">terse comments, missed nuance</text>
  </g>

  <!-- summary chip row1 -->
  <g id="r1Sum" opacity="0" transform="translate(32,222)">
    <rect x="0" y="0" width="776" height="36" rx="8" fill="#FEE2E2" stroke="#FCA5A5" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#9F1239" class="gtxt">8.0 h total</text>
    <text x="120" y="22" font-size="11" fill="#9F1239">· consistent quality essays 1–19, declining 20–32</text>
    <text x="762" y="22" text-anchor="end" font-size="11" fill="#9F1239" font-weight="700">Saturday gone.</text>
  </g>

  <!-- ── ROW 2: WITH AI + RUBRIC ────────────────────────────── -->
  <text x="32" y="296" font-size="12" font-weight="700" fill="#065F46" letter-spacing="0.8">WITH AI + RUBRIC · draft → review → personalize</text>
  <text x="808" y="296" text-anchor="end" font-size="11" fill="#065F46" class="gtxt" id="t2Time">0.0 h</text>

  <rect x="32" y="306" width="776" height="56" rx="10" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>

  <!-- Two-track inside: AI band (top half) + Teacher band (bottom half) -->
  <text x="38" y="320" font-size="9" fill="#0EA5E9" font-weight="700" letter-spacing="0.5">AI · 60 s/essay · drafts per criterion</text>
  <text x="38" y="354" font-size="9" fill="#10B981" font-weight="700" letter-spacing="0.5">TEACHER · 90 s/essay · review + personalize</text>

  <g id="row2bars"></g>
  <rect id="row2fill" x="32" y="306" width="0" height="56" rx="10" fill="#10B981" opacity="0.10"/>

  <!-- avatars -->
  <g id="t2Avatar" transform="translate(40,338)">
    <circle cx="0" cy="0" r="11" fill="#FBBF24" stroke="#1F2937" stroke-width="1.4"/>
    <circle cx="-3" cy="-2" r="1.3" fill="#1F2937"/>
    <circle cx="3" cy="-2" r="1.3" fill="#1F2937"/>
    <path d="M-4,3 Q0,5 4,3" fill="none" stroke="#1F2937" stroke-width="1.3" stroke-linecap="round"/>
  </g>
  <!-- AI bot icon -->
  <g id="t2Bot" transform="translate(40,322)">
    <rect x="-9" y="-7" width="18" height="14" rx="4" fill="#0EA5E9" stroke="#0C4A6E" stroke-width="1.2"/>
    <circle cx="-3" cy="-1" r="1.5" fill="white"/>
    <circle cx="3" cy="-1" r="1.5" fill="white"/>
    <line x1="0" y1="-7" x2="0" y2="-11" stroke="#0C4A6E" stroke-width="1.2"/>
    <circle cx="0" cy="-12" r="1.5" fill="#0C4A6E"/>
  </g>

  <!-- markers -->
  <g font-size="9" fill="#065F46" class="gtxt" text-anchor="middle">
    <line x1="32" y1="366" x2="32" y2="370" stroke="#065F46" stroke-width="1"/><text x="32" y="380">0h</text>
    <line x1="226" y1="366" x2="226" y2="370" stroke="#065F46" stroke-width="1"/><text x="226" y="380">2h</text>
    <line x1="372" y1="366" x2="372" y2="370" stroke="#065F46" stroke-width="1"/><text x="372" y="380">3.5h</text>
  </g>

  <!-- summary chip row2 -->
  <g id="r2Sum" opacity="0" transform="translate(32,398)">
    <rect x="0" y="0" width="776" height="36" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.2"/>
    <text x="14" y="22" font-size="11" font-weight="700" fill="#065F46" class="gtxt">3.5 h total</text>
    <text x="120" y="22" font-size="11" fill="#065F46">· consistent quality across all 32 · teacher voice preserved</text>
    <text x="762" y="22" text-anchor="end" font-size="11" fill="#065F46" font-weight="700">Saturday saved.</text>
  </g>

  <!-- delta callout -->
  <g id="delta" opacity="0">
    <rect x="280" y="446" width="280" height="48" rx="12" fill="#1F2937"/>
    <text x="420" y="466" text-anchor="middle" font-size="12" fill="#FCD34D" font-weight="700" letter-spacing="0.5">4.5 hours saved · quality steadier</text>
    <text x="420" y="484" text-anchor="middle" font-size="10.5" fill="#E5E7EB" font-style="italic">the rubric is the choreography. the teacher still leads.</text>
  </g>

</svg>
<div class="caption" id="cap">Same essays. Same care. Less attrition.</div>
<button id="rb" type="button" aria-label="Reset animation">reset</button>
</div>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const SVG_NS='http://www.w3.org/2000/svg';
let timers=[];
const after=(ms,fn)=>timers.push(setTimeout(fn,ms));
const clearAll=()=>{timers.forEach(clearTimeout);timers=[];};
const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
const cap=$('cap');

// build 32 bars per row
function buildRow1(){
  const g=$('row1bars');
  g.innerHTML='';
  const x0=32,x1=808;
  const N=32;
  for(let i=0;i<N;i++){
    const x=x0+(x1-x0)*(i/N)+1;
    const w=(x1-x0)/N-2;
    const r=document.createElementNS(SVG_NS,'rect');
    r.setAttribute('x',x);
    r.setAttribute('y',140);
    r.setAttribute('width',w);
    r.setAttribute('height',36);
    r.setAttribute('rx',3);
    // quality drop after #20 — color & height shift
    const decline=i<20?0:Math.min((i-19)/12,1);
    const h=36-decline*16;
    r.setAttribute('y',140+(36-h));
    r.setAttribute('height',h);
    const c=i<20?'#F43F5E':(i<26?'#FB7185':'#FDA4AF');
    r.setAttribute('fill',c);
    r.setAttribute('opacity','0');
    r.setAttribute('id','r1b'+i);
    g.appendChild(r);
  }
}
function buildRow2(){
  const g=$('row2bars');
  g.innerHTML='';
  const x0=32,x1=372; // ends at 3.5h marker
  const N=32;
  for(let i=0;i<N;i++){
    const x=x0+(x1-x0)*(i/N)+1;
    const w=(x1-x0)/N-2;
    // AI band
    const ai=document.createElementNS(SVG_NS,'rect');
    ai.setAttribute('x',x);
    ai.setAttribute('y',324);
    ai.setAttribute('width',w);
    ai.setAttribute('height',12);
    ai.setAttribute('rx',2);
    ai.setAttribute('fill','#0EA5E9');
    ai.setAttribute('opacity','0');
    ai.setAttribute('id','r2a'+i);
    g.appendChild(ai);
    // Teacher band
    const t=document.createElementNS(SVG_NS,'rect');
    t.setAttribute('x',x);
    t.setAttribute('y',342);
    t.setAttribute('width',w);
    t.setAttribute('height',16);
    t.setAttribute('rx',2);
    t.setAttribute('fill','#10B981');
    t.setAttribute('opacity','0');
    t.setAttribute('id','r2t'+i);
    g.appendChild(t);
  }
}

function fade(id,a,b,dur){
  return new Promise(res=>{
    const el=$(id);if(!el){res();return;}
    if(reduced){el.setAttribute('opacity',String(b));res();return;}
    const s=performance.now();
    function tick(now){
      const t=Math.min((now-s)/dur,1);
      const e=1-Math.pow(1-t,3);
      el.setAttribute('opacity',String(a+(b-a)*e));
      if(t<1)requestAnimationFrame(tick);else res();
    }
    requestAnimationFrame(tick);
  });
}

function animateRow1(durMs){
  return new Promise(res=>{
    const N=32;
    if(reduced){
      for(let i=0;i<N;i++)$('r1b'+i).setAttribute('opacity','0.95');
      $('row1fill').setAttribute('width','776');
      $('t1Time').textContent='8.0 h';
      $('t1Avatar').setAttribute('transform','translate(800,158)');
      res();return;
    }
    const start=performance.now();
    function tick(now){
      const t=Math.min((now-start)/durMs,1);
      const e=1-Math.pow(1-t,3);
      const idx=Math.floor(e*N);
      for(let i=0;i<idx;i++)$('r1b'+i).setAttribute('opacity','0.95');
      const fillW=776*e;
      $('row1fill').setAttribute('width',String(fillW));
      const ax=40+fillW;
      $('t1Avatar').setAttribute('transform',`translate(${ax},158)`);
      $('t1Time').textContent=(8.0*e).toFixed(1)+' h';
      // mouth droop after 60% (essay 20)
      if(e>0.6){
        const droop=(e-0.6)/0.4;
        $('t1Mouth').setAttribute('d',`M-4,${3+droop*1.5} Q0,${5-droop*4} 4,${3+droop*1.5}`);
      }
      if(t<1)requestAnimationFrame(tick);else{
        for(let i=0;i<N;i++)$('r1b'+i).setAttribute('opacity','0.95');
        res();
      }
    }
    requestAnimationFrame(tick);
  });
}

function animateRow2(durMs){
  return new Promise(res=>{
    const N=32;
    if(reduced){
      for(let i=0;i<N;i++){$('r2a'+i).setAttribute('opacity','0.95');$('r2t'+i).setAttribute('opacity','0.95');}
      $('row2fill').setAttribute('width','340');
      $('t2Time').textContent='3.5 h';
      $('t2Avatar').setAttribute('transform','translate(372,338)');
      $('t2Bot').setAttribute('transform','translate(372,322)');
      res();return;
    }
    const start=performance.now();
    function tick(now){
      const t=Math.min((now-start)/durMs,1);
      const e=1-Math.pow(1-t,3);
      const idx=Math.floor(e*N);
      for(let i=0;i<idx;i++){$('r2a'+i).setAttribute('opacity','0.95');$('r2t'+i).setAttribute('opacity','0.95');}
      const fillW=340*e;
      $('row2fill').setAttribute('width',String(fillW));
      $('t2Avatar').setAttribute('transform',`translate(${40+fillW-8},338)`);
      $('t2Bot').setAttribute('transform',`translate(${40+fillW-8},322)`);
      $('t2Time').textContent=(3.5*e).toFixed(1)+' h';
      if(t<1)requestAnimationFrame(tick);else{
        for(let i=0;i<N;i++){$('r2a'+i).setAttribute('opacity','0.95');$('r2t'+i).setAttribute('opacity','0.95');}
        res();
      }
    }
    requestAnimationFrame(tick);
  });
}

const sleep=ms=>new Promise(r=>{timers.push(setTimeout(r,ms));});

async function run(){
  cap.textContent='Without AI: hand-grade all 32 in one sitting.';
  await animateRow1(reduced?0:4500);
  await fade('r1Note',0,1,400);
  await sleep(reduced?0:600);
  await fade('r1Sum',0,1,400);
  cap.textContent='With AI + rubric: AI drafts per criterion, you review.';
  await sleep(reduced?0:500);
  await animateRow2(reduced?0:3500);
  await fade('r2Sum',0,1,400);
  await sleep(reduced?0:200);
  await fade('delta',0,1,500);
  cap.textContent='4.5 hours back. Quality steadier. Voice still yours.';
  if(!reduced){await sleep(3500);reset();}
}

function reset(){
  clearAll();
  buildRow1();buildRow2();
  ['row1fill','row2fill'].forEach(id=>$(id).setAttribute('width','0'));
  $('t1Time').textContent='0.0 h';$('t2Time').textContent='0.0 h';
  $('t1Avatar').setAttribute('transform','translate(40,158)');
  $('t2Avatar').setAttribute('transform','translate(40,338)');
  $('t2Bot').setAttribute('transform','translate(40,322)');
  $('t1Mouth').setAttribute('d','M-4,3 Q0,5 4,3');
  ['r1Note','r1Sum','r2Sum','delta'].forEach(id=>$(id).setAttribute('opacity','0'));
  run();
}

buildRow1();buildRow2();
$('rb').addEventListener('click',reset);
run();
})();
</script>
</body>
</html>
