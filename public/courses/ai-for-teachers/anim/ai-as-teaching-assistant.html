<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI as Teaching Assistant — the 80/20 split</title>
<style>
  :root{--bg:#FFF7ED;--ink:#1F2937;--mute:#6B7280;--good:#10B981;--ai:#0EA5E9;--human:#0EA5E9;--warm:#F59E0B;--violet:#8B5CF6;--rose:#F43F5E;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .wrap{position:relative;width:100%;max-width:820px;}
  svg{width:100%;height:auto;display:block;}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--mute);margin-top:8px;padding:0 8px;}
  #rb{position:absolute;bottom:8px;right:8px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.78;}
  #rb:hover{opacity:1;}
  .task{transition:transform .9s cubic-bezier(0.22,0.61,0.36,1),opacity .5s;}
  .gtxt{font-family:ui-monospace,"SFMono-Regular",monospace;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<main class="stage">
<div class="wrap">
<svg viewBox="0 0 820 470" aria-label="A teacher's weekly task list splits: 80% AI tasks fly to a done tray glowing green, 20% human tasks stay on the desk glowing blue.">
  <rect width="820" height="470" fill="#FFF7ED"/>

  <!-- title -->
  <text x="410" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">A teacher's week. AI handles the load. Humans hold the meaning.</text>

  <!-- DESK (left) -->
  <rect x="36" y="64" width="430" height="350" rx="14" fill="#FEF3C7" stroke="#FCD34D" stroke-width="2"/>
  <text x="251" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E" letter-spacing="1.2">THE DESK · this week</text>
  <line x1="60" y1="96" x2="442" y2="96" stroke="#FCD34D" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- DONE TRAY (right) -->
  <rect x="500" y="64" width="284" height="350" rx="14" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="2"/>
  <text x="642" y="86" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46" letter-spacing="1.2">DONE TRAY · AI handled</text>
  <line x1="520" y1="96" x2="764" y2="96" stroke="#6EE7B7" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- counters -->
  <g transform="translate(642,358)">
    <rect x="-94" y="0" width="188" height="46" rx="10" fill="white" stroke="#10B981" stroke-width="1.5"/>
    <text id="aiCount" x="-44" y="29" text-anchor="middle" font-size="22" font-weight="700" fill="#10B981" class="gtxt">0/8</text>
    <text x="44" y="20" text-anchor="middle" font-size="9.5" fill="#065F46" font-weight="600">AI handled</text>
    <text x="44" y="34" text-anchor="middle" font-size="9.5" fill="#065F46">~80%</text>
  </g>

  <!-- TASKS — 10 tasks. 8 fly to done (AI). 2 stay (human). -->
  <!-- positions are starting positions on desk; data-end is target on done tray -->
  <!-- AI 1 -->
  <g class="task" id="t1" data-kind="ai" data-end="540,118">
    <rect x="60" y="106" width="180" height="34" rx="8" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="76" cy="123" r="6" fill="#0EA5E9"/>
    <text x="90" y="120" font-size="11" font-weight="600" fill="#1F2937">Lesson plan: photosynthesis</text>
    <text x="90" y="133" font-size="9.5" fill="#6B7280">draft outline · 40 min</text>
  </g>
  <!-- AI 2 -->
  <g class="task" id="t2" data-kind="ai" data-end="540,156">
    <rect x="252" y="106" width="190" height="34" rx="8" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="268" cy="123" r="6" fill="#0EA5E9"/>
    <text x="282" y="120" font-size="11" font-weight="600" fill="#1F2937">Practice problems · fractions</text>
    <text x="282" y="133" font-size="9.5" fill="#6B7280">20 items, 3 levels</text>
  </g>
  <!-- AI 3 -->
  <g class="task" id="t3" data-kind="ai" data-end="540,194">
    <rect x="60" y="150" width="180" height="34" rx="8" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="76" cy="167" r="6" fill="#0EA5E9"/>
    <text x="90" y="164" font-size="11" font-weight="600" fill="#1F2937">Grade rough drafts (rubric)</text>
    <text x="90" y="177" font-size="9.5" fill="#6B7280">first-pass comments</text>
  </g>
  <!-- AI 4 -->
  <g class="task" id="t4" data-kind="ai" data-end="540,232">
    <rect x="252" y="150" width="190" height="34" rx="8" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="268" cy="167" r="6" fill="#0EA5E9"/>
    <text x="282" y="164" font-size="11" font-weight="600" fill="#1F2937">Quiz from ch. 4 · MCQ</text>
    <text x="282" y="177" font-size="9.5" fill="#6B7280">15 q + answer key</text>
  </g>
  <!-- AI 5 -->
  <g class="task" id="t5" data-kind="ai" data-end="540,270">
    <rect x="60" y="194" width="180" height="34" rx="8" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="76" cy="211" r="6" fill="#0EA5E9"/>
    <text x="90" y="208" font-size="11" font-weight="600" fill="#1F2937">Worksheet · Hindi adjectives</text>
    <text x="90" y="221" font-size="9.5" fill="#6B7280">2 difficulty levels</text>
  </g>
  <!-- AI 6 -->
  <g class="task" id="t6" data-kind="ai" data-end="540,308">
    <rect x="252" y="194" width="190" height="34" rx="8" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="268" cy="211" r="6" fill="#0EA5E9"/>
    <text x="282" y="208" font-size="11" font-weight="600" fill="#1F2937">Slide deck · ecosystems</text>
    <text x="282" y="221" font-size="9.5" fill="#6B7280">10 slides w/ visuals</text>
  </g>
  <!-- AI 7 -->
  <g class="task" id="t7" data-kind="ai" data-end="664,118">
    <rect x="60" y="238" width="180" height="34" rx="8" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="76" cy="255" r="6" fill="#0EA5E9"/>
    <text x="90" y="252" font-size="11" font-weight="600" fill="#1F2937">Email parent reminders</text>
    <text x="90" y="265" font-size="9.5" fill="#6B7280">field trip permission</text>
  </g>
  <!-- AI 8 -->
  <g class="task" id="t8" data-kind="ai" data-end="664,156">
    <rect x="252" y="238" width="190" height="34" rx="8" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="268" cy="255" r="6" fill="#0EA5E9"/>
    <text x="282" y="252" font-size="11" font-weight="600" fill="#1F2937">Summarize unit feedback</text>
    <text x="282" y="265" font-size="9.5" fill="#6B7280">from form responses</text>
  </g>

  <!-- HUMAN 1 -->
  <g class="task" id="h1" data-kind="human">
    <rect x="60" y="284" width="380" height="46" rx="10" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="78" cy="307" r="7.5" fill="#8B5CF6"/>
    <text x="94" y="304" font-size="11.5" font-weight="700" fill="#1F2937">Judge meaning in Aarav's college essay</text>
    <text x="94" y="319" font-size="10" fill="#6B7280">is the argument <tspan font-style="italic">his</tspan>? does it land?</text>
  </g>
  <!-- HUMAN 2 -->
  <g class="task" id="h2" data-kind="human">
    <rect x="60" y="338" width="380" height="46" rx="10" fill="white" stroke="#FCD34D" stroke-width="1.4"/>
    <circle cx="78" cy="361" r="7.5" fill="#F59E0B"/>
    <text x="94" y="358" font-size="11.5" font-weight="700" fill="#1F2937">Call Priya's mother re: anxiety in class</text>
    <text x="94" y="373" font-size="10" fill="#6B7280">presence, tone, listening — irreplaceable</text>
  </g>

  <!-- glows -->
  <circle id="glowH1" cx="250" cy="307" r="0" fill="#0EA5E9" opacity="0.18"/>
  <circle id="glowH2" cx="250" cy="361" r="0" fill="#0EA5E9" opacity="0.18"/>

  <!-- legend -->
  <g transform="translate(36,432)">
    <circle cx="6" cy="6" r="6" fill="#0EA5E9"/>
    <text x="18" y="10" font-size="10.5" fill="#1F2937">AI can draft this · ~80%</text>
    <circle cx="200" cy="6" r="6" fill="#8B5CF6"/>
    <text x="212" y="10" font-size="10.5" fill="#1F2937">Stays human · ~20%</text>
    <text x="370" y="10" font-size="10.5" fill="#6B7280" font-style="italic">presence, judgment, care</text>
  </g>

</svg>
<div class="caption" id="cap">AI clears the desk. The teacher does what only the teacher can.</div>
<button id="rb" type="button" aria-label="Reset animation">reset</button>
</div>
</main>
<script>
(function(){
'use strict';
const E=t=>1-Math.pow(1-t,3);
const $=id=>document.getElementById(id);
const cap=$('cap');
let timers=[];
const after=(ms,fn)=>timers.push(setTimeout(fn,ms));
const clearAll=()=>{timers.forEach(clearTimeout);timers=[];};
const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function flyTask(id,delay){
  const g=$(id);if(!g)return;
  const end=g.getAttribute('data-end').split(',').map(Number);
  const rect=g.querySelector('rect');
  const x=parseFloat(rect.getAttribute('x'));
  const y=parseFloat(rect.getAttribute('y'));
  const dx=end[0]-x;
  const dy=end[1]-y;
  after(delay,()=>{
    rect.setAttribute('stroke','#10B981');
    rect.setAttribute('stroke-width','2');
    g.style.filter='drop-shadow(0 4px 8px rgba(16,185,129,0.28))';
    if(reduced){
      g.setAttribute('transform',`translate(${dx},${dy}) scale(0.78)`);
      g.style.opacity='1';
      bumpCounter();
    }else{
      const s=performance.now(),DUR=820;
      function tick(now){
        const t=Math.min((now-s)/DUR,1);
        const e=E(t);
        g.setAttribute('transform',`translate(${dx*e},${dy*e}) scale(${1-0.22*e})`);
        if(t<1)requestAnimationFrame(tick);else bumpCounter();
      }
      requestAnimationFrame(tick);
    }
  });
}

let count=0;
function bumpCounter(){count++;$('aiCount').textContent=count+'/8';}

function pulseHuman(id,glowId,delay){
  const g=$(id);
  const glow=$(glowId);
  after(delay,()=>{
    g.querySelector('rect').setAttribute('stroke','#0EA5E9');
    g.querySelector('rect').setAttribute('stroke-width','2');
    g.style.filter='drop-shadow(0 4px 12px rgba(14,165,233,0.32))';
    if(reduced){glow.setAttribute('r','220');return;}
    let phase=0;
    function pulse(){
      const s=performance.now(),DUR=1500;
      function tick(now){
        const t=Math.min((now-s)/DUR,1);
        const r=200+30*Math.sin(t*Math.PI);
        glow.setAttribute('r',String(r));
        glow.setAttribute('opacity',String(0.15+0.07*Math.sin(t*Math.PI)));
        if(t<1)requestAnimationFrame(tick);else if(phase<3){phase++;pulse();}
      }
      requestAnimationFrame(tick);
    }
    pulse();
  });
}

function reset(){
  clearAll();count=0;$('aiCount').textContent='0/8';
  ['t1','t2','t3','t4','t5','t6','t7','t8'].forEach(id=>{
    const g=$(id);g.setAttribute('transform','translate(0,0) scale(1)');g.style.filter='none';g.style.opacity='1';
    g.querySelector('rect').setAttribute('stroke','#FCD34D');
    g.querySelector('rect').setAttribute('stroke-width','1.4');
  });
  ['h1','h2'].forEach(id=>{
    const g=$(id);g.style.filter='none';
    g.querySelector('rect').setAttribute('stroke','#FCD34D');
    g.querySelector('rect').setAttribute('stroke-width','1.4');
  });
  $('glowH1').setAttribute('r','0');$('glowH2').setAttribute('r','0');
  cap.textContent='Ten things on the desk this week.';
  run();
}

function run(){
  // 1: highlight everything
  after(reduced?0:600,()=>cap.textContent='Eight of them — AI can draft a first pass.');
  // 2: fly the AI tasks one at a time
  const base=reduced?0:1300;
  const step=reduced?0:380;
  for(let i=0;i<8;i++){flyTask('t'+(i+1), base+i*step);}
  // 3: pulse the human tasks
  after(reduced?0:base+8*step+500,()=>cap.textContent='Two stay. Judgment. Presence. Care.');
  pulseHuman('h1','glowH1', reduced?0:base+8*step+700);
  pulseHuman('h2','glowH2', reduced?0:base+8*step+1100);
  after(reduced?0:base+8*step+5200,()=>cap.textContent='AI clears the desk. The teacher does what only the teacher can.');
  // loop
  if(!reduced) after(base+8*step+8200, reset);
}

$('rb').addEventListener('click',reset);
run();
})();
</script>
</body>
</html>
