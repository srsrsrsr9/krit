<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson prep with AI — vague vs briefed</title>
<style>
  :root{--bg:#FFF7ED;--ink:#1F2937;--mute:#6B7280;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .wrap{position:relative;width:100%;max-width:840px;}
  svg{width:100%;height:auto;display:block;}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--mute);margin-top:8px;padding:0 8px;}
  #rb{position:absolute;bottom:8px;right:8px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.78;}
  #rb:hover{opacity:1;}
  .gtxt{font-family:ui-monospace,"SFMono-Regular",monospace;}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<main class="stage">
<div class="wrap">
<svg viewBox="0 0 840 510" aria-label="Two prompts run in parallel: a vague one yields a dull 1990s worksheet; a briefed one yields a tailored CBSE Class 7 lesson plan with discussion prompts and three differentiated activities.">
  <rect width="840" height="510" fill="#FFF7ED"/>

  <!-- title -->
  <text x="420" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1F2937">Same model. Same topic. Different brief.</text>

  <!-- divider -->
  <line x1="420" y1="60" x2="420" y2="488" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- ── LEFT: VAGUE PROMPT ─────────────────────────────────── -->
  <g>
    <!-- prompt box -->
    <rect x="32" y="62" width="368" height="82" rx="10" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="44" y="80" font-size="10" font-weight="700" fill="#475569" letter-spacing="1">VAGUE PROMPT</text>
    <text id="lp1" x="44" y="106" font-size="13" fill="#1F2937" class="gtxt"></text>
    <text id="lp2" x="44" y="126" font-size="13" fill="#1F2937" class="gtxt"></text>

    <!-- spinner -->
    <g id="lspin" transform="translate(216,170)" opacity="0">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-dasharray="40 12" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- output: a dull 1990s worksheet -->
    <g id="lout" opacity="0">
      <!-- paper -->
      <rect x="60" y="178" width="320" height="280" rx="3" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.5"/>
      <!-- punched holes -->
      <circle cx="74" cy="200" r="3" fill="#CBD5E1"/>
      <circle cx="74" cy="240" r="3" fill="#CBD5E1"/>
      <circle cx="74" cy="280" r="3" fill="#CBD5E1"/>
      <circle cx="74" cy="320" r="3" fill="#CBD5E1"/>
      <circle cx="74" cy="360" r="3" fill="#CBD5E1"/>
      <circle cx="74" cy="400" r="3" fill="#CBD5E1"/>
      <circle cx="74" cy="440" r="3" fill="#CBD5E1"/>
      <!-- header -->
      <text x="220" y="208" text-anchor="middle" font-size="13" font-weight="700" fill="#475569" class="gtxt">PHOTOSYNTHESIS — WORKSHEET</text>
      <line x1="92" y1="220" x2="372" y2="220" stroke="#CBD5E1" stroke-width="1"/>
      <text x="92" y="240" font-size="10" fill="#64748B">Name: ______________  Date: _________</text>
      <line x1="92" y1="248" x2="372" y2="248" stroke="#94A3B8" stroke-width="0.6"/>
      <!-- generic numbered lines -->
      <text x="92" y="270" font-size="11" fill="#475569">1. Define photosynthesis.</text>
      <line x1="92" y1="282" x2="372" y2="282" stroke="#CBD5E1" stroke-width="0.6"/>
      <text x="92" y="298" font-size="11" fill="#475569">2. Write the equation.</text>
      <line x1="92" y1="310" x2="372" y2="310" stroke="#CBD5E1" stroke-width="0.6"/>
      <text x="92" y="326" font-size="11" fill="#475569">3. Name two products.</text>
      <line x1="92" y1="338" x2="372" y2="338" stroke="#CBD5E1" stroke-width="0.6"/>
      <text x="92" y="354" font-size="11" fill="#475569">4. List the reactants.</text>
      <line x1="92" y1="366" x2="372" y2="366" stroke="#CBD5E1" stroke-width="0.6"/>
      <text x="92" y="382" font-size="11" fill="#475569">5. Where does it occur?</text>
      <line x1="92" y1="394" x2="372" y2="394" stroke="#CBD5E1" stroke-width="0.6"/>
      <text x="92" y="410" font-size="11" fill="#475569">6. True / False questions.</text>
      <line x1="92" y1="422" x2="372" y2="422" stroke="#CBD5E1" stroke-width="0.6"/>
      <!-- watermark vibe -->
      <text x="220" y="448" text-anchor="middle" font-size="9" font-style="italic" fill="#94A3B8">— generic, ages 10–18, any country —</text>
    </g>

    <!-- footer label -->
    <rect x="32" y="468" width="368" height="22" rx="6" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1"/>
    <text x="216" y="484" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">Generic. Forgettable. Could be any class.</text>
  </g>

  <!-- ── RIGHT: BRIEFED PROMPT ──────────────────────────────── -->
  <g>
    <!-- prompt box -->
    <rect x="440" y="62" width="368" height="82" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
    <text x="452" y="80" font-size="10" font-weight="700" fill="#047857" letter-spacing="1">PROMPT WITH BRIEF</text>
    <text id="rp1" x="452" y="98" font-size="11" fill="#064E3B"></text>
    <text id="rp2" x="452" y="113" font-size="11" fill="#064E3B"></text>
    <text id="rp3" x="452" y="128" font-size="11" fill="#064E3B"></text>

    <!-- spinner -->
    <g id="rspin" transform="translate(624,170)" opacity="0">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#10B981" stroke-width="2.5" stroke-dasharray="40 12" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- output: tailored lesson plan -->
    <g id="rout" opacity="0">
      <rect x="448" y="158" width="352" height="306" rx="10" fill="white" stroke="#6EE7B7" stroke-width="1.5"/>
      <!-- header bar -->
      <rect x="448" y="158" width="352" height="34" rx="10" fill="#10B981"/>
      <text x="624" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="white">Lesson plan · Class 7 · CBSE · 40 min</text>

      <!-- meta chips -->
      <g id="rchips" opacity="0">
        <rect x="460" y="200" width="86" height="20" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
        <text x="503" y="214" text-anchor="middle" font-size="9.5" fill="#92400E" font-weight="600">after food chain</text>
        <rect x="552" y="200" width="76" height="20" rx="10" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1"/>
        <text x="590" y="214" text-anchor="middle" font-size="9.5" fill="#075985" font-weight="600">low-internet</text>
        <rect x="634" y="200" width="64" height="20" rx="10" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1"/>
        <text x="666" y="214" text-anchor="middle" font-size="9.5" fill="#5B21B6" font-weight="600">40-min slot</text>
      </g>

      <!-- discussion prompts block -->
      <g id="rdisc" opacity="0">
        <rect x="460" y="232" width="328" height="58" rx="8" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1"/>
        <text x="468" y="247" font-size="10" font-weight="700" fill="#92400E" letter-spacing="0.6">DISCUSSION PROMPTS</text>
        <text x="468" y="262" font-size="10.5" fill="#1F2937">• If a banyan tree had a salary, what would it earn?</text>
        <text x="468" y="276" font-size="10.5" fill="#1F2937">• Where in the food chain we drew last week did sunlight enter?</text>
      </g>

      <!-- 3 differentiated activities -->
      <g id="ra1" opacity="0">
        <rect x="460" y="300" width="104" height="54" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="1.4"/>
        <circle cx="476" cy="316" r="9" fill="#10B981"/>
        <text x="476" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="white">A</text>
        <text x="490" y="319" font-size="10" font-weight="700" fill="#065F46">Foundation</text>
        <text x="468" y="335" font-size="9.5" fill="#1F2937">label a leaf:</text>
        <text x="468" y="346" font-size="9.5" fill="#1F2937">sun · water · CO₂</text>
      </g>
      <g id="ra2" opacity="0">
        <rect x="572" y="300" width="104" height="54" rx="8" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.4"/>
        <circle cx="588" cy="316" r="9" fill="#F59E0B"/>
        <text x="588" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="white">B</text>
        <text x="602" y="319" font-size="10" font-weight="700" fill="#92400E">Apply</text>
        <text x="580" y="335" font-size="9.5" fill="#1F2937">measure leaf in</text>
        <text x="580" y="346" font-size="9.5" fill="#1F2937">light vs shade</text>
      </g>
      <g id="ra3" opacity="0">
        <rect x="684" y="300" width="104" height="54" rx="8" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.4"/>
        <circle cx="700" cy="316" r="9" fill="#8B5CF6"/>
        <text x="700" y="320" text-anchor="middle" font-size="10" font-weight="700" fill="white">C</text>
        <text x="714" y="319" font-size="10" font-weight="700" fill="#5B21B6">Stretch</text>
        <text x="692" y="335" font-size="9.5" fill="#1F2937">design experiment</text>
        <text x="692" y="346" font-size="9.5" fill="#1F2937">w/o internet</text>
      </g>

      <!-- exit ticket -->
      <g id="rexit" opacity="0">
        <rect x="460" y="364" width="328" height="38" rx="8" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1"/>
        <text x="468" y="379" font-size="10" font-weight="700" fill="#075985" letter-spacing="0.6">EXIT TICKET</text>
        <text x="468" y="394" font-size="10.5" fill="#1F2937">Draw the path of one carbon atom from morning chai to a leaf.</text>
      </g>

      <!-- timing strip -->
      <g id="rtime" opacity="0">
        <rect x="460" y="412" width="328" height="38" rx="8" fill="white" stroke="#CBD5E1" stroke-width="1"/>
        <text x="468" y="427" font-size="9.5" font-weight="700" fill="#475569" letter-spacing="0.6">TIMING · 40 MIN</text>
        <text x="468" y="442" font-size="10" fill="#1F2937" class="gtxt">5 hook · 10 disc · 15 act · 7 share · 3 exit</text>
      </g>
    </g>

    <!-- footer label -->
    <rect x="440" y="468" width="368" height="22" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1"/>
    <text x="624" y="484" text-anchor="middle" font-size="11" fill="#065F46" font-weight="600">Specific. Useful. Yours.</text>
  </g>

</svg>
<div class="caption" id="cap">A prompt is only as good as the brief behind it.</div>
<button id="rb" type="button" aria-label="Reset animation">reset</button>
</div>
</main>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
let timers=[];
const after=(ms,fn)=>timers.push(setTimeout(fn,ms));
const clearAll=()=>{timers.forEach(clearTimeout);timers=[];};
const reduced=window.matchMedia('(prefers-reduced-motion:reduce)').matches;

function typeInto(el,text,speed){
  return new Promise(res=>{
    if(reduced){el.textContent=text;res();return;}
    let i=0;el.textContent='';
    function tick(){
      if(i>=text.length){res();return;}
      el.textContent+=text[i++];
      timers.push(setTimeout(tick,speed));
    }
    tick();
  });
}
function fade(id,a,b,dur){
  return new Promise(res=>{
    const el=$(id);
    if(!el){res();return;}
    if(reduced){el.setAttribute('opacity',String(b));res();return;}
    const start=performance.now();
    function tick(now){
      const t=Math.min((now-start)/dur,1);
      const e=1-Math.pow(1-t,3);
      el.setAttribute('opacity',String(a+(b-a)*e));
      if(t<1)requestAnimationFrame(tick);else res();
    }
    requestAnimationFrame(tick);
  });
}
const sleep=ms=>new Promise(r=>{timers.push(setTimeout(r,ms));});
const cap=$('cap');

async function run(){
  cap.textContent='Two teachers. Same topic. Same model.';
  // type LEFT prompt
  await Promise.all([
    typeInto($('lp1'),"> make me a lesson on", 26),
    typeInto($('rp1'),"> Class 7 CBSE · 40-min slot", 26)
  ]);
  await Promise.all([
    typeInto($('lp2'),"  photosynthesis", 26),
    typeInto($('rp2'),"  after food chain unit", 26)
  ]);
  await typeInto($('rp3'),"  low-internet group · differentiated", 22);

  cap.textContent='Both run. Watch what comes back.';
  $('lspin').setAttribute('opacity','1');
  $('rspin').setAttribute('opacity','1');
  await sleep(1100);
  $('lspin').setAttribute('opacity','0');
  $('rspin').setAttribute('opacity','0');

  // LEFT output: dull worksheet appears
  fade('lout',0,1,500);
  // RIGHT output: lesson plan reveals piece by piece
  await fade('rout',0,1,400);
  await sleep(180);
  await fade('rchips',0,1,300);
  await sleep(120);
  cap.textContent='Left: a worksheet from 1996. Right: a class.';
  await fade('rdisc',0,1,300);
  await sleep(140);
  await fade('ra1',0,1,260);
  await fade('ra2',0,1,260);
  await fade('ra3',0,1,260);
  await sleep(140);
  await fade('rexit',0,1,260);
  await fade('rtime',0,1,260);
  cap.textContent='A prompt is only as good as the brief behind it.';
  if(!reduced){await sleep(3500);reset();}
}

function reset(){
  clearAll();
  ['lp1','lp2','rp1','rp2','rp3'].forEach(id=>$(id).textContent='');
  ['lout','lspin','rout','rchips','rdisc','ra1','ra2','ra3','rexit','rtime','rspin'].forEach(id=>$(id).setAttribute('opacity','0'));
  run();
}
$('rb').addEventListener('click',reset);
run();
})();
</script>
</body>
</html>
