<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: lesson prep with AI</title>
<style>
  :root {
    --bg: #FFF7ED;
    --ink: #1F2937;
    --muted: #6B7280;
    --paper: #FFFFFF;
    --line: #E5E7EB;
    --amber: #F59E0B;
    --rose: #F43F5E;
    --emerald: #10B981;
    --sky: #0EA5E9;
    --violet: #8B5CF6;
    --gray-old: #D1D5DB;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family: system-ui,-apple-system,"Inter",sans-serif; }
  .stage { width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .wrap { width:100%; max-width:780px; }
  .frame { width:100%; aspect-ratio: 16/9; display:block; }
  .caption { text-align:center; font-size:13px; font-style:italic; color:var(--muted); margin-top:10px; min-height: 18px; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* 14s cycle: 0–2 prompt typed, 2–6 generic worksheet, 6–8 brief added, 8–13 tailored plan, 13–14 hold */
  @keyframes promptType {
    0% { width: 0; }
    10% { width: 100%; }
    100% { width: 100%; }
  }
  @keyframes oldPaperIn {
    0%, 12% { opacity: 0; transform: translate(0,8px) scale(0.98); }
    18%, 42% { opacity: 1; transform: translate(0,0) scale(1); }
    48%, 100% { opacity: 0.15; transform: translate(0,0) scale(0.96); }
  }
  @keyframes briefIn {
    0%, 38% { opacity: 0; transform: translateY(8px); }
    44%, 100% { opacity: 1; transform: translateY(0); }
  }
  @keyframes newPaperIn {
    0%, 50% { opacity: 0; transform: translateY(12px) scale(0.98); }
    58%, 100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes capSwap {
    0%, 8% { opacity: 0; }
    12%, 30% { opacity: 1; }
    34%, 48% { opacity: 0; }
    52%, 70% { opacity: 1; }
    74%, 86% { opacity: 0; }
    90%, 98% { opacity: 1; }
    100% { opacity: 0; }
  }
  .cap { animation: capSwap 14s var(--ease) infinite; }
  .cap.c1 { animation-delay: 0s; }
  .cap.c2 { animation-delay: -9.3s; }
  .cap.c3 { animation-delay: -4.6s; }

  .prompt-text { animation: promptType 14s steps(40, end) infinite; overflow:hidden; white-space:nowrap; }
  .old-paper { animation: oldPaperIn 14s var(--ease) infinite; }
  .brief { animation: briefIn 14s var(--ease) infinite; }
  .new-paper { animation: newPaperIn 14s var(--ease) infinite; }

  @keyframes pulseDot {
    0%, 90% { transform: scale(1); opacity: 0.6; }
    95% { transform: scale(1.4); opacity: 1; }
    100% { transform: scale(1); opacity: 0.6; }
  }
  .pulse { animation: pulseDot 1.4s ease-in-out infinite; transform-origin: center; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .old-paper, .new-paper, .brief { opacity: 1 !important; transform: none !important; }
    .prompt-text { width: 100% !important; }
    .cap.c1 { opacity: 1 !important; }
    .cap.c2, .cap.c3 { opacity: 0 !important; }
  }
html,body{overflow:hidden;margin:0;padding:0}</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg class="frame" viewBox="0 0 780 439" aria-label="A teacher prompts an AI for a lesson on photosynthesis. The same prompt without context produces a generic 1990s worksheet. With context — Class 7 CBSE, Pune school, after the food chain unit — the AI produces a tailored lesson plan.">
      <!-- Background -->
      <rect x="0" y="0" width="780" height="439" fill="#FFF7ED"/>

      <!-- Title row -->
      <text x="40" y="40" font-size="14" font-weight="700" fill="#1F2937" letter-spacing="0.5">SAME AI · TWO PROMPTS</text>
      <line x1="40" y1="50" x2="200" y2="50" stroke="#F59E0B" stroke-width="3" stroke-linecap="round"/>

      <!-- Prompt bar -->
      <g transform="translate(40, 70)">
        <rect x="0" y="0" width="700" height="44" rx="22" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/>
        <circle cx="22" cy="22" r="9" fill="#8B5CF6"/>
        <text x="22" y="26" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">T</text>
        <foreignObject x="42" y="6" width="640" height="34">
          <div xmlns="http://www.w3.org/1999/xhtml" style="font: 14px ui-monospace, monospace; color:#1F2937; line-height:32px;">
            <span class="prompt-text" style="display:inline-block;">"Lesson on photosynthesis"</span>
            <span style="display:inline-block; width:2px; height:18px; background:#1F2937; vertical-align:middle; animation: pulseDot 0.9s steps(2,end) infinite;"></span>
          </div>
        </foreignObject>
      </g>

      <!-- LEFT: Generic worksheet (1990s) -->
      <g class="old-paper" transform="translate(40, 138)">
        <!-- Paper -->
        <rect x="0" y="0" width="320" height="240" rx="6" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
        <!-- header -->
        <text x="160" y="28" text-anchor="middle" font-size="13" font-weight="800" fill="#4B5563" letter-spacing="1">PHOTOSYNTHESIS — WORKSHEET</text>
        <line x1="20" y1="40" x2="300" y2="40" stroke="#9CA3AF" stroke-width="1.2"/>

        <!-- Stiff diagram -->
        <g transform="translate(20, 56)">
          <rect x="0" y="0" width="60" height="60" fill="none" stroke="#6B7280" stroke-width="1.5"/>
          <text x="30" y="36" text-anchor="middle" font-size="9" fill="#6B7280">Fig. 1</text>
        </g>

        <!-- Numbered, dry questions -->
        <g font-family="ui-monospace, monospace" font-size="10" fill="#4B5563">
          <text x="92" y="68">1. Define photosynthesis. _______</text>
          <text x="92" y="84">2. Write the chemical equation.</text>
          <text x="92" y="100">3. Name the green pigment. ____</text>
          <text x="92" y="116">4. List the raw materials. _____</text>
          <text x="20" y="142">5. Fill in the blanks (5 marks):</text>
          <text x="20" y="158">    a) ___ + ___ → ___ + ___</text>
          <text x="20" y="174">    b) Site of reaction is ___</text>
          <text x="20" y="190">6. True / False (5 marks)</text>
          <text x="20" y="206">7. Tick the correct option (5 marks)</text>
        </g>

        <text x="160" y="226" text-anchor="middle" font-size="9" font-style="italic" fill="#6B7280">Marks: 30  ·  Time: 30 min</text>

        <!-- old vibe corner sticker -->
        <g transform="translate(280, 14) rotate(8)">
          <rect x="-22" y="-10" width="44" height="20" rx="3" fill="#9CA3AF"/>
          <text x="0" y="4" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">1996</text>
        </g>

        <!-- Tag -->
        <g transform="translate(0, 250)">
          <rect x="0" y="0" width="320" height="22" rx="11" fill="#9CA3AF"/>
          <text x="160" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">GENERIC PROMPT → GENERIC WORKSHEET</text>
        </g>
      </g>

      <!-- BRIEF chip in middle -->
      <g class="brief" transform="translate(390, 138)">
        <rect x="0" y="0" width="350" height="76" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5"/>
        <text x="14" y="22" font-size="11" font-weight="700" fill="#92400E" letter-spacing="0.5">+ ADD BRIEF</text>
        <text x="14" y="40" font-size="11" fill="#1F2937">• Class 7 CBSE, Marathi-medium home, English instruction</text>
        <text x="14" y="56" font-size="11" fill="#1F2937">• Pune municipal school, 38 students, 1 projector</text>
        <text x="14" y="72" font-size="11" fill="#1F2937">• Just finished food-chain unit. Connect, don't restart.</text>
      </g>

      <!-- RIGHT: Tailored plan -->
      <g class="new-paper" transform="translate(390, 224)">
        <rect x="0" y="0" width="350" height="170" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5"/>
        <text x="14" y="24" font-size="13" font-weight="800" fill="#065F46">Lesson — Photosynthesis (45 min)</text>
        <line x1="14" y1="32" x2="336" y2="32" stroke="#A7F3D0" stroke-width="1.5"/>

        <g font-size="11" fill="#1F2937">
          <text x="14" y="50"><tspan font-weight="700" fill="#0EA5E9">5'</tspan>  Hook: "Where did the food in your tiffin start?"</text>
          <text x="14" y="68"><tspan font-weight="700" fill="#0EA5E9">10'</tspan> Bridge: bajra plant in pot · trace back to sun</text>
          <text x="14" y="86"><tspan font-weight="700" fill="#0EA5E9">15'</tspan> Investigation: cover one leaf, predict in pairs</text>
          <text x="14" y="104"><tspan font-weight="700" fill="#0EA5E9">10'</tspan> Vocab in Marathi → English mapping</text>
          <text x="14" y="122"><tspan font-weight="700" fill="#0EA5E9">5'</tspan>  Exit ticket: draw the food chain backwards</text>
        </g>

        <line x1="14" y1="132" x2="336" y2="132" stroke="#A7F3D0" stroke-width="1.5"/>
        <text x="14" y="150" font-size="10" font-style="italic" fill="#065F46">Reuses: food-chain vocab from last week. No projector needed.</text>

        <!-- Green check badge -->
        <g transform="translate(312, 14)">
          <circle cx="0" cy="0" r="14" fill="#10B981"/>
          <path d="M-6 0 L-1 5 L7 -5" stroke="#FFFFFF" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
      </g>

      <!-- Tag for new -->
      <g class="new-paper" transform="translate(390, 400)">
        <rect x="0" y="0" width="350" height="22" rx="11" fill="#10B981"/>
        <text x="175" y="15" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">PROMPT + CONTEXT → TAILORED PLAN</text>
      </g>

      <!-- Subtle arrow from brief to right -->
      <g class="brief">
        <path d="M375 176 L390 176" stroke="#F59E0B" stroke-width="2" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
    <div class="caption">
      <span class="cap c1">Stage 1 · "Lesson on photosynthesis." The AI obliges. The worksheet is from no specific decade.</span>
      <span class="cap c2">Stage 2 · Add who, where, what came before. The same model, behaving completely differently.</span>
      <span class="cap c3">Stage 3 · The leverage is the brief, not the prompt. Five lines of context, an entire lesson better.</span>
    </div>
  </div>
</main>
</body>
</html>
