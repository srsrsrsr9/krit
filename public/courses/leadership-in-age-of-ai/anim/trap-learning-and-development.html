<!doctype html>

<style>:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.frame{width:100%;max-width:720px}.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}.bad{animation:fade .5s ease .3s both}.boxes-checked{animation:fade .25s ease both}.bad-line{stroke-dasharray:600;animation:draw 4s linear .5s forwards}.fix{animation:fade .5s ease 5s both}.fix-line{stroke-dasharray:600;animation:draw 4s linear 5.5s forwards}.sprint{animation:fade .25s ease both}</style>
