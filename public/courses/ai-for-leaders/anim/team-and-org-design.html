<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI team and org design</title>
<style>
:root{--bg:#ECFDF5;--ink:#1F2937;--good:#10B981;--blue:#0EA5E9;--bad:#F43F5E;--purple:#8B5CF6}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:820px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-family:inherit}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%,55%{transform:scale(1.06)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.title{animation:fade .4s cubic-bezier(0.22,0.61,0.36,1) .1s both}
.cell{animation:drop .5s cubic-bezier(0.22,0.61,0.36,1) .4s both}
.factory{animation:drop .5s cubic-bezier(0.22,0.61,0.36,1) .8s both}
.fail-cell{animation:pop .5s cubic-bezier(0.22,0.61,0.36,1) 2.5s both}
.fail-fac{animation:pop .5s cubic-bezier(0.22,0.61,0.36,1) 3.5s both}
.divider{animation:fade .4s cubic-bezier(0.22,0.61,0.36,1) 4.4s both}
.hybrid{animation:drop .6s cubic-bezier(0.22,0.61,0.36,1) 4.8s both}
.hybrid-flow{animation:fade .6s cubic-bezier(0.22,0.61,0.36,1) 5.6s both}
.foot{animation:fade .5s cubic-bezier(0.22,0.61,0.36,1) 6.4s both}
.heart{transform-origin:center;animation:pulse 4s cubic-bezier(0.22,0.61,0.36,1) infinite 5.6s}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 820 540" aria-label="Two AI org structures side by side. Left: AI Cell, a small autonomous embedded team that ships features but duplicates work. Right: AI Factory, a centralized platform team that builds reusable infrastructure but ships nothing. Then the 2026 hybrid that combines both.">
<rect width="820" height="540" rx="14" fill="#ECFDF5"/>

<g class="title">
<text x="410" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Two ways to organize AI · and the one that actually ships</text>
<text x="410" y="48" text-anchor="middle" font-size="12" fill="#6B7280">cells move fast and duplicate · factories build deep and stall · hybrid wins</text>
</g>

<!-- LEFT: AI Cell -->
<g class="cell" transform="translate(30 70)">
<rect width="370" height="190" rx="12" fill="#fff" stroke="#0EA5E9" stroke-width="2"/>
<rect width="370" height="26" rx="12" fill="#0EA5E9"/>
<rect y="14" width="370" height="12" fill="#0EA5E9"/>
<text x="185" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">AI CELL · embedded in product</text>

<!-- product squads, each with a small AI cell -->
<g transform="translate(20 44)">
<rect width="100" height="90" rx="8" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="50" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">SQUAD A</text>
<circle cx="22" cy="36" r="7" fill="#1F2937"/>
<circle cx="42" cy="36" r="7" fill="#1F2937"/>
<circle cx="62" cy="36" r="7" fill="#1F2937"/>
<circle cx="82" cy="36" r="7" fill="#0EA5E9"/>
<text x="82" y="56" text-anchor="middle" font-size="8" fill="#0EA5E9" font-weight="bold">AI</text>
<text x="50" y="78" text-anchor="middle" font-size="9" fill="#6B7280">ships weekly</text>
</g>
<g transform="translate(135 44)">
<rect width="100" height="90" rx="8" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="50" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">SQUAD B</text>
<circle cx="22" cy="36" r="7" fill="#1F2937"/>
<circle cx="42" cy="36" r="7" fill="#1F2937"/>
<circle cx="62" cy="36" r="7" fill="#1F2937"/>
<circle cx="82" cy="36" r="7" fill="#0EA5E9"/>
<text x="82" y="56" text-anchor="middle" font-size="8" fill="#0EA5E9" font-weight="bold">AI</text>
<text x="50" y="78" text-anchor="middle" font-size="9" fill="#6B7280">ships weekly</text>
</g>
<g transform="translate(250 44)">
<rect width="100" height="90" rx="8" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1.5"/>
<text x="50" y="16" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">SQUAD C</text>
<circle cx="22" cy="36" r="7" fill="#1F2937"/>
<circle cx="42" cy="36" r="7" fill="#1F2937"/>
<circle cx="62" cy="36" r="7" fill="#1F2937"/>
<circle cx="82" cy="36" r="7" fill="#0EA5E9"/>
<text x="82" y="56" text-anchor="middle" font-size="8" fill="#0EA5E9" font-weight="bold">AI</text>
<text x="50" y="78" text-anchor="middle" font-size="9" fill="#6B7280">ships weekly</text>
</g>
</g>

<!-- AI Cell failure mode -->
<g class="fail-cell" transform="translate(30 268)">
<rect width="370" height="80" rx="10" fill="#FEE2E2" stroke="#F43F5E" stroke-width="1.5"/>
<text x="14" y="20" font-size="11" font-weight="bold" fill="#9F1239">FAILURE MODE · duplication</text>
<g transform="translate(14 32)">
<rect width="80" height="36" rx="6" fill="#fff" stroke="#F43F5E"/>
<text x="40" y="18" text-anchor="middle" font-size="9" fill="#9F1239">eval harness v1</text>
<text x="40" y="30" text-anchor="middle" font-size="8" fill="#9F1239" font-style="italic">squad A</text>
</g>
<g transform="translate(108 32)">
<rect width="80" height="36" rx="6" fill="#fff" stroke="#F43F5E"/>
<text x="40" y="18" text-anchor="middle" font-size="9" fill="#9F1239">eval harness v2</text>
<text x="40" y="30" text-anchor="middle" font-size="8" fill="#9F1239" font-style="italic">squad B</text>
</g>
<g transform="translate(202 32)">
<rect width="80" height="36" rx="6" fill="#fff" stroke="#F43F5E"/>
<text x="40" y="18" text-anchor="middle" font-size="9" fill="#9F1239">eval harness v3</text>
<text x="40" y="30" text-anchor="middle" font-size="8" fill="#9F1239" font-style="italic">squad C</text>
</g>
<text x="356" y="58" text-anchor="end" font-size="10" fill="#9F1239" font-style="italic">3 stacks · 1 problem</text>
</g>

<!-- RIGHT: AI Factory -->
<g class="factory" transform="translate(420 70)">
<rect width="370" height="190" rx="12" fill="#fff" stroke="#8B5CF6" stroke-width="2"/>
<rect width="370" height="26" rx="12" fill="#8B5CF6"/>
<rect y="14" width="370" height="12" fill="#8B5CF6"/>
<text x="185" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">AI FACTORY · centralized platform</text>

<g transform="translate(40 44)">
<rect width="290" height="120" rx="10" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="1.5"/>
<text x="145" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#5B21B6">PLATFORM TEAM (12)</text>
<g transform="translate(20 30)">
<circle cx="14" cy="14" r="8" fill="#1F2937"/>
<circle cx="36" cy="14" r="8" fill="#1F2937"/>
<circle cx="58" cy="14" r="8" fill="#1F2937"/>
<circle cx="80" cy="14" r="8" fill="#1F2937"/>
<circle cx="102" cy="14" r="8" fill="#1F2937"/>
<circle cx="124" cy="14" r="8" fill="#1F2937"/>
<circle cx="146" cy="14" r="8" fill="#1F2937"/>
<circle cx="168" cy="14" r="8" fill="#1F2937"/>
<circle cx="190" cy="14" r="8" fill="#1F2937"/>
<circle cx="212" cy="14" r="8" fill="#1F2937"/>
<circle cx="234" cy="14" r="8" fill="#1F2937"/>
<circle cx="14" cy="36" r="8" fill="#8B5CF6"/>
</g>
<rect x="20" y="80" width="250" height="28" rx="6" fill="#fff" stroke="#8B5CF6" stroke-dasharray="3 3"/>
<text x="145" y="98" text-anchor="middle" font-size="10" fill="#5B21B6" font-style="italic">"unified eval framework v0.4"</text>
</g>
</g>

<!-- AI Factory failure mode -->
<g class="fail-fac" transform="translate(420 268)">
<rect width="370" height="80" rx="10" fill="#FEE2E2" stroke="#F43F5E" stroke-width="1.5"/>
<text x="14" y="20" font-size="11" font-weight="bold" fill="#9F1239">FAILURE MODE · ships nothing</text>
<rect x="14" y="32" width="342" height="14" rx="4" fill="#fff" stroke="#F43F5E"/>
<rect x="14" y="32" width="34" height="14" rx="4" fill="#F43F5E"/>
<text x="180" y="42" text-anchor="middle" font-size="9" fill="#9F1239" font-weight="bold">10% complete · 6 months in</text>
<text x="14" y="64" font-size="10" fill="#9F1239" font-style="italic">no product team uses it · they built their own months ago</text>
</g>

<!-- divider -->
<g class="divider">
<line x1="50" y1="368" x2="770" y2="368" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="410" y="362" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="bold" letter-spacing="2">THE 2026 HYBRID</text>
</g>

<!-- HYBRID -->
<g class="hybrid" transform="translate(30 380)">
<rect width="760" height="110" rx="12" fill="#FFFBF2" stroke="#F59E0B" stroke-width="2"/>
<rect width="760" height="26" rx="12" fill="#F59E0B"/>
<rect y="14" width="760" height="12" fill="#F59E0B"/>
<text x="380" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">SMALL THIN PLATFORM + EMBEDDED CELLS</text>

<!-- thin platform -->
<g transform="translate(20 38)">
<rect width="180" height="60" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
<text x="90" y="18" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400E">Platform (4 ppl)</text>
<text x="90" y="34" text-anchor="middle" font-size="10" fill="#92400E">eval · obs · safety</text>
<text x="90" y="50" text-anchor="middle" font-size="9" fill="#92400E" font-style="italic">opinionated, minimal</text>
</g>

<!-- arrow -->
<g class="hybrid-flow">
<path d="M 210 68 L 246 68" stroke="#92400E" stroke-width="2" fill="none"/>
<polygon points="246,68 240,64 240,72" fill="#92400E"/>
</g>

<!-- 3 squads -->
<g transform="translate(258 38)" class="hybrid-flow">
<rect width="150" height="60" rx="8" fill="#EFF6FF" stroke="#0EA5E9"/>
<text x="75" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">SQUAD A + AI</text>
<text x="75" y="34" text-anchor="middle" font-size="9" fill="#1E40AF">ships weekly</text>
<text x="75" y="50" text-anchor="middle" font-size="9" fill="#1E40AF" font-style="italic">on shared rails</text>
</g>
<g transform="translate(420 38)" class="hybrid-flow">
<rect width="150" height="60" rx="8" fill="#EFF6FF" stroke="#0EA5E9"/>
<text x="75" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#1E40AF">SQUAD B + AI</text>
<text x="75" y="34" text-anchor="middle" font-size="9" fill="#1E40AF">ships weekly</text>
<text x="75" y="50" text-anchor="middle" font-size="9" fill="#1E40AF" font-style="italic">on shared rails</text>
</g>
<g transform="translate(582 38) " class="hybrid-flow">
<rect width="158" height="60" rx="8" fill="#ECFDF5" stroke="#10B981"/>
<text x="79" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#065F46">SQUAD C + AI</text>
<text x="79" y="34" text-anchor="middle" font-size="9" fill="#065F46">ships weekly</text>
<text x="79" y="50" text-anchor="middle" font-size="9" fill="#065F46" font-style="italic">on shared rails</text>
</g>
</g>

<!-- footer -->
<g class="foot" transform="translate(30 504)">
<rect width="760" height="28" rx="8" fill="#1F2937"/>
<g class="heart" transform="translate(380 14)">
<text text-anchor="middle" font-size="11" fill="#FCD34D" font-weight="bold">Build the rails once · let the trains run themselves</text>
</g>
</g>
</svg>
<div class="caption">Cells own outcomes. Platform owns leverage. Neither owns the other's job.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
