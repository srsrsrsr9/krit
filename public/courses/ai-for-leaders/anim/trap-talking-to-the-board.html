<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trap: 40% promised, 4% delivered</title>
<style>:root{--bg:#FAF5FF;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.frame{width:100%;max-width:720px}.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes draw{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}.bad{animation:fade .5s ease .3s both}.line-bad{stroke-dasharray:600;animation:draw 4s linear forwards}.line-fix{stroke-dasharray:600;animation:draw 4s linear 5s forwards}.fix-banner{animation:fade .5s ease 5s both}.replaced{animation:fade .5s ease 4.5s both}</style>
</head><body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A CEO promising 40% CAC reduction in 6 months but delivering 4%, leading to replacement; vs the same VP framing in dated kill criteria">
<rect width="720" height="405" rx="14" fill="#FAF5FF"/>
<g class="bad" transform="translate(40 30)"><rect width="640" height="44" rx="8" fill="#FCD34D" stroke="#92400E" stroke-width="2"/><text x="320" y="20" text-anchor="middle" font-size="13" fill="#7C2D12" font-weight="bold">"AI WILL REDUCE CAC BY 40% IN 6 MONTHS"</text><text x="320" y="36" text-anchor="middle" font-size="10" fill="#7C2D12" font-style="italic">— Q1 2024 board pitch · applauded · funded</text></g>
<g transform="translate(60 100)"><line x1="0" y1="180" x2="600" y2="180" stroke="#1F2937" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="180" stroke="#1F2937" stroke-width="2"/><text x="-5" y="6" text-anchor="end" font-size="9" fill="#1F2937">−40%</text><text x="-5" y="180" text-anchor="end" font-size="9" fill="#1F2937">0</text><text x="0" y="195" font-size="9" fill="#1F2937">M0</text><text x="100" y="195" font-size="9" fill="#1F2937">M2</text><text x="200" y="195" font-size="9" fill="#1F2937">M4</text><text x="300" y="195" font-size="9" fill="#1F2937">M6</text><text x="400" y="195" font-size="9" fill="#1F2937">M9</text><text x="500" y="195" font-size="9" fill="#1F2937">M12</text>
<text x="0" y="-8" font-size="10" fill="#1F2937" font-weight="bold">CAC reduction (promised vs actual)</text>
<line x1="0" y1="180" x2="600" y2="0" stroke="#FBBF24" stroke-width="2" stroke-dasharray="4 3"/>
<text x="540" y="14" font-size="10" fill="#92400E" font-weight="bold" text-anchor="end">↗ promise (−40%)</text>
<polyline class="line-bad" points="0,180 100,178 200,176 300,170 400,166 500,160 600,160" stroke="#F43F5E" stroke-width="3" fill="none"/>
<text x="540" y="155" font-size="10" fill="#7F1D1D" font-weight="bold" text-anchor="end">→ actual (−4%)</text>
</g>
<g class="replaced" transform="translate(40 320)"><rect width="320" height="60" rx="10" fill="#7F1D1D"/><text x="160" y="22" text-anchor="middle" font-size="12" fill="#FCA5A5" font-weight="bold">M12: CEO replaced</text><text x="160" y="42" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">vapor met reality at month 6</text></g>
<g class="fix-banner" transform="translate(380 320)"><rect width="300" height="60" rx="10" fill="#065F46"/><text x="150" y="20" text-anchor="middle" font-size="11" fill="#A7F3D0" font-weight="bold">Fix: dated kill criteria</text><text x="150" y="36" text-anchor="middle" font-size="9" fill="#A7F3D0">"By Sep 30: CAC −10%; if not, kill at D45"</text><text x="150" y="50" text-anchor="middle" font-size="9" fill="#A7F3D0" font-style="italic">honest probability + rollback plan</text></g>
</svg>
<div class="caption">Boards reward honest probability + dated kill criteria. They punish 40% promises that deliver 4%.</div>
</div></main><button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
