<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Risk and governance</title>
<style>
:root{--bg:#EFF6FF;--ink:#1F2937;--good:#10B981;--bad:#F43F5E;--warn:#F59E0B}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:800px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-family:inherit}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes printer{0%{transform:translateY(0)}100%{transform:translateY(28px)}}
@keyframes dust{0%,100%{opacity:.55}50%{opacity:.85}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@keyframes meter{from{stroke-dashoffset:240}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}.gauge-fill{stroke-dashoffset:0 !important}}
.title{animation:fade .4s cubic-bezier(0.22,0.61,0.36,1) .1s both}
.printer{animation:fade .5s cubic-bezier(0.22,0.61,0.36,1) .3s both}
.paper{animation:printer 2.4s cubic-bezier(0.22,0.61,0.36,1) .6s both}
.dust{animation:dust 4s cubic-bezier(0.22,0.61,0.36,1) infinite 3s}
.violation{animation:pop .5s cubic-bezier(0.22,0.61,0.36,1) 3.4s both}
.shake{animation:shake .25s cubic-bezier(0.22,0.61,0.36,1) 3.6s 3 both}
.divider{animation:fade .4s cubic-bezier(0.22,0.61,0.36,1) 4.4s both}
.gate{animation:drop .5s cubic-bezier(0.22,0.61,0.36,1) 4.8s both}
.gauge-fill{stroke-dasharray:240;stroke-dashoffset:240;animation:meter 1.4s cubic-bezier(0.22,0.61,0.36,1) 5.4s both}
.block{animation:pop .5s cubic-bezier(0.22,0.61,0.36,1) 6.8s both}
.foot{animation:fade .5s cubic-bezier(0.22,0.61,0.36,1) 7.4s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 800 530" aria-label="A 47-page policy document is printed and gathers dust. Months later an AI feature ships violating three policies and nobody notices because the doc is not enforced. The fix is a CI eval gate that automatically blocks deploys when the eval score drops below 85 percent.">
<rect width="800" height="530" rx="14" fill="#EFF6FF"/>

<g class="title">
<text x="400" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">Policy on paper vs policy in CI</text>
<text x="400" y="48" text-anchor="middle" font-size="12" fill="#6B7280">a doc nobody enforces is a doc nobody reads</text>
</g>

<!-- LEFT: printed doc -->
<g class="printer" transform="translate(40 80)">
<rect width="350" height="180" rx="10" fill="#FFFBF2" stroke="#92400E" stroke-width="1.5"/>
<text x="14" y="22" font-size="11" font-weight="bold" fill="#92400E">THE OLD WAY · printed policy</text>

<!-- printer -->
<g transform="translate(120 38)">
<rect width="110" height="50" rx="8" fill="#374151"/>
<rect x="6" y="36" width="98" height="6" fill="#1F2937"/>
<rect x="14" y="14" width="60" height="6" rx="2" fill="#9CA3AF"/>
<circle cx="92" cy="22" r="4" fill="#10B981"/>
</g>

<!-- printed paper sliding down -->
<g class="paper" transform="translate(140 86)">
<rect width="70" height="40" rx="2" fill="#fff" stroke="#9CA3AF"/>
<line x1="6" y1="8" x2="64" y2="8" stroke="#9CA3AF" stroke-width="0.7"/>
<line x1="6" y1="14" x2="64" y2="14" stroke="#9CA3AF" stroke-width="0.7"/>
<line x1="6" y1="20" x2="64" y2="20" stroke="#9CA3AF" stroke-width="0.7"/>
<line x1="6" y1="26" x2="44" y2="26" stroke="#9CA3AF" stroke-width="0.7"/>
<text x="35" y="38" text-anchor="middle" font-size="6" fill="#92400E" font-weight="bold">AI POLICY · v1</text>
</g>

<!-- stack with dust -->
<g class="dust" transform="translate(36 132)">
<rect width="84" height="42" rx="2" fill="#fff" stroke="#9CA3AF"/>
<rect x="6" y="-4" width="84" height="42" rx="2" fill="#fff" stroke="#9CA3AF"/>
<rect x="12" y="-8" width="84" height="42" rx="2" fill="#fff" stroke="#9CA3AF"/>
<text x="54" y="14" text-anchor="middle" font-size="9" font-weight="bold" fill="#92400E" font-family="ui-monospace,monospace">47 pages</text>
<text x="54" y="26" text-anchor="middle" font-size="8" fill="#92400E" font-style="italic">read by 0 engineers</text>
<!-- dust particles -->
<circle cx="120" cy="-12" r="1.5" fill="#D6D3D1" opacity=".7"/>
<circle cx="135" cy="-6" r="1" fill="#D6D3D1" opacity=".6"/>
<circle cx="125" cy="2" r="1.2" fill="#D6D3D1" opacity=".7"/>
<circle cx="148" cy="-2" r="1" fill="#D6D3D1" opacity=".5"/>
</g>

<text x="246" y="170" font-size="10" fill="#92400E" font-style="italic">"we have a policy"</text>
</g>

<!-- RIGHT: violation -->
<g class="violation" transform="translate(420 80)">
<rect width="350" height="180" rx="10" fill="#FEE2E2" stroke="#9F1239" stroke-width="1.5"/>
<text x="14" y="22" font-size="11" font-weight="bold" fill="#9F1239">3 MONTHS LATER · feature ships</text>

<g class="shake" transform="translate(20 38)">
<rect width="310" height="58" rx="8" fill="#fff" stroke="#9F1239"/>
<text x="14" y="22" font-size="13" font-weight="bold" fill="#1F2937">customer-chat-ai · v1.4.2</text>
<text x="14" y="40" font-size="10" fill="#374151">deployed to prod · 9:14am Tuesday</text>
<text x="14" y="54" font-size="10" fill="#374151" font-family="ui-monospace,monospace">build #218 · 3 reviewers · LGTM</text>
</g>

<g transform="translate(20 110)">
<text x="0" y="0" font-size="10" font-weight="bold" fill="#9F1239">VIOLATIONS:</text>
<g transform="translate(0 6)">
<rect width="310" height="16" rx="4" fill="#fff" stroke="#9F1239"/>
<text x="8" y="12" font-size="9" fill="#9F1239" font-family="ui-monospace,monospace">✕  PII leaks to log (§3.2)</text>
</g>
<g transform="translate(0 26)">
<rect width="310" height="16" rx="4" fill="#fff" stroke="#9F1239"/>
<text x="8" y="12" font-size="9" fill="#9F1239" font-family="ui-monospace,monospace">✕  no fallback for refusal (§5.1)</text>
</g>
<g transform="translate(0 46)">
<rect width="310" height="16" rx="4" fill="#fff" stroke="#9F1239"/>
<text x="8" y="12" font-size="9" fill="#9F1239" font-family="ui-monospace,monospace">✕  prompt unlogged (§7.4)</text>
</g>
</g>
<text x="175" y="170" text-anchor="middle" font-size="10" fill="#9F1239" font-style="italic">caught by a customer · not by us</text>
</g>

<!-- divider -->
<g class="divider">
<line x1="60" y1="280" x2="740" y2="280" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="400" y="274" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="bold" letter-spacing="2">THE FIX · GOVERNANCE THAT EXECUTES</text>
</g>

<!-- CI gate -->
<g class="gate" transform="translate(40 296)">
<rect width="730" height="160" rx="12" fill="#fff" stroke="#10B981" stroke-width="2"/>
<rect width="730" height="26" rx="12" fill="#10B981"/>
<rect y="14" width="730" height="12" fill="#10B981"/>
<text x="365" y="18" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">CI eval gate · runs on every PR</text>

<!-- code commit -->
<g transform="translate(20 44)">
<rect width="140" height="100" rx="8" fill="#F3F4F6" stroke="#9CA3AF"/>
<text x="70" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#374151">PR #218</text>
<rect x="10" y="28" width="120" height="10" rx="2" fill="#fff" stroke="#9CA3AF"/>
<rect x="10" y="42" width="120" height="10" rx="2" fill="#fff" stroke="#9CA3AF"/>
<rect x="10" y="56" width="100" height="10" rx="2" fill="#fff" stroke="#9CA3AF"/>
<text x="70" y="84" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">change to chat-ai</text>
</g>

<!-- arrow 1 -->
<path d="M 168 94 L 196 94" stroke="#1F2937" stroke-width="2" fill="none"/>
<polygon points="196,94 190,90 190,98" fill="#1F2937"/>

<!-- gauge -->
<g transform="translate(206 44)">
<rect width="240" height="100" rx="8" fill="#FFFBF2" stroke="#F59E0B"/>
<text x="120" y="18" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400E">eval suite (1,200 cases)</text>
<!-- arc gauge -->
<path d="M 40 80 A 50 50 0 0 1 200 80" fill="none" stroke="#FDE68A" stroke-width="10" stroke-linecap="round"/>
<path class="gauge-fill" d="M 40 80 A 50 50 0 0 1 200 80" fill="none" stroke="#F43F5E" stroke-width="10" stroke-linecap="round" stroke-dasharray="240"/>
<text x="120" y="68" text-anchor="middle" font-size="20" font-weight="bold" fill="#9F1239" font-family="ui-monospace,monospace">78%</text>
<text x="120" y="92" text-anchor="middle" font-size="9" fill="#92400E">threshold: 85%</text>
</g>

<!-- arrow 2 -->
<path d="M 454 94 L 482 94" stroke="#1F2937" stroke-width="2" fill="none"/>
<polygon points="482,94 476,90 476,98" fill="#1F2937"/>

<!-- block -->
<g class="block" transform="translate(492 44)">
<rect width="220" height="100" rx="8" fill="#FEE2E2" stroke="#9F1239" stroke-width="2"/>
<text x="110" y="22" text-anchor="middle" font-size="11" font-weight="bold" fill="#9F1239">DEPLOY BLOCKED</text>
<g transform="translate(20 32)">
<rect width="180" height="14" rx="4" fill="#9F1239"/>
<text x="90" y="11" text-anchor="middle" font-size="9" fill="#fff" font-family="ui-monospace,monospace">eval 78% &lt; gate 85%</text>
</g>
<text x="110" y="62" text-anchor="middle" font-size="9" fill="#9F1239">PII leak detected in 47 cases</text>
<text x="110" y="76" text-anchor="middle" font-size="9" fill="#9F1239">no refusal fallback for 12 prompts</text>
<text x="110" y="92" text-anchor="middle" font-size="9" fill="#9F1239" font-style="italic">policy enforced · automatically</text>
</g>
</g>

<!-- footer -->
<g class="foot" transform="translate(40 472)">
<rect width="730" height="42" rx="8" fill="#1F2937"/>
<text x="365" y="20" text-anchor="middle" font-size="12" fill="#FCD34D" font-weight="bold">Governance is what runs · not what's printed</text>
<text x="365" y="34" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">if it isn't a CI check, it isn't a control</text>
</g>
</svg>
<div class="caption">Every printed policy is a wish. Every CI check is a guarantee.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
