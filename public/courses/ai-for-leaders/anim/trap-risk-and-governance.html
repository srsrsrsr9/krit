<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: policy doc, no enforcement</title>
<style>
  :root {
    --bg: #FFF7ED;
    --ink: #1F2937;
    --muted: #6B7280;
    --paper: #FFFFFF;
    --accent: #F59E0B;
    --bad: #F43F5E;
    --good: #10B981;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family: system-ui,-apple-system,"Inter",sans-serif; }
  .stage { width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .frame-wrap { width:100%; max-width:780px; }
  .frame { width:100%; aspect-ratio: 16/10; display:block; }
  .caption { text-align:center; font-size:13px; font-style:italic; color:var(--muted); margin-top:10px; padding:0 12px; }
  .num { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) {
    .anim, .anim * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="frame-wrap">
    <svg class="frame anim" viewBox="0 0 780 488" aria-label="Animation: a 47-page AI policy gets printed, signed, and filed. Four months later a feature ships violating three of its policies and no-one notices. The fix is a real eval gate in CI that blocks deploys." role="img">

      <!-- ============ ACT 1: the policy doc ============ -->
      <g style="animation: act1 13s cubic-bezier(0.22,0.61,0.36,1) infinite;">
        <text x="40" y="42" font-size="13" font-weight="700" fill="#9A3412" letter-spacing="1.5">ACT 1 — THE POLICY</text>

        <!-- desk -->
        <rect x="40" y="380" width="320" height="6" rx="3" fill="#FCD9B6"/>

        <!-- the document, growing in pages -->
        <g transform="translate(120 130)">
          <!-- back pages -->
          <rect x="14" y="10" width="160" height="220" rx="6" fill="#FCD9B6"/>
          <rect x="10" y="6"  width="160" height="220" rx="6" fill="#FFE7C8"/>
          <rect x="6"  y="2"  width="160" height="220" rx="6" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
          <text x="86" y="32" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412">AI POLICY v1.0</text>
          <line x1="20" y1="44" x2="152" y2="44" stroke="#F59E0B" stroke-width="1"/>
          <!-- text lines -->
          <g fill="#94A3B8">
            <rect x="20" y="56" width="120" height="3" rx="1.5"/>
            <rect x="20" y="66" width="132" height="3" rx="1.5"/>
            <rect x="20" y="76" width="100" height="3" rx="1.5"/>
            <rect x="20" y="86" width="124" height="3" rx="1.5"/>
            <rect x="20" y="96" width="116" height="3" rx="1.5"/>
            <rect x="20" y="108" width="130" height="3" rx="1.5"/>
            <rect x="20" y="118" width="106" height="3" rx="1.5"/>
            <rect x="20" y="128" width="124" height="3" rx="1.5"/>
            <rect x="20" y="138" width="118" height="3" rx="1.5"/>
            <rect x="20" y="148" width="100" height="3" rx="1.5"/>
            <rect x="20" y="158" width="128" height="3" rx="1.5"/>
            <rect x="20" y="168" width="110" height="3" rx="1.5"/>
            <rect x="20" y="178" width="120" height="3" rx="1.5"/>
          </g>
          <text x="86" y="216" text-anchor="middle" font-size="11" font-weight="700" fill="#9A3412" class="num">47 pages</text>
        </g>

        <!-- printer animation, paper count -->
        <g style="animation: pageCounter 13s cubic-bezier(0.22,0.61,0.36,1) infinite;">
          <text x="280" y="160" font-size="40" font-weight="700" fill="#F59E0B" class="num" id="pageCount">47</text>
          <text x="280" y="178" font-size="12" fill="#6B7280">pages</text>
        </g>

        <!-- signature stamp -->
        <g style="animation: signed 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity:0; transform-box: fill-box; transform-origin: 200px 320px;">
          <circle cx="200" cy="320" r="34" fill="none" stroke="#F43F5E" stroke-width="2.5"/>
          <text x="200" y="316" text-anchor="middle" font-size="11" font-weight="700" fill="#F43F5E" letter-spacing="1.5">SIGNED</text>
          <text x="200" y="332" text-anchor="middle" font-size="9" fill="#F43F5E" letter-spacing="1">25 JAN 2026</text>
        </g>

        <!-- arrow to filing cabinet -->
        <g style="animation: filing 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity:0;">
          <path d="M310 240 L 470 240" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 4"/>
          <polyline points="464,234 470,240 464,246" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <text x="390" y="232" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">filed</text>
        </g>

        <!-- filing cabinet -->
        <g transform="translate(488 178)" style="animation: filing 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity:0;">
          <rect x="0" y="0" width="160" height="180" rx="8" fill="#E5E7EB" stroke="#9CA3AF" stroke-width="1.5"/>
          <rect x="6" y="8" width="148" height="50" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
          <circle cx="80" cy="33" r="3" fill="#9CA3AF"/>
          <rect x="6" y="64" width="148" height="50" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
          <circle cx="80" cy="89" r="3" fill="#9CA3AF"/>
          <rect x="6" y="120" width="148" height="50" rx="4" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1"/>
          <circle cx="80" cy="145" r="3" fill="#9CA3AF"/>
          <text x="80" y="36" text-anchor="middle" font-size="9" fill="#6B7280" letter-spacing="1">POLICY</text>
        </g>

        <!-- caption strip -->
        <g style="animation: cap1 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity:0;">
          <rect x="120" y="402" width="540" height="36" rx="8" fill="#FFFBEB" stroke="#FCD34D" stroke-width="1.5"/>
          <text x="390" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">printed. signed. filed. nobody enforces it.</text>
        </g>
      </g>

      <!-- divider: 4 months later -->
      <g style="animation: timeJump 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity:0;">
        <text x="390" y="246" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">— 4 months later —</text>
        <line x1="320" y1="252" x2="380" y2="252" stroke="#9CA3AF" stroke-width="1.5"/>
        <line x1="400" y1="252" x2="460" y2="252" stroke="#9CA3AF" stroke-width="1.5"/>
      </g>

      <!-- ============ ACT 2: feature ships violating policy ============ -->
      <g style="animation: act2 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity:0;">
        <text x="40" y="42" font-size="13" font-weight="700" fill="#B91C1C" letter-spacing="1.5">ACT 2 — A FEATURE SHIPS</text>

        <!-- ship the feature: a rectangle moves into "production" -->
        <g>
          <rect x="80" y="200" width="200" height="80" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="180" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#1F2937">new AI feature</text>
          <text x="180" y="252" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">deploy.sh ✓ — green</text>
        </g>

        <!-- arrow → production -->
        <path d="M290 240 L 430 240" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
        <polyline points="424,234 430,240 424,246" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="360" y="232" text-anchor="middle" font-size="11" fill="#10B981" font-weight="700">PRODUCTION</text>

        <!-- production server -->
        <g transform="translate(440 180)">
          <rect x="0" y="0" width="120" height="120" rx="12" fill="#A7F3D0" stroke="#10B981" stroke-width="1.5"/>
          <rect x="14" y="20" width="92" height="14" rx="3" fill="#FFFFFF"/>
          <circle cx="22" cy="27" r="3" fill="#10B981"/>
          <rect x="14" y="42" width="92" height="14" rx="3" fill="#FFFFFF"/>
          <circle cx="22" cy="49" r="3" fill="#10B981"/>
          <rect x="14" y="64" width="92" height="14" rx="3" fill="#FFFFFF"/>
          <circle cx="22" cy="71" r="3" fill="#10B981"/>
          <text x="60" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">prod</text>
        </g>

        <!-- 47 policies, 3 of them being violated -->
        <g transform="translate(580 110)">
          <rect x="0" y="0" width="160" height="260" rx="10" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.5"/>
          <text x="80" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">47 POLICIES</text>
          <line x1="14" y1="32" x2="146" y2="32" stroke="#FCD34D" stroke-width="1"/>
          <!-- list of 13 lines, items 4, 9, 12 violated -->
          <g font-size="9" font-family="ui-monospace, monospace" fill="#6B7280">
            <text x="14" y="48">§ 1. data residency...</text>
            <text x="14" y="62">§ 2. logging policy...</text>
            <text x="14" y="76">§ 3. consent flow...</text>
            <text x="14" y="90" fill="#B91C1C" font-weight="700" style="animation: vio1 13s cubic-bezier(0.22,0.61,0.36,1) infinite;">§ 4. PII redaction ✗</text>
            <text x="14" y="104">§ 5. rate limiting...</text>
            <text x="14" y="118">§ 6. retention...</text>
            <text x="14" y="132">§ 7. eval coverage...</text>
            <text x="14" y="146">§ 8. red team...</text>
            <text x="14" y="160" fill="#B91C1C" font-weight="700" style="animation: vio2 13s cubic-bezier(0.22,0.61,0.36,1) infinite;">§ 9. prompt injection ✗</text>
            <text x="14" y="174">§10. fallbacks...</text>
            <text x="14" y="188">§11. cost ceilings...</text>
            <text x="14" y="202" fill="#B91C1C" font-weight="700" style="animation: vio3 13s cubic-bezier(0.22,0.61,0.36,1) infinite;">§12. human review ✗</text>
            <text x="14" y="216">§13. audit log...</text>
            <text x="14" y="230" fill="#94A3B8">§14-47. ...</text>
          </g>
        </g>

        <!-- "nobody noticed" stamp -->
        <g style="animation: nobody 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity: 0;">
          <rect x="80" y="400" width="450" height="40" rx="10" fill="#FEE2E2" stroke="#FECACA" stroke-width="1.5"/>
          <text x="305" y="426" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">3 violations. nothing flagged. nobody noticed.</text>
        </g>
      </g>

      <!-- ============ ACT 3: the fix — eval gate in CI ============ -->
      <g style="animation: act3 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity:0;">
        <text x="40" y="42" font-size="13" font-weight="700" fill="#065F46" letter-spacing="1.5">ACT 3 — THE FIX: EVAL GATE IN CI</text>

        <!-- pipeline: PR → Eval Gate → Deploy -->
        <!-- PR box -->
        <g transform="translate(60 170)">
          <rect width="140" height="80" rx="12" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="70" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">PR opened</text>
          <text x="70" y="50" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">new feature</text>
          <rect x="20" y="60" width="100" height="6" rx="3" fill="#E5E7EB"/>
        </g>

        <!-- arrow -->
        <path d="M210 210 L 270 210" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
        <polyline points="264,204 270,210 264,216" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

        <!-- eval gate -->
        <g transform="translate(280 145)">
          <rect width="200" height="130" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
          <text x="100" y="28" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">EVAL GATE</text>
          <text x="100" y="44" text-anchor="middle" font-size="10" fill="#92400E" font-style="italic">runs on every PR</text>
          <!-- check items -->
          <g font-size="10" font-family="ui-monospace, monospace">
            <g transform="translate(20 60)">
              <circle r="6" fill="#10B981"/>
              <path d="M-3,0 l2,2 l5,-5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
              <text x="14" y="3" fill="#1F2937">PII redaction</text>
            </g>
            <g transform="translate(20 80)">
              <circle r="6" fill="#10B981"/>
              <path d="M-3,0 l2,2 l5,-5" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
              <text x="14" y="3" fill="#1F2937">prompt injection</text>
            </g>
            <g transform="translate(20 100)">
              <circle r="6" fill="#F43F5E" style="animation: blockPulse 2.4s cubic-bezier(0.22,0.61,0.36,1) infinite;"/>
              <line x1="-3" y1="-3" x2="3" y2="3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
              <line x1="3" y1="-3" x2="-3" y2="3" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
              <text x="14" y="3" fill="#B91C1C" font-weight="700">human review missing</text>
            </g>
          </g>
        </g>

        <!-- block: deploy denied -->
        <g style="animation: blocked 13s cubic-bezier(0.22,0.61,0.36,1) infinite;">
          <path d="M490 210 L 560 210" stroke="#F43F5E" stroke-width="2" stroke-linecap="round"/>
          <line x1="556" y1="194" x2="566" y2="226" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
        </g>

        <!-- production blocked -->
        <g transform="translate(580 170)" style="animation: prodLocked 13s cubic-bezier(0.22,0.61,0.36,1) infinite;">
          <rect width="140" height="80" rx="12" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
          <text x="70" y="30" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">PROD</text>
          <!-- lock icon -->
          <g transform="translate(70 56)">
            <path d="M-8,-4 a8,8 0 0 1 16,0 v4 h-2 v-4 a6,6 0 0 0 -12,0 v4 h-2 z" fill="#94A3B8"/>
            <rect x="-12" y="0" width="24" height="16" rx="2" fill="#94A3B8"/>
            <circle r="2" fill="#FFFFFF" cy="8"/>
          </g>
        </g>

        <g style="animation: cap3 13s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity:0;">
          <rect x="60" y="320" width="660" height="80" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
          <text x="390" y="346" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">policies that block deploys are policies. everything else is decoration.</text>
          <text x="390" y="368" text-anchor="middle" font-size="11" fill="#1F2937">replace 47 pages with one CI step that fails the build.</text>
          <text x="390" y="386" text-anchor="middle" font-size="11" fill="#1F2937" font-style="italic">enforce in code, not in PDFs.</text>
        </g>
      </g>

      <style>
        @keyframes act1 {
          0%      { opacity: 0; }
          2%,28%  { opacity: 1; }
          33%,100%{ opacity: 0; }
        }
        @keyframes pageCounter {
          0%,4%   { opacity: 0; }
          8%,16%  { opacity: 1; }
          20%,100%{ opacity: 0; }
        }
        @keyframes signed {
          0%,18%   { opacity: 0; transform: scale(1.4) rotate(-12deg); }
          22%,28%  { opacity: 1; transform: scale(1) rotate(-12deg); }
          33%,100% { opacity: 0; }
        }
        @keyframes filing {
          0%,22%  { opacity: 0; }
          26%,28% { opacity: 1; }
          33%,100%{ opacity: 0; }
        }
        @keyframes cap1 {
          0%,18%  { opacity: 0; }
          24%,28% { opacity: 1; }
          33%,100%{ opacity: 0; }
        }
        @keyframes timeJump {
          0%,30%  { opacity: 0; }
          32%,35% { opacity: 1; }
          37%,100%{ opacity: 0; }
        }
        @keyframes act2 {
          0%,35%   { opacity: 0; }
          38%,63%  { opacity: 1; }
          68%,100% { opacity: 0; }
        }
        @keyframes vio1 {
          0%,42%  { fill: #6B7280; font-weight: 400; }
          47%,100%{ fill: #B91C1C; font-weight: 700; }
        }
        @keyframes vio2 {
          0%,48%  { fill: #6B7280; font-weight: 400; }
          53%,100%{ fill: #B91C1C; font-weight: 700; }
        }
        @keyframes vio3 {
          0%,54%  { fill: #6B7280; font-weight: 400; }
          59%,100%{ fill: #B91C1C; font-weight: 700; }
        }
        @keyframes nobody {
          0%,58%   { opacity: 0; transform: translateY(6px); }
          62%,68%  { opacity: 1; transform: translateY(0); }
          70%,100% { opacity: 0; }
        }
        @keyframes act3 {
          0%,68%   { opacity: 0; }
          73%,98%  { opacity: 1; }
          100%     { opacity: 0; }
        }
        @keyframes blocked {
          0%,80%   { opacity: 0; }
          85%,100% { opacity: 1; }
        }
        @keyframes prodLocked {
          0%,80%   { opacity: 0.4; }
          85%,100% { opacity: 1; }
        }
        @keyframes blockPulse {
          0%,100% { transform: scale(1); }
          50%     { transform: scale(1.3); }
        }
        @keyframes cap3 {
          0%,84%   { opacity: 0; transform: translateY(6px); }
          89%,98%  { opacity: 1; transform: translateY(0); }
          100%     { opacity: 0; }
        }
      </style>
    </svg>
    <div class="caption">If the policy doesn't fail the build, it isn't a policy — it's a binder on a shelf.</div>
  </div>
</main>
</body>
</html>
