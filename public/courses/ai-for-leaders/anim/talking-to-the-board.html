<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talking to the board</title>
<style>
:root{--bg:#FEF3C7;--ink:#1F2937;--good:#10B981;--bad:#F43F5E;--warn:#F59E0B;--purple:#8B5CF6}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:780px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer;font-family:inherit}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
@keyframes clap{0%,100%{transform:translateY(0)}40%{transform:translateY(-2px) rotate(-3deg)}60%{transform:translateY(0) rotate(3deg)}}
@keyframes frown{0%,100%{transform:translateY(0)}50%{transform:translateY(1px)}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.title{animation:fade .4s cubic-bezier(0.22,0.61,0.36,1) .1s both}
.scene1{animation:fade .5s cubic-bezier(0.22,0.61,0.36,1) .3s both}
.applause{animation:clap 1.6s cubic-bezier(0.22,0.61,0.36,1) 1.4s 2}
.timewarp{animation:pop .5s cubic-bezier(0.22,0.61,0.36,1) 3s both}
.scene2{animation:fade .5s cubic-bezier(0.22,0.61,0.36,1) 3.4s both}
.frown{transform-origin:center;animation:frown 1s cubic-bezier(0.22,0.61,0.36,1) 4.4s 2}
.divider{animation:fade .4s cubic-bezier(0.22,0.61,0.36,1) 5.6s both}
.scene3{animation:drop .5s cubic-bezier(0.22,0.61,0.36,1) 6s both}
.bullets{animation:fade .5s cubic-bezier(0.22,0.61,0.36,1) 6.8s both}
.signature{animation:pop .5s cubic-bezier(0.22,0.61,0.36,1) 8.2s both}
.foot{animation:fade .5s cubic-bezier(0.22,0.61,0.36,1) 8.8s both}
.nod{transform-origin:bottom;animation:nod 1s cubic-bezier(0.22,0.61,0.36,1) 7.4s 2}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 780 540" aria-label="A board meeting. Slide one: a vague AI promise applauded by the board. Eighteen months later: nothing shipped, board frustrated. The fix: a reframed slide with concrete dates, named bets, kill criteria, and a rollback narrative. Board signs off.">
<rect width="780" height="540" rx="14" fill="#FEF3C7"/>

<g class="title">
<text x="390" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#1F2937">The board slide that gets applause vs the one that gets results</text>
<text x="390" y="48" text-anchor="middle" font-size="12" fill="#6B7280">vague vision wins the room · concrete commitments win the year</text>
</g>

<!-- SCENE 1: vague slide -->
<g class="scene1" transform="translate(30 70)">
<rect width="380" height="160" rx="10" fill="#fff" stroke="#1F2937" stroke-width="2"/>
<text x="14" y="20" font-size="10" font-weight="bold" fill="#6B7280">SLIDE 1 · Q1 board pack</text>
<g transform="translate(190 90)">
<text text-anchor="middle" font-size="20" font-weight="bold" fill="#1F2937">AI WILL TRANSFORM</text>
<text y="22" text-anchor="middle" font-size="20" font-weight="bold" fill="#F59E0B">EVERYTHING IN 2026</text>
</g>
<text x="190" y="138" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">"a once-in-a-generation opportunity"</text>
</g>

<!-- board (applauding) -->
<g transform="translate(430 70)">
<rect width="320" height="160" rx="10" fill="#FFFBF2" stroke="#92400E" stroke-width="1.5"/>
<text x="14" y="20" font-size="10" font-weight="bold" fill="#92400E">BOARD ROOM · applause</text>

<!-- table -->
<ellipse cx="160" cy="120" rx="120" ry="14" fill="#FED7AA"/>

<!-- 4 board members with happy faces -->
<g transform="translate(50 60)">
<circle cx="0" cy="0" r="14" fill="#FCD34D" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="-4" cy="-3" r="1.5" fill="#1F2937"/>
<circle cx="4" cy="-3" r="1.5" fill="#1F2937"/>
<path d="M -5 3 Q 0 8 5 3" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
<g class="applause" transform="translate(0 16)"><circle cx="-7" cy="0" r="3" fill="#1F2937"/><circle cx="7" cy="0" r="3" fill="#1F2937"/></g>
</g>
<g transform="translate(115 50)">
<circle cx="0" cy="0" r="14" fill="#FCD34D" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="-4" cy="-3" r="1.5" fill="#1F2937"/>
<circle cx="4" cy="-3" r="1.5" fill="#1F2937"/>
<path d="M -5 3 Q 0 8 5 3" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
<g class="applause" transform="translate(0 16)"><circle cx="-7" cy="0" r="3" fill="#1F2937"/><circle cx="7" cy="0" r="3" fill="#1F2937"/></g>
</g>
<g transform="translate(180 50)">
<circle cx="0" cy="0" r="14" fill="#FCD34D" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="-4" cy="-3" r="1.5" fill="#1F2937"/>
<circle cx="4" cy="-3" r="1.5" fill="#1F2937"/>
<path d="M -5 3 Q 0 8 5 3" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
<g class="applause" transform="translate(0 16)"><circle cx="-7" cy="0" r="3" fill="#1F2937"/><circle cx="7" cy="0" r="3" fill="#1F2937"/></g>
</g>
<g transform="translate(245 60)">
<circle cx="0" cy="0" r="14" fill="#FCD34D" stroke="#1F2937" stroke-width="1.5"/>
<circle cx="-4" cy="-3" r="1.5" fill="#1F2937"/>
<circle cx="4" cy="-3" r="1.5" fill="#1F2937"/>
<path d="M -5 3 Q 0 8 5 3" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
<g class="applause" transform="translate(0 16)"><circle cx="-7" cy="0" r="3" fill="#1F2937"/><circle cx="7" cy="0" r="3" fill="#1F2937"/></g>
</g>

<text x="160" y="146" text-anchor="middle" font-size="10" fill="#92400E" font-style="italic">"bold · visionary"</text>
</g>

<!-- TIME WARP banner -->
<g class="timewarp" transform="translate(30 244)">
<rect width="720" height="22" rx="6" fill="#1F2937"/>
<text x="360" y="16" text-anchor="middle" font-size="11" font-weight="bold" fill="#FCD34D" letter-spacing="2">↻ 18 MONTHS LATER</text>
</g>

<!-- SCENE 2: nothing shipped + frustrated -->
<g class="scene2" transform="translate(30 278)">
<rect width="380" height="60" rx="10" fill="#fff" stroke="#9F1239" stroke-width="2"/>
<text x="14" y="20" font-size="10" font-weight="bold" fill="#9F1239">STATUS · Q3 review</text>
<text x="14" y="38" font-size="13" font-weight="bold" fill="#9F1239" font-family="ui-monospace,monospace">$4.2M spent · 0 features in production</text>
<text x="14" y="52" font-size="10" fill="#9F1239" font-style="italic">3 prototypes paused · 2 vendors disputed</text>
</g>

<g class="scene2" transform="translate(430 278)">
<rect width="320" height="60" rx="10" fill="#FEE2E2" stroke="#9F1239" stroke-width="1.5"/>
<text x="14" y="20" font-size="10" font-weight="bold" fill="#9F1239">BOARD ROOM · frustrated</text>
<g class="frown" transform="translate(60 44)">
<circle cx="0" cy="0" r="10" fill="#FCA5A5" stroke="#9F1239" stroke-width="1.5"/>
<circle cx="-3" cy="-2" r="1" fill="#9F1239"/>
<circle cx="3" cy="-2" r="1" fill="#9F1239"/>
<path d="M -4 4 Q 0 1 4 4" fill="none" stroke="#9F1239" stroke-width="1.2" stroke-linecap="round"/>
</g>
<g class="frown" transform="translate(95 44)">
<circle cx="0" cy="0" r="10" fill="#FCA5A5" stroke="#9F1239" stroke-width="1.5"/>
<circle cx="-3" cy="-2" r="1" fill="#9F1239"/>
<circle cx="3" cy="-2" r="1" fill="#9F1239"/>
<path d="M -4 4 Q 0 1 4 4" fill="none" stroke="#9F1239" stroke-width="1.2" stroke-linecap="round"/>
</g>
<g class="frown" transform="translate(130 44)">
<circle cx="0" cy="0" r="10" fill="#FCA5A5" stroke="#9F1239" stroke-width="1.5"/>
<circle cx="-3" cy="-2" r="1" fill="#9F1239"/>
<circle cx="3" cy="-2" r="1" fill="#9F1239"/>
<path d="M -4 4 Q 0 1 4 4" fill="none" stroke="#9F1239" stroke-width="1.2" stroke-linecap="round"/>
</g>
<text x="306" y="50" text-anchor="end" font-size="10" fill="#9F1239" font-style="italic">"what did we actually do?"</text>
</g>

<!-- divider -->
<g class="divider">
<line x1="50" y1="354" x2="730" y2="354" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="390" y="348" text-anchor="middle" font-size="10" fill="#1F2937" font-weight="bold" letter-spacing="2">THE FIX · SAME SLIDE, REFRAMED</text>
</g>

<!-- SCENE 3: concrete slide -->
<g class="scene3" transform="translate(30 366)">
<rect width="500" height="138" rx="10" fill="#fff" stroke="#10B981" stroke-width="2"/>
<text x="14" y="20" font-size="10" font-weight="bold" fill="#065F46">SLIDE 1 · reframed for Q1</text>
<text x="14" y="40" font-size="13" font-weight="bold" fill="#065F46">By Aug 31, 2026 we will know whether</text>

<g class="bullets">
<g transform="translate(14 50)">
<rect width="472" height="20" rx="4" fill="#ECFDF5" stroke="#10B981"/>
<text x="10" y="14" font-size="11" fill="#065F46" font-family="ui-monospace,monospace">Bet A · RAG · moves CSAT &gt; 4 pts · else KILL</text>
</g>
<g transform="translate(14 74)">
<rect width="472" height="20" rx="4" fill="#ECFDF5" stroke="#10B981"/>
<text x="10" y="14" font-size="11" fill="#065F46" font-family="ui-monospace,monospace">Bet B · invoice agent · &lt; $0.40/doc · else KILL</text>
</g>
<g transform="translate(14 98)">
<rect width="472" height="20" rx="4" fill="#ECFDF5" stroke="#10B981"/>
<text x="10" y="14" font-size="11" fill="#065F46" font-family="ui-monospace,monospace">Rollback · funds revert to core roadmap by Sep 15</text>
</g>
</g>
</g>

<!-- Board signs -->
<g class="signature" transform="translate(548 366)">
<rect width="202" height="138" rx="10" fill="#ECFDF5" stroke="#065F46" stroke-width="1.5"/>
<text x="14" y="20" font-size="10" font-weight="bold" fill="#065F46">BOARD ROOM · signs</text>

<g class="nod" transform="translate(50 56)">
<circle cx="0" cy="0" r="11" fill="#A7F3D0" stroke="#065F46" stroke-width="1.5"/>
<circle cx="-3" cy="-2" r="1" fill="#065F46"/>
<circle cx="3" cy="-2" r="1" fill="#065F46"/>
<path d="M -4 3 Q 0 7 4 3" fill="none" stroke="#065F46" stroke-width="1.2" stroke-linecap="round"/>
</g>
<g class="nod" transform="translate(100 56)">
<circle cx="0" cy="0" r="11" fill="#A7F3D0" stroke="#065F46" stroke-width="1.5"/>
<circle cx="-3" cy="-2" r="1" fill="#065F46"/>
<circle cx="3" cy="-2" r="1" fill="#065F46"/>
<path d="M -4 3 Q 0 7 4 3" fill="none" stroke="#065F46" stroke-width="1.2" stroke-linecap="round"/>
</g>
<g class="nod" transform="translate(150 56)">
<circle cx="0" cy="0" r="11" fill="#A7F3D0" stroke="#065F46" stroke-width="1.5"/>
<circle cx="-3" cy="-2" r="1" fill="#065F46"/>
<circle cx="3" cy="-2" r="1" fill="#065F46"/>
<path d="M -4 3 Q 0 7 4 3" fill="none" stroke="#065F46" stroke-width="1.2" stroke-linecap="round"/>
</g>

<g transform="translate(20 88)">
<rect width="160" height="34" rx="6" fill="#fff" stroke="#065F46"/>
<text x="80" y="14" text-anchor="middle" font-size="9" font-weight="bold" fill="#065F46">APPROVED</text>
<path d="M 14 24 Q 30 18 50 28 T 88 22 T 130 26" fill="none" stroke="#065F46" stroke-width="1.5" stroke-linecap="round"/>
</g>
</g>

<!-- footer -->
<g class="foot" transform="translate(30 514)">
<rect width="720" height="20" rx="6" fill="#1F2937"/>
<text x="360" y="14" text-anchor="middle" font-size="11" font-weight="bold" fill="#FCD34D">Concrete bet · concrete date · concrete kill · concrete rollback</text>
</g>
</svg>
<div class="caption">Boards don't fund vision. They fund commitments they can hold you to.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
