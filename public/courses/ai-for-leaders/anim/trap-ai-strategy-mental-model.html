<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: shiny demo, no measurable outcome</title>
<style>
  :root {
    --bg: #FAF5FF;
    --ink: #1F2937;
    --muted: #6B7280;
    --grid: #E5E7EB;
    --accent: #8B5CF6;
    --bad: #F43F5E;
    --good: #10B981;
    --warm: #F59E0B;
    --paper: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family: system-ui,-apple-system,"Inter",sans-serif; }
  .stage { width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .frame-wrap { width:100%; max-width:780px; }
  .frame { width:100%; aspect-ratio: 16/10; display:block; }
  .caption { text-align:center; font-size:13px; font-style:italic; color:var(--muted); margin-top:10px; padding:0 12px; }
  .num { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) {
    .anim, .anim * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="frame-wrap">
    <svg class="frame anim" viewBox="0 0 780 488" aria-label="Animation: a dazzling AI demo to applause, then six months later the metric that the demo claimed to move sits flat. The fix is to pre-commit a measurable outcome before any AI bet." role="img">
      <defs>
        <clipPath id="screenClip"><rect x="120" y="80" width="240" height="150" rx="10"/></clipPath>
        <clipPath id="chartClip"><rect x="430" y="100" width="270" height="170"/></clipPath>
      </defs>

      <!-- ====== LEFT PANEL: the demo ====== -->
      <g>
        <text x="40" y="50" font-size="13" font-weight="700" fill="#6D28D9" letter-spacing="1.5">SCENE 1 — ALL-HANDS DEMO</text>
        <!-- stage floor -->
        <rect x="40" y="240" width="320" height="6" rx="3" fill="#DDD6FE"/>
        <!-- screen frame -->
        <rect x="116" y="76" width="248" height="158" rx="12" fill="#1F2937"/>
        <rect x="120" y="80" width="240" height="150" rx="10" fill="#FAF5FF"/>
        <!-- demo content inside screen -->
        <g clip-path="url(#screenClip)">
          <!-- shimmering "AI" headline -->
          <rect x="138" y="98" width="96" height="10" rx="4" fill="#8B5CF6">
            <animate attributeName="opacity" values="0.4;1;0.4" dur="1.6s" repeatCount="indefinite"/>
          </rect>
          <rect x="138" y="116" width="180" height="6" rx="3" fill="#C4B5FD"/>
          <rect x="138" y="128" width="156" height="6" rx="3" fill="#C4B5FD"/>
          <!-- pretend chart line going up dramatically -->
          <polyline points="142,210 168,200 188,178 212,160 240,140 268,120 304,108 336,98"
                    fill="none" stroke="#10B981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"
                    stroke-dasharray="260" stroke-dashoffset="260">
            <animate attributeName="stroke-dashoffset" values="260;0;0;260" keyTimes="0;0.35;0.7;1" dur="9s" repeatCount="indefinite"/>
          </polyline>
          <!-- glowing "AI" pulse -->
          <circle cx="240" cy="155" r="4" fill="#F59E0B">
            <animate attributeName="r" values="3;9;3" dur="1.8s" repeatCount="indefinite"/>
            <animate attributeName="opacity" values="0.9;0.2;0.9" dur="1.8s" repeatCount="indefinite"/>
          </circle>
          <text x="240" y="159" text-anchor="middle" font-size="9" font-weight="700" fill="#1F2937">AI</text>
        </g>
        <!-- screen base -->
        <rect x="220" y="234" width="40" height="10" rx="2" fill="#1F2937"/>
        <rect x="200" y="244" width="80" height="4" rx="2" fill="#1F2937"/>

        <!-- audience dots -->
        <g>
          <circle cx="80" cy="270" r="11" fill="#FDE68A"/>
          <circle cx="80" cy="266" r="6" fill="#1F2937"/>
          <circle cx="115" cy="275" r="11" fill="#FECACA"/>
          <circle cx="115" cy="271" r="6" fill="#1F2937"/>
          <circle cx="150" cy="270" r="11" fill="#A7F3D0"/>
          <circle cx="150" cy="266" r="6" fill="#1F2937"/>
          <circle cx="185" cy="275" r="11" fill="#BFDBFE"/>
          <circle cx="185" cy="271" r="6" fill="#1F2937"/>
          <circle cx="220" cy="270" r="11" fill="#FDE68A"/>
          <circle cx="220" cy="266" r="6" fill="#1F2937"/>
          <circle cx="255" cy="275" r="11" fill="#DDD6FE"/>
          <circle cx="255" cy="271" r="6" fill="#1F2937"/>
          <circle cx="290" cy="270" r="11" fill="#FECACA"/>
          <circle cx="290" cy="266" r="6" fill="#1F2937"/>
          <circle cx="325" cy="275" r="11" fill="#A7F3D0"/>
          <circle cx="325" cy="271" r="6" fill="#1F2937"/>
        </g>

        <!-- applause bursts (sparkles) -->
        <g style="animation: applause 9s cubic-bezier(0.22,0.61,0.36,1) infinite;">
          <g transform="translate(70 250)">
            <path d="M0,-7 L1.5,-1.5 L7,0 L1.5,1.5 L0,7 L-1.5,1.5 L-7,0 L-1.5,-1.5 Z" fill="#F59E0B"/>
          </g>
          <g transform="translate(140 245)">
            <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#F59E0B"/>
          </g>
          <g transform="translate(210 252)">
            <path d="M0,-6 L1.2,-1.2 L6,0 L1.2,1.2 L0,6 L-1.2,1.2 L-6,0 L-1.2,-1.2 Z" fill="#F59E0B"/>
          </g>
          <g transform="translate(280 246)">
            <path d="M0,-6 L1.2,-1.2 L6,0 L1.2,1.2 L0,6 L-1.2,1.2 L-6,0 L-1.2,-1.2 Z" fill="#F59E0B"/>
          </g>
          <g transform="translate(330 252)">
            <path d="M0,-5 L1,-1 L5,0 L1,1 L0,5 L-1,1 L-5,0 L-1,-1 Z" fill="#F59E0B"/>
          </g>
        </g>

        <!-- demo claim label -->
        <g style="animation: fadeInOut 9s cubic-bezier(0.22,0.61,0.36,1) infinite;">
          <rect x="60" y="320" width="280" height="46" rx="10" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5"/>
          <text x="200" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#6D28D9">THE CLAIM</text>
          <text x="200" y="358" text-anchor="middle" font-size="13" fill="#1F2937">"Our AI will lift activation by 20%."</text>
        </g>
        <!-- "applause" label -->
        <g style="animation: fadeInOut 9s cubic-bezier(0.22,0.61,0.36,1) infinite;">
          <text x="200" y="384" text-anchor="middle" font-size="12" font-style="italic" fill="#9CA3AF">(applause)</text>
        </g>
      </g>

      <!-- divider arrow -->
      <g>
        <line x1="378" y1="244" x2="402" y2="244" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
        <text x="390" y="232" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">6 months later</text>
        <polyline points="396,238 402,244 396,250" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- ====== RIGHT PANEL: the metric ====== -->
      <g>
        <text x="430" y="50" font-size="13" font-weight="700" fill="#374151" letter-spacing="1.5">SCENE 2 — THE METRIC</text>

        <!-- chart card -->
        <rect x="420" y="76" width="290" height="200" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
        <text x="436" y="98" font-size="12" font-weight="700" fill="#6B7280">ACTIVATION RATE</text>
        <text x="694" y="98" text-anchor="end" font-size="11" fill="#9CA3AF" font-style="italic">target +20%</text>

        <!-- gridlines -->
        <g stroke="#F3F4F6" stroke-width="1">
          <line x1="430" y1="130" x2="700" y2="130"/>
          <line x1="430" y1="170" x2="700" y2="170"/>
          <line x1="430" y1="210" x2="700" y2="210"/>
          <line x1="430" y1="250" x2="700" y2="250"/>
        </g>
        <!-- target line (where it should have ended) -->
        <line x1="430" y1="120" x2="700" y2="120" stroke="#10B981" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7"/>
        <text x="436" y="116" font-size="10" fill="#10B981" font-weight="700">+20% (promised)</text>

        <!-- baseline label -->
        <line x1="430" y1="220" x2="700" y2="220" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="2 3" opacity="0.5"/>
        <text x="436" y="234" font-size="10" fill="#9CA3AF">baseline</text>

        <!-- the actual flat line, drawn over time -->
        <g clip-path="url(#chartClip)">
          <polyline points="430,220 470,219 510,221 550,220 590,222 630,219 670,221 700,220"
                    fill="none" stroke="#F43F5E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"
                    stroke-dasharray="280" stroke-dashoffset="280">
            <animate attributeName="stroke-dashoffset" values="280;280;0;0;280" keyTimes="0;0.4;0.78;0.92;1" dur="9s" repeatCount="indefinite"/>
          </polyline>
          <!-- end marker -->
          <circle cx="700" cy="220" r="4" fill="#F43F5E" opacity="0">
            <animate attributeName="opacity" values="0;0;0;1;1;0" keyTimes="0;0.4;0.77;0.8;0.92;1" dur="9s" repeatCount="indefinite"/>
          </circle>
        </g>

        <!-- gap arrow showing the disappointment -->
        <g style="animation: fadeInLate 9s cubic-bezier(0.22,0.61,0.36,1) infinite;">
          <line x1="690" y1="120" x2="690" y2="216" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 3"/>
          <polyline points="686,124 690,120 694,124" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round"/>
          <polyline points="686,212 690,216 694,212" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-linecap="round"/>
        </g>

        <!-- numbers -->
        <g class="num">
          <text x="436" y="260" font-size="11" fill="#6B7280">delivered:</text>
          <text x="498" y="260" font-size="13" font-weight="700" fill="#F43F5E" style="animation: fadeInLate 9s cubic-bezier(0.22,0.61,0.36,1) infinite;">+0.4%</text>
        </g>

        <!-- the verdict label -->
        <g style="animation: fadeInOutLate 9s cubic-bezier(0.22,0.61,0.36,1) infinite;">
          <rect x="430" y="320" width="280" height="46" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.5"/>
          <text x="570" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#B91C1C">THE OUTCOME</text>
          <text x="570" y="358" text-anchor="middle" font-size="13" fill="#1F2937">No-one tracked the metric. It is flat.</text>
        </g>
      </g>

      <!-- ====== BOTTOM: the fix ====== -->
      <g style="animation: fixIn 9s cubic-bezier(0.22,0.61,0.36,1) infinite;">
        <rect x="60" y="404" width="660" height="64" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
        <circle cx="92" cy="436" r="14" fill="#10B981"/>
        <path d="M85,436 l5,5 l10,-10" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="118" y="430" font-size="13" font-weight="700" fill="#065F46">THE FIX — pre-commit the outcome</text>
        <text x="118" y="450" font-size="12" fill="#1F2937">Before the demo: which metric, by how much, by when, and how we will measure it.</text>
      </g>

      <style>
        @keyframes applause {
          0%,8%   { opacity: 0; transform: translateY(4px); }
          12%,32% { opacity: 1; transform: translateY(0); }
          38%     { opacity: 0; }
          100%    { opacity: 0; }
        }
        @keyframes fadeInOut {
          0%,8%    { opacity: 0; }
          14%,32%  { opacity: 1; }
          40%,100% { opacity: 0; }
        }
        @keyframes fadeInOutLate {
          0%,55%    { opacity: 0; }
          70%,92%   { opacity: 1; }
          100%      { opacity: 0; }
        }
        @keyframes fadeInLate {
          0%,72%   { opacity: 0; }
          82%,92%  { opacity: 1; }
          100%     { opacity: 0; }
        }
        @keyframes fixIn {
          0%,82%  { opacity: 0; transform: translateY(8px); }
          92%,98% { opacity: 1; transform: translateY(0); }
          100%    { opacity: 0; }
        }
      </style>
    </svg>
    <div class="caption">A dazzling demo. Six months on, the metric the demo claimed to move sat flat — because no-one pre-committed to track it.</div>
  </div>
</main>
</body>
</html>
