<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: 47-hex chaos</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes pop{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes collapse{0%{opacity:1}40%{opacity:1;transform:scale(1)}80%{opacity:.4;transform:scale(.7)}100%{opacity:0;transform:scale(.5)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.chip{animation:pop .3s cubic-bezier(0.22,0.61,0.36,1) both}
.chips-collapse{animation:collapse 1.5s ease 6s forwards;transform-origin:center}
.token{animation:pop .5s ease 7s both}
.dark-fail{animation:fade .4s ease 5.2s both}
.dark-pass{animation:fade .4s ease 9s both}
</style>
</head>
<body>
<main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A Figma file with 47 different gray hex codes scattered across components, breaking dark mode, then collapsed into 4 named tokens that flip cleanly">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- LEFT: 47 hex chips -->
<g class="chips-collapse" transform="translate(40 30)">
<rect width="320" height="180" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">designs.fig — 47 unique grays</text>

<!-- 47 chip grid -->
<g font-family="ui-monospace,monospace" font-size="6" fill="#fff">
<g class="chip" style="animation-delay:.05s"><rect x="20" y="40" width="40" height="20" fill="#1F2937"/><text x="40" y="52" text-anchor="middle">#1F2937</text></g>
<g class="chip" style="animation-delay:.10s"><rect x="64" y="40" width="40" height="20" fill="#374151"/><text x="84" y="52" text-anchor="middle">#374151</text></g>
<g class="chip" style="animation-delay:.15s"><rect x="108" y="40" width="40" height="20" fill="#4B5563"/><text x="128" y="52" text-anchor="middle">#4B5563</text></g>
<g class="chip" style="animation-delay:.20s"><rect x="152" y="40" width="40" height="20" fill="#6B7280"/><text x="172" y="52" text-anchor="middle">#6B7280</text></g>
<g class="chip" style="animation-delay:.25s"><rect x="196" y="40" width="40" height="20" fill="#9CA3AF"/><text x="216" y="52" text-anchor="middle">#9CA3AF</text></g>
<g class="chip" style="animation-delay:.30s"><rect x="240" y="40" width="40" height="20" fill="#D1D5DB"/><text x="260" y="52" text-anchor="middle" fill="#1F2937">#D1D5DB</text></g>

<g class="chip" style="animation-delay:.35s"><rect x="20" y="64" width="40" height="20" fill="#202935"/><text x="40" y="76" text-anchor="middle">#202935</text></g>
<g class="chip" style="animation-delay:.40s"><rect x="64" y="64" width="40" height="20" fill="#21303F"/><text x="84" y="76" text-anchor="middle">#21303F</text></g>
<g class="chip" style="animation-delay:.45s"><rect x="108" y="64" width="40" height="20" fill="#2A323B"/><text x="128" y="76" text-anchor="middle">#2A323B</text></g>
<g class="chip" style="animation-delay:.50s"><rect x="152" y="64" width="40" height="20" fill="#3a4754"/><text x="172" y="76" text-anchor="middle">#3a4754</text></g>
<g class="chip" style="animation-delay:.55s"><rect x="196" y="64" width="40" height="20" fill="#56616E"/><text x="216" y="76" text-anchor="middle">#56616E</text></g>
<g class="chip" style="animation-delay:.60s"><rect x="240" y="64" width="40" height="20" fill="#737B83"/><text x="260" y="76" text-anchor="middle">#737B83</text></g>

<g class="chip" style="animation-delay:.65s"><rect x="20" y="88" width="40" height="20" fill="#EDEFF1"/><text x="40" y="100" text-anchor="middle" fill="#1F2937">#EDEFF1</text></g>
<g class="chip" style="animation-delay:.70s"><rect x="64" y="88" width="40" height="20" fill="#E2E5E7"/><text x="84" y="100" text-anchor="middle" fill="#1F2937">#E2E5E7</text></g>
<g class="chip" style="animation-delay:.75s"><rect x="108" y="88" width="40" height="20" fill="#D6DADD"/><text x="128" y="100" text-anchor="middle" fill="#1F2937">#D6DADD</text></g>
<g class="chip" style="animation-delay:.80s"><rect x="152" y="88" width="40" height="20" fill="#C8CDD1"/><text x="172" y="100" text-anchor="middle" fill="#1F2937">#C8CDD1</text></g>
<g class="chip" style="animation-delay:.85s"><rect x="196" y="88" width="40" height="20" fill="#B7BDC2"/><text x="216" y="100" text-anchor="middle" fill="#1F2937">#B7BDC2</text></g>
<g class="chip" style="animation-delay:.90s"><rect x="240" y="88" width="40" height="20" fill="#A4ABB1"/><text x="260" y="100" text-anchor="middle" fill="#1F2937">#A4ABB1</text></g>

<g class="chip" style="animation-delay:.95s"><rect x="20" y="112" width="40" height="20" fill="#161E26"/><text x="40" y="124" text-anchor="middle">#161E26</text></g>
<g class="chip" style="animation-delay:1.0s"><rect x="64" y="112" width="40" height="20" fill="#1A2330"/><text x="84" y="124" text-anchor="middle">#1A2330</text></g>
<g class="chip" style="animation-delay:1.05s"><rect x="108" y="112" width="40" height="20" fill="#1E2A36"/><text x="128" y="124" text-anchor="middle">#1E2A36</text></g>
<g class="chip" style="animation-delay:1.10s"><rect x="152" y="112" width="40" height="20" fill="#252F3E"/><text x="172" y="124" text-anchor="middle">#252F3E</text></g>
<g class="chip" style="animation-delay:1.15s"><rect x="196" y="112" width="40" height="20" fill="#2C3848"/><text x="216" y="124" text-anchor="middle">#2C3848</text></g>
<g class="chip" style="animation-delay:1.20s"><rect x="240" y="112" width="40" height="20" fill="#334155"/><text x="260" y="124" text-anchor="middle">#334155</text></g>

<g class="chip" style="animation-delay:1.25s"><rect x="20" y="136" width="40" height="20" fill="#A6AEB6"/><text x="40" y="148" text-anchor="middle" fill="#1F2937">#A6AEB6</text></g>
<g class="chip" style="animation-delay:1.30s"><rect x="64" y="136" width="40" height="20" fill="#959CA4"/><text x="84" y="148" text-anchor="middle" fill="#1F2937">#959CA4</text></g>
<g class="chip" style="animation-delay:1.35s"><rect x="108" y="136" width="40" height="20" fill="#838A93"/><text x="128" y="148" text-anchor="middle" fill="#1F2937">#838A93</text></g>
<g class="chip" style="animation-delay:1.40s"><rect x="152" y="136" width="40" height="20" fill="#727882"/><text x="172" y="148" text-anchor="middle">#727882</text></g>
<g class="chip" style="animation-delay:1.45s"><rect x="196" y="136" width="40" height="20" fill="#5F656E"/><text x="216" y="148" text-anchor="middle">#5F656E</text></g>
<g class="chip" style="animation-delay:1.50s"><rect x="240" y="136" width="40" height="20" fill="#525861"/><text x="260" y="148" text-anchor="middle">#525861</text></g>

<text x="160" y="174" text-anchor="middle" font-size="11" fill="#7F1D1D" font-style="italic">…and 17 more</text>
</g>
</g>

<!-- LEFT-RESULT: dark mode failure -->
<g class="dark-fail" transform="translate(40 230)">
<rect width="320" height="155" rx="8" fill="#1F2937" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#FCA5A5" font-weight="bold">Dark mode build · BROKEN</text>
<rect x="20" y="34" width="280" height="22" rx="2" fill="#A4ABB1"/>
<text x="160" y="50" text-anchor="middle" font-size="10" fill="#1F2937">"background-secondary" picked wrong gray</text>
<rect x="20" y="62" width="280" height="22" rx="2" fill="#21303F"/>
<text x="160" y="78" text-anchor="middle" font-size="10" fill="#FCA5A5">card body unreadable on dark surface</text>
<rect x="20" y="90" width="280" height="22" rx="2" fill="#525861"/>
<text x="160" y="106" text-anchor="middle" font-size="10" fill="#FCA5A5">divider line invisible</text>
<text x="160" y="138" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">12 components broken · 6h to repair</text>
</g>

<!-- RIGHT: 4 tokens -->
<g class="token" transform="translate(390 30)">
<rect width="290" height="180" rx="8" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<text x="145" y="22" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">tokens.json — 4 named grays</text>

<g font-family="ui-monospace,monospace" font-size="11">
<g><rect x="20" y="40" width="50" height="32" fill="#F9FAFB" stroke="#1F2937"/><text x="80" y="60" fill="#1F2937">--gray-50  · backgrounds</text></g>
<g><rect x="20" y="80" width="50" height="32" fill="#E5E7EB" stroke="#1F2937"/><text x="80" y="100" fill="#1F2937">--gray-200 · borders</text></g>
<g><rect x="20" y="120" width="50" height="32" fill="#6B7280"/><text x="80" y="140" fill="#1F2937">--gray-500 · secondary text</text></g>
<g><rect x="20" y="160" width="50" height="14" fill="#1F2937"/><text x="80" y="172" fill="#1F2937">--gray-900 · ink</text></g>
</g>
</g>

<!-- RIGHT-RESULT: dark mode passes -->
<g class="dark-pass" transform="translate(390 230)">
<rect width="290" height="155" rx="8" fill="#1F2937" stroke="#10B981" stroke-width="2"/>
<text x="145" y="22" text-anchor="middle" font-size="12" fill="#A7F3D0" font-weight="bold">Dark mode build · CLEAN</text>
<rect x="20" y="34" width="250" height="22" rx="2" fill="#374151"/>
<text x="145" y="50" text-anchor="middle" font-size="10" fill="#F9FAFB">card body, token-driven</text>
<rect x="20" y="62" width="250" height="22" rx="2" fill="#4B5563"/>
<text x="145" y="78" text-anchor="middle" font-size="10" fill="#F9FAFB">divider, token-driven</text>
<rect x="20" y="90" width="250" height="22" rx="2" fill="#6B7280"/>
<text x="145" y="106" text-anchor="middle" font-size="10" fill="#F9FAFB">secondary text</text>
<text x="145" y="138" text-anchor="middle" font-size="10" fill="#A7F3D0" font-style="italic">flips cleanly · zero broken components</text>
</g>
</svg>
<div class="caption">Hex codes are technical debt. Tokens are documentation.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body>
</html>
