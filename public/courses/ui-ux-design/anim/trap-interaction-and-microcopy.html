<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: no-feedback button</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes click{0%,100%{transform:scale(1)}50%{transform:scale(.92)}}
@keyframes ripple{from{r:4;opacity:.7}to{r:36;opacity:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes spinner{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.click1{animation:click .25s ease 1s both}
.click2{animation:click .25s ease 2s both}
.click3{animation:click .25s ease 3s both}
.click4{animation:click .25s ease 4s both}
.r1{animation:ripple .6s ease 1s both}
.r2{animation:ripple .6s ease 2s both}
.r3{animation:ripple .6s ease 3s both}
.r4{animation:ripple .6s ease 4s both}
.alarm{animation:fade .5s ease 5s both}
.fix-block{animation:fade .5s ease 7s both}
.spin{animation:spinner 1s linear infinite;transform-origin:center}
.saving{animation:fade .35s ease 8s both}
.saved{animation:fade .35s ease 9.5s both}
</style>
</head>
<body>
<main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A button click that takes 3 seconds with no feedback, leading to four duplicate clicks; the fix uses optimistic UI">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- BAD VERSION -->
<g transform="translate(40 30)">
<rect width="320" height="170" rx="10" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">BEFORE · no feedback</text>

<!-- The button -->
<g transform="translate(110 60)">
<rect class="click1" width="100" height="40" rx="6" fill="#1E40AF"/>
<text class="click1" x="50" y="26" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Save</text>
<rect class="click2" width="100" height="40" rx="6" fill="#1E40AF"/>
<rect class="click3" width="100" height="40" rx="6" fill="#1E40AF"/>
<rect class="click4" width="100" height="40" rx="6" fill="#1E40AF"/>
<circle class="r1" cx="50" cy="20" r="4" fill="#fff" stroke="#1E40AF" stroke-width="2"/>
<circle class="r2" cx="50" cy="20" r="4" fill="#fff" stroke="#1E40AF" stroke-width="2"/>
<circle class="r3" cx="50" cy="20" r="4" fill="#fff" stroke="#1E40AF" stroke-width="2"/>
<circle class="r4" cx="50" cy="20" r="4" fill="#fff" stroke="#1E40AF" stroke-width="2"/>
</g>

<text x="160" y="130" text-anchor="middle" font-size="11" fill="#7F1D1D">user clicks 1× · waits · clicks 2× · 3× · 4×</text>
<text x="160" y="148" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">no spinner, no copy, nothing</text>
</g>

<!-- BAD ALARM -->
<g class="alarm" transform="translate(40 215)">
<rect width="320" height="60" rx="8" fill="#7F1D1D"/>
<text x="160" y="24" text-anchor="middle" font-size="13" fill="#FCA5A5" font-weight="bold">4 entries saved instead of 1</text>
<text x="160" y="42" text-anchor="middle" font-size="10" fill="#FCA5A5">duplicate-rate: 23% on this form</text>
<text x="160" y="56" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">cost of silence > cost of feedback</text>
</g>

<!-- FIX VERSION -->
<g transform="translate(380 30)">
<rect width="300" height="170" rx="10" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">AFTER · optimistic UI</text>

<g transform="translate(100 60)">
<g class="saving">
<rect width="100" height="40" rx="6" fill="#9CA3AF"/>
<g transform="translate(20 20)" class="spin">
<circle r="6" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="20 8"/>
</g>
<text x="68" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Saving…</text>
</g>
<g class="saved">
<rect width="100" height="40" rx="6" fill="#10B981"/>
<text x="50" y="26" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">Saved ✓</text>
</g>
</g>

<text x="150" y="130" text-anchor="middle" font-size="11" fill="#065F46">disabled while saving · clear copy</text>
<text x="150" y="148" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">user can't double-fire even if they try</text>
</g>

<!-- FIX BANNER -->
<g class="fix-block" transform="translate(380 215)">
<rect width="300" height="60" rx="8" fill="#065F46"/>
<text x="150" y="24" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">duplicate-rate: 0.4%</text>
<text x="150" y="42" text-anchor="middle" font-size="10" fill="#A7F3D0">3 lines of UI · 22% bug fixed</text>
<text x="150" y="56" text-anchor="middle" font-size="10" fill="#A7F3D0" font-style="italic">microcopy isn't decoration; it's plumbing</text>
</g>

<!-- BOTTOM SUMMARY -->
<g transform="translate(40 305)">
<rect width="640" height="80" rx="10" fill="#1F2937"/>
<text x="320" y="24" text-anchor="middle" font-size="13" fill="#FCD34D" font-weight="bold">Every click is a question; the UI must answer it within 100ms</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#9CA3AF">"Saving…" → "Saved ✓" is the cheapest, highest-leverage interaction in your toolbox</text>
<text x="320" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">silence isn't neutral — it's the user wondering if anything happened</text>
</g>
</svg>
<div class="caption">Three-second silence on a button is a 3-second invitation to click again.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body>
</html>
