<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Design critique loop</title>
<style>
:root{--bg:#FEF3C7;--ink:#1F2937;--mute:#6B7280;--accent:#F59E0B;--good:#10B981;--cool:#0EA5E9;--purple:#8B5CF6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
.wrap{width:100%;max-width:760px;position:relative}
svg{width:100%;height:auto;display:block}
.cap{text-align:center;font-size:13px;font-style:italic;color:var(--mute);margin-top:10px}
#rb{position:absolute;bottom:-6px;right:6px;background:var(--ink);color:#FEF3C7;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.78}
#rb:hover{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
 <div class="wrap">
  <svg viewBox="0 0 760 470" aria-label="A three-question critique loop. Each question shrinks the design until what remains is the simplest version that ships.">
   <rect width="760" height="470" fill="#FEF3C7"/>
   <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">Three questions. Tighter every round.</text>

   <!-- Stage indicators (3 dots) -->
   <g id="dots">
    <circle id="d1" cx="320" cy="56" r="6" fill="#1F2937" opacity=".25"/>
    <circle id="d2" cx="380" cy="56" r="6" fill="#1F2937" opacity=".25"/>
    <circle id="d3" cx="440" cy="56" r="6" fill="#1F2937" opacity=".25"/>
   </g>

   <!-- Question banner (changes per stage) -->
   <g id="qbox">
    <rect x="60" y="78" width="640" height="48" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5"/>
    <text id="qLabel" x="80" y="106" font-size="11" font-weight="700" font-family="ui-monospace,monospace" fill="#F59E0B">Q1</text>
    <text id="qText"  x="380" y="108" text-anchor="middle" font-size="15" font-weight="600" fill="#1F2937">What problem are we solving?</text>
    <circle id="qDot" cx="690" cy="102" r="6" fill="#F59E0B" opacity=".7"/>
   </g>

   <!-- mockup canvas -->
   <rect x="80" y="148" width="600" height="240" rx="14" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>

   <!-- ── STAGE 1: bloated mockup ── -->
   <g id="s1" opacity="1">
    <!-- header bar -->
    <rect x="100" y="168" width="220" height="14" rx="4" fill="#1F2937" opacity=".7"/>
    <rect x="340" y="168" width="60" height="14" rx="4" fill="#0EA5E9" opacity=".6"/>
    <rect x="410" y="168" width="60" height="14" rx="4" fill="#8B5CF6" opacity=".6"/>
    <rect x="480" y="168" width="60" height="14" rx="4" fill="#10B981" opacity=".6"/>
    <rect x="550" y="168" width="60" height="14" rx="4" fill="#F43F5E" opacity=".6"/>
    <!-- left sidebar -->
    <rect x="100" y="194" width="120" height="180" rx="6" fill="#F3F4F6" stroke="#E5E7EB"/>
    <rect x="110" y="206" width="100" height="8" rx="3" fill="#1F2937" opacity=".4"/>
    <rect x="110" y="222" width="80"  height="8" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="110" y="238" width="100" height="8" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="110" y="254" width="70"  height="8" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="110" y="270" width="100" height="8" rx="3" fill="#1F2937" opacity=".3"/>
    <!-- main: too many widgets -->
    <rect x="232" y="194" width="180" height="84" rx="8" fill="#FEF3C7" stroke="#F59E0B"/>
    <rect x="244" y="206" width="100" height="8" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="244" y="222" width="156" height="6" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="244" y="234" width="120" height="6" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="244" y="252" width="60" height="18" rx="6" fill="#F59E0B"/>
    <rect x="424" y="194" width="180" height="84" rx="8" fill="#DBEAFE" stroke="#0EA5E9"/>
    <rect x="436" y="206" width="100" height="8" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="436" y="222" width="156" height="6" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="436" y="234" width="120" height="6" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="436" y="252" width="60" height="18" rx="6" fill="#0EA5E9"/>
    <rect x="232" y="290" width="180" height="84" rx="8" fill="#EDE9FE" stroke="#8B5CF6"/>
    <rect x="244" y="302" width="100" height="8" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="244" y="318" width="156" height="6" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="244" y="330" width="120" height="6" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="244" y="348" width="60" height="18" rx="6" fill="#8B5CF6"/>
    <rect x="424" y="290" width="180" height="84" rx="8" fill="#D1FAE5" stroke="#10B981"/>
    <rect x="436" y="302" width="100" height="8" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="436" y="318" width="156" height="6" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="436" y="330" width="120" height="6" rx="3" fill="#1F2937" opacity=".3"/>
    <rect x="436" y="348" width="60" height="18" rx="6" fill="#10B981"/>
   </g>

   <!-- ── STAGE 2: trimmed (one persona) ── -->
   <g id="s2" opacity="0">
    <rect x="100" y="168" width="220" height="14" rx="4" fill="#1F2937" opacity=".7"/>
    <rect x="340" y="168" width="60" height="14" rx="4" fill="#0EA5E9" opacity=".6"/>
    <rect x="410" y="168" width="60" height="14" rx="4" fill="#8B5CF6" opacity=".6"/>
    <!-- main: 2 cards left -->
    <rect x="120" y="208" width="240" height="148" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.4"/>
    <rect x="138" y="226" width="160" height="12" rx="3" fill="#1F2937" opacity=".7"/>
    <rect x="138" y="246" width="200" height="6"  rx="3" fill="#1F2937" opacity=".35"/>
    <rect x="138" y="258" width="170" height="6"  rx="3" fill="#1F2937" opacity=".35"/>
    <rect x="138" y="280" width="200" height="48" rx="6"  fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="138" y="338" width="80"  height="14" rx="4" fill="#F59E0B"/>
    <rect x="400" y="208" width="240" height="148" rx="10" fill="#DBEAFE" stroke="#0EA5E9" stroke-width="1.4"/>
    <rect x="418" y="226" width="160" height="12" rx="3" fill="#1F2937" opacity=".7"/>
    <rect x="418" y="246" width="200" height="6"  rx="3" fill="#1F2937" opacity=".35"/>
    <rect x="418" y="258" width="170" height="6"  rx="3" fill="#1F2937" opacity=".35"/>
    <rect x="418" y="280" width="200" height="48" rx="6"  fill="#FFFFFF" stroke="#E5E7EB"/>
    <rect x="418" y="338" width="80"  height="14" rx="4" fill="#0EA5E9"/>
   </g>

   <!-- ── STAGE 3: shippable MVP ── -->
   <g id="s3" opacity="0">
    <rect x="240" y="200" width="280" height="170" rx="14" fill="#FFFFFF" stroke="#10B981" stroke-width="1.6"/>
    <rect x="262" y="222" width="100" height="10" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="262" y="244" width="240" height="22" rx="4" fill="#1F2937"/>
    <rect x="262" y="278" width="220" height="6" rx="3" fill="#1F2937" opacity=".35"/>
    <rect x="262" y="290" width="180" height="6" rx="3" fill="#1F2937" opacity=".35"/>
    <rect id="cta3" x="262" y="316" width="160" height="36" rx="10" fill="#10B981"/>
    <text x="342" y="339" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF">Get started</text>
    <!-- check badge -->
    <circle cx="500" cy="334" r="14" fill="#10B981"/>
    <path d="M 493 334 L 498 339 L 508 329" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
   </g>

   <!-- counter / score -->
   <g id="meter">
    <rect x="80" y="406" width="600" height="38" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
    <text id="mLabel" x="100" y="430" font-size="12" font-weight="700" fill="#1F2937">elements on screen</text>
    <text id="mVal"   x="660" y="430" text-anchor="end" font-size="14" font-weight="700" fill="#F43F5E" font-family="ui-monospace,monospace">42</text>
    <!-- bar -->
    <rect x="240" y="418" width="380" height="10" rx="5" fill="#F3F4F6"/>
    <rect id="mBar" x="240" y="418" width="360" height="10" rx="5" fill="#F43F5E"/>
   </g>
  </svg>
  <div class="cap">Each question removes more than the last. Shipping is what's left.</div>
  <button id="rb">↺ replay</button>
 </div>
</main>
<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
var EASE=function(t){return 1-Math.pow(1-t,3);};
var rafs=[],tms=[];
function after(ms,fn){tms.push(setTimeout(fn,ms));}
function clearAll(){tms.forEach(clearTimeout);tms=[];rafs.forEach(cancelAnimationFrame);rafs=[];}
function setOp(id,v){var e=$(id);if(e)e.setAttribute('opacity',v);}
function fade(id,a,b,dur,cb){
 var e=$(id);if(!e)return;
 var s=performance.now();
 function tick(now){var t=Math.min((now-s)/dur,1);e.setAttribute('opacity',(a+(b-a)*EASE(t)).toFixed(3));if(t<1)rafs.push(requestAnimationFrame(tick));else if(cb)cb();}
 rafs.push(requestAnimationFrame(tick));
}

function setQuestion(label,text,color){
 $('qLabel').textContent=label;
 $('qLabel').setAttribute('fill',color);
 $('qText').textContent=text;
 $('qDot').setAttribute('fill',color);
 $('qbox').querySelector('rect').setAttribute('stroke',color);
}

function activateDot(id){
 ['d1','d2','d3'].forEach(function(d){var e=$(d);e.setAttribute('opacity','0.25');e.setAttribute('fill','#1F2937');e.setAttribute('r','6');});
 var d=$(id);d.setAttribute('opacity','1');d.setAttribute('fill', id==='d1'?'#F59E0B':id==='d2'?'#0EA5E9':'#10B981');
 d.setAttribute('r','7');
}

function setMeter(target,color,label){
 if(label)$('mLabel').textContent=label;
 var cur=parseInt($('mVal').textContent,10)||0;
 var s=performance.now();
 var dur=700;
 function tick(now){
  var t=Math.min((now-s)/dur,1),e=EASE(t);
  var v=Math.round(cur+(target-cur)*e);
  $('mVal').textContent=v;
  $('mVal').setAttribute('fill',color);
  $('mBar').setAttribute('fill',color);
  $('mBar').setAttribute('width',(380*Math.max(0.06,target/42)*e + 380*Math.max(0.06,cur/42)*(1-e)).toFixed(1));
  if(t<1)rafs.push(requestAnimationFrame(tick));
 }
 rafs.push(requestAnimationFrame(tick));
}

function pulseCta(){
 var s=performance.now();
 function tick(now){
  var t=Math.min((now-s)/600,1);
  var k=1+0.06*Math.sin(t*Math.PI);
  $('cta3').setAttribute('transform','translate('+(342*(1-k))+','+(334*(1-k))+') scale('+k+')');
  if(t<1)rafs.push(requestAnimationFrame(tick));
  else $('cta3').removeAttribute('transform');
 }
 rafs.push(requestAnimationFrame(tick));
}

function run(){
 clearAll();
 setOp('s1',1);setOp('s2',0);setOp('s3',0);
 $('mVal').textContent='42';$('mBar').setAttribute('width','360');
 $('mBar').setAttribute('fill','#F43F5E');$('mVal').setAttribute('fill','#F43F5E');
 $('mLabel').textContent='elements on screen';

 // STAGE 1
 setQuestion('Q1','What problem are we solving?','#F59E0B');
 activateDot('d1');

 // STAGE 2
 after(3500,function(){
  setQuestion('Q2','For whom, exactly?','#0EA5E9');
  activateDot('d2');
  fade('s1',1,0,600,null);
  fade('s2',0,1,600,null);
  setMeter(14,'#0EA5E9','elements on screen');
 });

 // STAGE 3
 after(7000,function(){
  setQuestion('Q3',"What's the simplest version that ships?",'#10B981');
  activateDot('d3');
  fade('s2',1,0,600,null);
  fade('s3',0,1,600,null);
  setMeter(6,'#10B981','elements on screen · ready to ship');
  after(700,pulseCta);
 });

 // loop
 after(11500,run);
}
$('rb').addEventListener('click',function(){clearAll();run();});
run();
})();
</script>
</body>
</html>
