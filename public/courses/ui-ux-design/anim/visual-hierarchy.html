<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual hierarchy — eye-tracking</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--mute:#6B7280;--accent:#F59E0B;--good:#10B981;--bad:#F43F5E;--cool:#0EA5E9;--purple:#8B5CF6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;position:relative}
.wrap{width:100%;max-width:760px;position:relative}
svg{width:100%;height:auto;display:block}
.cap{text-align:center;font-size:13px;font-style:italic;color:var(--mute);margin-top:10px}
#rb{position:absolute;bottom:-6px;right:6px;background:var(--ink);color:#fff7ed;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.78}
#rb:hover{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
 <div class="wrap">
  <svg viewBox="0 0 760 470" aria-label="Eye-tracking heatmap on a busy UI versus the same UI with intentional hierarchy. The redesign lets the eye reach the call to action in roughly one second.">
   <rect width="760" height="470" fill="#FFF7ED"/>
   <text x="380" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">Where the eye actually goes.</text>

   <!-- LEFT: busy page -->
   <g id="left">
    <text x="170" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#6B7280">BUSY · everything shouts</text>
    <rect x="40" y="72" width="260" height="320" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- chaotic blocks: similar weight, multiple bright items -->
    <rect x="56" y="88"  width="228" height="22" rx="4" fill="#F59E0B" opacity=".75"/>
    <rect x="56" y="118" width="120" height="14" rx="3" fill="#1F2937" opacity=".7"/>
    <rect x="184" y="118" width="100" height="14" rx="3" fill="#F43F5E" opacity=".7"/>
    <rect x="56" y="142" width="228" height="10" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="56" y="158" width="200" height="10" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="56" y="184" width="64"  height="40" rx="6" fill="#10B981" opacity=".7"/>
    <rect x="128" y="184" width="64" height="40" rx="6" fill="#0EA5E9" opacity=".7"/>
    <rect x="200" y="184" width="64" height="40" rx="6" fill="#8B5CF6" opacity=".7"/>
    <rect x="56" y="240" width="228" height="10" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="56" y="256" width="180" height="10" rx="3" fill="#1F2937" opacity=".5"/>
    <rect x="56" y="280" width="110" height="32" rx="6" fill="#F59E0B"/>
    <text x="111" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">BUY!</text>
    <rect x="172" y="280" width="112" height="32" rx="6" fill="#F43F5E"/>
    <text x="228" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">SALE!!</text>
    <rect x="56" y="324" width="228" height="10" rx="3" fill="#1F2937" opacity=".4"/>
    <rect x="56" y="340" width="160" height="10" rx="3" fill="#1F2937" opacity=".4"/>
    <rect x="56" y="362" width="228" height="20" rx="4" fill="#0EA5E9" opacity=".7"/>

    <!-- F-pattern eye path (long, scattered) -->
    <path id="pathBusy" d="M 60 96 L 280 96 L 60 124 L 250 124 L 60 148 L 220 148 L 80 200 L 220 200 L 60 246 L 230 246 L 90 296 L 230 296 L 60 332 L 200 332 L 60 372 L 270 372"
          fill="none" stroke="none"/>
    <!-- heatmap blobs (busy: many, scattered) -->
    <g id="blobsBusy" opacity="0">
     <circle cx="80"  cy="98"  r="22" fill="#F43F5E" opacity=".22"/>
     <circle cx="170" cy="98"  r="20" fill="#F43F5E" opacity=".22"/>
     <circle cx="80"  cy="148" r="20" fill="#F59E0B" opacity=".25"/>
     <circle cx="170" cy="194" r="22" fill="#F59E0B" opacity=".22"/>
     <circle cx="240" cy="200" r="18" fill="#F59E0B" opacity=".2"/>
     <circle cx="100" cy="294" r="18" fill="#F43F5E" opacity=".2"/>
     <circle cx="220" cy="296" r="18" fill="#F43F5E" opacity=".2"/>
     <circle cx="80"  cy="372" r="18" fill="#F59E0B" opacity=".18"/>
    </g>
    <!-- moving eye -->
    <circle id="eyeL" cx="60" cy="96" r="8" fill="#1F2937" opacity="0"/>
    <circle id="eyeLi" cx="60" cy="96" r="3" fill="#FFF7ED" opacity="0"/>

    <!-- timer -->
    <g id="tlBusy" opacity="0">
     <rect x="40" y="404" width="260" height="22" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
     <text x="50" y="420" font-size="11" fill="#6B7280" font-family="ui-monospace,monospace">eye reaches CTA in</text>
     <text id="tBusy" x="290" y="420" text-anchor="end" font-size="13" font-weight="700" fill="#F43F5E" font-family="ui-monospace,monospace">— s</text>
    </g>

    <!-- contrast badge -->
    <g id="crBusy" opacity="0">
     <rect x="56" y="436" width="228" height="22" rx="11" fill="#FEF2F2" stroke="#F43F5E" stroke-width="1.2"/>
     <text x="170" y="451" text-anchor="middle" font-size="11" fill="#B91C1C" font-family="ui-monospace,monospace">contrast 1.8 : 1   ✗ fails AA</text>
    </g>
   </g>

   <!-- divider -->
   <line x1="380" y1="60" x2="380" y2="450" stroke="#E5E7EB" stroke-width="1.2" stroke-dasharray="3 4"/>

   <!-- RIGHT: clean page -->
   <g id="right">
    <text x="590" y="60" text-anchor="middle" font-size="12" font-weight="700" fill="#10B981">CLEAR · one focal point</text>
    <rect x="460" y="72" width="260" height="320" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
    <!-- minimal blocks -->
    <rect x="476" y="92" width="96"  height="10" rx="3" fill="#1F2937" opacity=".55"/>
    <rect x="476" y="120" width="200" height="22" rx="4" fill="#1F2937"/>
    <rect x="476" y="156" width="190" height="8" rx="3" fill="#1F2937" opacity=".4"/>
    <rect x="476" y="170" width="160" height="8" rx="3" fill="#1F2937" opacity=".4"/>
    <!-- single dominant CTA -->
    <rect id="cta" x="476" y="208" width="170" height="44" rx="10" fill="#F59E0B"/>
    <text x="561" y="236" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Start free trial</text>
    <rect x="476" y="266" width="120" height="8" rx="3" fill="#1F2937" opacity=".3"/>
    <!-- supporting -->
    <rect x="476" y="296" width="200" height="6" rx="3" fill="#1F2937" opacity=".25"/>
    <rect x="476" y="310" width="170" height="6" rx="3" fill="#1F2937" opacity=".25"/>
    <rect x="476" y="324" width="190" height="6" rx="3" fill="#1F2937" opacity=".25"/>

    <!-- heatmap (focused) -->
    <g id="blobsClear" opacity="0">
     <circle cx="525" cy="130" r="16" fill="#F59E0B" opacity=".18"/>
     <circle cx="561" cy="230" r="34" fill="#F43F5E" opacity=".22"/>
     <circle cx="561" cy="230" r="22" fill="#F59E0B" opacity=".28"/>
     <circle cx="561" cy="230" r="12" fill="#F43F5E" opacity=".4"/>
    </g>

    <!-- moving eye -->
    <circle id="eyeR" cx="476" cy="130" r="8" fill="#1F2937" opacity="0"/>
    <circle id="eyeRi" cx="476" cy="130" r="3" fill="#FFF7ED" opacity="0"/>

    <!-- timer -->
    <g id="tlClear" opacity="0">
     <rect x="460" y="404" width="260" height="22" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/>
     <text x="470" y="420" font-size="11" fill="#6B7280" font-family="ui-monospace,monospace">eye reaches CTA in</text>
     <text id="tClear" x="710" y="420" text-anchor="end" font-size="13" font-weight="700" fill="#10B981" font-family="ui-monospace,monospace">— s</text>
    </g>

    <g id="crClear" opacity="0">
     <rect x="476" y="436" width="228" height="22" rx="11" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
     <text x="590" y="451" text-anchor="middle" font-size="11" fill="#065F46" font-family="ui-monospace,monospace">contrast 8.6 : 1   ✓ passes AAA</text>
    </g>
   </g>
  </svg>
  <div class="cap">Same content. Hierarchy is which thing the eye finds first.</div>
  <button id="rb">↺ replay</button>
 </div>
</main>

<script>
(function(){
'use strict';
var EASE=function(t){return 1-Math.pow(1-t,3);};
var rafs=[],tms=[];
function $(id){return document.getElementById(id);}
function after(ms,fn){tms.push(setTimeout(fn,ms));}
function clearAll(){tms.forEach(clearTimeout);tms=[];rafs.forEach(cancelAnimationFrame);rafs=[];}
function setOp(id,v){var e=$(id);if(e)e.setAttribute('opacity',v);}
function fade(id,from,to,dur,cb){
 var e=$(id);if(!e)return;
 var s=performance.now();
 function tick(now){
  var t=Math.min((now-s)/dur,1);
  e.setAttribute('opacity',(from+(to-from)*EASE(t)).toFixed(3));
  if(t<1)rafs.push(requestAnimationFrame(tick));else if(cb)cb();
 }
 rafs.push(requestAnimationFrame(tick));
}

/* eye paths */
var BUSY=[
 [60,96],[280,96],[60,124],[250,124],[60,148],[220,148],
 [80,200],[220,200],[60,246],[230,246],
 [100,294],[230,294],[60,332],[200,332],[60,372],[270,372]
];
var CLEAR=[
 [476,130],[640,130],[561,230]
];

function moveEye(prefix,pts,perSeg,onTick,cb){
 var i=0;
 function step(){
  if(i>=pts.length-1){if(cb)cb();return;}
  var a=pts[i],b=pts[i+1];
  var s=performance.now();
  function tick(now){
   var t=Math.min((now-s)/perSeg,1),e=EASE(t);
   var x=a[0]+(b[0]-a[0])*e,y=a[1]+(b[1]-a[1])*e;
   $(prefix).setAttribute('cx',x);$(prefix).setAttribute('cy',y);
   $(prefix+'i').setAttribute('cx',x);$(prefix+'i').setAttribute('cy',y);
   if(onTick)onTick(i,t);
   if(t<1)rafs.push(requestAnimationFrame(tick));
   else{i++;step();}
  }
  rafs.push(requestAnimationFrame(tick));
 }
 step();
}

function countTo(id,target,dur,unit,color){
 var s=performance.now();
 function tick(now){
  var t=Math.min((now-s)/dur,1),v=(target*EASE(t));
  $(id).textContent=v.toFixed(1)+' '+unit;
  if(color)$(id).setAttribute('fill',color);
  if(t<1)rafs.push(requestAnimationFrame(tick));
 }
 rafs.push(requestAnimationFrame(tick));
}

function pulse(id){
 var e=$(id);if(!e)return;
 var s=performance.now();
 function tick(now){
  var t=Math.min((now-s)/600,1);
  var k=1+0.06*Math.sin(t*Math.PI);
  e.setAttribute('transform','translate('+(561*(1-k))+','+(230*(1-k))+') scale('+k+')');
  if(t<1)rafs.push(requestAnimationFrame(tick));
  else e.setAttribute('transform','');
 }
 rafs.push(requestAnimationFrame(tick));
}

function run(){
 clearAll();
 ['blobsBusy','blobsClear','tlBusy','tlClear','crBusy','crClear','eyeL','eyeR','eyeLi','eyeRi'].forEach(function(id){setOp(id,0);});
 $('tBusy').textContent='— s';$('tClear').textContent='— s';
 $('eyeL').setAttribute('cx',60);$('eyeL').setAttribute('cy',96);
 $('eyeR').setAttribute('cx',476);$('eyeR').setAttribute('cy',130);

 // BUSY phase
 after(500,function(){
  fade('eyeL',0,1,250,null);fade('eyeLi',0,1,250,null);
  fade('blobsBusy',0,1,800,null);
  fade('tlBusy',0,1,400,null);
  moveEye('eyeL',BUSY,360,null,function(){
   countTo('tBusy',5.7,500,'s','#F43F5E');
   fade('crBusy',0,1,500,null);
  });
 });

 // CLEAR phase (slight overlap)
 after(7200,function(){
  fade('eyeR',0,1,250,null);fade('eyeRi',0,1,250,null);
  fade('blobsClear',0,1,600,null);
  fade('tlClear',0,1,400,null);
  moveEye('eyeR',CLEAR,420,null,function(){
   pulse('cta');
   countTo('tClear',1.0,500,'s','#10B981');
   fade('crClear',0,1,500,null);
  });
 });

 after(11500,function(){
  fade('eyeL',1,0,500,null);fade('eyeLi',1,0,500,null);
  fade('eyeR',1,0,500,null);fade('eyeRi',1,0,500,null);
  after(2200,run);
 });
}
$('rb').addEventListener('click',function(){clearAll();run();});
run();
})();
</script>
</body>
</html>
