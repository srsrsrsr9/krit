<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data mental model</title>
<style>
  :root{
    --bg:#FFF7ED; --ink:#1F2937; --muted:#6B7280;
    --amber:#F59E0B; --green:#10B981; --blue:#0EA5E9;
    --violet:#8B5CF6; --rose:#F43F5E;
    --paper:#FFFDF7;
    --ease:cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Inter",sans-serif}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .frame{width:100%;max-width:820px;aspect-ratio:16/10;display:block}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;max-width:820px;margin-left:auto;margin-right:auto;padding:0 12px}
  text{font-family:system-ui,-apple-system,"Inter",sans-serif}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  .question{
    transform-box:fill-box;transform-origin:center;
    animation:flow 14s var(--ease) infinite;
  }
  @keyframes flow{
    0%,5%   {transform:translateX(0px);   opacity:1}
    18%,28% {transform:translateX(180px); opacity:1}
    36%,46% {transform:translateX(360px); opacity:1}
    54%,64% {transform:translateX(540px); opacity:1}
    72%,90% {transform:translateX(540px); opacity:1}
    96%,100%{transform:translateX(0px);   opacity:1}
  }

  .stage-card{opacity:.35;transition:opacity .4s var(--ease)}
  .stage-card.active{opacity:1}

  .signal-bar rect.noise{
    transform-box:fill-box;transform-origin:left center;
    animation:noiseShrink 14s var(--ease) infinite;
  }
  .signal-bar rect.signal{
    transform-box:fill-box;transform-origin:left center;
    animation:signalGrow 14s var(--ease) infinite;
  }
  @keyframes noiseShrink{
    0%,5%   {transform:scaleX(1)}
    25%     {transform:scaleX(.78)}
    45%     {transform:scaleX(.55)}
    65%     {transform:scaleX(.32)}
    85%,100%{transform:scaleX(.18)}
  }
  @keyframes signalGrow{
    0%,5%   {transform:scaleX(.18)}
    25%     {transform:scaleX(.4)}
    45%     {transform:scaleX(.6)}
    65%     {transform:scaleX(.78)}
    85%,100%{transform:scaleX(.92)}
  }

  .conclusion{opacity:0; animation: revealConclusion 14s var(--ease) infinite}
  @keyframes revealConclusion{
    0%,70%{opacity:0;transform:translateY(6px)}
    78%,92%{opacity:1;transform:translateY(0)}
    98%,100%{opacity:0}
  }

  .ci-band{transform-box:fill-box;transform-origin:center;
    animation: ciAppear 14s var(--ease) infinite}
  @keyframes ciAppear{
    0%,72%{transform:scaleX(0); opacity:0}
    80%,92%{transform:scaleX(1); opacity:1}
    98%,100%{transform:scaleX(0); opacity:0}
  }

  .arrow{stroke-dasharray:6 8; animation: dash 6s linear infinite}
  @keyframes dash{to{stroke-dashoffset:-56}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    .question{transform:translateX(540px)}
    .signal-bar rect.noise{transform:scaleX(.18)}
    .signal-bar rect.signal{transform:scaleX(.92)}
    .conclusion,.ci-band{opacity:1}
    .ci-band{transform:scaleX(1)}
    .stage-card{opacity:1}
  }
</style>
</head>
<body>
<main class="stage">
<div>
<svg class="frame" viewBox="0 0 820 512" aria-label="A question flowing through hypothesis, data, test and conclusion stages while a noise bar shrinks and signal bar grows, ending with a confidence interval.">
  <!-- background card -->
  <rect x="0" y="0" width="820" height="512" fill="#FFF7ED"/>

  <!-- title -->
  <text x="410" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">From question to conclusion</text>
  <text x="410" y="54" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">noise shrinks, signal emerges</text>

  <!-- pipeline track -->
  <line x1="100" y1="120" x2="720" y2="120" stroke="#E5D9C3" stroke-width="2" class="arrow" stroke-linecap="round"/>

  <!-- four stage cards -->
  <!-- stage 1 hypothesis -->
  <g class="stage-card" id="s1">
    <rect x="60" y="146" width="140" height="84" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <text x="130" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#92400E">1 · HYPOTHESIS</text>
    <text x="130" y="196" text-anchor="middle" font-size="11" fill="#1F2937">"churn dropped"</text>
    <text x="130" y="214" text-anchor="middle" font-size="11" fill="#6B7280">our guess</text>
  </g>

  <!-- stage 2 data -->
  <g class="stage-card" id="s2">
    <rect x="220" y="146" width="140" height="84" rx="12" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="2"/>
    <text x="290" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#075985">2 · DATA</text>
    <!-- mini scatter -->
    <g transform="translate(238,184)">
      <circle cx="6"  cy="22" r="2.5" fill="#0EA5E9"/>
      <circle cx="18" cy="14" r="2.5" fill="#0EA5E9"/>
      <circle cx="30" cy="26" r="2.5" fill="#0EA5E9"/>
      <circle cx="42" cy="10" r="2.5" fill="#0EA5E9"/>
      <circle cx="54" cy="20" r="2.5" fill="#0EA5E9"/>
      <circle cx="66" cy="6"  r="2.5" fill="#0EA5E9"/>
      <circle cx="78" cy="18" r="2.5" fill="#0EA5E9"/>
      <circle cx="90" cy="12" r="2.5" fill="#0EA5E9"/>
      <circle cx="102" cy="24" r="2.5" fill="#F43F5E"/>
    </g>
    <text x="290" y="222" text-anchor="middle" font-size="11" fill="#6B7280">62 days, n=4,720</text>
  </g>

  <!-- stage 3 test -->
  <g class="stage-card" id="s3">
    <rect x="380" y="146" width="140" height="84" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
    <text x="450" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">3 · TEST</text>
    <!-- bell curve mini -->
    <path d="M 396 214 C 410 214, 422 188, 450 188 C 478 188, 490 214, 504 214"
          fill="none" stroke="#10B981" stroke-width="2"/>
    <line x1="450" y1="188" x2="450" y2="214" stroke="#10B981" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="450" y="226" text-anchor="middle" font-size="10" fill="#6B7280">t-test, paired</text>
  </g>

  <!-- stage 4 conclusion -->
  <g class="stage-card" id="s4">
    <rect x="540" y="146" width="140" height="84" rx="12" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2"/>
    <text x="610" y="174" text-anchor="middle" font-size="12" font-weight="700" fill="#5B21B6">4 · CONCLUSION</text>
    <text x="610" y="198" text-anchor="middle" font-size="11" fill="#1F2937">churn dropped</text>
    <text x="610" y="214" text-anchor="middle" font-size="11" fill="#1F2937" class="num">−4.1% ± 1.2</text>
  </g>

  <!-- moving question pill -->
  <g class="question">
    <rect x="20" y="84" width="180" height="36" rx="18" fill="#1F2937"/>
    <text x="110" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#FFF7ED">"did our churn drop?"</text>
  </g>

  <!-- noise vs signal bars -->
  <g transform="translate(60,278)">
    <text x="0" y="0" font-size="13" font-weight="700" fill="#1F2937">Noise vs signal</text>
    <text x="0" y="18" font-size="11" font-style="italic" fill="#6B7280">fluctuations &amp; outliers vs the real movement</text>

    <!-- legend -->
    <g transform="translate(440,-2)">
      <rect width="14" height="14" rx="3" fill="#F43F5E"/>
      <text x="20" y="11" font-size="11" fill="#1F2937">noise</text>
      <rect x="80" width="14" height="14" rx="3" fill="#10B981"/>
      <text x="100" y="11" font-size="11" fill="#1F2937">signal</text>
    </g>

    <!-- noise -->
    <text x="0" y="56" font-size="11" fill="#1F2937">noise</text>
    <g class="signal-bar">
      <rect x="60" y="44" width="640" height="18" rx="6" fill="#FEE2E2"/>
      <rect class="noise" x="60" y="44" width="640" height="18" rx="6" fill="#F43F5E"/>
    </g>

    <!-- signal -->
    <text x="0" y="92" font-size="11" fill="#1F2937">signal</text>
    <g class="signal-bar">
      <rect x="60" y="80" width="640" height="18" rx="6" fill="#D1FAE5"/>
      <rect class="signal" x="60" y="80" width="640" height="18" rx="6" fill="#10B981"/>
    </g>
  </g>

  <!-- final conclusion card with CI -->
  <g class="conclusion">
    <rect x="160" y="412" width="500" height="74" rx="14" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
    <text x="180" y="438" font-size="13" font-weight="700" fill="#1F2937">Churn fell 4.1% in Q3.</text>
    <text x="180" y="458" font-size="11" fill="#6B7280">95% CI</text>
    <!-- CI scale -->
    <line x1="240" y1="454" x2="620" y2="454" stroke="#E5D9C3" stroke-width="2" stroke-linecap="round"/>
    <line x1="240" y1="450" x2="240" y2="458" stroke="#9CA3AF" stroke-width="1.5"/>
    <line x1="620" y1="450" x2="620" y2="458" stroke="#9CA3AF" stroke-width="1.5"/>
    <text x="240" y="476" font-size="10" fill="#6B7280" text-anchor="middle">−6%</text>
    <text x="620" y="476" font-size="10" fill="#6B7280" text-anchor="middle">−2%</text>
    <!-- band -->
    <g class="ci-band">
      <rect x="320" y="448" width="220" height="12" rx="6" fill="#10B981" opacity=".25"/>
      <line x1="430" y1="442" x2="430" y2="466" stroke="#10B981" stroke-width="3"/>
      <text x="430" y="438" font-size="10" font-weight="700" fill="#065F46" text-anchor="middle" class="num">−4.1%</text>
    </g>
  </g>
</svg>
<div class="caption">A question only earns a conclusion after noise has been separated from signal — and the answer wears its uncertainty out loud.</div>
</div>
</main>
<script>
  // stage spotlight, tied to the same 14s loop
  (function(){
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      document.querySelectorAll('.stage-card').forEach(el => el.classList.add('active'));
      return;
    }
    const ids = ['s1','s2','s3','s4'];
    const els = ids.map(id => document.getElementById(id));
    const T = 14000;
    function tick(now){
      const t = (now % T) / T;
      let active = 0;
      if (t < 0.07) active = 0;
      else if (t < 0.30) active = 1;
      else if (t < 0.50) active = 2;
      else if (t < 0.68) active = 3;
      else active = 4; // all on during conclusion
      els.forEach((el,i) => {
        if (active === 4) el.classList.add('active');
        else el.classList.toggle('active', i === active);
      });
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
