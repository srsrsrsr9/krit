<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Communicating results</title>
<style>
  :root{
    --bg:#FFF7ED; --ink:#1F2937; --muted:#6B7280;
    --amber:#F59E0B; --green:#10B981; --blue:#0EA5E9;
    --violet:#8B5CF6; --rose:#F43F5E;
    --paper:#FFFDF7;
    --ease:cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Inter",sans-serif}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .frame{width:100%;max-width:880px;aspect-ratio:16/10;display:block}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;max-width:820px;margin-left:auto;margin-right:auto;padding:0 12px}
  text{font-family:system-ui,-apple-system,"Inter",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* CFO eye - look left, then right */
  .cfo-look{
    transform-box:fill-box; transform-origin:center;
    animation: look 14s var(--ease) infinite;
  }
  @keyframes look{
    0%,8%   {transform:translateX(0px)}
    18%,32% {transform:translateX(-4px)}    /* looking left at dump */
    44%,72% {transform:translateX(4px)}     /* looking right at BLUF */
    82%,100%{transform:translateX(0px)}
  }

  /* dump scrolls endlessly, hint at bloated content */
  .dump-scroll{ animation: scroll 8s linear infinite }
  @keyframes scroll{
    from{transform:translateY(0)}
    to{transform:translateY(-120px)}
  }

  /* dump rejection: shake + tilt */
  .dump-reject{
    transform-box:fill-box; transform-origin:center;
    animation: reject 14s var(--ease) infinite;
  }
  @keyframes reject{
    0%,30%{transform:translate(0,0) rotate(0)}
    40%,46%{transform:translate(-4px,0) rotate(-1.5deg)}
    52%   {transform:translate(110px,40px) rotate(-12deg); opacity:.85}
    56%,72%{transform:translate(220px,90px) rotate(-22deg); opacity:0}
    78%,100%{transform:translate(0,0) rotate(0); opacity:1}
  }

  .stamp-rejected{opacity:0; animation: stampR 14s var(--ease) infinite;
    transform-box:fill-box; transform-origin:center}
  @keyframes stampR{
    0%,38%{opacity:0; transform:scale(1.4) rotate(-12deg)}
    44%,62%{opacity:1; transform:scale(1) rotate(-12deg)}
    66%,100%{opacity:0}
  }

  /* BLUF gets approved: gentle nod + stamp */
  .stamp-approved{opacity:0; animation: stampA 14s var(--ease) infinite;
    transform-box:fill-box; transform-origin:center}
  @keyframes stampA{
    0%,68%{opacity:0; transform:scale(1.4) rotate(8deg)}
    76%,92%{opacity:1; transform:scale(1) rotate(8deg)}
    96%,100%{opacity:0}
  }

  .bluf-glow{
    transform-box:fill-box; transform-origin:center;
    animation: blufFocus 14s var(--ease) infinite;
  }
  @keyframes blufFocus{
    0%,46%{transform:scale(1)}
    56%,80%{transform:scale(1.02)}
    90%,100%{transform:scale(1)}
  }

  .speech{opacity:0; animation: speak 14s var(--ease) infinite}
  @keyframes speak{
    0%,30%{opacity:0; transform:translateY(4px)}
    36%,52%{opacity:1; transform:translateY(0)}
    56%,68%{opacity:0; transform:translateY(4px)}
    74%,90%{opacity:1; transform:translateY(0)}
    96%,100%{opacity:0}
  }

  .speech-A{animation-delay:0s}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    .stamp-rejected, .stamp-approved{opacity:1}
    .speech{opacity:1}
  }
</style>
</head>
<body>
<main class="stage">
<div>
<svg class="frame" viewBox="0 0 880 550" aria-label="Two memos side by side. Left: a model-dump memo gets rejected by the CFO. Right: a BLUF memo with bottom line first gets approved.">
  <rect x="0" y="0" width="880" height="550" fill="#FFF7ED"/>

  <!-- title -->
  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">Two memos. One CFO. One minute.</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">bottom line up front, evidence underneath, methodology in the appendix</text>

  <!-- =========== LEFT: Model-dump memo =========== -->
  <g transform="translate(36,82)" class="dump-reject">
    <rect x="0" y="0" width="316" height="358" rx="10" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
    <!-- header -->
    <rect x="0" y="0" width="316" height="38" rx="10" fill="#FEE2E2"/>
    <rect x="0" y="28" width="316" height="10" fill="#FEE2E2"/>
    <text x="16" y="24" font-size="12" font-weight="700" fill="#9F1239">memo · "model dump"</text>
    <text x="300" y="24" text-anchor="end" font-size="10" fill="#9F1239" class="mono">14 pages</text>

    <!-- viewport for scrolling content -->
    <clipPath id="clipDump">
      <rect x="8" y="46" width="300" height="294" rx="6"/>
    </clipPath>
    <g clip-path="url(#clipDump)">
      <g class="dump-scroll">
        <!-- huge wall of "text" rendered as gray bars -->
        <g fill="#D1D5DB">
          <!-- methodology section header -->
          <rect x="14" y="56" width="180" height="10" rx="3" fill="#9CA3AF"/>
          <rect x="14" y="74" width="284" height="6" rx="2"/>
          <rect x="14" y="86" width="276" height="6" rx="2"/>
          <rect x="14" y="98" width="290" height="6" rx="2"/>
          <rect x="14" y="110" width="240" height="6" rx="2"/>
          <rect x="14" y="122" width="280" height="6" rx="2"/>
          <rect x="14" y="134" width="260" height="6" rx="2"/>
          <!-- equation chunk -->
          <rect x="60" y="156" width="200" height="14" rx="3" fill="#E5E7EB"/>
          <text x="160" y="168" text-anchor="middle" font-size="10" fill="#6B7280" class="mono">y = β₀ + β₁x₁ + … + β₄₇x₄₇ + ε</text>
          <rect x="14" y="184" width="290" height="6" rx="2"/>
          <rect x="14" y="196" width="260" height="6" rx="2"/>
          <rect x="14" y="208" width="284" height="6" rx="2"/>
          <rect x="14" y="220" width="240" height="6" rx="2"/>
          <!-- table-ish -->
          <rect x="14" y="240" width="160" height="10" rx="3" fill="#9CA3AF"/>
          <rect x="14" y="258" width="50" height="6" rx="2"/>
          <rect x="74" y="258" width="50" height="6" rx="2"/>
          <rect x="134" y="258" width="50" height="6" rx="2"/>
          <rect x="14" y="270" width="50" height="6" rx="2"/>
          <rect x="74" y="270" width="50" height="6" rx="2"/>
          <rect x="134" y="270" width="50" height="6" rx="2"/>
          <rect x="14" y="282" width="50" height="6" rx="2"/>
          <rect x="74" y="282" width="50" height="6" rx="2"/>
          <rect x="134" y="282" width="50" height="6" rx="2"/>
          <rect x="14" y="306" width="180" height="10" rx="3" fill="#9CA3AF"/>
          <rect x="14" y="324" width="290" height="6" rx="2"/>
          <rect x="14" y="336" width="260" height="6" rx="2"/>
          <!-- second pass to fake infinite scroll -->
          <rect x="14" y="356" width="180" height="10" rx="3" fill="#9CA3AF"/>
          <rect x="14" y="374" width="284" height="6" rx="2"/>
          <rect x="14" y="386" width="276" height="6" rx="2"/>
          <rect x="14" y="398" width="290" height="6" rx="2"/>
          <rect x="14" y="410" width="240" height="6" rx="2"/>
          <rect x="14" y="422" width="280" height="6" rx="2"/>
          <rect x="14" y="434" width="260" height="6" rx="2"/>
          <rect x="60" y="456" width="200" height="14" rx="3" fill="#E5E7EB"/>
          <rect x="14" y="484" width="290" height="6" rx="2"/>
          <rect x="14" y="496" width="260" height="6" rx="2"/>
        </g>
      </g>
    </g>

    <!-- "where's the answer?" margin scribble -->
    <g transform="translate(214,338)">
      <path d="M 0 0 q 20 -12, 40 0 q 20 12, 60 0" fill="none" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="0" y="-10" font-size="10" font-style="italic" fill="#9F1239">…answer?</text>
    </g>

    <!-- REJECTED stamp -->
    <g class="stamp-rejected" transform="translate(160,160)">
      <rect x="-90" y="-26" width="180" height="52" rx="4" fill="none" stroke="#F43F5E" stroke-width="3"/>
      <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="800" fill="#F43F5E" letter-spacing="2">REJECTED</text>
    </g>
  </g>

  <!-- =========== CENTER: CFO =========== -->
  <g transform="translate(376,150)">
    <!-- shoulders -->
    <path d="M -64 162 Q 0 96, 64 162 L 64 200 L -64 200 Z" fill="#0EA5E9" opacity=".15"/>
    <path d="M -64 162 Q 0 96, 64 162" fill="none" stroke="#0EA5E9" stroke-width="2.5"/>
    <!-- head -->
    <ellipse cx="0" cy="62" rx="58" ry="64" fill="#FEF3C7" stroke="#1F2937" stroke-width="2.5"/>
    <!-- hair tuft -->
    <path d="M -36 14 Q 0 -8, 36 14 Q 24 8, 0 8 Q -24 8, -36 14 Z" fill="#1F2937"/>
    <!-- eyebrows -->
    <line x1="-28" y1="48" x2="-12" y2="44" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="12"  y1="44" x2="28"  y2="48" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round"/>
    <!-- glasses -->
    <circle cx="-18" cy="64" r="11" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
    <circle cx="18"  cy="64" r="11" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
    <line x1="-7" y1="64" x2="7" y2="64" stroke="#1F2937" stroke-width="2"/>
    <line x1="-29" y1="62" x2="-38" y2="58" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
    <line x1="29"  y1="62" x2="38"  y2="58" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
    <!-- pupils, follow attention -->
    <g class="cfo-look">
      <circle cx="-18" cy="64" r="3" fill="#1F2937"/>
      <circle cx="18"  cy="64" r="3" fill="#1F2937"/>
    </g>
    <!-- nose -->
    <path d="M 0 70 Q -3 84, 0 88 Q 3 92, 6 88" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
    <!-- mouth - slight smile -->
    <path d="M -10 102 Q 0 110, 10 102" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
    <!-- label -->
    <rect x="-36" y="186" width="72" height="20" rx="10" fill="#1F2937"/>
    <text x="0" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF7ED">CFO</text>
  </g>

  <!-- speech bubbles -->
  <g class="speech speech-A" transform="translate(330,272)">
    <rect x="-66" y="-20" width="132" height="32" rx="14" fill="#FFFDF7" stroke="#F43F5E" stroke-width="2"/>
    <path d="M 24 12 L 36 24 L 30 12 Z" fill="#FFFDF7" stroke="#F43F5E" stroke-width="2" stroke-linejoin="round"/>
    <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#9F1239">"so what?"</text>
  </g>
  <g class="speech" style="animation-delay:8s" transform="translate(434,272)">
    <rect x="-66" y="-20" width="132" height="32" rx="14" fill="#FFFDF7" stroke="#10B981" stroke-width="2"/>
    <path d="M -24 12 L -36 24 L -30 12 Z" fill="#FFFDF7" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
    <text x="0" y="0" text-anchor="middle" font-size="12" font-weight="700" fill="#065F46">"approved."</text>
  </g>

  <!-- =========== RIGHT: BLUF memo =========== -->
  <g transform="translate(528,82)" class="bluf-glow">
    <rect x="0" y="0" width="316" height="358" rx="10" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
    <!-- header -->
    <rect x="0" y="0" width="316" height="38" rx="10" fill="#DCFCE7"/>
    <rect x="0" y="28" width="316" height="10" fill="#DCFCE7"/>
    <text x="16" y="24" font-size="12" font-weight="700" fill="#065F46">memo · "BLUF"</text>
    <text x="300" y="24" text-anchor="end" font-size="10" fill="#065F46" class="mono">1 page</text>

    <!-- bottom line panel -->
    <g transform="translate(14,52)">
      <rect x="0" y="0" width="288" height="68" rx="8" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
      <text x="12" y="20" font-size="10" font-weight="700" fill="#065F46" letter-spacing="1.5">BOTTOM LINE</text>
      <text x="12" y="40" font-size="12" font-weight="700" fill="#1F2937">Churn rose 18% in Q3</text>
      <text x="12" y="56" font-size="11" fill="#1F2937">due to onboarding bug · recommend fix X</text>
    </g>

    <!-- Evidence -->
    <g transform="translate(14,134)">
      <text x="0" y="0" font-size="11" font-weight="700" fill="#1F2937">Evidence</text>
      <!-- bullets -->
      <g transform="translate(4,12)">
        <circle cx="6" cy="10" r="3" fill="#0EA5E9"/>
        <text x="18" y="14" font-size="11" fill="#1F2937">step-3 drop-off doubled (12% → 24%)</text>

        <circle cx="6" cy="32" r="3" fill="#0EA5E9"/>
        <text x="18" y="36" font-size="11" fill="#1F2937">cohort signup-to-day-30 fell 9 pts</text>

        <circle cx="6" cy="54" r="3" fill="#0EA5E9"/>
        <text x="18" y="58" font-size="11" fill="#1F2937">CI: ±1.4 pts, n=4,720, p&lt;0.001</text>
      </g>
    </g>

    <!-- chart preview - tidy -->
    <g transform="translate(14,224)">
      <rect x="0" y="0" width="288" height="80" rx="6" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1.5"/>
      <!-- baseline -->
      <line x1="14" y1="64" x2="274" y2="64" stroke="#9CA3AF" stroke-width="1"/>
      <!-- bars showing rise -->
      <rect x="20"  y="48" width="22" height="16" rx="2" fill="#0EA5E9"/>
      <rect x="50"  y="44" width="22" height="20" rx="2" fill="#0EA5E9"/>
      <rect x="80"  y="42" width="22" height="22" rx="2" fill="#0EA5E9"/>
      <rect x="110" y="32" width="22" height="32" rx="2" fill="#F43F5E"/>
      <rect x="140" y="24" width="22" height="40" rx="2" fill="#F43F5E"/>
      <rect x="170" y="20" width="22" height="44" rx="2" fill="#F43F5E"/>
      <rect x="200" y="16" width="22" height="48" rx="2" fill="#F43F5E"/>
      <rect x="230" y="12" width="22" height="52" rx="2" fill="#F43F5E"/>
      <text x="14" y="14" font-size="10" font-weight="700" fill="#1F2937">churn · weekly</text>
      <text x="262" y="78" text-anchor="end" font-size="9" fill="#6B7280">↑ +18% over Q3</text>
    </g>

    <!-- appendix tag -->
    <g transform="translate(14,316)">
      <rect x="0" y="0" width="288" height="28" rx="8" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.5"/>
      <text x="12" y="18" font-size="11" fill="#5B21B6">
        <tspan font-weight="700">appendix →</tspan> full methodology, code, and CI math
      </text>
    </g>

    <!-- APPROVED stamp -->
    <g class="stamp-approved" transform="translate(158,168)">
      <rect x="-90" y="-26" width="180" height="52" rx="4" fill="none" stroke="#10B981" stroke-width="3"/>
      <text x="0" y="6" text-anchor="middle" font-size="22" font-weight="800" fill="#10B981" letter-spacing="2">APPROVED</text>
    </g>
  </g>

  <!-- bottom note -->
  <g transform="translate(40,512)">
    <text x="0" y="0" font-size="11" font-style="italic" fill="#6B7280">
      The decision-maker is busy. Lead with the answer; the methodology can wait in the appendix.
    </text>
  </g>
</svg>
<div class="caption">A model dump tells; a BLUF memo decides. Same analysis — different career.</div>
</div>
</main>
</body>
</html>
