<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Statistical thinking</title>
<style>
  :root{
    --bg:#FFF7ED; --ink:#1F2937; --muted:#6B7280;
    --amber:#F59E0B; --green:#10B981; --blue:#0EA5E9;
    --violet:#8B5CF6; --rose:#F43F5E;
    --paper:#FFFDF7;
    --ease:cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .frame{width:100%;max-width:880px;aspect-ratio:16/10;display:block}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;max-width:820px;margin-left:auto;margin-right:auto;padding:0 12px}
  text{font-family:system-ui,-apple-system,"Inter",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  .bell-wide{
    transform-box:fill-box;transform-origin:center bottom;
    animation: stayWide 12s var(--ease) infinite;
  }
  .bell-narrow{
    transform-box:fill-box;transform-origin:center bottom;
    animation: narrow 12s var(--ease) infinite;
  }
  @keyframes stayWide{
    0%,100%{transform:scaleX(1) scaleY(1)}
  }
  @keyframes narrow{
    0%,8%   {transform:scaleX(2.0) scaleY(.5)}
    50%,55% {transform:scaleX(.45) scaleY(2.2)}
    92%,100%{transform:scaleX(.45) scaleY(2.2)}
  }

  .ci-A{transform-box:fill-box;transform-origin:center;
    animation: ciA 12s var(--ease) infinite}
  .ci-B{transform-box:fill-box;transform-origin:center;
    animation: ciB 12s var(--ease) infinite}
  @keyframes ciA{
    0%,100%{transform:scaleX(1)}
  }
  @keyframes ciB{
    0%,8%   {transform:scaleX(1)}
    50%,100%{transform:scaleX(.18)}
  }

  /* sample size readout */
  .nB-text{animation: nGrow 12s var(--ease) infinite}
  @keyframes nGrow{
    0%,8%{opacity:.6}
    50%,100%{opacity:1}
  }

  .annot{opacity:0; animation: showAnnot 12s var(--ease) infinite}
  @keyframes showAnnot{
    0%,55%{opacity:0; transform:translateY(4px)}
    65%,92%{opacity:1; transform:translateY(0)}
    98%,100%{opacity:0}
  }

  /* tick marks for sample dots in B */
  .dot-B{opacity:0; animation: dotsAppear 12s var(--ease) infinite}
  @keyframes dotsAppear{
    0%,10%{opacity:0; transform:scale(0)}
    50%,100%{opacity:1; transform:scale(1)}
  }
  .dot-B{transform-box:fill-box;transform-origin:center}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important}
    .bell-narrow{transform:scaleX(.45) scaleY(2.2)}
    .ci-B{transform:scaleX(.18)}
    .annot{opacity:1}
    .dot-B{opacity:1; transform:scale(1)}
  }
</style>
</head>
<body>
<main class="stage">
<div>
<svg class="frame" viewBox="0 0 880 550" aria-label="Two A/B tests with the same lift but different sample sizes. Test A: n=47, wide bell curve, confidence interval [-3, +27]. Test B: n=4700, the bell narrows and the interval tightens to [+10, +14].">
  <rect x="0" y="0" width="880" height="550" fill="#FFF7ED"/>

  <text x="440" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">Same lift, very different stories</text>
  <text x="440" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">a confidence interval is what your data is willing to swear to</text>

  <!-- divider -->
  <line x1="440" y1="80" x2="440" y2="498" stroke="#E5D9C3" stroke-width="2" stroke-dasharray="4 6"/>

  <!-- ============ LEFT: Test A ============ -->
  <g transform="translate(40,86)">
    <rect x="0" y="0" width="376" height="408" rx="14" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#1F2937">Test A · pilot run</text>
    <text x="20" y="48" font-size="11" fill="#6B7280">small sample, big shrug</text>

    <!-- stat row -->
    <g transform="translate(20,68)">
      <text x="0" y="0" font-size="11" fill="#6B7280">lift</text>
      <text x="0" y="22" font-size="22" font-weight="700" fill="#1F2937" class="mono">+12%</text>
      <text x="120" y="0" font-size="11" fill="#6B7280">n</text>
      <text x="120" y="22" font-size="22" font-weight="700" fill="#F43F5E" class="mono">47</text>
      <text x="240" y="0" font-size="11" fill="#6B7280">p-value</text>
      <text x="240" y="22" font-size="22" font-weight="700" fill="#1F2937" class="mono">0.21</text>
    </g>

    <!-- bell curve A: stays wide and short -->
    <g transform="translate(20,134)">
      <!-- axis -->
      <line x1="0" y1="160" x2="336" y2="160" stroke="#1F2937" stroke-width="1.5"/>
      <!-- ticks -->
      <g font-size="9" fill="#6B7280" class="mono">
        <text x="0"   y="178" text-anchor="middle">−10%</text>
        <text x="84"  y="178" text-anchor="middle">0</text>
        <text x="168" y="178" text-anchor="middle">+12%</text>
        <text x="252" y="178" text-anchor="middle">+20%</text>
        <text x="336" y="178" text-anchor="middle">+30%</text>
      </g>
      <!-- zero line -->
      <line x1="84" y1="20" x2="84" y2="160" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="84" y="14" text-anchor="middle" font-size="9" fill="#9CA3AF">no effect</text>

      <!-- bell, wide -->
      <g class="bell-wide">
        <path d="M -40 160 Q 30 160, 84 90 Q 138 20, 168 20 Q 198 20, 252 90 Q 306 160, 376 160 Z"
              fill="#FEE2E2" stroke="#F43F5E" stroke-width="2"/>
      </g>
      <!-- center marker -->
      <line x1="168" y1="20" x2="168" y2="160" stroke="#F43F5E" stroke-width="2"/>
      <circle cx="168" cy="20" r="4" fill="#F43F5E"/>

      <!-- CI bracket -->
      <g class="ci-A" transform="translate(168,178)">
        <line x1="-144" y1="0" x2="144" y2="0" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
        <line x1="-144" y1="-6" x2="-144" y2="6" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
        <line x1="144"  y1="-6" x2="144"  y2="6" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="168" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#9F1239" class="mono">95% CI: [−3% … +27%]</text>
      <text x="168" y="224" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">crosses zero — could even be a loss</text>
    </g>

    <!-- 47 dots, sparse -->
    <g transform="translate(20,360)" fill="#F43F5E">
      <text x="0" y="-4" font-size="11" fill="#6B7280">your sample</text>
      <g>
        <!-- 47 dots in a strip -->
        <g id="dotsA"></g>
      </g>
    </g>

    <text x="20" y="396" font-size="11" font-style="italic" fill="#6B7280">verdict: inconclusive — go run more</text>
  </g>

  <!-- ============ RIGHT: Test B ============ -->
  <g transform="translate(464,86)">
    <rect x="0" y="0" width="376" height="408" rx="14" fill="#FFFDF7" stroke="#1F2937" stroke-width="2"/>
    <text x="20" y="28" font-size="13" font-weight="700" fill="#1F2937">Test B · full rollout</text>
    <text x="20" y="48" font-size="11" fill="#6B7280">100× the data, a real answer</text>

    <!-- stat row -->
    <g transform="translate(20,68)">
      <text x="0" y="0" font-size="11" fill="#6B7280">lift</text>
      <text x="0" y="22" font-size="22" font-weight="700" fill="#1F2937" class="mono">+12%</text>
      <text x="120" y="0" font-size="11" fill="#6B7280">n</text>
      <text x="120" y="22" font-size="22" font-weight="700" fill="#10B981" class="mono nB-text">4,700</text>
      <text x="240" y="0" font-size="11" fill="#6B7280">p-value</text>
      <text x="240" y="22" font-size="22" font-weight="700" fill="#10B981" class="mono">&lt;0.001</text>
    </g>

    <!-- bell curve B: starts wide, narrows in -->
    <g transform="translate(20,134)">
      <line x1="0" y1="160" x2="336" y2="160" stroke="#1F2937" stroke-width="1.5"/>
      <g font-size="9" fill="#6B7280" class="mono">
        <text x="0"   y="178" text-anchor="middle">−10%</text>
        <text x="84"  y="178" text-anchor="middle">0</text>
        <text x="168" y="178" text-anchor="middle">+12%</text>
        <text x="252" y="178" text-anchor="middle">+20%</text>
        <text x="336" y="178" text-anchor="middle">+30%</text>
      </g>
      <line x1="84" y1="20" x2="84" y2="160" stroke="#9CA3AF" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="84" y="14" text-anchor="middle" font-size="9" fill="#9CA3AF">no effect</text>

      <!-- bell that narrows -->
      <g class="bell-narrow">
        <path d="M -40 160 Q 30 160, 84 90 Q 138 20, 168 20 Q 198 20, 252 90 Q 306 160, 376 160 Z"
              fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      </g>
      <line x1="168" y1="20" x2="168" y2="160" stroke="#10B981" stroke-width="2"/>
      <circle cx="168" cy="20" r="4" fill="#10B981"/>

      <!-- CI bracket B -->
      <g class="ci-B" transform="translate(168,178)">
        <line x1="-144" y1="0" x2="144" y2="0" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
        <line x1="-144" y1="-6" x2="-144" y2="6" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
        <line x1="144"  y1="-6" x2="144"  y2="6" stroke="#10B981" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="168" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46" class="mono">95% CI: [+10% … +14%]</text>
      <text x="168" y="224" text-anchor="middle" font-size="11" font-style="italic" fill="#6B7280">never crosses zero — the lift is real</text>
    </g>

    <!-- dot crowd for B -->
    <g transform="translate(20,360)">
      <text x="0" y="-4" font-size="11" fill="#6B7280">your sample (a hundred times bigger)</text>
      <g id="dotsB"></g>
    </g>

    <text x="20" y="396" font-size="11" font-style="italic" fill="#6B7280">verdict: ship it — and watch the band</text>
  </g>

  <!-- annotation banner -->
  <g class="annot">
    <rect x="160" y="510" width="560" height="32" rx="10" fill="#1F2937"/>
    <text x="440" y="531" text-anchor="middle" font-size="13" font-weight="600" fill="#FFF7ED">"p &lt; 0.05 isn't a decision rule on its own."</text>
  </g>
</svg>
<div class="caption">More data narrows the bell — and only narrow bells can answer the question you actually asked.</div>
</div>
</main>
<script>
(function(){
  // dot strips
  const dotsA = document.getElementById('dotsA');
  const dotsB = document.getElementById('dotsB');

  // 47 dots, fixed pattern
  for (let i=0;i<47;i++){
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    const x = (i % 24) * 14 + 4;
    const y = Math.floor(i / 24) * 14 + 4;
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('r', 3);
    c.setAttribute('fill', '#F43F5E');
    dotsA.appendChild(c);
  }
  // ~470 dots for B in dense grid (4700 implied; 470 visualised)
  let n = 470;
  let cols = 47;
  for (let i=0;i<n;i++){
    const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
    const x = (i % cols) * 7.2 + 4;
    const y = Math.floor(i / cols) * 4 + 4;
    c.setAttribute('cx', x);
    c.setAttribute('cy', y);
    c.setAttribute('r', 1.4);
    c.setAttribute('fill', '#10B981');
    c.setAttribute('class', 'dot-B');
    c.style.animationDelay = (i*8) + 'ms';
    dotsB.appendChild(c);
  }
})();
</script>
</body>
</html>
