<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: skip EDA</title>
<style>
  :root {
    --bg: #ECFDF5;
    --ink: #1F2937;
    --muted: #6B7280;
    --paper: #FFFFFF;
    --accent: #10B981;
    --bad: #F43F5E;
    --amber: #F59E0B;
    --blue: #0EA5E9;
    --violet: #8B5CF6;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family: system-ui,-apple-system,"Inter",sans-serif; }
  .stage { width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
  .frame-wrap { width:100%; max-width:780px; }
  svg.frame { width:100%; height:auto; display:block; }
  .caption { text-align:center; font-size:13px; font-style:italic; color:var(--muted); margin-top:10px; padding:0 12px; }
  text { font-family: system-ui,-apple-system,"Inter",sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, "SF Mono", monospace; }
  .label { font-size: 13px; }
  .tiny { font-size: 11px; fill: var(--muted); }
  .head { font-size: 17px; font-weight: 700; }
  .stage-cap { font-size: 12px; font-style: italic; fill: var(--muted); }

  .panel { animation: panelFade 14s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity: 0; }
  .panel.p1 { animation-delay: 0s; }
  .panel.p2 { animation-delay: 3.5s; }
  .panel.p3 { animation-delay: 7s; }
  .panel.p4 { animation-delay: 10.5s; }
  @keyframes panelFade {
    0% { opacity: 0; }
    3% { opacity: 1; }
    22% { opacity: 1; }
    27% { opacity: 0; }
    100% { opacity: 0; }
  }

  .acc-fill { animation: accFill 14s cubic-bezier(0.22,0.61,0.36,1) infinite; }
  @keyframes accFill {
    0%, 4% { width: 0; }
    16% { width: 0; }
    21% { width: 156px; }
    100% { width: 156px; }
  }

  .ship-stamp { animation: shipStamp 14s cubic-bezier(0.22,0.61,0.36,1) infinite; transform-origin: center; transform-box: fill-box; opacity: 0; }
  @keyframes shipStamp {
    0%, 22% { opacity: 0; transform: scale(2) rotate(-25deg); }
    24% { opacity: 1; transform: scale(1) rotate(-12deg); }
    27% { opacity: 1; transform: scale(1) rotate(-12deg); }
    100% { opacity: 0; transform: scale(1) rotate(-12deg); }
  }

  .pie-spin { animation: pieReveal 14s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity: 0; transform-origin: center; transform-box: fill-box; }
  @keyframes pieReveal {
    0%, 27% { opacity: 0; transform: scale(0.4) rotate(-90deg); }
    32% { opacity: 1; transform: scale(1) rotate(0deg); }
    49% { opacity: 1; transform: scale(1) rotate(0deg); }
    51% { opacity: 0; }
    100% { opacity: 0; }
  }

  .crash-line { animation: crashLine 14s cubic-bezier(0.22,0.61,0.36,1) infinite; stroke-dasharray: 600; stroke-dashoffset: 600; }
  @keyframes crashLine {
    0%, 51% { stroke-dashoffset: 600; }
    62% { stroke-dashoffset: 0; }
    74% { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 0; }
  }

  .crash-bolt { animation: crashBolt 14s cubic-bezier(0.22,0.61,0.36,1) infinite; opacity: 0; }
  @keyframes crashBolt {
    0%, 65% { opacity: 0; transform: scale(0.5); transform-origin: center; transform-box: fill-box; }
    70% { opacity: 1; transform: scale(1.2); }
    74% { opacity: 1; transform: scale(1); }
    77% { opacity: 0; }
    100% { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .panel { opacity: 1; }
    .ship-stamp, .pie-spin, .crash-bolt { opacity: 1; transform: none; }
    .acc-fill { width: 156px; }
    .crash-line { stroke-dashoffset: 0; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="frame-wrap">
    <svg class="frame" viewBox="0 0 720 460" aria-label="An analyst loads a CSV, runs a model that scores 78 percent accuracy and ships it. A stakeholder asks about the demographic split: 92 percent of the data came from one cohort. The model then breaks on a new cohort. The fix is to describe the data before modeling.">
      <defs>
        <pattern id="gridG" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#D1FAE5" stroke-width="1"/>
        </pattern>
        <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2937"/>
        </marker>
      </defs>

      <rect x="0.5" y="0.5" width="719" height="459" rx="14" fill="var(--paper)" stroke="#E5E7EB"/>

      <!-- ====== PANEL 1: load CSV, run model, accuracy ====== -->
      <g class="panel p1">
        <text class="head" x="360" y="46" text-anchor="middle">Load CSV. Run model. Eyeball accuracy.</text>

        <!-- csv "icon" -->
        <g transform="translate(80 110)">
          <rect x="0" y="0" width="120" height="150" rx="8" fill="#FFF7ED" stroke="var(--amber)" stroke-width="2"/>
          <path d="M 90 0 L 120 30 L 90 30 Z" fill="var(--amber)" opacity="0.5"/>
          <text class="mono tiny" x="14" y="48" fill="var(--ink)">id,cohort,y</text>
          <text class="mono tiny" x="14" y="64" fill="var(--ink)">1,A,0.81</text>
          <text class="mono tiny" x="14" y="80" fill="var(--ink)">2,A,0.74</text>
          <text class="mono tiny" x="14" y="96" fill="var(--ink)">3,A,0.79</text>
          <text class="mono tiny" x="14" y="112" fill="var(--ink)">4,A,0.83</text>
          <text class="mono tiny" x="14" y="128" fill="var(--ink)">...</text>
          <text class="tiny" x="60" y="146" text-anchor="middle" fill="var(--muted)">data.csv</text>
        </g>

        <!-- arrow -->
        <line x1="210" y1="185" x2="260" y2="185" stroke="var(--ink)" stroke-width="2" marker-end="url(#arr)"/>

        <!-- model "box" -->
        <g transform="translate(265 130)">
          <rect x="0" y="0" width="180" height="110" rx="10" fill="#EFF6FF" stroke="var(--blue)" stroke-width="2"/>
          <text class="label" x="90" y="28" text-anchor="middle" font-weight="700" fill="var(--blue)">model.fit()</text>
          <g class="mono" font-size="10" fill="var(--ink)">
            <text x="14" y="50">RandomForest</text>
            <text x="14" y="66">n_estimators=100</text>
            <text x="14" y="82">cross_val_score</text>
            <text x="14" y="98">→ "looks fine"</text>
          </g>
        </g>

        <!-- arrow -->
        <line x1="455" y1="185" x2="505" y2="185" stroke="var(--ink)" stroke-width="2" marker-end="url(#arr)"/>

        <!-- accuracy bar -->
        <g transform="translate(510 140)">
          <text class="label" x="80" y="0" text-anchor="middle" font-weight="600">Accuracy</text>
          <rect x="0" y="20" width="160" height="32" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
          <rect class="acc-fill" x="0" y="20" width="0" height="32" rx="6" fill="var(--accent)"/>
          <text class="mono" font-size="14" x="80" y="42" text-anchor="middle" fill="white" font-weight="700">78%</text>
          <text class="tiny" x="80" y="76" text-anchor="middle" fill="var(--muted)">"good enough"</text>
        </g>

        <!-- SHIP IT stamp -->
        <g class="ship-stamp" transform="translate(420 320)">
          <rect x="-50" y="-20" width="100" height="40" rx="4" fill="none" stroke="var(--good, #10B981)" stroke-width="3"/>
          <text class="mono" font-size="20" font-weight="700" x="0" y="8" text-anchor="middle" fill="var(--accent)">SHIP IT</text>
        </g>

        <text class="stage-cap" x="360" y="408" text-anchor="middle">No describe(). No groupby. No histogram. Just .fit() and a number.</text>
      </g>

      <!-- ====== PANEL 2: stakeholder asks. demographic split ====== -->
      <g class="panel p2">
        <text class="head" x="360" y="46" text-anchor="middle">A stakeholder asks: "what's the demographic split?"</text>

        <!-- speech bubble -->
        <g transform="translate(80 90)">
          <rect x="0" y="0" width="220" height="60" rx="10" fill="#FEF3C7" stroke="var(--amber)" stroke-width="2"/>
          <path d="M 30 60 L 38 76 L 50 60 Z" fill="#FEF3C7" stroke="var(--amber)" stroke-width="2"/>
          <text class="label" x="110" y="34" text-anchor="middle" font-style="italic">"Who's actually in the data?"</text>
        </g>

        <!-- pie chart appears -->
        <g class="pie-spin" transform="translate(450 230)">
          <!-- 92% slice (cohort A) -->
          <path d="M 0 -100 A 100 100 0 1 1 -25.04 96.81 L 0 0 Z" fill="var(--bad)" opacity="0.85"/>
          <!-- small slices -->
          <path d="M -25.04 96.81 A 100 100 0 0 1 -49.97 -86.62 L 0 0 Z" fill="#FCA5A5"/>
          <path d="M -49.97 -86.62 A 100 100 0 0 1 0 -100 L 0 0 Z" fill="var(--violet)"/>
          <circle r="100" fill="none" stroke="var(--ink)" stroke-width="2"/>

          <text class="mono" font-size="22" font-weight="700" x="-15" y="-10" text-anchor="middle" fill="white">92%</text>
          <text class="label" x="-15" y="14" text-anchor="middle" fill="white" font-weight="700">cohort A</text>

          <!-- legend -->
          <g transform="translate(120 -90)">
            <rect width="12" height="12" fill="var(--bad)" opacity="0.85"/>
            <text class="tiny" x="20" y="10" fill="var(--ink)">cohort A · 92%</text>
            <rect y="22" width="12" height="12" fill="#FCA5A5"/>
            <text class="tiny" x="20" y="32" fill="var(--ink)">cohort B · 6%</text>
            <rect y="44" width="12" height="12" fill="var(--violet)"/>
            <text class="tiny" x="20" y="54" fill="var(--ink)">cohort C · 2%</text>
          </g>
        </g>

        <text class="stage-cap" x="360" y="408" text-anchor="middle">It wasn't a "general model." It was a model of cohort A.</text>
      </g>

      <!-- ====== PANEL 3: model crashes on new cohort ====== -->
      <g class="panel p3">
        <text class="head" x="360" y="46" text-anchor="middle">The model meets cohort B in production.</text>

        <!-- chart frame -->
        <rect x="80" y="100" width="560" height="240" fill="url(#gridG)"/>
        <rect x="80" y="100" width="560" height="240" fill="none" stroke="#D1D5DB" stroke-width="1.5"/>

        <!-- y-axis -->
        <text class="tiny mono" x="74" y="106" text-anchor="end">100%</text>
        <text class="tiny mono" x="74" y="178" text-anchor="end">75%</text>
        <text class="tiny mono" x="74" y="250" text-anchor="end">50%</text>
        <text class="tiny mono" x="74" y="324" text-anchor="end">25%</text>
        <text class="tiny" x="36" y="220" text-anchor="middle" transform="rotate(-90 36 220)">accuracy</text>

        <!-- x labels -->
        <text class="tiny mono" x="220" y="358" text-anchor="middle">cohort A (training)</text>
        <text class="tiny mono" x="500" y="358" text-anchor="middle">cohort B (new)</text>

        <!-- divider -->
        <line x1="360" y1="100" x2="360" y2="340" stroke="#D1D5DB" stroke-width="1" stroke-dasharray="4 4"/>

        <!-- 78% line on left -->
        <line x1="100" y1="170" x2="340" y2="170" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="100" cy="170" r="5" fill="var(--accent)"/>
        <circle cx="340" cy="170" r="5" fill="var(--accent)"/>
        <text class="mono" font-size="13" x="220" y="160" text-anchor="middle" fill="var(--accent)" font-weight="700">78%</text>

        <!-- crash line on right -->
        <path class="crash-line" d="M 380 170 Q 420 175, 460 220 T 540 285 T 620 305" fill="none" stroke="var(--bad)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="380" cy="170" r="5" fill="var(--bad)"/>

        <!-- crash bolt at endpoint -->
        <g class="crash-bolt" transform="translate(620 305)">
          <circle r="22" fill="var(--bad)" opacity="0.18"/>
          <path d="M -4 -12 L 4 -2 L -2 -2 L 4 12 L -4 2 L 2 2 Z" fill="var(--bad)" stroke="#9F1239" stroke-width="1"/>
          <text class="mono" font-size="13" x="0" y="42" text-anchor="middle" fill="var(--bad)" font-weight="700">41%</text>
        </g>

        <text class="stage-cap" x="360" y="402" text-anchor="middle">Coin-flip territory. The "78%" was an in-distribution illusion.</text>
      </g>

      <!-- ====== PANEL 4: fix — describe before modeling ====== -->
      <g class="panel p4">
        <text class="head" x="360" y="46" text-anchor="middle">Fix: always look at the data first. Describe before modeling.</text>

        <!-- checklist -->
        <g transform="translate(110 88)">
          <rect x="0" y="0" width="500" height="280" rx="12" fill="#FFF7ED" stroke="var(--amber)" stroke-width="2"/>
          <text class="label" x="250" y="32" text-anchor="middle" font-weight="700">EDA checklist (5 minutes, before .fit())</text>

          <g transform="translate(28 60)">
            <circle cx="6" cy="6" r="9" fill="var(--accent)"/>
            <path d="M 1 6 L 5 10 L 11 2" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="label" x="28" y="10" fill="var(--ink)">df.describe() — means, ranges, missingness</text>
          </g>
          <g transform="translate(28 96)">
            <circle cx="6" cy="6" r="9" fill="var(--accent)"/>
            <path d="M 1 6 L 5 10 L 11 2" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="label" x="28" y="10" fill="var(--ink)">df.groupby(cohort).size() — who's in here?</text>
          </g>
          <g transform="translate(28 132)">
            <circle cx="6" cy="6" r="9" fill="var(--accent)"/>
            <path d="M 1 6 L 5 10 L 11 2" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="label" x="28" y="10" fill="var(--ink)">histogram of y — bimodal? skewed? truncated?</text>
          </g>
          <g transform="translate(28 168)">
            <circle cx="6" cy="6" r="9" fill="var(--accent)"/>
            <path d="M 1 6 L 5 10 L 11 2" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="label" x="28" y="10" fill="var(--ink)">scatter pairs — leakage? collinearity?</text>
          </g>
          <g transform="translate(28 204)">
            <circle cx="6" cy="6" r="9" fill="var(--accent)"/>
            <path d="M 1 6 L 5 10 L 11 2" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
            <text class="label" x="28" y="10" fill="var(--ink)">does the population match where it'll be deployed?</text>
          </g>

          <text class="tiny" x="250" y="252" text-anchor="middle" fill="var(--muted)" font-style="italic">If any answer surprises you, the model would have surprised you worse.</text>
        </g>

        <text class="stage-cap" x="360" y="408" text-anchor="middle">A model is a summary. Summarize the input first.</text>
      </g>

      <!-- progress dots -->
      <g transform="translate(360 432)">
        <circle cx="-30" cy="0" r="3.5" fill="var(--accent)"/>
        <circle cx="-10" cy="0" r="3.5" fill="var(--accent)" opacity="0.5"/>
        <circle cx="10" cy="0" r="3.5" fill="var(--accent)" opacity="0.5"/>
        <circle cx="30" cy="0" r="3.5" fill="var(--accent)" opacity="0.5"/>
      </g>
    </svg>
    <div class="caption">Modeling without EDA is shipping a survey of one cohort and calling it the population.</div>
  </div>
</main>
</body>
</html>
