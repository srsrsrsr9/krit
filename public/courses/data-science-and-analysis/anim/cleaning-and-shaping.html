<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cleaning and shaping</title>
<style>
  :root{
    --bg:#FFF7ED; --ink:#1F2937; --muted:#6B7280;
    --amber:#F59E0B; --green:#10B981; --blue:#0EA5E9;
    --violet:#8B5CF6; --rose:#F43F5E;
    --paper:#FFFDF7;
    --ease:cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Inter",sans-serif}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
  .frame{width:100%;max-width:860px;aspect-ratio:16/10;display:block}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;max-width:820px;margin-left:auto;margin-right:auto;padding:0 12px}
  text{font-family:system-ui,-apple-system,"Inter",sans-serif}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* counter ticks downwards through 14s */
  .stage-pill{transform-box:fill-box;transform-origin:center}
  .pipe-stage rect.bg{fill:#FAF5FF;stroke:#E5D9C3;stroke-width:2}
  .pipe-stage.active rect.bg{stroke:#1F2937}

  .issue{transition:opacity .45s var(--ease), transform .45s var(--ease);
    transform-box:fill-box;transform-origin:center}
  .cleaned{opacity:0;transform:scale(.85)}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important}
    .issue{opacity:0}
    .pipe-stage rect.bg{stroke:#1F2937}
  }
</style>
</head>
<body>
<main class="stage">
<div>
<svg class="frame" viewBox="0 0 860 538" aria-label="A messy CSV with 47 issues being cleaned in five pipeline stages — schema, nulls, types, strings, deduplication — until it's ready for analysis.">

  <text x="430" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">Cleaning &amp; shaping</text>
  <text x="430" y="52" text-anchor="middle" font-size="12" font-style="italic" fill="#6B7280">47 issues → 0, one stage at a time</text>

  <!-- left: messy CSV -->

<div class="caption">Cleaning isn't glamorous, but a tidy schema, honest nulls, and ISO dates are the foundation of every honest chart that follows.</div>
</div>
</main>
<script>
(function(){
  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const counter = document.getElementById('counter');
  const finalPill = document.getElementById('finalPill');
  const pipeStages = [1,2,3,4,5].map(i => document.getElementById('p'+i));
  const remaining = [47,41,32,18,7];
  const stageTotals = [47,41,32,18,7,0];
  const stageDur = 2200;
  const settle  = 600;
  const pause   = 1200;
  const totalCycle = stageDur*5 + settle + pause;

  function setCounter(n){
    counter.textContent = String(n);
    counter.setAttribute('fill', n === 0 ? '#10B981' : (n < 20 ? '#F59E0B' : '#F43F5E'));
  }

  function clearStage(stage){
    document.querySelectorAll('.issue[data-stage="'+stage+'"]').forEach(el => el.classList.add('cleaned'));
  }
  function resetAll(){
    document.querySelectorAll('.issue').forEach(el => el.classList.remove('cleaned'));
    pipeStages.forEach(el => el.classList.remove('active'));
    finalPill.setAttribute('opacity','0');
    setCounter(47);
  }

  if (reduce){
    document.querySelectorAll('.issue').forEach(el => el.classList.add('cleaned'));
    pipeStages.forEach(el => el.classList.add('active'));
    finalPill.setAttribute('opacity','1');
    setCounter(0);
    return;
  }

  function runCycle(){
    resetAll();
    for (let i=0; i<5; i++){
      const startAt = i*stageDur + 200;
      setTimeout(() => {
        pipeStages.forEach(el => el.classList.remove('active'));
        pipeStages[i].classList.add('active');
        clearStage(i+1);
        animateCounter(stageTotals[i], stageTotals[i+1], 800);
      }, startAt);
    }
    setTimeout(() => {
      pipeStages.forEach(el => el.classList.remove('active'));
      finalPill.setAttribute('opacity','1');
    }, 5*stageDur + settle);
    setTimeout(runCycle, totalCycle + 800);
  }

  function animateCounter(from, to, dur){
    const start = performance.now();
    function step(now){
      const t = Math.min(1, (now-start)/dur);
      const eased = 1 - Math.pow(1-t, 3);
      const val = Math.round(from + (to-from)*eased);
      setCounter(val);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  runCycle();
})();
</script>
</body>
