<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: leading questions</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.q1{animation:fade .4s ease .3s both}.a1{animation:pop .4s ease 1s both}
.q2{animation:fade .4s ease 2s both}.a2{animation:pop .4s ease 2.6s both}
.q3{animation:fade .4s ease 3.5s both}.a3{animation:pop .4s ease 4.1s both}
.bad-result{animation:pop .5s ease 5s both}
.good-q{animation:fade .4s ease 6.5s both}.good-a{animation:pop .5s ease 7.5s both}
.good-result{animation:pop .5s ease 9s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="Leading questions producing yes-yes-yes interview, vs the silence move plus 'tell me about the last time' producing real insight">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- LEFT: bad interview -->
<g transform="translate(40 30)">
<rect width="320" height="160" rx="10" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">BEFORE · leading questions</text>

<g class="q1"><rect x="14" y="34" width="180" height="22" rx="11" fill="#FFFFFF" stroke="#7F1D1D"/><text x="22" y="49" font-size="10" fill="#1F2937">"Would you use a faster checkout?"</text></g>
<g class="a1"><rect x="200" y="34" width="105" height="22" rx="11" fill="#7F1D1D"/><text x="252" y="49" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">"Yes, definitely!"</text></g>

<g class="q2"><rect x="14" y="66" width="180" height="22" rx="11" fill="#FFFFFF" stroke="#7F1D1D"/><text x="22" y="81" font-size="10" fill="#1F2937">"Faster than current?"</text></g>
<g class="a2"><rect x="200" y="66" width="105" height="22" rx="11" fill="#7F1D1D"/><text x="252" y="81" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">"Yes!"</text></g>

<g class="q3"><rect x="14" y="98" width="180" height="22" rx="11" fill="#FFFFFF" stroke="#7F1D1D"/><text x="22" y="113" font-size="10" fill="#1F2937">"Would you pay for it?"</text></g>
<g class="a3"><rect x="200" y="98" width="105" height="22" rx="11" fill="#7F1D1D"/><text x="252" y="113" text-anchor="middle" font-size="10" fill="#fff" font-weight="bold">"Sure!"</text></g>

<text x="160" y="142" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">3 yeses · zero learning</text>
</g>

<g class="bad-result" transform="translate(40 210)">
<rect width="320" height="80" rx="10" fill="#7F1D1D"/>
<text x="160" y="24" text-anchor="middle" font-size="13" fill="#FCA5A5" font-weight="bold">Shipped → 4% used it</text>
<text x="160" y="44" text-anchor="middle" font-size="10" fill="#FCA5A5">turns out users didn't think checkout was slow</text>
<text x="160" y="62" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">they were being polite</text>
</g>

<!-- RIGHT: good interview -->
<g transform="translate(380 30)">
<rect width="300" height="160" rx="10" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">AFTER · "tell me about the last time…"</text>

<g class="good-q"><rect x="14" y="36" width="270" height="40" rx="6" fill="#FFFFFF" stroke="#065F46"/><text x="24" y="54" font-size="10" fill="#1F2937">"Tell me about the last time</text><text x="24" y="68" font-size="10" fill="#1F2937">checkout felt frustrating."</text></g>

<g class="good-a"><rect x="14" y="84" width="270" height="62" rx="6" fill="#065F46"/><text x="24" y="100" font-size="10" fill="#fff">"Last Tuesday I tried to buy</text><text x="24" y="114" font-size="10" fill="#fff">tickets, the OTP took 38s,</text><text x="24" y="128" font-size="10" fill="#fff">card got declined twice,</text><text x="24" y="142" font-size="10" fill="#fff" font-weight="bold">I gave up and went to bed."</text></g>
</g>

<g class="good-result" transform="translate(380 210)">
<rect width="300" height="80" rx="10" fill="#065F46"/>
<text x="150" y="24" text-anchor="middle" font-size="13" fill="#A7F3D0" font-weight="bold">Real problem: OTP latency</text>
<text x="150" y="44" text-anchor="middle" font-size="10" fill="#A7F3D0">fixed it · 38% conversion lift</text>
<text x="150" y="62" text-anchor="middle" font-size="10" fill="#A7F3D0" font-style="italic">never about "faster"</text>
</g>

<g transform="translate(40 310)">
<rect width="640" height="80" rx="10" fill="#1F2937"/>
<text x="320" y="24" text-anchor="middle" font-size="12" fill="#FCD34D" font-weight="bold">Users tell you what they want · their behavior tells you what they need</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#9CA3AF">"Would you use…?" gets 'yes' from everyone politely lying</text>
<text x="320" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">"Tell me about the last time…" makes them re-live the actual moment</text>
</g>
</svg>
<div class="caption">Stop asking what users want. Ask them what they actually did, last Tuesday at 9pm.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
