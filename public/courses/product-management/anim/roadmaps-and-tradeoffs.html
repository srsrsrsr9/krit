<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Now / Next / Later</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--muted:#6B7280;--good:#10B981;--bad:#F43F5E;--warn:#F59E0B;--info:#0EA5E9}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{position:relative;width:100%;max-width:780px}
svg{width:100%;height:auto;display:block}
.cap{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;min-height:18px}
#rb{position:absolute;top:8px;right:8px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.78}
#rb:hover{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
<div class="wrap">
<svg viewBox="0 0 780 480" aria-label="A now-next-later roadmap. Items pile into the 'now' column until they overflow the container; the PM moves the surplus into 'next' to restore balance.">
  <rect width="780" height="480" fill="#FFF7ED"/>
  <text x="390" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">Roadmaps obey gravity.</text>
  <text x="390" y="48" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">A column has a bottom. So does a sprint.</text>

  <!-- Three columns: x positions 60-260, 280-480, 500-700 -->
  <!-- "Now" column has visible capacity line -->

  <!-- NOW -->
  <g>
    <rect id="nowFrame" x="60" y="80" width="200" height="340" rx="10" fill="#FFFFFF" stroke="#F43F5E" stroke-width="2.5"/>
    <text x="160" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#F43F5E">NOW</text>
    <text x="160" y="120" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">this sprint</text>
    <!-- Capacity line at y = 380 -->
    <line x1="60" y1="380" x2="260" y2="380" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="64" y="395" font-size="9" fill="#F43F5E" font-weight="700">CAPACITY</text>
  </g>

  <!-- NEXT -->
  <g>
    <rect x="280" y="80" width="200" height="340" rx="10" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
    <text x="380" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#F59E0B">NEXT</text>
    <text x="380" y="120" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">in queue</text>
  </g>

  <!-- LATER -->
  <g>
    <rect x="500" y="80" width="200" height="340" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <text x="600" y="106" text-anchor="middle" font-size="13" font-weight="700" fill="#0EA5E9">LATER</text>
    <text x="600" y="120" text-anchor="middle" font-size="9" fill="#6B7280" font-style="italic">someday</text>
  </g>

  <!-- Items get added dynamically -->
  <g id="items"></g>

  <!-- Caption / status box -->
  <g id="status">
    <rect id="statusBg" x="60" y="438" width="640" height="30" rx="8" fill="#1F2937" opacity="0"/>
    <text id="statusText" x="380" y="458" text-anchor="middle" font-size="12" fill="#FFFFFF" opacity="0"></text>
  </g>
</svg>
<div class="cap" id="cap">three columns. one capacity line.</div>
<button id="rb">reset</button>
</div>
</main>
<script>
(function(){
'use strict';
var svgNS='http://www.w3.org/2000/svg';
var prefersReduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var tms=[],rafs=[];
function after(ms,fn){tms.push(setTimeout(fn,prefersReduce?0:ms));}
function clearAll(){tms.forEach(clearTimeout);tms=[];rafs.forEach(cancelAnimationFrame);rafs=[];}
function ease(t){return 1-Math.pow(1-t,3);}

var ITEMS=[
  {l:'checkout fix',     c:'#F59E0B'},
  {l:'mobile nav',       c:'#F59E0B'},
  {l:'search v2',        c:'#F59E0B'},
  {l:'analytics events', c:'#F59E0B'},
  {l:'GDPR consent',     c:'#F59E0B'},
  {l:'A/B harness',      c:'#F59E0B'},
  {l:'paid landing',     c:'#F59E0B'}
];

// Each item is 32 high, gap 6, starts at y=140
var ITEM_H=32, GAP=6, START_Y=140, COL_TOP=140, CAP_Y=380;

function makeItem(item,col,idx){
  var x=col===0?70:(col===1?290:510);
  var y=START_Y+idx*(ITEM_H+GAP);
  var g=document.createElementNS(svgNS,'g');
  g.setAttribute('opacity','0');
  g.setAttribute('data-col',col);
  g.setAttribute('data-idx',idx);
  var r=document.createElementNS(svgNS,'rect');
  r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width',180);r.setAttribute('height',ITEM_H);
  r.setAttribute('rx',6);r.setAttribute('fill','#FEF3C7');r.setAttribute('stroke',item.c);r.setAttribute('stroke-width','1.5');
  var t=document.createElementNS(svgNS,'text');
  t.setAttribute('x',x+12);t.setAttribute('y',y+21);t.setAttribute('font-size','11');t.setAttribute('fill','#1F2937');t.setAttribute('font-weight','600');
  t.textContent=item.l;
  g.appendChild(r);g.appendChild(t);
  document.getElementById('items').appendChild(g);
  return {g:g,r:r,t:t,col:col,idx:idx,label:item.l};
}

function fadeIn(g,dur){
  var s=performance.now();
  function tick(now){
    var tt=Math.min((now-s)/dur,1);
    g.setAttribute('opacity',String(ease(tt)));
    if(tt<1)rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}
function moveItem(item,toCol,toIdx,dur,cb){
  var fromX=item.col===0?70:(item.col===1?290:510);
  var fromY=START_Y+item.idx*(ITEM_H+GAP);
  var toX=toCol===0?70:(toCol===1?290:510);
  var toY=START_Y+toIdx*(ITEM_H+GAP);
  var s=performance.now();
  function tick(now){
    var tt=Math.min((now-s)/dur,1),e=ease(tt);
    var x=fromX+(toX-fromX)*e,y=fromY+(toY-fromY)*e;
    item.r.setAttribute('x',x);item.r.setAttribute('y',y);
    item.t.setAttribute('x',x+12);item.t.setAttribute('y',y+21);
    if(tt<1)rafs.push(requestAnimationFrame(tick));
    else{item.col=toCol;item.idx=toIdx;if(cb)cb();}
  }
  rafs.push(requestAnimationFrame(tick));
}

function shakeNow(){
  var f=document.getElementById('nowFrame');
  var s=performance.now();
  function tick(now){
    var tt=Math.min((now-s)/520,1);
    var amp=8*(1-tt)*Math.sin(tt*Math.PI*5);
    f.setAttribute('transform','translate('+amp+',0)');
    if(tt<1)rafs.push(requestAnimationFrame(tick));else f.removeAttribute('transform');
  }
  rafs.push(requestAnimationFrame(tick));
}

function flashRed(item){
  var orig=item.r.getAttribute('fill');
  item.r.setAttribute('fill','#FEE2E2');
  after(700,function(){item.r.setAttribute('fill','#FEF3C7');});
}

function setStatus(text,bgColor){
  var bg=document.getElementById('statusBg'),tx=document.getElementById('statusText');
  bg.setAttribute('fill',bgColor||'#1F2937');
  tx.textContent=text;
  var s=performance.now();
  function tick(now){
    var tt=Math.min((now-s)/350,1),e=ease(tt);
    bg.setAttribute('opacity',String(0.94*e));tx.setAttribute('opacity',String(e));
    if(tt<1)rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}
function hideStatus(){
  var bg=document.getElementById('statusBg'),tx=document.getElementById('statusText');
  var s=performance.now(),sb=parseFloat(bg.getAttribute('opacity')||'0'),st=parseFloat(tx.getAttribute('opacity')||'0');
  function tick(now){
    var tt=Math.min((now-s)/300,1);
    bg.setAttribute('opacity',String(sb*(1-tt)));tx.setAttribute('opacity',String(st*(1-tt)));
    if(tt<1)rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}
function cap(t){document.getElementById('cap').textContent=t;}

var liveItems=[];

function run(){
  clearAll();
  document.getElementById('items').innerHTML='';
  liveItems=[];
  hideStatus();
  cap('three columns. one capacity line.');

  // Add 5 items into "now" cleanly  → fits within capacity (5 * 38 = 190; 140+190=330 < 380)
  for(var i=0;i<5;i++){
    (function(idx){
      after(700+idx*500,function(){
        var it=makeItem(ITEMS[idx],0,idx);
        liveItems.push(it);
        fadeIn(it.g,300);
      });
    })(i);
  }

  after(3700,function(){cap('"now" looks healthy. Then more requests arrive.');});

  // Add 2 more items → overflows past capacity line
  after(4400,function(){
    var it=makeItem(ITEMS[5],0,5);liveItems.push(it);fadeIn(it.g,300);
  });
  after(5100,function(){
    var it=makeItem(ITEMS[6],0,6);liveItems.push(it);fadeIn(it.g,300);
    flashRed(it);
    shakeNow();
  });

  after(5700,function(){
    cap('overflow. capacity is finite. always.');
    setStatus('"Can we just ship faster?"  No. People are not water.','#F43F5E');
  });

  // Try to ship faster: shake more, fail
  after(7800,function(){
    shakeNow();
    setStatus('Pick: cut scope, or move to NEXT.','#1F2937');
    cap('the only honest moves: cut, or defer.');
  });

  // Move the last 2 items to NEXT
  after(9300,function(){
    var it=liveItems[6];
    flashRed(it);
    moveItem(it,1,0,650,null);
  });
  after(9900,function(){
    var it=liveItems[5];
    flashRed(it);
    moveItem(it,1,1,650,null);
  });

  after(10800,function(){
    setStatus('balance restored. roadmap honest.','#10B981');
    cap('a roadmap is a promise about constraints, not wishes.');
  });

  after(13800,function(){
    hideStatus();
    after(700,run);
  });
}
document.getElementById('rb').addEventListener('click',function(){clearAll();run();});
run();
})();
</script>
</body>
</html>
