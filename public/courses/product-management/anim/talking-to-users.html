<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talking to Users</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--muted:#6B7280;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{position:relative;width:100%;max-width:780px}
svg{width:100%;height:auto;display:block}
.cap{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;min-height:18px}
#rb{position:absolute;top:8px;right:8px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.78}
#rb:hover{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
<div class="wrap">
<svg viewBox="0 0 780 520" aria-label="Two side-by-side flows: a bad PM translates user request literally and ships nothing, while a good PM digs deeper, finds the real problem, and ships a fix">
  <rect width="780" height="520" fill="#FFF7ED"/>

  <!-- Title -->
  <text x="390" y="28" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">What the user said vs. what they meant.</text>

  <!-- Top: shared user bubble -->
  <g id="userBubble" opacity="0">
    <rect x="195" y="50" width="390" height="58" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
    <text x="390" y="76" text-anchor="middle" font-size="13" fill="#1F2937" font-weight="600">"I want a faster checkout."</text>
    <text x="390" y="96" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">— a user, in an interview</text>
    <!-- Bubble tail -->
    <path d="M 380 108 L 390 122 L 400 108 Z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
  </g>

  <!-- Divider -->
  <line x1="390" y1="140" x2="390" y2="490" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="3 4"/>

  <!-- LEFT: bad PM -->
  <g>
    <text x="195" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#F43F5E">BAD PM · takes it literally</text>

    <!-- PM avatar -->
    <g id="badPM" opacity="0">
      <circle cx="195" cy="195" r="22" fill="#FEE2E2" stroke="#F43F5E" stroke-width="2"/>
      <text x="195" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#F43F5E">PM</text>
    </g>

    <!-- Mapping arrow -->
    <g id="badArrow" opacity="0">
      <line x1="195" y1="225" x2="195" y2="275" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"/>
      <polygon points="195,282 189,272 201,272" fill="#F43F5E"/>
      <text x="195" y="255" text-anchor="middle" font-size="10" fill="#F43F5E" font-style="italic">→</text>
    </g>

    <!-- Bad output -->
    <g id="badOut" opacity="0">
      <rect x="55" y="295" width="280" height="64" rx="10" fill="#FEE2E2" stroke="#F43F5E" stroke-width="2"/>
      <text x="195" y="320" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">"Build faster checkout"</text>
      <text x="195" y="340" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">vague spec, 6-week build</text>
    </g>

    <!-- Result tag -->
    <g id="badShip" opacity="0">
      <rect x="125" y="400" width="140" height="38" rx="19" fill="#F43F5E"/>
      <text x="195" y="424" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">DOESN'T SHIP</text>
    </g>
  </g>

  <!-- RIGHT: good PM -->
  <g>
    <text x="585" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#10B981">GOOD PM · asks "tell me more"</text>

    <!-- PM avatar -->
    <g id="goodPM" opacity="0">
      <circle cx="585" cy="195" r="22" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <text x="585" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#10B981">PM</text>
    </g>

    <!-- Question bubble -->
    <g id="probe" opacity="0">
      <rect x="430" y="232" width="310" height="42" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
      <text x="585" y="258" text-anchor="middle" font-size="11" fill="#1F2937" font-style="italic">"tell me about the last time it felt slow…"</text>
    </g>

    <!-- Reveal -->
    <g id="reveal" opacity="0">
      <rect x="430" y="285" width="310" height="64" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="585" y="306" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="700">the real problem:</text>
      <text x="585" y="324" text-anchor="middle" font-size="11" fill="#1F2937">3-step form · validation lag (2.4s)</text>
      <text x="585" y="340" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">user thinks form is broken, abandons</text>
    </g>

    <!-- Good output -->
    <g id="goodOut" opacity="0">
      <rect x="445" y="362" width="280" height="40" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
      <text x="585" y="387" text-anchor="middle" font-size="12" font-weight="700" fill="#1F2937">"Remove validation lag"</text>
    </g>

    <!-- Result tag -->
    <g id="goodShip" opacity="0">
      <rect x="515" y="420" width="140" height="38" rx="19" fill="#10B981"/>
      <text x="585" y="444" text-anchor="middle" font-size="13" fill="#FFFFFF" font-weight="700">SHIPS IN 3 DAYS</text>
    </g>
  </g>

  <!-- Footer takeaway -->
  <g id="footer" opacity="0">
    <rect x="60" y="478" width="660" height="30" rx="8" fill="#1F2937"/>
    <text x="390" y="498" text-anchor="middle" font-size="12" fill="#FFFFFF">Users describe solutions. PMs are paid to find the problem.</text>
  </g>
</svg>
<div class="cap" id="cap">a user says one thing…</div>
<button id="rb">reset</button>
</div>
</main>
<script>
(function(){
'use strict';
var prefersReduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var tms=[],rafs=[];
function after(ms,fn){tms.push(setTimeout(fn,prefersReduce?0:ms));}
function clearAll(){tms.forEach(clearTimeout);tms=[];rafs.forEach(cancelAnimationFrame);rafs=[];}
function ease(t){return 1-Math.pow(1-t,3);}
function fadeIn(id,dur){
  var el=document.getElementById(id);if(!el)return;
  var s=performance.now();
  function tick(now){
    var t=Math.min((now-s)/dur,1);
    el.setAttribute('opacity',String(ease(t)));
    if(t<1)rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}
function fadeOut(id,dur){
  var el=document.getElementById(id);if(!el)return;
  var s=performance.now();
  function tick(now){
    var t=Math.min((now-s)/dur,1);
    el.setAttribute('opacity',String(1-ease(t)));
    if(t<1)rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}
function reset(){
  ['userBubble','badPM','badArrow','badOut','badShip','goodPM','probe','reveal','goodOut','goodShip','footer'].forEach(function(id){
    var el=document.getElementById(id);if(el)el.setAttribute('opacity','0');
  });
}
function cap(t){document.getElementById('cap').textContent=t;}

function run(){
  clearAll();reset();
  cap('a user says one thing…');
  after(400,function(){fadeIn('userBubble',500);});
  after(1400,function(){cap('the bad PM transcribes literally');fadeIn('badPM',300);});
  after(2100,function(){fadeIn('badArrow',300);});
  after(2700,function(){fadeIn('badOut',400);});
  after(3700,function(){fadeIn('badShip',400);});

  after(5400,function(){cap('the good PM asks one more question');fadeIn('goodPM',300);});
  after(6200,function(){fadeIn('probe',400);});
  after(7400,function(){cap('and the actual problem surfaces');fadeIn('reveal',500);});
  after(9000,function(){fadeIn('goodOut',400);});
  after(10000,function(){fadeIn('goodShip',400);});
  after(11000,function(){fadeIn('footer',500);cap('one extra question separates shipping from spinning');});

  after(14500,function(){
    fadeOut('userBubble',400);fadeOut('badPM',400);fadeOut('badArrow',400);fadeOut('badOut',400);fadeOut('badShip',400);
    fadeOut('goodPM',400);fadeOut('probe',400);fadeOut('reveal',400);fadeOut('goodOut',400);fadeOut('goodShip',400);fadeOut('footer',400);
    after(900,run);
  });
}
document.getElementById('rb').addEventListener('click',function(){clearAll();run();});
run();
})();
</script>
</body>
</html>
