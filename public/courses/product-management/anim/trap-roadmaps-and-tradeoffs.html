<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: now/now/now roadmap</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes overflow{from{height:240px;background:#FECACA}to{height:340px;background:#7F1D1D}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.card{animation:drop .35s cubic-bezier(0.22,0.61,0.36,1) both}
.now-col{animation:overflow 1s ease 5s forwards}
.shake-it{animation:shake .25s ease 6s 3 both}
.burn{animation:fade .5s ease 7s both}
.fix-card{animation:drop .4s ease both}
.split{animation:fade .5s ease 9.5s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A roadmap with three columns Now Next Later overflowing as everything gets pulled into Now, vs the polite-no template that holds the line">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- BAD: now/now/now -->
<g class="shake-it" transform="translate(40 30)">
<text x="160" y="14" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">BEFORE · everything to "now"</text>
<g class="now-col">
<rect width="100" height="240" rx="6" fill="#FECACA" stroke="#7F1D1D"/>
<text x="50" y="22" text-anchor="middle" font-size="11" fill="#7F1D1D" font-weight="bold">Now</text>
<g class="card" style="animation-delay:.3s"><rect x="6" y="32" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="46" text-anchor="middle" font-size="9" fill="#fff">Auth rebuild</text></g>
<g class="card" style="animation-delay:.6s"><rect x="6" y="58" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="72" text-anchor="middle" font-size="9" fill="#fff">SSO migration</text></g>
<g class="card" style="animation-delay:.9s"><rect x="6" y="84" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="98" text-anchor="middle" font-size="9" fill="#fff">Bug bash Q2</text></g>
<g class="card" style="animation-delay:1.2s"><rect x="6" y="110" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="124" text-anchor="middle" font-size="9" fill="#fff">CEO dashboard</text></g>
<g class="card" style="animation-delay:1.5s"><rect x="6" y="136" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="150" text-anchor="middle" font-size="9" fill="#fff">Launch redesign</text></g>
<g class="card" style="animation-delay:1.8s"><rect x="6" y="162" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="176" text-anchor="middle" font-size="9" fill="#fff">Sales feature ask</text></g>
<g class="card" style="animation-delay:2.1s"><rect x="6" y="188" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="202" text-anchor="middle" font-size="9" fill="#fff">Support backlog</text></g>
<g class="card" style="animation-delay:2.4s"><rect x="6" y="214" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="228" text-anchor="middle" font-size="9" fill="#fff">CFO compliance</text></g>
<g class="card" style="animation-delay:2.7s"><rect x="6" y="240" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="254" text-anchor="middle" font-size="9" fill="#fff">Regulatory ask</text></g>
<g class="card" style="animation-delay:3.0s"><rect x="6" y="266" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="280" text-anchor="middle" font-size="9" fill="#fff">Migration v2</text></g>
<g class="card" style="animation-delay:3.3s"><rect x="6" y="292" width="88" height="22" rx="3" fill="#7F1D1D"/><text x="50" y="306" text-anchor="middle" font-size="9" fill="#fff">Q3 carryover</text></g>
</g>

<rect x="110" width="100" height="240" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-dasharray="3 2"/>
<text x="160" y="22" text-anchor="middle" font-size="11" fill="#9CA3AF" font-weight="bold">Next</text>
<text x="160" y="130" text-anchor="middle" font-size="9" fill="#9CA3AF" font-style="italic">empty</text>

<rect x="220" width="100" height="240" rx="6" fill="#F9FAFB" stroke="#9CA3AF" stroke-dasharray="3 2"/>
<text x="270" y="22" text-anchor="middle" font-size="11" fill="#9CA3AF" font-weight="bold">Later</text>
<text x="270" y="130" text-anchor="middle" font-size="9" fill="#9CA3AF" font-style="italic">empty</text>
</g>

<!-- BURN OUT -->
<g class="burn" transform="translate(40 290)">
<rect width="320" height="100" rx="10" fill="#7F1D1D"/>
<text x="160" y="24" text-anchor="middle" font-size="12" fill="#FCA5A5" font-weight="bold">Team velocity over Q3</text>
<polyline points="20,40 60,42 100,46 140,52 180,62 220,76 260,90 300,90" stroke="#FCA5A5" stroke-width="2" fill="none"/>
<text x="160" y="78" text-anchor="middle" font-size="10" fill="#FCA5A5">↓ throughput</text>
<text x="160" y="92" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">2 senior engineers quit</text>
</g>

<!-- FIX -->
<g transform="translate(380 30)">
<text x="150" y="14" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">AFTER · polite-no held the line</text>

<rect width="100" height="320" rx="6" fill="#A7F3D0" stroke="#065F46"/>
<text x="50" y="22" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Now</text>
<g class="fix-card" style="animation-delay:7.5s"><rect x="6" y="32" width="88" height="22" rx="3" fill="#065F46"/><text x="50" y="46" text-anchor="middle" font-size="9" fill="#fff">Auth rebuild</text></g>
<g class="fix-card" style="animation-delay:7.8s"><rect x="6" y="58" width="88" height="22" rx="3" fill="#065F46"/><text x="50" y="72" text-anchor="middle" font-size="9" fill="#fff">CFO compliance</text></g>
<g class="fix-card" style="animation-delay:8.1s"><rect x="6" y="84" width="88" height="22" rx="3" fill="#065F46"/><text x="50" y="98" text-anchor="middle" font-size="9" fill="#fff">Bug bash</text></g>

<rect x="110" width="100" height="320" rx="6" fill="#FEF3C7" stroke="#92400E"/>
<text x="160" y="22" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Next</text>
<g class="fix-card" style="animation-delay:8.4s"><rect x="116" y="32" width="88" height="22" rx="3" fill="#92400E"/><text x="160" y="46" text-anchor="middle" font-size="9" fill="#fff">SSO migration</text></g>
<g class="fix-card" style="animation-delay:8.7s"><rect x="116" y="58" width="88" height="22" rx="3" fill="#92400E"/><text x="160" y="72" text-anchor="middle" font-size="9" fill="#fff">Launch redesign</text></g>

<rect x="220" width="100" height="320" rx="6" fill="#DBEAFE" stroke="#1E40AF"/>
<text x="270" y="22" text-anchor="middle" font-size="11" fill="#1E40AF" font-weight="bold">Later</text>
<g class="fix-card" style="animation-delay:9s"><rect x="226" y="32" width="88" height="22" rx="3" fill="#1E40AF"/><text x="270" y="46" text-anchor="middle" font-size="9" fill="#fff">CEO dashboard</text></g>
<g class="fix-card" style="animation-delay:9.3s"><rect x="226" y="58" width="88" height="22" rx="3" fill="#1E40AF"/><text x="270" y="72" text-anchor="middle" font-size="9" fill="#fff">Migration v2</text></g>
</g>

<g class="split" transform="translate(380 360)">
<text x="150" y="20" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">3 in Now · 2 in Next · 2 in Later · 6 polite-no'd</text>
</g>
</svg>
<div class="caption">"No" is the only thing standing between a roadmap and burnout.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
