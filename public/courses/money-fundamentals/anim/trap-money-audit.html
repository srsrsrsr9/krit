<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: dashboard delusion (money)</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.05)}100%{opacity:1;transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dim{0%,75%{opacity:1}100%{opacity:.18}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.app{animation:pop .35s cubic-bezier(0.22,0.61,0.36,1) both,dim 12s linear forwards}
.label{animation:fade .4s ease both,dim 12s linear forwards}
.simple-note{animation:fade .5s ease 6s both}
.entry{animation:fade .4s ease both}
</style>
</head>
<body>
<main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="Six budgeting apps installed and abandoned versus a three-line plain-text note kept for six weeks">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- LEFT: 6 budgeting apps -->
<g transform="translate(40 30)">
<rect width="320" height="345" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#1F2937" font-weight="bold">Saturday night spree</text>

<g class="app" style="animation-delay:.5s,4.5s"><rect x="165" y="40" width="135" height="60" rx="8" fill="#FECACA" stroke="#7F1D1D"/><text x="232" y="62" text-anchor="middle" font-size="11" fill="#7F1D1D" font-weight="bold">YNAB</text><text x="232" y="78" text-anchor="middle" font-size="9" fill="#7F1D1D">budgeting trial</text><text x="232" y="92" text-anchor="middle" font-size="9" fill="#7F1D1D">$15/mo</text></g>
<g class="app" style="animation-delay:.8s,5.0s"><rect x="20" y="110" width="135" height="60" rx="8" fill="#A7F3D0" stroke="#065F46"/><text x="87" y="132" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">Notion</text><text x="87" y="148" text-anchor="middle" font-size="9" fill="#065F46">22 widgets</text><text x="87" y="162" text-anchor="middle" font-size="9" fill="#065F46">color-coded</text></g>
<g class="app" style="animation-delay:1.1s,5.5s"><rect x="165" y="110" width="135" height="60" rx="8" fill="#FED7AA" stroke="#9A3412"/><text x="232" y="132" text-anchor="middle" font-size="11" fill="#9A3412" font-weight="bold">Google Sheets</text><text x="232" y="148" text-anchor="middle" font-size="9" fill="#9A3412">templates × 14</text><text x="232" y="162" text-anchor="middle" font-size="9" fill="#9A3412">conditional fmt</text></g>
<g class="app" style="animation-delay:1.4s,6.0s"><rect x="20" y="180" width="135" height="60" rx="8" fill="#DDD6FE" stroke="#5B21B6"/><text x="87" y="202" text-anchor="middle" font-size="11" fill="#5B21B6" font-weight="bold">ETMoney</text><text x="87" y="218" text-anchor="middle" font-size="9" fill="#5B21B6">tracking SIP</text><text x="87" y="232" text-anchor="middle" font-size="9" fill="#5B21B6">+ 4 graphs</text></g>
<g class="app" style="animation-delay:1.7s,6.5s"><rect x="165" y="180" width="135" height="60" rx="8" fill="#FCE7F3" stroke="#9D174D"/><text x="232" y="202" text-anchor="middle" font-size="11" fill="#9D174D" font-weight="bold">FinTrack</text><text x="232" y="218" text-anchor="middle" font-size="9" fill="#9D174D">subs counter</text><text x="232" y="232" text-anchor="middle" font-size="9" fill="#9D174D">14-day trial</text></g>

<g class="label" style="animation-delay:2.5s,7s"><rect x="80" y="265" width="160" height="22" rx="4" fill="#1F2937"/><text x="160" y="280" text-anchor="middle" font-size="10" fill="#FCD34D" font-weight="bold">CHECKED MONDAY</text></g>
<g class="label" style="animation-delay:3.5s,7.5s"><rect x="60" y="295" width="200" height="22" rx="4" fill="#1F2937"/><text x="160" y="310" text-anchor="middle" font-size="10" fill="#FBBF24" font-weight="bold">FORGOT BY WEDNESDAY</text></g>
<g class="label" style="animation-delay:4.5s,8s"><rect x="50" y="320" width="220" height="22" rx="4" fill="#7F1D1D"/><text x="160" y="335" text-anchor="middle" font-size="10" fill="#FCA5A5" font-weight="bold">SUBSCRIPTIONS STILL CHARGED</text></g>
</g>

<!-- RIGHT: 3-line plain note -->
<g class="simple-note" transform="translate(380 30)">
<rect width="300" height="345" rx="10" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>
<rect width="300" height="28" rx="10" fill="#10B981"/>
<text x="150" y="20" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">money.txt</text>

<g class="entry" style="animation-delay:6.5s"><text x="20" y="60" font-size="10" fill="#6B7280">— sun, week 1 —</text><text x="20" y="76" font-family="ui-monospace,monospace" font-size="11">net worth: ₹4.2L · burn: ₹85k · save: 12%</text></g>
<g class="entry" style="animation-delay:7.5s"><text x="20" y="105" font-size="10" fill="#6B7280">— sun, week 2 —</text><text x="20" y="121" font-family="ui-monospace,monospace" font-size="11">net worth: ₹4.4L · burn: ₹83k · save: 15%</text></g>
<g class="entry" style="animation-delay:8.5s"><text x="20" y="150" font-size="10" fill="#6B7280">— sun, week 3 —</text><text x="20" y="166" font-family="ui-monospace,monospace" font-size="11">net worth: ₹4.5L · burn: ₹81k · save: 17%</text></g>
<g class="entry" style="animation-delay:9.5s"><text x="20" y="195" font-size="10" fill="#6B7280">— sun, week 4 —</text><text x="20" y="211" font-family="ui-monospace,monospace" font-size="11">net worth: ₹4.7L · burn: ₹78k · save: 19%</text></g>
<g class="entry" style="animation-delay:10.5s"><text x="20" y="240" font-size="10" fill="#6B7280">— sun, week 5 —</text><text x="20" y="256" font-family="ui-monospace,monospace" font-size="11">net worth: ₹4.9L · burn: ₹78k · save: 20%</text></g>
<g class="entry" style="animation-delay:11.5s"><text x="20" y="285" font-size="10" fill="#6B7280">— sun, week 6 —</text><text x="20" y="301" font-family="ui-monospace,monospace" font-size="11">net worth: ₹5.1L · burn: ₹76k · save: 22%</text><circle cx="270" cy="296" r="9" fill="#10B981"/><path d="M265 296 l3 3 l6 -7" stroke="#fff" stroke-width="2" fill="none"/></g>

<text x="150" y="328" text-anchor="middle" font-size="11" fill="#065F46" font-style="italic">2 minutes a week, 6 weeks straight</text>
</g>
</svg>
<div class="caption">The dashboard delusion is procrastination wearing the costume of productivity.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body>
</html>
