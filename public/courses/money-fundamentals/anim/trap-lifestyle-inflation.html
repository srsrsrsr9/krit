<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EMI is lifestyle inflation on contract</title>
<style>
  :root {
    --bg: #FFF7ED;
    --ink: #1F2937;
    --muted: #6B7280;
    --paper: #FFFFFF;
    --good: #10B981;
    --good-soft: #ECFDF5;
    --bad: #F43F5E;
    --bad-soft: #FEE2E2;
    --accent: #F59E0B;
    --indigo: #0EA5E9;
    --line: #E5E7EB;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Inter", sans-serif;
  }
  .stage {
    width: 100%; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 760px; }
  .frame {
    width: 100%;
    aspect-ratio: 16 / 10;
    display: block;
  }
  .caption {
    text-align: center;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* Stage timing: total 13.5s loop */
  .scene { opacity: 0; }
  .s1 { animation: fade 13.5s cubic-bezier(0.22,0.61,0.36,1) infinite; animation-delay: 0s; }
  .s2 { animation: fade 13.5s cubic-bezier(0.22,0.61,0.36,1) infinite; animation-delay: 3.4s; }
  .s3 { animation: fade 13.5s cubic-bezier(0.22,0.61,0.36,1) infinite; animation-delay: 7s; }
  @keyframes fade {
    0%   { opacity: 0; }
    3%   { opacity: 1; }
    23%  { opacity: 1; }
    27%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .pop { transform-origin: center; transform: scale(.92); animation: pop 13.5s cubic-bezier(0.22,0.61,0.36,1) infinite; }
  @keyframes pop {
    0%, 100% { transform: scale(.92); }
    4%, 22%  { transform: scale(1); }
  }

  .tickerNum { animation: tick 3.4s steps(34) infinite; animation-delay: 3.5s; animation-iteration-count: 1; }
  /* the calculator number is animated by JS for accuracy */

  .gapBar { transform: scaleY(0); transform-origin: bottom; animation: rise 13.5s cubic-bezier(0.22,0.61,0.36,1) infinite; animation-delay: 8.5s; }
  @keyframes rise {
    0%, 60%  { transform: scaleY(0); }
    66%, 96% { transform: scaleY(1); }
    100%     { transform: scaleY(0); }
  }

  .gridLine { stroke-dasharray: 4 6; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .scene { opacity: 1; }
    .pop { transform: none; }
    .gapBar { transform: scaleY(1); }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg class="frame" viewBox="0 0 760 475" aria-label="Animation showing how a 35,000 rupee monthly EMI accumulates to 21 lakh over 5 years, while the same amount invested in a Nifty index would grow to roughly 28 lakh.">
      <!-- background card -->
      <rect x="20" y="20" width="720" height="435" rx="18" fill="#FFFFFF" stroke="#F1E9D7" stroke-width="1.5"/>
      <text x="40" y="52" font-size="14" font-weight="700" fill="#1F2937">EMI vs the same money, invested</text>
      <text x="40" y="72" font-size="12" fill="#6B7280">A 5-year story in three frames.</text>

      <!-- ============ SCENE 1: friendly green EMI badge ============ -->
      <g class="scene s1">
        <g class="pop">
          <rect x="170" y="140" width="420" height="200" rx="22" fill="#ECFDF5" stroke="#10B981" stroke-width="2.5"/>
          <text x="380" y="190" text-anchor="middle" font-size="14" font-weight="600" fill="#047857">Monthly EMI</text>
          <text x="380" y="265" text-anchor="middle" font-size="64" font-weight="800" fill="#10B981" font-family="ui-monospace, monospace">₹35,000</text>
          <text x="380" y="300" text-anchor="middle" font-size="14" fill="#047857">"totally manageable!"</text>
          <!-- thumbs up -->
          <g transform="translate(540,170)">
            <circle r="22" fill="#10B981"/>
            <path d="M -8 4 L -8 -4 L -2 -4 L -2 -10 L 4 -10 L 4 -4 L 10 -4 L 8 8 L -6 8 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1" stroke-linejoin="round"/>
          </g>
        </g>
        <text x="380" y="395" text-anchor="middle" font-size="13" fill="#6B7280">Frame 1 · the salesman's number</text>
      </g>

      <!-- ============ SCENE 2: calculator running ============ -->
      <g class="scene s2">
        <!-- calculator body -->
        <rect x="220" y="120" width="320" height="240" rx="16" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/>
        <rect x="240" y="140" width="280" height="60" rx="8" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
        <text id="calcDisplay" x="510" y="183" text-anchor="end" font-size="30" font-weight="700" fill="#1F2937" font-family="ui-monospace, monospace">₹0</text>

        <!-- the math line -->
        <text x="380" y="232" text-anchor="middle" font-size="13" fill="#6B7280" font-family="ui-monospace, monospace">
          ₹35,000 × 60 months
        </text>

        <!-- buttons (decorative) -->
        <g fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1">
          <rect x="250" y="252" width="40" height="32" rx="6"/>
          <rect x="298" y="252" width="40" height="32" rx="6"/>
          <rect x="346" y="252" width="40" height="32" rx="6"/>
          <rect x="394" y="252" width="40" height="32" rx="6"/>
          <rect x="442" y="252" width="40" height="32" rx="6"/>
          <rect x="250" y="292" width="40" height="32" rx="6"/>
          <rect x="298" y="292" width="40" height="32" rx="6"/>
          <rect x="346" y="292" width="40" height="32" rx="6"/>
          <rect x="394" y="292" width="40" height="32" rx="6"/>
          <rect x="442" y="292" width="40" height="32" rx="6" fill="#F59E0B" stroke="#F59E0B"/>
          <text x="462" y="313" text-anchor="middle" font-size="14" font-weight="800" fill="#FFFFFF">=</text>
        </g>

        <!-- result band -->
        <g>
          <rect x="220" y="370" width="320" height="0" rx="8" fill="#FEE2E2" opacity="0">
            <animate attributeName="height" values="0;40;40;40" keyTimes="0;0.6;0.95;1" dur="3.6s" begin="3.5s" fill="freeze" repeatCount="1"/>
            <animate attributeName="opacity" values="0;1;1;1" keyTimes="0;0.6;0.95;1" dur="3.6s" begin="3.5s" fill="freeze" repeatCount="1"/>
          </rect>
        </g>

        <text x="380" y="425" text-anchor="middle" font-size="13" fill="#6B7280">Frame 2 · the math the brochure skips</text>
      </g>

      <!-- ============ SCENE 3: comparison ============ -->
      <g class="scene s3">
        <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Same ₹35K/month, two destinations</text>

        <!-- chart frame -->
        <line x1="100" y1="360" x2="660" y2="360" stroke="#1F2937" stroke-width="2"/>
        <line x1="100" y1="160" x2="100" y2="360" stroke="#1F2937" stroke-width="2"/>

        <!-- gridlines -->
        <line x1="100" y1="220" x2="660" y2="220" stroke="#E5E7EB" stroke-width="1" class="gridLine"/>
        <line x1="100" y1="280" x2="660" y2="280" stroke="#E5E7EB" stroke-width="1" class="gridLine"/>

        <!-- y-axis labels -->
        <text x="92" y="364" text-anchor="end" font-size="10" fill="#6B7280" font-family="ui-monospace, monospace">0</text>
        <text x="92" y="284" text-anchor="end" font-size="10" fill="#6B7280" font-family="ui-monospace, monospace">14L</text>
        <text x="92" y="224" text-anchor="end" font-size="10" fill="#6B7280" font-family="ui-monospace, monospace">28L</text>

        <!-- bar A: EMI total 21L -->
        <g>
          <rect x="200" y="360" width="120" height="150" rx="6" fill="#F43F5E" opacity="0.85" class="gapBar"/>
          <text x="260" y="380" text-anchor="middle" font-size="11" fill="#6B7280">EMI paid out</text>
          <text x="260" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#F43F5E" font-family="ui-monospace, monospace">₹21 L</text>
        </g>

        <!-- bar B: Nifty 28L -->
        <g>
          <rect x="450" y="360" width="120" height="200" rx="6" fill="#10B981" opacity="0.9" class="gapBar"/>
          <text x="510" y="380" text-anchor="middle" font-size="11" fill="#6B7280">Nifty index, same SIP</text>
          <text x="510" y="395" text-anchor="middle" font-size="13" font-weight="700" fill="#10B981" font-family="ui-monospace, monospace">₹28 L+</text>
        </g>

        <!-- bar labels at top after rise -->
        <text x="260" y="200" text-anchor="middle" font-size="11" fill="#9CA3AF">spent</text>
        <text x="510" y="150" text-anchor="middle" font-size="11" fill="#9CA3AF">grown</text>

        <!-- gap bracket -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.85;1" dur="13.5s" repeatCount="indefinite"/>
          <line x1="335" y1="160" x2="435" y2="160" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="3 4"/>
          <text x="385" y="148" text-anchor="middle" font-size="11" font-weight="700" fill="#F43F5E">~₹7L gap</text>
        </g>
      </g>
    </svg>
    <div class="caption">An EMI is a salary you've already promised. The same rupees, left free, compound elsewhere.</div>
  </div>
</main>
<script>
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    var d = document.getElementById('calcDisplay');
    if (d) d.textContent = '₹21,00,000';
    return;
  }
  var display = document.getElementById('calcDisplay');
  if (!display) return;
  var loopMs = 13500;
  var startOffset = 3500; // when scene 2 fades in
  var rampMs = 2400;
  var target = 2100000;
  function format(n){
    n = Math.round(n);
    var s = n.toString();
    // Indian comma format
    if (s.length <= 3) return '₹' + s;
    var last3 = s.slice(-3);
    var rest = s.slice(0, -3);
    var withCommas = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
    return '₹' + withCommas + ',' + last3;
  }
  function frame(){
    var t = (performance.now() % loopMs);
    var local = t - startOffset;
    var v = 0;
    if (local <= 0) v = 0;
    else if (local >= rampMs) v = target;
    else {
      var p = local / rampMs;
      // ease-out cubic
      p = 1 - Math.pow(1 - p, 3);
      v = target * p;
    }
    display.textContent = format(v);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
