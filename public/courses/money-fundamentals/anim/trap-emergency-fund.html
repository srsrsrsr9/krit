<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Credit card limit ≠ buffer</title>
<style>
  :root {
    --bg: #FFF7ED;
    --ink: #1F2937;
    --muted: #6B7280;
    --good: #10B981;
    --good-soft: #ECFDF5;
    --bad: #F43F5E;
    --bad-soft: #FEE2E2;
    --accent: #F59E0B;
    --indigo: #0EA5E9;
    --line: #E5E7EB;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Inter", sans-serif;
  }
  .stage {
    width: 100%; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 760px; }
  .frame { width: 100%; aspect-ratio: 16/10; display: block; }
  .caption {
    text-align: center;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }

  .scene { opacity: 0; }
  /* Total loop: 14s. Three scenes: 0-4s, 4-9s, 9-14s */
  .s1 { animation: fadeA 14s cubic-bezier(0.22,0.61,0.36,1) infinite; }
  .s2 { animation: fadeB 14s cubic-bezier(0.22,0.61,0.36,1) infinite; }
  .s3 { animation: fadeC 14s cubic-bezier(0.22,0.61,0.36,1) infinite; }
  @keyframes fadeA {
    0%, 25%   { opacity: 1; }
    30%, 100% { opacity: 0; }
  }
  @keyframes fadeB {
    0%, 28%    { opacity: 0; }
    32%, 60%   { opacity: 1; }
    65%, 100%  { opacity: 0; }
  }
  @keyframes fadeC {
    0%, 63%    { opacity: 0; }
    68%, 96%   { opacity: 1; }
    100%       { opacity: 0; }
  }

  .relief {
    transform-origin: 380px 230px;
    animation: reliefPop 14s cubic-bezier(0.22,0.61,0.36,1) infinite;
  }
  @keyframes reliefPop {
    0%, 30% { transform: scale(.85); opacity: 0; }
    35%     { transform: scale(1.06); opacity: 1; }
    42%, 60%{ transform: scale(1); opacity: 1; }
    65%, 100%{ transform: scale(1); opacity: 0; }
  }

  /* compounding bar grows during scene 2 */
  .compound {
    transform-origin: bottom;
    transform: scaleY(0);
    animation: grow 14s cubic-bezier(0.22,0.61,0.36,1) infinite;
  }
  @keyframes grow {
    0%, 38% { transform: scaleY(0); }
    60%     { transform: scaleY(1); }
    62%, 100% { transform: scaleY(1); }
  }

  .gridLine { stroke-dasharray: 3 5; }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .scene { opacity: 1; }
    .compound { transform: scaleY(1); }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg class="frame" viewBox="0 0 760 475" aria-label="Animation showing how using a credit card to cover a 2 lakh medical bill compounds at 36 percent APR to 2.7 lakh in 12 months, while a 2 lakh liquid fund buffer would have absorbed the bill at zero ongoing cost.">
      <rect x="20" y="20" width="720" height="435" rx="18" fill="#FFFFFF" stroke="#F1E9D7" stroke-width="1.5"/>
      <text x="40" y="52" font-size="14" font-weight="700">A ₹2 lakh medical bill, two ways to absorb it</text>
      <text x="40" y="72" font-size="12" fill="#6B7280">Buffer ≠ borrow.</text>

      <!-- ============ SCENE 1: bill arrives, no buffer, card swoops in ============ -->
      <g class="scene s1">
        <!-- person silhouette -->
        <g transform="translate(150,260)">
          <circle cx="0" cy="-30" r="22" fill="#FCD34D"/>
          <rect x="-26" y="-8" width="52" height="58" rx="14" fill="#0EA5E9"/>
          <!-- worried face -->
          <circle cx="-7" cy="-32" r="2" fill="#1F2937"/>
          <circle cx="7" cy="-32" r="2" fill="#1F2937"/>
          <path d="M -7 -22 Q 0 -26 7 -22" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
        </g>
        <text x="150" y="345" text-anchor="middle" font-size="11" fill="#6B7280">no buffer</text>

        <!-- bill -->
        <g transform="translate(380,200)">
          <rect x="-90" y="-50" width="180" height="120" rx="8" fill="#FFFFFF" stroke="#F43F5E" stroke-width="2.5"/>
          <text x="0" y="-25" text-anchor="middle" font-size="11" fill="#F43F5E" font-weight="600">MEDICAL BILL</text>
          <line x1="-70" y1="-12" x2="70" y2="-12" stroke="#FEE2E2" stroke-width="1"/>
          <text x="0" y="20" text-anchor="middle" font-size="32" font-weight="800" fill="#F43F5E" font-family="ui-monospace, monospace">₹2,00,000</text>
          <text x="0" y="48" text-anchor="middle" font-size="10" fill="#6B7280">due now</text>
        </g>

        <!-- credit card swoops in from right -->
        <g>
          <g transform="translate(620,250)">
            <rect x="-65" y="-40" width="130" height="80" rx="10" fill="#1F2937"/>
            <rect x="-55" y="-22" width="22" height="16" rx="3" fill="#F59E0B"/>
            <text x="-55" y="22" font-size="9" fill="#FFFFFF" font-family="ui-monospace, monospace">**** 4521</text>
            <text x="-55" y="-30" font-size="8" fill="#9CA3AF">LIMIT ₹3L</text>
            <animateTransform attributeName="transform" type="translate" values="820,250; 620,250; 520,230" keyTimes="0;0.5;1" dur="2s" begin="0.4s" fill="freeze" repeatCount="1"/>
          </g>
        </g>

        <text x="380" y="395" text-anchor="middle" font-size="13" fill="#6B7280">Frame 1 · the card "saves" the day</text>
      </g>

      <!-- ============ SCENE 2: APR ticker + compounding ============ -->
      <g class="scene s2">
        <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="700">Now the meter starts</text>

        <!-- APR pill -->
        <g transform="translate(380,140)">
          <rect x="-70" y="-18" width="140" height="36" rx="18" fill="#FEE2E2" stroke="#F43F5E" stroke-width="2"/>
          <text x="0" y="6" text-anchor="middle" font-size="15" font-weight="800" fill="#F43F5E" font-family="ui-monospace, monospace">36% APR</text>
        </g>

        <!-- chart frame -->
        <line x1="100" y1="380" x2="660" y2="380" stroke="#1F2937" stroke-width="2"/>
        <line x1="100" y1="200" x2="100" y2="380" stroke="#1F2937" stroke-width="2"/>

        <!-- months labels -->
        <text x="100" y="398" text-anchor="middle" font-size="10" fill="#6B7280">M0</text>
        <text x="240" y="398" text-anchor="middle" font-size="10" fill="#6B7280">M3</text>
        <text x="380" y="398" text-anchor="middle" font-size="10" fill="#6B7280">M6</text>
        <text x="520" y="398" text-anchor="middle" font-size="10" fill="#6B7280">M9</text>
        <text x="660" y="398" text-anchor="middle" font-size="10" fill="#6B7280">M12</text>

        <!-- gridlines -->
        <line x1="100" y1="320" x2="660" y2="320" stroke="#E5E7EB" stroke-width="1" class="gridLine"/>
        <line x1="100" y1="260" x2="660" y2="260" stroke="#E5E7EB" stroke-width="1" class="gridLine"/>

        <!-- y labels -->
        <text x="92" y="384" text-anchor="end" font-size="10" fill="#6B7280" font-family="ui-monospace, monospace">2.0L</text>
        <text x="92" y="324" text-anchor="end" font-size="10" fill="#6B7280" font-family="ui-monospace, monospace">2.35L</text>
        <text x="92" y="264" text-anchor="end" font-size="10" fill="#6B7280" font-family="ui-monospace, monospace">2.7L</text>

        <!-- compounding curve, drawn via animateMotion or via path with stroke-dasharray reveal -->
        <path id="compCurve" d="M 100 380 Q 240 360 380 320 T 660 250" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" stroke-dasharray="700" stroke-dashoffset="700">
          <animate attributeName="stroke-dashoffset" values="700;700;0;0" keyTimes="0;0.32;0.6;1" dur="14s" repeatCount="indefinite"/>
        </path>
        <!-- shaded under -->
        <path d="M 100 380 Q 240 360 380 320 T 660 250 L 660 380 Z" fill="#FEE2E2" opacity="0">
          <animate attributeName="opacity" values="0;0;0.55;0.55" keyTimes="0;0.4;0.6;1" dur="14s" repeatCount="indefinite"/>
        </path>

        <!-- end-point label -->
        <g opacity="0">
          <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.55;0.62;1" dur="14s" repeatCount="indefinite"/>
          <circle cx="660" cy="250" r="5" fill="#F43F5E"/>
          <rect x="558" y="208" width="100" height="34" rx="6" fill="#FFFFFF" stroke="#F43F5E" stroke-width="1.5"/>
          <text x="608" y="222" text-anchor="middle" font-size="10" fill="#6B7280">12 months later</text>
          <text x="608" y="237" text-anchor="middle" font-size="13" font-weight="800" fill="#F43F5E" font-family="ui-monospace, monospace">₹2,70,000</text>
        </g>

        <text x="380" y="430" text-anchor="middle" font-size="13" fill="#6B7280">Frame 2 · 36% compounding doesn't sleep</text>
      </g>

      <!-- ============ SCENE 3: liquid-fund alternative ============ -->
      <g class="scene s3">
        <text x="380" y="105" text-anchor="middle" font-size="14" font-weight="700">A ₹2L liquid-fund buffer would have absorbed it.</text>

        <!-- two columns -->
        <!-- LEFT: card path -->
        <g>
          <rect x="80" y="150" width="280" height="220" rx="14" fill="#FEE2E2" stroke="#F43F5E" stroke-width="1.5"/>
          <text x="220" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#F43F5E">Credit-card path</text>
          <text x="220" y="220" text-anchor="middle" font-size="11" fill="#6B7280">Bill</text>
          <text x="220" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937" font-family="ui-monospace, monospace">₹2,00,000</text>
          <text x="220" y="278" text-anchor="middle" font-size="11" fill="#6B7280">After 12 months @ 36%</text>
          <text x="220" y="306" text-anchor="middle" font-size="22" font-weight="800" fill="#F43F5E" font-family="ui-monospace, monospace">₹2,70,000</text>
          <text x="220" y="340" text-anchor="middle" font-size="11" fill="#F43F5E" font-weight="600">+ ₹70,000 wasted</text>
        </g>

        <!-- RIGHT: liquid fund buffer -->
        <g>
          <rect x="400" y="150" width="280" height="220" rx="14" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
          <text x="540" y="178" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Liquid-fund buffer</text>
          <text x="540" y="220" text-anchor="middle" font-size="11" fill="#6B7280">Bill</text>
          <text x="540" y="244" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937" font-family="ui-monospace, monospace">₹2,00,000</text>
          <text x="540" y="278" text-anchor="middle" font-size="11" fill="#6B7280">Ongoing cost</text>
          <text x="540" y="306" text-anchor="middle" font-size="22" font-weight="800" fill="#10B981" font-family="ui-monospace, monospace">₹0</text>
          <text x="540" y="340" text-anchor="middle" font-size="11" fill="#10B981" font-weight="600">paid in full, end of story</text>
        </g>

        <text x="380" y="410" text-anchor="middle" font-size="13" fill="#6B7280">Frame 3 · the buffer absorbs; the card extracts</text>
      </g>
    </svg>
    <div class="caption">A credit limit lets you borrow your future. A buffer lets you keep it.</div>
  </div>
</main>
</body>
</html>
