<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>₹3K/month subscriptions = ₹1Cr lost</title>
<style>
  :root {
    --bg: #FFF7ED;
    --ink: #1F2937;
    --muted: #6B7280;
    --good: #10B981;
    --bad: #F43F5E;
    --accent: #F59E0B;
    --indigo: #0EA5E9;
    --violet: #8B5CF6;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Inter", sans-serif;
  }
  .stage {
    width: 100%; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 760px; }
  .frame { width: 100%; aspect-ratio: 16/10; display: block; }
  .caption {
    text-align: center;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    margin-top: 10px;
    line-height: 1.5;
  }

  /* coins falling into funnel */
  .coin {
    animation: fall 2.4s cubic-bezier(0.22,0.61,0.36,1) infinite;
    transform-origin: center;
  }
  @keyframes fall {
    0%   { transform: translateY(-10px); opacity: 0; }
    15%  { opacity: 1; }
    70%  { transform: translateY(140px); opacity: 1; }
    85%  { transform: translateY(180px); opacity: 0; }
    100% { transform: translateY(180px); opacity: 0; }
  }
  .c1 { animation-delay: 0s; }
  .c2 { animation-delay: 0.4s; }
  .c3 { animation-delay: 0.8s; }
  .c4 { animation-delay: 1.2s; }
  .c5 { animation-delay: 1.6s; }
  .c6 { animation-delay: 2.0s; }

  /* red bar rising on right side */
  .lossBar {
    transform: scaleY(0);
    transform-origin: bottom;
    animation: lossRise 14s cubic-bezier(0.22,0.61,0.36,1) infinite;
  }
  @keyframes lossRise {
    0%, 30% { transform: scaleY(0); }
    65%, 100% { transform: scaleY(1); }
  }

  .greenBar {
    transform: scaleY(0);
    transform-origin: bottom;
    animation: greenRise 14s cubic-bezier(0.22,0.61,0.36,1) infinite;
  }
  @keyframes greenRise {
    0%, 32% { transform: scaleY(0); }
    62%, 100% { transform: scaleY(1); }
  }

  .gridLine { stroke-dasharray: 3 5; }

  .reveal { opacity: 0; }
  .r1 { animation: rev 14s cubic-bezier(0.22,0.61,0.36,1) infinite; animation-delay: 0s; }
  .r2 { animation: rev 14s cubic-bezier(0.22,0.61,0.36,1) infinite; animation-delay: 0s; }
  @keyframes rev {
    0%, 70% { opacity: 0; }
    78%, 100% { opacity: 1; }
  }

  .funnelLabel { animation: lblFade 14s linear infinite; }
  @keyframes lblFade {
    0%, 38% { opacity: 1; }
    50%, 100% { opacity: 0.35; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .coin { opacity: 0.5; }
    .lossBar, .greenBar { transform: scaleY(1); }
    .reveal { opacity: 1; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg class="frame" viewBox="0 0 760 475" aria-label="Animation showing a 3000 rupee monthly stream flowing into a subscription funnel for Netflix, gym, and SaaS, then a parallel timeline showing the same amount compounded at 12 percent over 30 years would have grown to roughly 1.05 crore.">
      <rect x="20" y="20" width="720" height="435" rx="18" fill="#FFFFFF" stroke="#F1E9D7" stroke-width="1.5"/>
      <text x="40" y="52" font-size="14" font-weight="700">₹3,000/month — two parallel lives</text>
      <text x="40" y="72" font-size="12" fill="#6B7280">One drains. One compounds.</text>

      <!-- divider -->
      <line x1="380" y1="100" x2="380" y2="430" stroke="#E5E7EB" stroke-width="1.5" stroke-dasharray="3 5"/>

      <!-- ============ LEFT: subscription funnel ============ -->
      <g>
        <text x="200" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#F43F5E">SUBSCRIPTIONS</text>

        <!-- monthly source -->
        <g transform="translate(200,140)">
          <rect x="-58" y="-18" width="116" height="36" rx="18" fill="#FEE2E2" stroke="#F43F5E" stroke-width="1.5"/>
          <text x="0" y="6" text-anchor="middle" font-size="13" font-weight="700" fill="#F43F5E" font-family="ui-monospace, monospace">₹3,000/mo</text>
        </g>

        <!-- coins falling -->
        <g>
          <g class="coin c1" transform="translate(180,170)">
            <circle r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
            <text y="3" text-anchor="middle" font-size="9" font-weight="800" fill="#7C2D12">₹</text>
          </g>
          <g class="coin c2" transform="translate(220,170)">
            <circle r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
            <text y="3" text-anchor="middle" font-size="9" font-weight="800" fill="#7C2D12">₹</text>
          </g>
          <g class="coin c3" transform="translate(200,170)">
            <circle r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
            <text y="3" text-anchor="middle" font-size="9" font-weight="800" fill="#7C2D12">₹</text>
          </g>
          <g class="coin c4" transform="translate(180,170)">
            <circle r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
            <text y="3" text-anchor="middle" font-size="9" font-weight="800" fill="#7C2D12">₹</text>
          </g>
          <g class="coin c5" transform="translate(220,170)">
            <circle r="8" fill="#F59E0B" stroke="#B45309" stroke-width="1.5"/>
            <text y="3" text-anchor="middle" font-size="9" font-weight="800" fill="#7C2D12">₹</text>
          </g>
        </g>

        <!-- funnel shape -->
        <path d="M 110 240 L 290 240 L 230 320 L 170 320 Z" fill="#FFF7ED" stroke="#F43F5E" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="200" y="265" text-anchor="middle" font-size="10" font-weight="600" fill="#F43F5E" class="funnelLabel">funnel of fine</text>
        <text x="200" y="280" text-anchor="middle" font-size="10" font-weight="600" fill="#F43F5E" class="funnelLabel">small "yes"es</text>

        <!-- output: subscription tiles -->
        <g>
          <rect x="120" y="340" width="68" height="32" rx="6" fill="#1F2937"/>
          <text x="154" y="361" text-anchor="middle" font-size="11" font-weight="700" fill="#F43F5E">NETFLIX</text>

          <rect x="200" y="340" width="42" height="32" rx="6" fill="#10B981"/>
          <text x="221" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">GYM</text>

          <rect x="252" y="340" width="50" height="32" rx="6" fill="#0EA5E9"/>
          <text x="277" y="360" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">SaaS</text>

          <rect x="120" y="380" width="42" height="28" rx="6" fill="#8B5CF6"/>
          <text x="141" y="398" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">Spotify</text>

          <rect x="172" y="380" width="56" height="28" rx="6" fill="#F59E0B"/>
          <text x="200" y="398" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">Cloud+</text>

          <rect x="238" y="380" width="64" height="28" rx="6" fill="#6B7280"/>
          <text x="270" y="398" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">News+++</text>
        </g>

        <text x="200" y="430" text-anchor="middle" font-size="11" fill="#6B7280">"only ₹3K, what's the harm?"</text>
      </g>

      <!-- ============ RIGHT: parallel investment timeline ============ -->
      <g>
        <text x="560" y="110" text-anchor="middle" font-size="12" font-weight="700" fill="#10B981">PARALLEL TIMELINE</text>
        <text x="560" y="128" text-anchor="middle" font-size="11" fill="#6B7280" font-family="ui-monospace, monospace">SIP @ 12%, 30 years</text>

        <!-- chart axes -->
        <line x1="430" y1="380" x2="700" y2="380" stroke="#1F2937" stroke-width="2"/>
        <line x1="430" y1="160" x2="430" y2="380" stroke="#1F2937" stroke-width="2"/>

        <!-- gridlines -->
        <line x1="430" y1="220" x2="700" y2="220" stroke="#E5E7EB" stroke-width="1" class="gridLine"/>
        <line x1="430" y1="280" x2="700" y2="280" stroke="#E5E7EB" stroke-width="1" class="gridLine"/>
        <line x1="430" y1="340" x2="700" y2="340" stroke="#E5E7EB" stroke-width="1" class="gridLine"/>

        <!-- y labels -->
        <text x="424" y="384" text-anchor="end" font-size="9" fill="#6B7280" font-family="ui-monospace, monospace">0</text>
        <text x="424" y="344" text-anchor="end" font-size="9" fill="#6B7280" font-family="ui-monospace, monospace">25L</text>
        <text x="424" y="284" text-anchor="end" font-size="9" fill="#6B7280" font-family="ui-monospace, monospace">50L</text>
        <text x="424" y="224" text-anchor="end" font-size="9" fill="#6B7280" font-family="ui-monospace, monospace">1Cr</text>

        <!-- x labels -->
        <text x="430" y="396" text-anchor="middle" font-size="9" fill="#6B7280">Y0</text>
        <text x="565" y="396" text-anchor="middle" font-size="9" fill="#6B7280">Y15</text>
        <text x="700" y="396" text-anchor="middle" font-size="9" fill="#6B7280">Y30</text>

        <!-- lost-money red bar (showing the loss as bar to right of chart, growing) -->
        <rect x="445" y="380" width="38" height="200" rx="4" fill="#FEE2E2" stroke="#F43F5E" stroke-width="1.5" class="lossBar"/>
        <!-- green bar same height (compounded total) -->
        <rect x="500" y="380" width="38" height="200" rx="4" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5" class="greenBar"/>

        <!-- compounding curve -->
        <path d="M 430 380 Q 540 370 590 320 Q 640 270 700 180" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-dasharray="500" stroke-dashoffset="500">
          <animate attributeName="stroke-dashoffset" values="500;500;0;0" keyTimes="0;0.32;0.7;1" dur="14s" repeatCount="indefinite"/>
        </path>

        <!-- end marker -->
        <g class="reveal r1">
          <circle cx="700" cy="180" r="5" fill="#10B981"/>
          <rect x="555" y="148" width="142" height="32" rx="6" fill="#FFFFFF" stroke="#10B981" stroke-width="1.5"/>
          <text x="626" y="170" text-anchor="middle" font-size="13" font-weight="800" fill="#10B981" font-family="ui-monospace, monospace">₹1.05 Cr</text>
        </g>

        <!-- bar legends -->
        <g class="reveal r2">
          <text x="464" y="375" text-anchor="middle" font-size="9" fill="#F43F5E" font-weight="700">spent</text>
          <text x="519" y="375" text-anchor="middle" font-size="9" fill="#10B981" font-weight="700">grown</text>
        </g>

        <text x="565" y="430" text-anchor="middle" font-size="11" fill="#6B7280">same ₹3K, different ending</text>
      </g>
    </svg>
    <div class="caption">A monthly auto-debit is a vote. ₹3,000/month votes for ₹1 crore — or against it.</div>
  </div>
</main>
</body>
</html>
