<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emergency Fund — The Cascade</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FAF5FF;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,"Inter",sans-serif;color:#1F2937}
#w{position:relative;width:100%;max-width:780px;padding:8px}
svg{width:100%;height:auto;display:block}
#rb{position:absolute;bottom:14px;right:18px;background:#1F2937;color:#FAF5FF;border:none;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.75;z-index:5}
#rb:hover{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="w">
<svg viewBox="0 0 780 500" xmlns="http://www.w3.org/2000/svg"
     aria-label="Emergency fund cascade: same income shock hits two households. Without buffer, debt cascades into a 5-year setback. With buffer, the shock is absorbed and recovery is quick.">

  <rect width="780" height="500" fill="#FAF5FF"/>

  <text x="390" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">Same shock. Two outcomes.</text>
  <text x="390" y="52" text-anchor="middle" font-size="12" fill="#6B7280">A medical emergency hits both households at month 6.</text>

  <!-- Vertical separator -->
  <line x1="390" y1="78" x2="390" y2="450" stroke="#E9D5FF" stroke-width="1.5" stroke-dasharray="4 5"/>

  <!-- ── LEFT: Without buffer ── -->
  <g>
    <text x="195" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#F43F5E">WITHOUT BUFFER</text>

    <!-- Net worth chart bg -->
    <rect x="40" y="100" width="310" height="180" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1.4"/>
    <text x="48" y="118" font-size="9" fill="#9CA3AF" letter-spacing="0.5">NET WORTH (₹L)</text>

    <!-- Y axis hints: top = +20L, mid 0, bottom -20L → y = 190 - val*4.5 -->
    <line x1="40" y1="190" x2="350" y2="190" stroke="#FECACA" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="46" y="194" font-size="9" fill="#9CA3AF" font-family="ui-monospace,monospace">0</text>
    <text x="46" y="113" font-size="9" fill="#9CA3AF" font-family="ui-monospace,monospace">+20</text>
    <text x="46" y="277" font-size="9" fill="#9CA3AF" font-family="ui-monospace,monospace">-20</text>

    <!-- Net worth path -->
    <path id="leftNW" d="M 60 168 L 60 168" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="leftDot" cx="60" cy="168" r="5" fill="#F43F5E"/>

    <!-- Cascade events stack -->
    <g id="leftEvents" transform="translate(50,300)">
      <text x="0" y="0" font-size="10" font-weight="600" fill="#9CA3AF" letter-spacing="0.5">CASCADE</text>
    </g>

    <!-- Setback callout -->
    <g id="leftSetback" opacity="0">
      <rect x="50" y="408" width="290" height="38" rx="8" fill="#7F1D1D"/>
      <text x="195" y="425" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">Net worth: -₹14L</text>
      <text x="195" y="440" text-anchor="middle" font-size="11" fill="#FCA5A5">5-year setback</text>
    </g>
  </g>

  <!-- ── RIGHT: With buffer ── -->
  <g>
    <text x="585" y="86" text-anchor="middle" font-size="13" font-weight="700" fill="#10B981">WITH BUFFER</text>

    <rect x="430" y="100" width="310" height="180" rx="10" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.4"/>
    <text x="438" y="118" font-size="9" fill="#9CA3AF" letter-spacing="0.5">NET WORTH (₹L)</text>

    <line x1="430" y1="190" x2="740" y2="190" stroke="#A7F3D0" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="436" y="194" font-size="9" fill="#9CA3AF" font-family="ui-monospace,monospace">0</text>
    <text x="436" y="113" font-size="9" fill="#9CA3AF" font-family="ui-monospace,monospace">+20</text>
    <text x="436" y="277" font-size="9" fill="#9CA3AF" font-family="ui-monospace,monospace">-20</text>

    <!-- Buffer pool icon -->
    <g id="bufferPool" transform="translate(450,135)">
      <rect x="0" y="0" width="80" height="22" rx="6" fill="#10B981" opacity="0.18"/>
      <rect id="bufferLevel" x="0" y="0" width="80" height="22" rx="6" fill="#10B981" opacity="0.55"/>
      <text x="40" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46" font-family="ui-monospace,monospace">BUFFER ₹6L</text>
    </g>

    <!-- Net worth path -->
    <path id="rightNW" d="M 450 168 L 450 168" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle id="rightDot" cx="450" cy="168" r="5" fill="#10B981"/>

    <!-- Right events -->
    <g id="rightEvents" transform="translate(440,300)">
      <text x="0" y="0" font-size="10" font-weight="600" fill="#9CA3AF" letter-spacing="0.5">RESPONSE</text>
    </g>

    <!-- Recovery callout -->
    <g id="rightSetback" opacity="0">
      <rect x="440" y="408" width="290" height="38" rx="8" fill="#065F46"/>
      <text x="585" y="425" text-anchor="middle" font-size="12" fill="#FFFFFF" font-weight="700">Net worth: +₹16L</text>
      <text x="585" y="440" text-anchor="middle" font-size="11" fill="#A7F3D0">recovery in 6 months</text>
    </g>
  </g>

  <!-- Shock indicator (top center) -->
  <g id="shockBolt" opacity="0" transform="translate(390,160)">
    <circle cx="0" cy="0" r="22" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
    <path d="M -4 -10 L 4 -2 L -2 -2 L 4 10 L -4 2 L 2 2 Z" fill="#F59E0B"/>
  </g>

  <!-- Time axis -->
  <text x="390" y="468" text-anchor="middle" font-size="10" fill="#9CA3AF">months 0 ──── 6 (shock) ──── 24</text>

  <!-- Caption -->
  <rect id="capBg" x="40" y="478" width="700" height="20" rx="6" fill="#1F2937" opacity="0"/>
  <text id="cap" x="390" y="492" text-anchor="middle" font-size="11" fill="#FFFFFF" opacity="0"></text>

</svg>
<button id="rb">restart</button>
</div>

<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){return t<0?0:t>1?1:1-Math.pow(1-t,3);}

// Net worth coords. Map month 0..24 → x left: 60..340; x right: 450..730.
// Map ₹L value: y = 190 - val*4.5. Cap range -20..+20.
function lx(m){return 60 + (m/24)*280;}
function rx(m){return 450 + (m/24)*280;}
function yL(v){return 190 - v*4.5;}

// Left timeline: net worth values (₹L)
const leftCurve = [
  {m:0, v:8}, {m:6, v:8},
  {m:6.2, v:8}, // shock instant
  {m:7, v:-2},  // credit cards maxed
  {m:9, v:-6},  // EMI default
  {m:13, v:-12}, // forced equity sell
  {m:18, v:-14}, {m:24, v:-14}
];

// Right timeline
const rightCurve = [
  {m:0, v:8}, {m:6, v:8},
  {m:6.5, v:6}, // buffer absorbs
  {m:9, v:7}, {m:14, v:11}, {m:18, v:14}, {m:24, v:16}
];

let timers=[], rafs=[];
function after(ms,fn){timers.push(setTimeout(fn,ms));}
function clearAll(){timers.forEach(clearTimeout);timers=[];rafs.forEach(cancelAnimationFrame);rafs=[];}

function pathFromCurve(curve, xfn, uptoIndex, partialT){
  // build path string up to uptoIndex (inclusive); if partialT in 0..1 given, interpolate from uptoIndex to uptoIndex+1
  let pts = curve.slice(0, uptoIndex+1).map(p=>`${xfn(p.m).toFixed(1)},${yL(p.v).toFixed(1)}`);
  if(partialT!=null && uptoIndex < curve.length-1){
    const a = curve[uptoIndex], b = curve[uptoIndex+1];
    const cm = lerp(a.m, b.m, partialT);
    const cv = lerp(a.v, b.v, partialT);
    pts.push(`${xfn(cm).toFixed(1)},${yL(cv).toFixed(1)}`);
  }
  return 'M ' + pts.join(' L ');
}

function animCurve(curve, xfn, pathId, dotId, fromIdx, toIdx, dur, cb){
  const segDur = dur / (toIdx - fromIdx);
  let idx = fromIdx;
  function nextSeg(){
    if(idx >= toIdx){ if(cb) cb(); return; }
    const start = performance.now();
    function tick(now){
      const t = Math.min((now-start)/segDur, 1);
      const e = ease(t);
      const d = pathFromCurve(curve, xfn, idx, e);
      $(pathId).setAttribute('d', d);
      const a = curve[idx], b = curve[idx+1];
      const cm = lerp(a.m, b.m, e);
      const cv = lerp(a.v, b.v, e);
      $(dotId).setAttribute('cx', xfn(cm));
      $(dotId).setAttribute('cy', yL(cv));
      if(t<1) rafs.push(requestAnimationFrame(tick));
      else { idx++; nextSeg(); }
    }
    rafs.push(requestAnimationFrame(tick));
  }
  nextSeg();
}

function appendEvent(parentId, txt, color, delayLine){
  const g = $(parentId);
  const lines = g.querySelectorAll('text.evtLine').length;
  const t = document.createElementNS('http://www.w3.org/2000/svg','text');
  t.setAttribute('class','evtLine');
  t.setAttribute('x','0');
  t.setAttribute('y', String(18 + lines*16));
  t.setAttribute('font-size','11');
  t.setAttribute('fill', color);
  t.setAttribute('opacity','0');
  t.textContent = txt;
  g.appendChild(t);
  // fade in
  const start = performance.now();
  function tick(now){
    const tt = Math.min((now-start)/350, 1);
    t.setAttribute('opacity', String(ease(tt)));
    if(tt<1) rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}

function clearEvents(id){
  const g = $(id);
  g.querySelectorAll('text.evtLine').forEach(n=>n.remove());
}

function showCap(text, dur){
  dur = dur || 1700;
  $('cap').textContent = text;
  $('cap').setAttribute('opacity','1');
  $('capBg').setAttribute('opacity','0.92');
  after(dur, ()=>{
    $('cap').setAttribute('opacity','0');
    $('capBg').setAttribute('opacity','0');
  });
}

function reset(){
  clearAll();
  clearEvents('leftEvents');
  clearEvents('rightEvents');
  $('leftNW').setAttribute('d', `M ${lx(0)} ${yL(8)} L ${lx(0)} ${yL(8)}`);
  $('rightNW').setAttribute('d', `M ${rx(0)} ${yL(8)} L ${rx(0)} ${yL(8)}`);
  $('leftDot').setAttribute('cx', lx(0));$('leftDot').setAttribute('cy', yL(8));
  $('rightDot').setAttribute('cx', rx(0));$('rightDot').setAttribute('cy', yL(8));
  $('leftSetback').setAttribute('opacity','0');
  $('rightSetback').setAttribute('opacity','0');
  $('shockBolt').setAttribute('opacity','0');
  $('bufferLevel').setAttribute('width','80');
}

function run(){
  reset();

  // Phase 1: months 0..6 (steady)
  after(400, ()=>{
    showCap('Months 0–6: both households on track. ₹8L net worth.', 1700);
    animCurve(leftCurve, lx, 'leftNW', 'leftDot', 0, 1, 1500, null);
    animCurve(rightCurve, rx, 'rightNW', 'rightDot', 0, 1, 1500, null);
  });

  // Phase 2: shock at month 6
  after(2200, ()=>{
    $('shockBolt').setAttribute('opacity','1');
    showCap('Month 6: medical emergency. ₹6L bill.', 1900);
  });

  // LEFT cascade
  after(3000, ()=>{
    appendEvent('leftEvents','• Credit card maxed','#F43F5E');
    animCurve(leftCurve, lx, 'leftNW', 'leftDot', 1, 3, 1100, null);
  });
  after(4400, ()=>{
    appendEvent('leftEvents','• EMI default → 18% interest','#F43F5E');
    animCurve(leftCurve, lx, 'leftNW', 'leftDot', 3, 4, 1300, null);
  });
  after(5900, ()=>{
    appendEvent('leftEvents','• Forced equity sale at loss','#F43F5E');
    animCurve(leftCurve, lx, 'leftNW', 'leftDot', 4, 5, 1400, null);
  });
  after(7500, ()=>{
    animCurve(leftCurve, lx, 'leftNW', 'leftDot', 5, 7, 1400, null);
  });
  after(9000, ()=>{
    $('leftSetback').setAttribute('opacity','1');
  });

  // RIGHT response (parallel)
  after(3000, ()=>{
    appendEvent('rightEvents','• Buffer absorbs the bill','#10B981');
    // Drain buffer level visually
    const start = performance.now();
    function drain(now){
      const t = Math.min((now-start)/1100, 1);
      $('bufferLevel').setAttribute('width', String(80*(1-ease(t))));
      if(t<1) rafs.push(requestAnimationFrame(drain));
    }
    rafs.push(requestAnimationFrame(drain));
    animCurve(rightCurve, rx, 'rightNW', 'rightDot', 1, 2, 1100, null);
  });
  after(4400, ()=>{
    appendEvent('rightEvents','• Investments untouched','#10B981');
    animCurve(rightCurve, rx, 'rightNW', 'rightDot', 2, 3, 1300, null);
  });
  after(5900, ()=>{
    appendEvent('rightEvents','• Compounding continues','#10B981');
    animCurve(rightCurve, rx, 'rightNW', 'rightDot', 3, 5, 2000, null);
  });
  after(8000, ()=>{
    appendEvent('rightEvents','• Buffer rebuilt by month 18','#10B981');
    animCurve(rightCurve, rx, 'rightNW', 'rightDot', 5, 6, 1200, null);
    // Refill buffer slowly
    const start = performance.now();
    function refill(now){
      const t = Math.min((now-start)/1500, 1);
      $('bufferLevel').setAttribute('width', String(80*ease(t)));
      if(t<1) rafs.push(requestAnimationFrame(refill));
    }
    rafs.push(requestAnimationFrame(refill));
  });
  after(9400, ()=>{
    $('rightSetback').setAttribute('opacity','1');
  });

  after(10000, ()=>{
    showCap('A buffer is the difference between an event and a setback.', 3000);
  });

  after(13800, run);
}

$('rb').addEventListener('click', run);
run();
})();
</script>
</body>
</html>
