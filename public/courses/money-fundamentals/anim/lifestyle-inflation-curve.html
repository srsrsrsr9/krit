<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lifestyle Inflation — Three Years</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FFF7ED;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:system-ui,-apple-system,"Inter",sans-serif;color:#1F2937}
#w{position:relative;width:100%;max-width:760px;padding:8px}
svg{width:100%;height:auto;display:block}
#rb{position:absolute;bottom:14px;right:18px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;font-family:inherit;opacity:.75;z-index:5}
#rb:hover{opacity:1}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
html,body{overflow:hidden;margin:0;padding:0}</style>
</head>
<body>
<div id="w">
<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg"
     aria-label="Lifestyle inflation: income rises from 6 lakh to 15 lakh over three years while spending tracks income perfectly, leaving the savings gap nearly flat">

  <rect width="760" height="460" fill="#FFF7ED"/>

  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">The raise was decorative.</text>
  <text x="380" y="54" text-anchor="middle" font-size="12" fill="#6B7280">Three years. Income up 2.5×. Savings barely moved.</text>

  <!-- Chart frame: x 80..680, y 90..360 -->
  <rect x="80" y="90" width="600" height="270" rx="10" fill="#FFFBF1" stroke="#FED7AA" stroke-width="1.5"/>

  <!-- Y axis ticks (₹ lakh): 0,3,6,9,12,15 → y = 360 - val*18 -->
  <g font-family="ui-monospace,monospace" font-size="10" fill="#9CA3AF">
    <line x1="80" y1="360" x2="680" y2="360" stroke="#FED7AA" stroke-width="1"/>
    <line x1="80" y1="306" x2="680" y2="306" stroke="#FFEDD5" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="80" y1="252" x2="680" y2="252" stroke="#FFEDD5" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="80" y1="198" x2="680" y2="198" stroke="#FFEDD5" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="80" y1="144" x2="680" y2="144" stroke="#FFEDD5" stroke-width="1" stroke-dasharray="2 3"/>
    <line x1="80" y1="90"  x2="680" y2="90"  stroke="#FFEDD5" stroke-width="1" stroke-dasharray="2 3"/>
    <text x="74" y="364" text-anchor="end">0</text>
    <text x="74" y="310" text-anchor="end">3L</text>
    <text x="74" y="256" text-anchor="end">6L</text>
    <text x="74" y="202" text-anchor="end">9L</text>
    <text x="74" y="148" text-anchor="end">12L</text>
    <text x="74" y="94"  text-anchor="end">15L</text>
  </g>

  <!-- X axis: years 0..3 → x = 80 + year*200 -->
  <g font-family="ui-monospace,monospace" font-size="11" fill="#6B7280">
    <text x="80"  y="380" text-anchor="middle">Y0</text>
    <text x="280" y="380" text-anchor="middle">Y1</text>
    <text x="480" y="380" text-anchor="middle">Y2</text>
    <text x="680" y="380" text-anchor="middle">Y3</text>
  </g>

  <!-- Filled bands -->
  <!-- Spending band fills below the spending line; Savings gap is the sliver between income and spending -->
  <path id="incomeFill" d="M 80 360 L 80 360 Z" fill="#0EA5E9" fill-opacity="0.10"/>
  <path id="spendFill"  d="M 80 360 L 80 360 Z" fill="#F43F5E" fill-opacity="0.18"/>

  <!-- Lines -->
  <polyline id="incomeLine" points="80,252" fill="none" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline id="spendLine"  points="80,266" fill="none" stroke="#F43F5E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="0"/>

  <!-- Endpoint dots -->
  <circle id="incomeDot" cx="80" cy="252" r="5" fill="#0EA5E9"/>
  <circle id="spendDot"  cx="80" cy="266" r="5" fill="#F43F5E"/>

  <!-- Numeric tiles (top-right area) -->
  <g transform="translate(500,108)">
    <rect width="170" height="70" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.4"/>
    <text x="14" y="22" font-size="10" fill="#9CA3AF" letter-spacing="0.5">INCOME</text>
    <text id="tIncome" x="14" y="46" font-size="22" font-weight="700" fill="#0EA5E9" font-family="ui-monospace,monospace">₹6.0L</text>
    <text x="14" y="62" font-size="10" fill="#9CA3AF">per year</text>
  </g>
  <g transform="translate(500,188)">
    <rect width="170" height="70" rx="10" fill="#FFFFFF" stroke="#FED7AA" stroke-width="1.4"/>
    <text x="14" y="22" font-size="10" fill="#9CA3AF" letter-spacing="0.5">SAVED</text>
    <text id="tSaved" x="14" y="46" font-size="22" font-weight="700" fill="#10B981" font-family="ui-monospace,monospace">₹0.4L</text>
    <text x="14" y="62" font-size="10" fill="#9CA3AF">the sliver</text>
  </g>

  <!-- Legend -->
  <g transform="translate(90,108)" font-size="11" fill="#1F2937">
    <line x1="0" y1="6" x2="20" y2="6" stroke="#0EA5E9" stroke-width="3" stroke-linecap="round"/>
    <text x="26" y="10">income</text>
    <line x1="0" y1="26" x2="20" y2="26" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
    <text x="26" y="30">spending</text>
  </g>

  <!-- Year labels appearing -->
  <g id="yrLabels" font-size="11" fill="#6B7280" font-style="italic"></g>

  <!-- Sliver annotation arrow (year 3) -->
  <g id="sliverNote" opacity="0">
    <line x1="660" y1="98" x2="690" y2="80" stroke="#10B981" stroke-width="1.5"/>
    <text x="694" y="78" font-size="11" fill="#10B981" font-weight="600">flat</text>
    <text x="694" y="92" font-size="10" fill="#6B7280">savings</text>
    <text x="694" y="104" font-size="10" fill="#6B7280">gap</text>
  </g>

  <!-- Caption -->
  <rect id="capBg" x="80" y="400" width="600" height="40" rx="8" fill="#1F2937" opacity="0"/>
  <text id="cap" x="380" y="425" text-anchor="middle" font-size="13" fill="#FFFFFF" opacity="0">Income climbs.</text>

</svg>
<button id="rb">restart</button>
</div>

<script>
(function(){
'use strict';
function $(id){return document.getElementById(id);}
function lerp(a,b,t){return a+(b-a)*t;}
function ease(t){return t<0?0:t>1?1:1-Math.pow(1-t,3);}

// data: yearly income & spending (₹ lakh)
// year 0 baseline, climbs over Y1, Y2, Y3
const data = [
  {y:0, inc:6.0, spend:5.6},
  {y:1, inc:9.0, spend:8.6},
  {y:2, inc:12.0, spend:11.5},
  {y:3, inc:15.0, spend:14.5}
];

// chart math: x = 80 + year*200, y = 360 - val*18
function X(y){return 80 + y*200;}
function Y(v){return 360 - v*18;}

let timers=[], rafs=[];
function after(ms,fn){timers.push(setTimeout(fn,ms));}
function clearAll(){timers.forEach(clearTimeout);timers=[];rafs.forEach(cancelAnimationFrame);rafs=[];}

function setLines(uptoYear, inc, spend){
  // current point set: all completed segments + current animated point
  const incPts=[], spPts=[];
  for(let i=0;i<=Math.floor(uptoYear);i++){
    incPts.push(`${X(i).toFixed(1)},${Y(data[i].inc).toFixed(1)}`);
    spPts.push(`${X(i).toFixed(1)},${Y(data[i].spend).toFixed(1)}`);
  }
  if(uptoYear%1!==0){
    incPts.push(`${X(uptoYear).toFixed(1)},${Y(inc).toFixed(1)}`);
    spPts.push(`${X(uptoYear).toFixed(1)},${Y(spend).toFixed(1)}`);
  } else {
    // ensure current point is the last
  }
  $('incomeLine').setAttribute('points', incPts.join(' '));
  $('spendLine').setAttribute('points', spPts.join(' '));
  $('incomeDot').setAttribute('cx', X(uptoYear));
  $('incomeDot').setAttribute('cy', Y(inc));
  $('spendDot').setAttribute('cx', X(uptoYear));
  $('spendDot').setAttribute('cy', Y(spend));

  // fills
  let incFill = `M 80 360 `;
  let spFill = `M 80 360 `;
  for(let p of incPts) incFill += `L ${p} `;
  incFill += `L ${X(uptoYear).toFixed(1)} 360 Z`;
  for(let p of spPts) spFill += `L ${p} `;
  spFill += `L ${X(uptoYear).toFixed(1)} 360 Z`;
  $('incomeFill').setAttribute('d', incFill);
  $('spendFill').setAttribute('d', spFill);

  // tiles
  $('tIncome').textContent = `₹${inc.toFixed(1)}L`;
  $('tSaved').textContent = `₹${(inc-spend).toFixed(1)}L`;
}

function animSeg(fromY, toY, dur, cb){
  const start = performance.now();
  const fromInc = data[fromY].inc, toInc = data[toY].inc;
  const fromSp = data[fromY].spend, toSp = data[toY].spend;
  function tick(now){
    const t = Math.min((now-start)/dur, 1);
    const e = ease(t);
    const cy = lerp(fromY, toY, e);
    const ci = lerp(fromInc, toInc, e);
    const cs = lerp(fromSp, toSp, e);
    setLines(cy, ci, cs);
    if(t<1) rafs.push(requestAnimationFrame(tick));
    else if(cb) cb();
  }
  rafs.push(requestAnimationFrame(tick));
}

function showCap(text, dur){
  dur = dur || 1800;
  $('cap').textContent = text;
  $('cap').setAttribute('opacity','1');
  $('capBg').setAttribute('opacity','0.92');
  after(dur, ()=>{
    $('cap').setAttribute('opacity','0');
    $('capBg').setAttribute('opacity','0');
  });
}

function setYrLabel(year, label){
  const g = $('yrLabels');
  const el = document.createElementNS('http://www.w3.org/2000/svg','text');
  el.setAttribute('x', X(year));
  el.setAttribute('y', 76);
  el.setAttribute('text-anchor','middle');
  el.setAttribute('font-size','10');
  el.setAttribute('fill','#9CA3AF');
  el.textContent = label;
  g.appendChild(el);
}

function reset(){
  clearAll();
  $('yrLabels').innerHTML='';
  $('sliverNote').setAttribute('opacity','0');
  setLines(0, data[0].inc, data[0].spend);
}

function run(){
  reset();
  // Y0 → Y1
  after(500, ()=>{
    showCap('Year 1: ₹3L raise. Upgraded apartment, faster phone.', 2200);
    animSeg(0,1, 2200, ()=>{ setYrLabel(1,'+₹3L raise'); });
  });
  // Y1 → Y2
  after(3000, ()=>{
    showCap('Year 2: another raise. Bigger car. Same savings sliver.', 2200);
    animSeg(1,2, 2200, ()=>{ setYrLabel(2,'+₹3L raise'); });
  });
  // Y2 → Y3
  after(5500, ()=>{
    showCap('Year 3: promotion. Travel, gear, dining out.', 2200);
    animSeg(2,3, 2200, ()=>{
      setYrLabel(3,'+₹3L raise');
      $('sliverNote').setAttribute('opacity','1');
    });
  });
  // Final reveal
  after(8200, ()=>{
    showCap('Income up 2.5×. Savings up ₹0.1L. Net worth: unchanged.', 3500);
  });
  // Loop
  after(12500, run);
}

$('rb').addEventListener('click', run);
run();
})();
</script>
</body>
</html>
