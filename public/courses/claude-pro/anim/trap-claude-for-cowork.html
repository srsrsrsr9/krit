<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: auto-send fake metric</title>
<style>
:root{--bg:#FAF5FF;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.bad-draft{animation:fade .4s ease .2s both}
.bad-send{animation:pop .35s ease 1.5s both}
.bad-react{animation:fade .4s ease 3s both,flash .8s ease 3.6s 2 both}
.fix-draft{animation:fade .4s ease 5.5s both}
.fix-edits{animation:fade .4s ease 6.5s both}
.fix-send{animation:pop .35s ease 8s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A manager auto-sending an AI-drafted Slack message with a fake metric, vs the human-review-then-send fix">
<rect width="720" height="405" rx="14" fill="#FAF5FF"/>

<!-- BAD -->
<g class="bad-draft" transform="translate(40 30)">
<rect width="320" height="100" rx="10" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="11" fill="#7F1D1D" font-weight="bold">BEFORE · AI auto-sends</text>
<g transform="translate(14 32)">
<rect width="290" height="58" rx="6" fill="#FFFFFF" stroke="#7F1D1D"/>
<text x="14" y="18" font-size="10" fill="#7F1D1D" font-weight="bold">Manager · #leadership-updates</text>
<text x="14" y="34" font-size="10" fill="#1F2937">"Q2 is going well — DAU is 47K,</text>
<text x="14" y="48" font-size="10" fill="#7F1D1D" font-weight="bold">up 22% MoM" — AI made this up</text>
</g>
</g>

<g class="bad-send" transform="translate(40 140)">
<rect width="80" height="32" rx="6" fill="#1E40AF"/>
<text x="40" y="20" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Send →</text>
<text x="100" y="20" font-size="10" fill="#1F2937">no review · auto-fired</text>
</g>

<g class="bad-react" transform="translate(40 184)">
<rect width="320" height="100" rx="10" fill="#7F1D1D"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#FCA5A5" font-weight="bold">CFO replied 4 hours later</text>
<text x="160" y="40" text-anchor="middle" font-size="10" fill="#FCA5A5">"DAU was 31K · numbers don't match"</text>
<text x="160" y="60" text-anchor="middle" font-size="10" fill="#FCA5A5">team trust: dented · 4 weeks to recover</text>
<text x="160" y="80" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">manager: "I let Claude auto-send..."</text>
</g>

<!-- FIX -->
<g class="fix-draft" transform="translate(380 30)">
<rect width="300" height="100" rx="10" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">AFTER · AI drafts, human signs</text>
<g transform="translate(14 32)">
<rect width="270" height="58" rx="6" fill="#FFFFFF" stroke="#065F46"/>
<text x="14" y="18" font-size="10" fill="#065F46" font-weight="bold">Draft (AI):</text>
<text x="14" y="34" font-size="10" fill="#1F2937">"Q2 is going well — DAU is 47K,</text>
<text x="14" y="48" font-size="10" fill="#1F2937">up 22% MoM"</text>
</g>
</g>

<g class="fix-edits" transform="translate(380 140)">
<rect width="300" height="80" rx="10" fill="#FEF3C7" stroke="#92400E" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="11" fill="#92400E" font-weight="bold">Manager reviews · checks dashboard</text>
<text x="14" y="40" font-size="10" fill="#7C2D12">"actually DAU is 31K (not 47K)</text>
<text x="14" y="56" font-size="10" fill="#7C2D12">and that's flat MoM, not +22%."</text>
<text x="14" y="72" font-size="10" fill="#7C2D12" font-style="italic">— corrected the draft before send</text>
</g>

<g class="fix-send" transform="translate(380 230)">
<rect width="300" height="60" rx="10" fill="#065F46"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#A7F3D0" font-weight="bold">Sent · accurate · no fallout</text>
<text x="150" y="40" text-anchor="middle" font-size="10" fill="#A7F3D0">human latency: ~90 seconds</text>
<text x="150" y="56" text-anchor="middle" font-size="10" fill="#A7F3D0" font-style="italic">trust intact · saved 4 weeks of repair</text>
</g>

<g transform="translate(40 305)">
<rect width="640" height="80" rx="10" fill="#1F2937"/>
<text x="320" y="24" text-anchor="middle" font-size="13" fill="#FCD34D" font-weight="bold">AI drafts · humans sign · the send button is human-only</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#9CA3AF">90 seconds of review prevents 4 weeks of trust repair</text>
<text x="320" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">Claude is fast at drafting · slow at telling truth from plausible</text>
</g>
</svg>
<div class="caption">A 90-second human review is the cheapest insurance you'll ever buy.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
