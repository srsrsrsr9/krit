<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: Claude Code without CLAUDE.md</title>
<style>
:root{--bg:#FAF5FF;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.bad-ask{animation:fade .4s ease .2s both}
.diff-row{animation:fade .25s ease both}
.bad-pr{animation:pop .5s ease 4s both}
.kernel{animation:pop .5s ease 6s both,pulse 1.5s ease 7s 2 both}
.fix-pr{animation:pop .5s ease 9s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A bug-fix request without a CLAUDE.md kernel produces a 200-file PR; with the kernel, the AI makes a surgical 12-line fix">
<rect width="720" height="405" rx="14" fill="#FAF5FF"/>

<!-- BAD: no kernel -->
<g class="bad-ask" transform="translate(40 30)">
<rect width="320" height="36" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="14" y="22" font-size="11" fill="#7F1D1D" font-weight="bold">"fix the login redirect bug"</text>
</g>

<g transform="translate(40 78)">
<rect width="320" height="160" rx="8" fill="#FFFFFF" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="11" fill="#7F1D1D" font-weight="bold">Claude (no CLAUDE.md) starts wandering</text>

<g font-family="ui-monospace,monospace" font-size="9" fill="#1F2937">
<g class="diff-row" style="animation-delay:.6s"><text x="14" y="42">+ src/auth/login.tsx</text><text x="280" y="42" fill="#10B981">+12</text></g>
<g class="diff-row" style="animation-delay:.9s"><text x="14" y="56">~ src/auth/oauth.tsx       (refactored)</text><text x="280" y="56" fill="#7F1D1D">+47 -22</text></g>
<g class="diff-row" style="animation-delay:1.2s"><text x="14" y="70">~ src/lib/jwt.ts           (rewritten)</text><text x="280" y="70" fill="#7F1D1D">+89 -34</text></g>
<g class="diff-row" style="animation-delay:1.5s"><text x="14" y="84">+ src/lib/csrf.ts          (added)</text><text x="280" y="84" fill="#10B981">+58</text></g>
<g class="diff-row" style="animation-delay:1.8s"><text x="14" y="98">~ middleware.ts            (rewritten)</text><text x="280" y="98" fill="#7F1D1D">+34 -19</text></g>
<g class="diff-row" style="animation-delay:2.1s"><text x="14" y="112">~ tailwind.config.ts       (theme update?)</text><text x="280" y="112" fill="#7F1D1D">+17 -3</text></g>
<g class="diff-row" style="animation-delay:2.4s"><text x="14" y="126">+ 14 new test files</text><text x="280" y="126" fill="#10B981">+340</text></g>
<g class="diff-row" style="animation-delay:2.7s"><text x="14" y="140">~ 187 other files</text><text x="280" y="140" fill="#7F1D1D">…</text></g>
</g>
</g>

<g class="bad-pr" transform="translate(40 250)">
<rect width="320" height="80" rx="8" fill="#7F1D1D"/>
<text x="160" y="22" text-anchor="middle" font-size="13" fill="#FCA5A5" font-weight="bold">PR: 200 files changed</text>
<text x="160" y="42" text-anchor="middle" font-size="11" fill="#FCA5A5">reviewer: 🚫 close</text>
<text x="160" y="58" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">"that's not what I asked for"</text>
<text x="160" y="74" text-anchor="middle" font-size="10" fill="#FCA5A5">2 days lost · trust dented</text>
</g>

<!-- KERNEL FIX -->
<g class="kernel" transform="translate(380 30)">
<rect width="300" height="180" rx="8" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">FIX · CLAUDE.md kernel as ground truth</text>
<line x1="14" y1="32" x2="286" y2="32" stroke="#065F46"/>
<g font-family="ui-monospace,monospace" font-size="10">
<text x="14" y="50" fill="#065F46" font-weight="bold"># Project rules</text>
<text x="14" y="66" fill="#1F2937">- never refactor unless asked</text>
<text x="14" y="80" fill="#1F2937">- single-file fixes preferred</text>
<text x="14" y="94" fill="#1F2937">- no schema migrations w/o /plan</text>
<text x="14" y="108" fill="#1F2937">- no global config edits</text>
<text x="14" y="122" fill="#1F2937">- ask if scope &gt; 5 files</text>
</g>
<text x="150" y="148" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">read first · obey the contract</text>
<text x="150" y="166" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">→ Claude reads kernel before acting</text>
</g>

<g class="fix-pr" transform="translate(380 220)">
<rect width="300" height="120" rx="8" fill="#065F46"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#A7F3D0" font-weight="bold">PR: 1 file changed · 12 lines</text>
<g font-family="ui-monospace,monospace" font-size="10" fill="#fff">
<text x="14" y="46">~ src/auth/login.tsx</text>
<text x="270" y="46" fill="#A7F3D0" text-anchor="end">+12 -3</text>
<text x="14" y="68">- redirect = '/'</text>
<text x="14" y="84">+ redirect = ctx.from ?? '/'</text>
</g>
<text x="150" y="106" text-anchor="middle" font-size="10" fill="#A7F3D0" font-style="italic">PR-to-merge: 12 minutes</text>
</g>

<g transform="translate(40 350)">
<rect width="640" height="40" rx="8" fill="#1F2937"/>
<text x="320" y="18" text-anchor="middle" font-size="11" fill="#FCD34D" font-weight="bold">Claude Code without a kernel = expensive autocomplete that wanders</text>
<text x="320" y="34" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">CLAUDE.md is the contract. Without it, every task starts from zero.</text>
</g>
</svg>
<div class="caption">A kernel is the cheapest investment in a Claude Code workflow. Five minutes once, save hours forever.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
