<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: ship without tests</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.merge-bad{animation:fade .4s ease .3s both}
.outage{animation:pop .5s ease 2s both,flash 1s ease 2.6s 2 both}
.merge-fix{animation:fade .4s ease 6s both}
.fail-fast{animation:pop .5s ease 7.5s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="Refactor merged on Friday with no tests, production goes red Saturday 2am, vs the same refactor with tests catching the bug pre-merge in 30 seconds">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- BAD: ship without tests -->
<g transform="translate(40 30)">
<rect width="320" height="180" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">BEFORE · "we don't have time for tests"</text>

<g class="merge-bad" transform="translate(20 38)">
<rect width="280" height="36" rx="6" fill="#10B981"/>
<text x="140" y="22" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">Friday 4 PM · merged · build green ✓</text>
</g>

<g class="outage" transform="translate(20 90)">
<rect width="280" height="80" rx="6" fill="#7F1D1D"/>
<text x="140" y="22" text-anchor="middle" font-size="11" fill="#FCA5A5" font-weight="bold">Saturday 2 AM · pager fires</text>
<text x="140" y="40" text-anchor="middle" font-size="10" fill="#FCA5A5">prod 5xx rate: 47%</text>
<text x="140" y="56" text-anchor="middle" font-size="10" fill="#FCA5A5">on-call wakes · debugs blind</text>
<text x="140" y="72" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">4 hours · ₹47L SLA penalty</text>
</g>
</g>

<!-- FIX: with tests -->
<g transform="translate(380 30)">
<rect width="300" height="180" rx="8" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">AFTER · same refactor + tests</text>

<g class="merge-fix" transform="translate(20 38)">
<rect width="260" height="36" rx="6" fill="#FED7AA" stroke="#92400E"/>
<text x="130" y="22" text-anchor="middle" font-size="11" fill="#7C2D12" font-weight="bold">Friday 3:58 PM · CI runs · 30s</text>
</g>

<g class="fail-fast" transform="translate(20 90)">
<rect width="260" height="80" rx="6" fill="#065F46"/>
<text x="130" y="22" text-anchor="middle" font-size="11" fill="#A7F3D0" font-weight="bold">Friday 3:58 PM · 3 tests fail</text>
<text x="14" y="42" font-family="ui-monospace,monospace" font-size="9" fill="#fff">✗ login_redirect.spec.ts</text>
<text x="14" y="56" font-family="ui-monospace,monospace" font-size="9" fill="#fff">✗ checkout_otp.spec.ts</text>
<text x="14" y="70" font-family="ui-monospace,monospace" font-size="9" fill="#fff">✗ session_persist.spec.ts</text>
</g>
</g>

<g class="fail-fast" transform="translate(40 230)">
<rect width="640" height="80" rx="10" fill="#1F2937"/>
<text x="320" y="24" text-anchor="middle" font-size="13" fill="#FCD34D" font-weight="bold">Same refactor · same engineer · two outcomes</text>
<g font-family="sans-serif" font-size="11">
<text x="100" y="50" text-anchor="middle" fill="#FCA5A5">no tests</text>
<text x="100" y="68" text-anchor="middle" fill="#FCA5A5">4-hour outage · pager · ₹47L</text>
</g>
<g font-family="sans-serif" font-size="11">
<text x="540" y="50" text-anchor="middle" fill="#A7F3D0">with tests</text>
<text x="540" y="68" text-anchor="middle" fill="#A7F3D0">30-second feedback · fixed · home by 5</text>
</g>
</g>

<g transform="translate(40 330)">
<rect width="640" height="60" rx="10" fill="#FED7AA" stroke="#92400E" stroke-width="1.5"/>
<text x="320" y="24" text-anchor="middle" font-size="12" fill="#7C2D12" font-weight="bold">Tests aren't a tax · they're paid-up insurance</text>
<text x="320" y="44" text-anchor="middle" font-size="10" fill="#7C2D12" font-style="italic">"we don't have time" is the most expensive sentence in software</text>
</g>
</svg>
<div class="caption">The 90 minutes you skip writing tests show up as 4 hours of debugging at 2 AM. Always.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
