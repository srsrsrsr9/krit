<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: waitForTimeout(3000)</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes glow{0%,100%{filter:none}50%{filter:drop-shadow(0 0 8px #F43F5E)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.run{animation:pop .3s ease both}
.bad-line{animation:fade .4s ease 4s both,glow 1.5s ease 4.5s 2 both}
.trace{animation:fade .5s ease 6.5s both}
.fix-line{animation:fade .5s ease 8s both}
.fix-runs{animation:pop .25s ease both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A flaky test running 10 times with random failures, the offending line waitForTimeout 3000 highlighted, the trace viewer revealing the race, then the fix using web-first assertions">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- 10 RUNS BEFORE -->
<g transform="translate(40 30)">
<text x="160" y="14" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">BEFORE · 10 runs · 30% flake</text>
<g font-family="ui-monospace,monospace" font-size="11" font-weight="bold" text-anchor="middle">
<g class="run" style="animation-delay:.1s"><circle cx="20" cy="40" r="12" fill="#10B981"/><text x="20" y="44" fill="#fff">✓</text></g>
<g class="run" style="animation-delay:.3s"><circle cx="50" cy="40" r="12" fill="#F43F5E"/><text x="50" y="44" fill="#fff">✗</text></g>
<g class="run" style="animation-delay:.5s"><circle cx="80" cy="40" r="12" fill="#10B981"/><text x="80" y="44" fill="#fff">✓</text></g>
<g class="run" style="animation-delay:.7s"><circle cx="110" cy="40" r="12" fill="#10B981"/><text x="110" y="44" fill="#fff">✓</text></g>
<g class="run" style="animation-delay:.9s"><circle cx="140" cy="40" r="12" fill="#F43F5E"/><text x="140" y="44" fill="#fff">✗</text></g>
<g class="run" style="animation-delay:1.1s"><circle cx="170" cy="40" r="12" fill="#10B981"/><text x="170" y="44" fill="#fff">✓</text></g>
<g class="run" style="animation-delay:1.3s"><circle cx="200" cy="40" r="12" fill="#F43F5E"/><text x="200" y="44" fill="#fff">✗</text></g>
<g class="run" style="animation-delay:1.5s"><circle cx="230" cy="40" r="12" fill="#F43F5E"/><text x="230" y="44" fill="#fff">✗</text></g>
<g class="run" style="animation-delay:1.7s"><circle cx="260" cy="40" r="12" fill="#10B981"/><text x="260" y="44" fill="#fff">✓</text></g>
<g class="run" style="animation-delay:1.9s"><circle cx="290" cy="40" r="12" fill="#10B981"/><text x="290" y="44" fill="#fff">✓</text></g>
</g>
<text x="160" y="76" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">non-deterministic · "works on my machine"</text>
</g>

<!-- BAD CODE -->
<g class="bad-line" transform="translate(40 130)">
<rect width="320" height="58" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="14" y="22" font-family="ui-monospace,monospace" font-size="10" fill="#7F1D1D">await page.click('Submit');</text>
<text x="14" y="40" font-family="ui-monospace,monospace" font-size="10" fill="#7F1D1D" font-weight="bold">await page.waitForTimeout(3000);   ← FLAKE</text>
<text x="14" y="56" font-family="ui-monospace,monospace" font-size="10" fill="#7F1D1D">await expect(page).toHaveURL('/done');</text>
</g>

<!-- TRACE VIEWER -->
<g class="trace" transform="translate(40 210)">
<rect width="320" height="80" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">$ playwright show-trace</text>
<g font-family="ui-monospace,monospace" font-size="9">
<text x="14" y="42" fill="#1F2937">[ 0ms]  click Submit</text>
<text x="14" y="56" fill="#1F2937">[2980ms] navigation pending...</text>
<text x="14" y="70" fill="#7F1D1D" font-weight="bold">[3001ms] timeout fires · URL not yet '/done'  ✗</text>
</g>
</g>

<!-- FIX -->
<g class="fix-line" transform="translate(380 130)">
<rect width="300" height="58" rx="8" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="14" y="22" font-family="ui-monospace,monospace" font-size="10" fill="#065F46">await page.click('Submit');</text>
<text x="14" y="40" font-family="ui-monospace,monospace" font-size="10" fill="#065F46" font-weight="bold">// auto-waits, retries until truthy:</text>
<text x="14" y="56" font-family="ui-monospace,monospace" font-size="10" fill="#065F46">await expect(page).toHaveURL('/done');</text>
</g>

<!-- 10 RUNS AFTER -->
<g transform="translate(380 210)">
<text x="150" y="14" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">AFTER · 10 runs · 0% flake</text>
<g font-family="ui-monospace,monospace" font-size="11" font-weight="bold" text-anchor="middle">
<g class="fix-runs" style="animation-delay:9s"><circle cx="20" cy="40" r="12" fill="#10B981"/><text x="20" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.1s"><circle cx="50" cy="40" r="12" fill="#10B981"/><text x="50" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.2s"><circle cx="80" cy="40" r="12" fill="#10B981"/><text x="80" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.3s"><circle cx="110" cy="40" r="12" fill="#10B981"/><text x="110" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.4s"><circle cx="140" cy="40" r="12" fill="#10B981"/><text x="140" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.5s"><circle cx="170" cy="40" r="12" fill="#10B981"/><text x="170" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.6s"><circle cx="200" cy="40" r="12" fill="#10B981"/><text x="200" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.7s"><circle cx="230" cy="40" r="12" fill="#10B981"/><text x="230" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.8s"><circle cx="260" cy="40" r="12" fill="#10B981"/><text x="260" y="44" fill="#fff">✓</text></g>
<g class="fix-runs" style="animation-delay:9.9s"><circle cx="290" cy="40" r="12" fill="#10B981"/><text x="290" y="44" fill="#fff">✓</text></g>
</g>
<text x="150" y="76" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">deterministic · web-first auto-retry</text>
</g>

<g transform="translate(40 310)">
<rect width="640" height="80" rx="10" fill="#1F2937"/>
<text x="320" y="24" text-anchor="middle" font-size="13" fill="#FCD34D" font-weight="bold">Flake is information, not bad luck · the trace decodes it</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#9CA3AF">If your test sleeps, your test is wrong</text>
<text x="320" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">expect().toBe…() auto-retries until satisfied or times out</text>
</g>
</svg>
<div class="caption">A waitForTimeout is a confession that you don't know what to wait for.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
