<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: CSS selectors break</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.5}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.before{animation:fade .4s ease .3s both}
.rename{animation:pop .5s ease 2s both,flash .8s ease 2.6s 2 both}
.css-fail{animation:fade .4s ease 4s both}
.role-pass{animation:fade .4s ease 6s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A CSS selector breaks when a class is renamed in a Tailwind upgrade, vs getByRole that survives untouched">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- BEFORE -->
<g class="before" transform="translate(40 30)">
<rect width="640" height="60" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="14" y="22" font-size="11" fill="#1F2937" font-weight="bold">Before · the test (both versions)</text>
<g font-family="ui-monospace,monospace" font-size="10">
<text x="14" y="42" fill="#7F1D1D">CSS:    page.locator('.btn-primary &gt; span:nth-child(2)')</text>
<text x="14" y="56" fill="#065F46">Role:   page.getByRole('button', {name: 'Submit'})</text>
</g>
</g>

<!-- TAILWIND UPGRADE -->
<g class="rename" transform="translate(140 110)">
<rect width="440" height="40" rx="8" fill="#FCA5A5" stroke="#7F1D1D" stroke-width="2"/>
<text x="220" y="24" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">Tailwind upgrade · class renamed: .btn-primary → .btn-cta</text>
</g>

<!-- CSS FAILS -->
<g class="css-fail" transform="translate(40 170)">
<rect width="320" height="180" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="11" fill="#7F1D1D" font-weight="bold">CSS-selector test</text>

<g font-family="ui-monospace,monospace" font-size="9">
<g transform="translate(14 38)">
<rect width="290" height="20" rx="3" fill="#7F1D1D"/>
<text x="145" y="14" text-anchor="middle" fill="#fff">✗ login.spec.ts</text>
</g>
<g transform="translate(14 62)">
<rect width="290" height="20" rx="3" fill="#7F1D1D"/>
<text x="145" y="14" text-anchor="middle" fill="#fff">✗ checkout.spec.ts</text>
</g>
<g transform="translate(14 86)">
<rect width="290" height="20" rx="3" fill="#7F1D1D"/>
<text x="145" y="14" text-anchor="middle" fill="#fff">✗ profile.spec.ts</text>
</g>
<g transform="translate(14 110)">
<rect width="290" height="20" rx="3" fill="#7F1D1D"/>
<text x="145" y="14" text-anchor="middle" fill="#fff">✗ ... 68 more failures</text>
</g>
</g>

<text x="160" y="160" text-anchor="middle" font-size="11" fill="#7F1D1D" font-weight="bold">71 tests broken overnight</text>
<text x="160" y="174" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">QA spends 2 days on selector triage</text>
</g>

<!-- ROLE PASSES -->
<g class="role-pass" transform="translate(380 170)">
<rect width="300" height="180" rx="8" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">getByRole test</text>

<g font-family="ui-monospace,monospace" font-size="9">
<g transform="translate(14 38)">
<rect width="270" height="20" rx="3" fill="#065F46"/>
<text x="135" y="14" text-anchor="middle" fill="#fff">✓ login.spec.ts</text>
</g>
<g transform="translate(14 62)">
<rect width="270" height="20" rx="3" fill="#065F46"/>
<text x="135" y="14" text-anchor="middle" fill="#fff">✓ checkout.spec.ts</text>
</g>
<g transform="translate(14 86)">
<rect width="270" height="20" rx="3" fill="#065F46"/>
<text x="135" y="14" text-anchor="middle" fill="#fff">✓ profile.spec.ts</text>
</g>
<g transform="translate(14 110)">
<rect width="270" height="20" rx="3" fill="#065F46"/>
<text x="135" y="14" text-anchor="middle" fill="#fff">✓ ... 68 more passing</text>
</g>
</g>

<text x="150" y="160" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">All 71 tests pass · zero changes</text>
<text x="150" y="174" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">role survived the rename</text>
</g>

<g transform="translate(40 365)">
<text x="320" y="14" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">CSS selectors test the implementation. getByRole tests the user.</text>
</g>
</svg>
<div class="caption">If a CSS class rename can break your tests, your tests aren't testing what users do.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
