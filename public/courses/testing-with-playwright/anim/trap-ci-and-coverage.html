<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: coverage as proxy</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes climb{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
@keyframes growBar{from{height:0;y:140}to{height:var(--h);y:var(--y)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.cov-line{stroke-dasharray:300;animation:climb 4s linear forwards}
.bug-bar{animation:fade .4s ease both}
.alarm{animation:pop .5s ease 4.5s both}
.fix-bar{animation:fade .5s ease 6.5s both}
.fix-result{animation:pop .5s ease 8s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="Coverage climbing to 95% while critical-path bugs ship to production, then a pivot to journey-based testing dropping bugs by 60%">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- BAD -->
<g transform="translate(40 30)">
<rect width="320" height="180" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">BEFORE · coverage as proxy</text>

<g transform="translate(20 36)">
<line x1="0" y1="120" x2="280" y2="120" stroke="#7F1D1D"/>
<line x1="0" y1="0" x2="0" y2="120" stroke="#7F1D1D"/>
<text x="-4" y="6" text-anchor="end" font-size="9" fill="#7F1D1D">100%</text>
<text x="-4" y="124" text-anchor="end" font-size="9" fill="#7F1D1D">0</text>

<polyline class="cov-line" points="0,80 60,60 120,40 180,18 280,12" stroke="#10B981" stroke-width="3" fill="none"/>
<text x="240" y="6" font-size="10" fill="#065F46" font-weight="bold">95%</text>

<!-- bug bars below -->
<g class="bug-bar" style="animation-delay:1s"><rect x="40" y="124" width="20" height="14" fill="#F43F5E"/></g>
<g class="bug-bar" style="animation-delay:1.5s"><rect x="80" y="124" width="20" height="18" fill="#F43F5E"/></g>
<g class="bug-bar" style="animation-delay:2s"><rect x="120" y="124" width="20" height="14" fill="#F43F5E"/></g>
<g class="bug-bar" style="animation-delay:2.5s"><rect x="160" y="124" width="20" height="20" fill="#F43F5E"/></g>
<g class="bug-bar" style="animation-delay:3s"><rect x="200" y="124" width="20" height="22" fill="#F43F5E"/></g>
<g class="bug-bar" style="animation-delay:3.5s"><rect x="240" y="124" width="20" height="18" fill="#F43F5E"/></g>
<text x="140" y="170" text-anchor="middle" font-size="9" fill="#7F1D1D">prod bugs (per month)</text>
</g>
</g>

<g class="alarm" transform="translate(40 230)">
<rect width="320" height="60" rx="10" fill="#7F1D1D"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#FCA5A5" font-weight="bold">95% covered · 14 critical-path bugs</text>
<text x="160" y="42" text-anchor="middle" font-size="10" fill="#FCA5A5">covered the trivial · skipped the user journeys</text>
</g>

<!-- FIX -->
<g transform="translate(380 30)">
<rect width="300" height="180" rx="8" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">AFTER · top-5 user journeys</text>

<g class="fix-bar" transform="translate(20 36)">
<text x="0" y="14" font-size="10" fill="#065F46" font-weight="bold">journey · status</text>
<g font-family="ui-monospace,monospace" font-size="9">
<text x="0" y="34" fill="#065F46">1. signup → first-purchase</text>
<text x="240" y="34" fill="#065F46" text-anchor="end">✓ tested</text>
<text x="0" y="50" fill="#065F46">2. checkout → payment</text>
<text x="240" y="50" fill="#065F46" text-anchor="end">✓ tested</text>
<text x="0" y="66" fill="#065F46">3. login → core action</text>
<text x="240" y="66" fill="#065F46" text-anchor="end">✓ tested</text>
<text x="0" y="82" fill="#065F46">4. settings → save</text>
<text x="240" y="82" fill="#065F46" text-anchor="end">✓ tested</text>
<text x="0" y="98" fill="#065F46">5. delete-account flow</text>
<text x="240" y="98" fill="#065F46" text-anchor="end">✓ tested</text>
</g>
<text x="120" y="124" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">coverage drops to 76%</text>
<text x="120" y="138" text-anchor="middle" font-size="10" fill="#065F46" font-weight="bold">but the right 76%</text>
</g>
</g>

<g class="fix-result" transform="translate(380 230)">
<rect width="300" height="60" rx="10" fill="#065F46"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#A7F3D0" font-weight="bold">76% covered · 6 prod bugs</text>
<text x="150" y="42" text-anchor="middle" font-size="10" fill="#A7F3D0">→ 60% drop · same headcount</text>
</g>

<g transform="translate(40 305)">
<rect width="640" height="80" rx="10" fill="#1F2937"/>
<text x="320" y="24" text-anchor="middle" font-size="13" fill="#FCD34D" font-weight="bold">Coverage % is a proxy · journey coverage is the goal</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#9CA3AF">a 95% number that misses the top-5 journeys is worse than a 70% number that doesn't</text>
<text x="320" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">test what users do · skip the rest</text>
</g>
</svg>
<div class="caption">A coverage badge tells you nothing about whether the things users actually do are tested.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
