<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: the dashboard delusion</title>
<style>
:root { --bg:#FFF7ED; --ink:#1F2937; --bad:#F43F5E; --good:#10B981; --warn:#F59E0B; --accent:#8B5CF6; --paper:#FFFFFF; }
* { box-sizing: border-box; }
html, body { margin:0; padding:0; background:var(--bg); color:var(--ink); font-family: system-ui,-apple-system,"Inter",sans-serif; }
.stage { width:100%; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
.frame { width:100%; max-width:720px; }
.caption { text-align:center; font-size:13px; font-style:italic; color:#6B7280; margin-top:8px; }
.reset { position:fixed; right:12px; bottom:12px; padding:6px 10px; font-size:11px; background:#fff; border:1px solid #d1d5db; border-radius:6px; cursor:pointer; }
@keyframes pop { 0%{opacity:0;transform:scale(.6)} 70%{transform:scale(1.06)} 100%{opacity:1;transform:scale(1)} }
@keyframes dim { 0%,80%{opacity:1} 100%{opacity:.18} }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
@keyframes flash { 0%,100%{opacity:1} 50%{opacity:.4} }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.widget { transform-origin: center; animation: pop .55s cubic-bezier(0.22,0.61,0.36,1) both, dim 14s linear forwards; }
.notion-frame { animation: dim 14s linear forwards; }
.note-tile { animation: fadeIn .5s cubic-bezier(0.22,0.61,0.36,1) both; }
.tick { animation: pop .4s cubic-bezier(0.22,0.61,0.36,1) both; }
.lost-link { animation: flash 1s ease 7s 2 both; }
</style>
</head>
