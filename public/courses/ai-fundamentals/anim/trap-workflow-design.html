<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: ship and forget</title>
<style>
:root{--bg:#FAF5FF;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drawLine{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@keyframes drawLineFix{from{stroke-dashoffset:600}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.bad-line{stroke-dasharray:600;animation:drawLine 6s linear forwards}
.fix-line{stroke-dasharray:600;animation:drawLineFix 6s linear 6s forwards}
.point{animation:fade .3s ease both}
.tweet{animation:fade .5s ease 5.5s both}
.audit{animation:fade .5s ease 10s both}
</style>
</head>
<body>
<main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="An AI feature shipped at 92% accuracy drifting to 80% over six months unnoticed, vs the same feature with a 14-day audit catching the drop early">
<rect width="720" height="405" rx="14" fill="#FAF5FF"/>

<!-- AXES -->
<g transform="translate(60 50)">
<line x1="0" y1="240" x2="600" y2="240" stroke="#5B21B6" stroke-width="2"/>
<line x1="0" y1="0" x2="0" y2="240" stroke="#5B21B6" stroke-width="2"/>
<text x="-8" y="6" text-anchor="end" font-size="10" fill="#5B21B6">100%</text>
<text x="-8" y="62" text-anchor="end" font-size="10" fill="#5B21B6">90%</text>
<text x="-8" y="120" text-anchor="end" font-size="10" fill="#5B21B6">80%</text>
<text x="-8" y="244" text-anchor="end" font-size="10" fill="#5B21B6">0</text>
<text x="0" y="258" font-size="9" fill="#5B21B6">launch</text>
<text x="148" y="258" font-size="9" fill="#5B21B6">m1</text>
<text x="298" y="258" font-size="9" fill="#5B21B6">m3</text>
<text x="448" y="258" font-size="9" fill="#5B21B6">m6</text>
<text x="595" y="258" font-size="9" fill="#5B21B6">m9</text>
<text x="280" y="278" font-size="11" fill="#5B21B6" font-style="italic">months in production</text>

<!-- BAD: drift to 80%, no eval, twitter complaint -->
<polyline class="bad-line" points="0,40 75,46 150,52 225,64 300,82 375,108 450,128 525,140 600,140" stroke="#F43F5E" stroke-width="3" fill="none"/>
<g class="point" style="animation-delay:.1s"><circle cx="0" cy="40" r="4" fill="#10B981"/></g>
<g class="point" style="animation-delay:5s"><circle cx="525" cy="140" r="6" fill="#7F1D1D"/></g>
<text x="525" y="170" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">drifted to 80%</text>

<g class="tweet" transform="translate(525 -10)">
<rect width="80" height="40" rx="6" fill="#FECACA" stroke="#7F1D1D"/>
<text x="40" y="14" text-anchor="middle" font-size="9" fill="#7F1D1D" font-weight="bold">@user 🤡</text>
<text x="40" y="26" text-anchor="middle" font-size="8" fill="#7F1D1D">"this is broken"</text>
<text x="40" y="36" text-anchor="middle" font-size="7" fill="#7F1D1D">2.4K retweets</text>
</g>

<!-- FIX: with audit, caught at week 6 -->
<polyline class="fix-line" points="0,40 75,42 150,46 225,52 300,46 375,40 450,38 525,38 600,38" stroke="#10B981" stroke-width="3" fill="none"/>
<g class="audit" transform="translate(150 60)">
<circle r="6" fill="#F59E0B" stroke="#92400E" stroke-width="2"/>
<text x="0" y="22" text-anchor="middle" font-size="10" fill="#92400E" font-weight="bold">14-day audit</text>
<text x="0" y="34" text-anchor="middle" font-size="9" fill="#92400E">catches drop</text>
</g>
<text x="600" y="34" text-anchor="end" font-size="10" fill="#065F46" font-style="italic">held at 92%</text>
</g>

<!-- BOTTOM BANNER -->
<g class="audit" style="animation-delay:11s" transform="translate(40 340)">
<rect width="640" height="50" rx="8" fill="#1F2937"/>
<text x="320" y="22" text-anchor="middle" font-size="12" fill="#FCD34D" font-weight="bold">Day 1: ship eval set, define alert thresholds, set 14-day audit cadence</text>
<text x="320" y="38" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">production traffic is unlabeled — only an eval set tells you when quality drops</text>
</g>
</svg>
<div class="caption">No eval set on day 1, no monitoring, no alert thresholds = ship and forget.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body>
</html>
