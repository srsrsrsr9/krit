<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: Magic black box</title>
<style>
  :root {
    --bg: #FFF7ED;
    --ink: #1F2937;
    --muted: #6B7280;
    --paper: #FFFFFF;
    --line: #E5E7EB;
    --accent: #F59E0B;
    --good: #10B981;
    --bad: #F43F5E;
    --violet: #8B5CF6;
    --sky: #0EA5E9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Inter", sans-serif;
  }
  .stage {
    width: 100%; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 820px; }
  .frame { width: 100%; aspect-ratio: 16/9; display: block; }
  .caption {
    text-align: center; font-size: 13px; font-style: italic;
    color: var(--muted); margin-top: 10px; padding: 0 12px;
  }
  .reset {
    position: fixed; right: 14px; bottom: 14px;
    border: 1.5px solid var(--ink); background: var(--paper);
    color: var(--ink); font: 600 12px system-ui, sans-serif;
    padding: 6px 10px; border-radius: 8px; cursor: pointer;
  }
  .reset:hover { background: var(--bg); }
  text { font-family: system-ui, -apple-system, "Inter", sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .label { font-size: 13px; }
  .hed { font-size: 18px; font-weight: 700; }
  .small { font-size: 11px; fill: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .anim { animation: none !important; opacity: 1 !important; transform: none !important; }
    .pulse, .shake { animation: none !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg class="frame" viewBox="0 0 820 460" aria-label="A person asks an LLM to predict a stock price; the model gives a confident wrong answer because it is just a next-token predictor.">
      <defs>
        <clipPath id="boxClip"><rect x="40" y="80" width="320" height="280" rx="14"/></clipPath>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0,0 L10,5 L0,10 Z" fill="#1F2937"/>
        </marker>
      </defs>

      <!-- ===================== SCENE 1: confident answer ===================== -->
      <g class="scene s1">
        <!-- Person -->
        <g transform="translate(80,210)">
          <circle cx="0" cy="0" r="22" fill="#FEF3C7" stroke="#1F2937" stroke-width="2"/>
          <circle cx="-7" cy="-3" r="2" fill="#1F2937"/>
          <circle cx="7" cy="-3" r="2" fill="#1F2937"/>
          <path d="M-7,8 Q0,12 7,8" fill="none" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
          <rect x="-22" y="22" width="44" height="44" rx="10" fill="#FEF3C7" stroke="#1F2937" stroke-width="2"/>
        </g>

        <!-- Question bubble -->
        <g transform="translate(140,160)">
          <rect x="0" y="0" width="240" height="68" rx="12" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
          <path d="M14,68 L8,82 L26,68 Z" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
          <text x="14" y="26" class="label">predict tomorrow's</text>
          <text x="14" y="46" class="label">stock price for INFY</text>
        </g>

        <!-- Black-ish box (LLM) -->
        <g class="llm-box">
          <rect x="430" y="120" width="280" height="200" rx="18" fill="#1F2937"/>
          <rect x="430" y="120" width="280" height="200" rx="18" fill="url(#none)" stroke="#F59E0B" stroke-width="2"/>
          <text x="570" y="155" text-anchor="middle" class="hed" fill="#FEF3C7">LLM</text>
          <text x="570" y="178" text-anchor="middle" class="small" fill="#FEF3C7" opacity="0.75">large language model</text>
          <!-- subtle sparkle -->
          <g class="sparkle">
            <circle cx="465" cy="150" r="2" fill="#FEF3C7"/>
            <circle cx="690" cy="170" r="2" fill="#FEF3C7"/>
            <circle cx="455" cy="290" r="2" fill="#FEF3C7"/>
            <circle cx="695" cy="295" r="2" fill="#FEF3C7"/>
          </g>
        </g>

        <!-- Confident answer -->
        <g class="answer" opacity="0">
          <rect x="450" y="200" width="240" height="80" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
          <text x="570" y="232" text-anchor="middle" class="hed mono" fill="#1F2937">₹2,847.32</text>
          <g class="check">
            <circle cx="660" cy="230" r="14" fill="#10B981"/>
            <path d="M652,231 L658,237 L668,224" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <text x="570" y="262" text-anchor="middle" class="small">"high confidence"</text>
        </g>

        <!-- Stage 1 caption -->
        <text x="410" y="420" text-anchor="middle" class="label" fill="#6B7280">
          <tspan class="t1" opacity="0">a confident answer arrives in 0.4 seconds</tspan>
        </text>
      </g>

      <!-- ===================== SCENE 2: zoom inside ===================== -->
      <g class="scene s2" opacity="0">
        <!-- Inner panel -->
        <rect x="60" y="80" width="700" height="300" rx="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
        <text x="410" y="112" text-anchor="middle" class="hed">inside the box: next-token prediction</text>

        <!-- Tokens -->
        <g transform="translate(90,150)">
          <!-- prompt tokens -->
          <g class="tok t-pre">
            <rect x="0" y="0" width="68" height="34" rx="8" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1.5"/>
            <text x="34" y="22" text-anchor="middle" class="mono label">predict</text>
          </g>
          <g class="tok t-pre" transform="translate(76,0)">
            <rect x="0" y="0" width="80" height="34" rx="8" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1.5"/>
            <text x="40" y="22" text-anchor="middle" class="mono label">tomorrow</text>
          </g>
          <g class="tok t-pre" transform="translate(164,0)">
            <rect x="0" y="0" width="60" height="34" rx="8" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1.5"/>
            <text x="30" y="22" text-anchor="middle" class="mono label">stock</text>
          </g>
          <g class="tok t-pre" transform="translate(232,0)">
            <rect x="0" y="0" width="68" height="34" rx="8" fill="#EFF6FF" stroke="#0EA5E9" stroke-width="1.5"/>
            <text x="34" y="22" text-anchor="middle" class="mono label">price...</text>
          </g>

          <!-- arrow -->
          <line class="arr" x1="310" y1="17" x2="358" y2="17" stroke="#1F2937" stroke-width="2" marker-end="url(#arrow)"/>

          <!-- next-token candidates -->
          <g class="tok t-next" transform="translate(370,-46)">
            <rect x="0" y="0" width="180" height="22" rx="6" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
            <text x="8" y="16" class="mono small" fill="#1F2937">"₹2,847.32"</text>
            <text x="118" y="16" class="mono small" fill="#1F2937">p=0.18</text>
          </g>
          <g class="tok t-next" transform="translate(370,-18)">
            <rect x="0" y="0" width="180" height="22" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
            <text x="8" y="16" class="mono small" fill="#6B7280">"₹3,120.40"</text>
            <text x="118" y="16" class="mono small" fill="#6B7280">p=0.11</text>
          </g>
          <g class="tok t-next" transform="translate(370,10)">
            <rect x="0" y="0" width="180" height="22" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
            <text x="8" y="16" class="mono small" fill="#6B7280">"around ₹2,800"</text>
            <text x="118" y="16" class="mono small" fill="#6B7280">p=0.09</text>
          </g>
          <g class="tok t-next" transform="translate(370,38)">
            <rect x="0" y="0" width="180" height="22" rx="6" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
            <text x="8" y="16" class="mono small" fill="#6B7280">"I cannot say"</text>
            <text x="118" y="16" class="mono small" fill="#6B7280">p=0.03</text>
          </g>
        </g>

        <!-- pattern source: training corpus -->
        <g transform="translate(90,260)" class="corp">
          <text x="0" y="0" class="label">pattern matched against training text</text>
          <g transform="translate(0,12)">
            <rect x="0" y="0" width="600" height="64" rx="10" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.5"/>
            <text x="14" y="22" class="mono small" fill="#1F2937">"…the closing price of INFY was ₹2,847.32 yesterday…"</text>
            <text x="14" y="40" class="mono small" fill="#6B7280">"…analysts predict ₹3,120 for next quarter…"</text>
            <text x="14" y="58" class="mono small" fill="#6B7280">— text from 2023, not actually about tomorrow</text>
          </g>
        </g>

        <text x="410" y="412" text-anchor="middle" class="label" fill="#6B7280">no crystal ball — pattern completion that *sounds* right</text>
      </g>

      <!-- ===================== SCENE 3: ✓ becomes ✗ ===================== -->
      <g class="scene s3" opacity="0">
        <rect x="60" y="80" width="700" height="300" rx="18" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>

        <text x="410" y="118" text-anchor="middle" class="hed">tomorrow's actual close</text>
        <text x="410" y="170" text-anchor="middle" class="hed mono" font-size="32" fill="#1F2937">₹2,612.85</text>
        <text x="410" y="194" text-anchor="middle" class="small">predicted ₹2,847.32 → off by 8.9%</text>

        <!-- check turning into cross -->
        <g class="convert" transform="translate(410,260)">
          <circle cx="0" cy="0" r="34" fill="#F43F5E"/>
          <g class="x-mark">
            <line x1="-12" y1="-12" x2="12" y2="12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
            <line x1="12" y1="-12" x2="-12" y2="12" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
          </g>
        </g>

        <text x="410" y="338" text-anchor="middle" class="label" font-weight="700">
          the model is good at confident, not at correct.
        </text>
      </g>

      <!-- master timeline (CSS-only). 14s loop. -->
      <style>
        .scene { transition: opacity 0.4s; }
        .s1 { animation: s1 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .s2 { animation: s2 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .s3 { animation: s3 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }

        .answer { animation: pop 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .check  { animation: check 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .t1     { animation: t1 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .sparkle circle { animation: sp 2.4s ease-in-out infinite; }
        .sparkle circle:nth-child(2) { animation-delay: 0.6s; }
        .sparkle circle:nth-child(3) { animation-delay: 1.2s; }
        .sparkle circle:nth-child(4) { animation-delay: 1.8s; }

        .t-pre { opacity: 0; animation: tokIn 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .t-pre:nth-child(1) { animation-delay: 0s; }
        .t-pre:nth-child(2) { animation-delay: 0.15s; }
        .t-pre:nth-child(3) { animation-delay: 0.3s; }
        .t-pre:nth-child(4) { animation-delay: 0.45s; }

        .t-next { opacity: 0; animation: tokNext 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .t-next:nth-child(2) { animation-delay: 0.1s; }
        .t-next:nth-child(3) { animation-delay: 0.2s; }
        .t-next:nth-child(4) { animation-delay: 0.3s; }
        .arr { stroke-dasharray: 60; stroke-dashoffset: 60; animation: dash 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .corp { opacity: 0; animation: corpIn 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }

        .convert circle { animation: morph 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }
        .x-mark { opacity: 0; animation: xIn 14s cubic-bezier(0.22, 0.61, 0.36, 1) infinite; }

        @keyframes s1 {
          0%, 32% { opacity: 1; }
          34%, 100% { opacity: 0; }
        }
        @keyframes s2 {
          0%, 33% { opacity: 0; }
          37%, 70% { opacity: 1; }
          74%, 100% { opacity: 0; }
        }
        @keyframes s3 {
          0%, 71% { opacity: 0; }
          75%, 96% { opacity: 1; }
          100% { opacity: 0; }
        }
        @keyframes pop {
          0%, 14% { opacity: 0; transform: scale(0.94); transform-origin: 570px 240px; }
          18%, 32% { opacity: 1; transform: scale(1); }
          34%, 100% { opacity: 0; transform: scale(1); }
        }
        @keyframes check {
          0%, 18% { opacity: 0; transform: scale(0.6); transform-origin: 660px 230px; }
          22%, 32% { opacity: 1; transform: scale(1); }
          34%, 100% { opacity: 0; }
        }
        @keyframes t1 {
          0%, 22% { opacity: 0; }
          26%, 32% { opacity: 1; }
          34%, 100% { opacity: 0; }
        }
        @keyframes sp {
          0%, 100% { opacity: 0.2; }
          50% { opacity: 1; }
        }
        @keyframes tokIn {
          0%, 35% { opacity: 0; transform: translateY(6px); }
          40%, 70% { opacity: 1; transform: translateY(0); }
          74%, 100% { opacity: 0; }
        }
        @keyframes tokNext {
          0%, 50% { opacity: 0; transform: translateY(0); }
          54%, 70% { opacity: 1; }
          74%, 100% { opacity: 0; }
        }
        @keyframes dash {
          0%, 48% { stroke-dashoffset: 60; }
          54%, 70% { stroke-dashoffset: 0; }
          74%, 100% { stroke-dashoffset: 60; }
        }
        @keyframes corpIn {
          0%, 58% { opacity: 0; }
          64%, 70% { opacity: 1; }
          74%, 100% { opacity: 0; }
        }
        @keyframes morph {
          0%, 75% { fill: #10B981; }
          80%, 96% { fill: #F43F5E; }
          100% { fill: #10B981; }
        }
        @keyframes xIn {
          0%, 78% { opacity: 0; transform: rotate(-15deg); transform-origin: 410px 260px; }
          82%, 96% { opacity: 1; transform: rotate(0deg); }
          100% { opacity: 0; }
        }
      </style>
    </svg>
    <div class="caption">a stock-price prediction looks like an answer; under the hood it is pattern completion.</div>
  </div>
</main>
</body>
</html>
