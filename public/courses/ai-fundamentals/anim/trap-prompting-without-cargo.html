<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: Just ask nicely</title>
<style>
  :root {
    --bg: #FFF7ED;
    --ink: #1F2937;
    --muted: #6B7280;
    --paper: #FFFFFF;
    --line: #E5E7EB;
    --accent: #F59E0B;
    --good: #10B981;
    --bad: #F43F5E;
    --violet: #8B5CF6;
    --sky: #0EA5E9;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Inter", sans-serif;
  }
  .stage {
    width: 100%; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .wrap { width: 100%; max-width: 860px; }
  .frame { width: 100%; aspect-ratio: 16/9; display: block; }
  .caption {
    text-align: center; font-size: 13px; font-style: italic;
    color: var(--muted); margin-top: 10px; padding: 0 12px;
  }
  text { font-family: system-ui, -apple-system, "Inter", sans-serif; fill: var(--ink); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .label { font-size: 12.5px; }
  .small { font-size: 11px; fill: var(--muted); }
  .hed { font-size: 16px; font-weight: 700; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .barFill { width: var(--w, 0) !important; }
  }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg class="frame" viewBox="0 0 860 484" aria-label="A vague prompt produces a generic SaaS email; the same task with role, context, task, format, and an example produces a tightly scoped output. A quality bar rises on the right.">

      <!-- ============ LEFT: vague prompt ============ -->
      <g transform="translate(20,30)">
        <text x="0" y="0" class="hed">vague prompt</text>
        <rect x="0" y="14" width="380" height="74" rx="12" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="2"/>
        <text x="14" y="36" class="mono small" fill="#1F2937">user:</text>
        <text x="14" y="58" class="label">"please write me a really good</text>
        <text x="14" y="76" class="label">marketing email!"</text>

        <!-- arrow -->
        <line x1="190" y1="98" x2="190" y2="120" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
        <polygon points="184,116 196,116 190,126" fill="#1F2937"/>

        <!-- generic SaaS output -->
        <rect x="0" y="130" width="380" height="170" rx="12" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2"/>
        <text x="14" y="154" class="hed" fill="#1F2937">Subject: Unlock Your Full Potential 🚀</text>
        <g class="vagueLines">
          <rect x="14" y="166" width="320" height="6" rx="3" fill="#E5E7EB"/>
          <rect x="14" y="180" width="350" height="6" rx="3" fill="#E5E7EB"/>
          <rect x="14" y="194" width="280" height="6" rx="3" fill="#E5E7EB"/>
          <rect x="14" y="208" width="340" height="6" rx="3" fill="#E5E7EB"/>
          <rect x="14" y="222" width="200" height="6" rx="3" fill="#E5E7EB"/>
        </g>
        <text x="14" y="252" class="small" fill="#8B5CF6">"Hi there! In today's fast-paced world,</text>
        <text x="14" y="268" class="small" fill="#8B5CF6">leveraging cutting-edge solutions is..."</text>
        <text x="14" y="288" class="small" fill="#F43F5E" font-weight="700">— sounds like every other landing page.</text>
      </g>

      <!-- ============ RIGHT: structured prompt ============ -->
      <g transform="translate(440,30)" class="rightBlock">
        <text x="0" y="0" class="hed">role · context · task · format · example</text>
        <rect x="0" y="14" width="280" height="158" rx="12" fill="#FFFFFF" stroke="#10B981" stroke-width="2"/>

        <g class="row r1">
          <rect x="10" y="24" width="44" height="18" rx="5" fill="#ECFDF5"/>
          <text x="32" y="37" text-anchor="middle" class="small" fill="#10B981" font-weight="700">ROLE</text>
          <text x="62" y="37" class="small" fill="#1F2937">B2B SaaS copywriter, Indian fintech.</text>
        </g>
        <g class="row r2">
          <rect x="10" y="48" width="62" height="18" rx="5" fill="#ECFDF5"/>
          <text x="41" y="61" text-anchor="middle" class="small" fill="#10B981" font-weight="700">CONTEXT</text>
          <text x="80" y="61" class="small" fill="#1F2937">CFOs at series-B startups.</text>
        </g>
        <g class="row r3">
          <rect x="10" y="72" width="44" height="18" rx="5" fill="#ECFDF5"/>
          <text x="32" y="85" text-anchor="middle" class="small" fill="#10B981" font-weight="700">TASK</text>
          <text x="62" y="85" class="small" fill="#1F2937">Re-engage trial users on day 9.</text>
        </g>
        <g class="row r4">
          <rect x="10" y="96" width="56" height="18" rx="5" fill="#ECFDF5"/>
          <text x="38" y="109" class="small" text-anchor="middle" fill="#10B981" font-weight="700">FORMAT</text>
          <text x="74" y="109" class="small" fill="#1F2937">subject + 3 short paragraphs + CTA.</text>
        </g>
        <g class="row r5">
          <rect x="10" y="120" width="58" height="18" rx="5" fill="#ECFDF5"/>
          <text x="39" y="133" class="small" text-anchor="middle" fill="#10B981" font-weight="700">EXAMPLE</text>
          <text x="76" y="133" class="small" fill="#1F2937">[paste 1 best-performing email]</text>
        </g>
        <text x="10" y="156" class="small" fill="#6B7280">+ constraint: no emoji, no buzzwords.</text>

        <!-- arrow -->
        <line x1="140" y1="180" x2="140" y2="202" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
        <polygon points="134,198 146,198 140,208" fill="#1F2937"/>

        <!-- tight output -->
        <rect x="0" y="210" width="280" height="170" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
        <text x="10" y="234" class="hed" fill="#1F2937">Subject: still on the fence?</text>
        <g class="tightLines">
          <rect x="10" y="246" width="220" height="6" rx="3" fill="#10B981" opacity="0.55"/>
          <rect x="10" y="260" width="240" height="6" rx="3" fill="#10B981" opacity="0.55"/>
          <rect x="10" y="274" width="180" height="6" rx="3" fill="#10B981" opacity="0.55"/>
          <rect x="10" y="288" width="220" height="6" rx="3" fill="#10B981" opacity="0.55"/>
        </g>
        <text x="10" y="316" class="small" fill="#1F2937">"Hi {{first}}, you set up reconciliation</text>
        <text x="10" y="330" class="small" fill="#1F2937">on day 1 and stopped at vendor sync.</text>
        <text x="10" y="344" class="small" fill="#1F2937">15-min call with our CFO partner?"</text>
        <text x="10" y="368" class="small" fill="#10B981" font-weight="700">— specific, sendable, on-brand.</text>
      </g>

      <!-- ============ Quality bar (rising) ============ -->
      <g transform="translate(740,40)">
        <text x="38" y="0" text-anchor="middle" class="hed">quality</text>
        <rect x="14" y="14" width="48" height="340" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
        <!-- ticks -->
        <line x1="62" y1="86"  x2="74" y2="86"  stroke="#6B7280" stroke-width="1.5"/>
        <line x1="62" y1="184" x2="74" y2="184" stroke="#6B7280" stroke-width="1.5"/>
        <line x1="62" y1="282" x2="74" y2="282" stroke="#6B7280" stroke-width="1.5"/>
        <text x="78" y="90"  class="small">ships</text>
        <text x="78" y="188" class="small">ok</text>
        <text x="78" y="286" class="small">vague</text>

        <!-- fill -->
        <rect class="barFill" x="16" y="14" width="44" height="340" rx="9" fill="#F59E0B"/>
        <text x="38" y="376" text-anchor="middle" class="mono label" id="pct">28%</text>
      </g>

      <!-- footnote -->
      <text x="430" y="468" text-anchor="middle" class="label" fill="#6B7280">
        prompt structure beats prompt length. cargo-culted "please" doesn't move the needle.
      </text>
    </svg>
    <div class="caption">RCTFE = Role, Context, Task, Format, Example. Cheap leverage.</div>
  </div>
</main>
<script>
  (function(){
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const bar = document.querySelector('.barFill');
    const pct = document.getElementById('pct');
    const rows = ['.r1','.r2','.r3','.r4','.r5'].map(s => document.querySelector(s));
    rows.forEach(r => { r.style.opacity = 0; r.style.transition = 'opacity 0.4s cubic-bezier(0.22,0.61,0.36,1)'; });

    function setQuality(q) {
      // q is 0..1; bar grows up from bottom. y starts at 354, height up to 340
      const maxH = 340;
      const h = Math.round(q * maxH);
      const y = 14 + (maxH - h);
      bar.setAttribute('y', y);
      bar.setAttribute('height', h);
      bar.setAttribute('fill', q < 0.4 ? '#F43F5E' : (q < 0.7 ? '#F59E0B' : '#10B981'));
      pct.textContent = Math.round(q * 100) + '%';
    }

    if (reduce) {
      rows.forEach(r => r.style.opacity = 1);
      setQuality(0.92);
      return;
    }

    const T = 12000;
    const t0 = performance.now();
    function easeOutCubic(t){ return 1 - Math.pow(1 - t, 3); }

    function tick(now) {
      const t = ((now - t0) % T) / T;

      // initial vague: bar low
      let q;
      if (t < 0.18) {
        q = 0.28;
        rows.forEach(r => r.style.opacity = 0);
      } else if (t < 0.62) {
        // rows light up sequentially; bar climbs
        const local = (t - 0.18) / 0.44;
        rows.forEach((r, i) => {
          r.style.opacity = local > (i * 0.18) ? 1 : 0;
        });
        q = 0.28 + easeOutCubic(local) * (0.92 - 0.28);
      } else if (t < 0.92) {
        rows.forEach(r => r.style.opacity = 1);
        q = 0.92;
      } else {
        // fade rows to reset
        const local = (t - 0.92) / 0.08;
        rows.forEach(r => r.style.opacity = 1 - local);
        q = 0.92 - local * (0.92 - 0.28);
      }
      setQuality(q);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  })();
</script>
</body>
</html>
