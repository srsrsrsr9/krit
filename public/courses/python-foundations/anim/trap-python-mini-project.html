<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: errors='ignore'</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes flow{0%{transform:translateX(0);opacity:1}45%{transform:translateX(170px);opacity:1}50%{transform:translateX(180px);opacity:0}100%{transform:translateX(180px);opacity:0}}
@keyframes flowSafe{0%{transform:translateX(0);opacity:1}100%{transform:translateX(380px);opacity:1}}
@keyframes appear{from{opacity:0}to{opacity:1}}
@keyframes alarm{0%,100%{fill:#FCA5A5}50%{fill:#F43F5E}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.token-rupee{animation:flow 5s cubic-bezier(0.22,0.61,0.36,1) 1s 2 both}
.token-other{animation:flowSafe 5s cubic-bezier(0.22,0.61,0.36,1) 1s 2 both}
.bad-output{animation:appear .5s ease 6s both}
.alarm{animation:appear .5s ease 8s both,alarm 1s ease 8.5s 3 both}
.fix-block{animation:appear .5s ease 10s both}
</style>
</head>
<body>
<main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A CSV containing a rupee symbol passing through errors='ignore' and silently losing the symbol; the report mis-states a number">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- INPUT CSV -->
<g transform="translate(40 80)">
<rect width="140" height="110" rx="8" fill="#FFFFFF" stroke="#1F2937" stroke-width="2"/>
<text x="70" y="22" text-anchor="middle" font-size="11" fill="#1F2937" font-weight="bold">orders.csv</text>
<line x1="0" y1="30" x2="140" y2="30" stroke="#1F2937"/>
<text x="14" y="48" font-family="ui-monospace,monospace" font-size="11" fill="#1F2937">id, amount</text>
<text x="14" y="68" font-family="ui-monospace,monospace" font-size="11" fill="#1F2937">1, $45.00</text>
<text x="14" y="86" font-family="ui-monospace,monospace" font-size="11" fill="#9D174D" font-weight="bold">2, ₹45,000</text>
<text x="14" y="104" font-family="ui-monospace,monospace" font-size="11" fill="#1F2937">3, $200.00</text>
</g>

<!-- PARSER -->
<g transform="translate(220 90)">
<rect width="180" height="90" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="90" y="32" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7F1D1D" font-weight="bold">open(path,</text>
<text x="90" y="48" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7F1D1D" font-weight="bold">encoding='utf-8',</text>
<text x="90" y="64" text-anchor="middle" font-family="ui-monospace,monospace" font-size="10" fill="#7F1D1D" font-weight="bold">errors='ignore')</text>
<text x="90" y="82" text-anchor="middle" font-size="9" fill="#7F1D1D" font-style="italic">silently drops bad bytes</text>
</g>

<!-- FLOW: rupee disappears halfway, others survive -->
<g class="token-rupee">
<rect x="180" y="100" width="42" height="20" rx="4" fill="#9D174D"/>
<text x="201" y="114" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#fff" font-weight="bold">₹</text>
</g>
<g class="token-other">
<rect x="180" y="135" width="42" height="20" rx="4" fill="#10B981"/>
<text x="201" y="149" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#fff" font-weight="bold">$</text>
</g>

<!-- OUTPUT (corrupted) -->
<g class="bad-output" transform="translate(440 80)">
<rect width="200" height="110" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="100" y="22" text-anchor="middle" font-size="11" fill="#7F1D1D" font-weight="bold">parsed.csv</text>
<line x1="0" y1="30" x2="200" y2="30" stroke="#7F1D1D"/>
<text x="14" y="48" font-family="ui-monospace,monospace" font-size="11" fill="#7F1D1D">1, $45.00</text>
<text x="14" y="68" font-family="ui-monospace,monospace" font-size="11" fill="#7F1D1D" font-weight="bold">2, 45,000  ⚠</text>
<text x="14" y="86" font-family="ui-monospace,monospace" font-size="11" fill="#7F1D1D">3, $200.00</text>
<text x="100" y="104" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">₹ silently dropped</text>
</g>

<!-- ALARM -->
<g class="alarm" transform="translate(140 220)">
<rect width="440" height="50" rx="8" fill="#FCA5A5" stroke="#7F1D1D" stroke-width="2"/>
<text x="220" y="22" text-anchor="middle" font-size="13" fill="#7F1D1D" font-weight="bold">Q4 report shows ₹45,000 sale as $45,000</text>
<text x="220" y="40" text-anchor="middle" font-size="11" fill="#7F1D1D">compliance audit: failed</text>
</g>

<!-- FIX -->
<g class="fix-block" transform="translate(40 300)">
<rect width="640" height="80" rx="8" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="20" y="28" font-family="ui-monospace,monospace" font-size="13" fill="#064E3B" font-weight="bold">Fix → open(path, encoding='utf-8-sig')   # raises on bad bytes</text>
<text x="20" y="50" font-family="sans-serif" font-size="11" fill="#065F46">Bad input fails LOUDLY at the boundary; downstream stays clean.</text>
<text x="20" y="68" font-family="sans-serif" font-size="11" fill="#065F46" font-style="italic">never use errors='ignore' to mask boundary problems.</text>
</g>
</svg>
<div class="caption">Bad data at the boundary should fail loudly, not get silently mutilated.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body>
</html>
