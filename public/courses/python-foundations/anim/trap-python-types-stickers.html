<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Mutable Default Trap</title>
<style>
  :root {
    --bg: #FFF7ED;
    --ink: #1F2937;
    --muted: #6B7280;
    --bad: #F43F5E;
    --good: #10B981;
    --warn: #F59E0B;
    --code: #FAF5FF;
    --line: #E5E7EB;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Inter", sans-serif;
  }
  .stage {
    width: 100%;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }
  .frame {
    width: 100%;
    max-width: 760px;
    aspect-ratio: 16/10;
    display: block;
  }
  .caption {
    text-align: center;
    font-size: 13px;
    font-style: italic;
    color: var(--muted);
    margin-top: 10px;
    max-width: 760px;
  }
  text { font-family: system-ui, -apple-system, sans-serif; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .reveal { opacity: 1 !important; }
  }
html,body{overflow:hidden;margin:0;padding:0}</style>
</head>
<body>
<main class="stage">
  <div>
    <svg class="frame" viewBox="0 0 760 475" aria-label="Animation showing how a mutable default argument in Python persists across function calls, accumulating state, and how using None as a sentinel fixes it.">
      <defs>
        <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
          <feGaussianBlur stdDeviation="1.4"/>
        </filter>
      </defs>

      <!-- title -->
      <text x="380" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">
        The basket that never empties
      </text>
      <text x="380" y="52" text-anchor="middle" font-size="13" fill="#6B7280">
        def add(item, basket=[]) — Python evaluates [] once, at definition time
      </text>

      <!-- LEFT: the broken signature -->
      <g transform="translate(40,80)">
        <rect width="320" height="76" rx="12" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2"/>
        <text x="16" y="28" font-size="13" class="mono" fill="#6B7280">
          # the trap
        </text>
        <text x="16" y="52" font-size="15" class="mono" fill="#1F2937" font-weight="600">
          def add(item, basket=[]):
        </text>
        <text x="16" y="70" font-size="13" class="mono" fill="#6B7280">
          &#160;&#160;basket.append(item); return basket
        </text>
      </g>

      <!-- the singleton basket symbol -->
      <g transform="translate(400,80)" class="reveal" id="singletonGroup">
        <rect width="320" height="76" rx="12" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="16" y="26" font-size="13" fill="#92400E" font-weight="600">
          ONE basket exists. Forever.
        </text>
        <text x="16" y="48" font-size="12" fill="#92400E">
          id() is identical across every call.
        </text>
        <text x="16" y="66" font-size="12" fill="#92400E" font-style="italic">
          Created once, when the def line ran.
        </text>
      </g>

      <!-- THREE BASKETS for broken version -->
      <g transform="translate(40,180)">
        <text x="0" y="0" font-size="14" font-weight="700" fill="#1F2937">Three calls — same basket</text>

        <!-- Call 1 -->
        <g transform="translate(0,16)" id="call1">
          <rect width="220" height="120" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
          <text x="14" y="22" class="mono" font-size="12" fill="#6B7280">call 1</text>
          <text x="14" y="40" class="mono" font-size="13" fill="#1F2937">add('apple')</text>

          <!-- basket -->
          <g transform="translate(60,52)">
            <path d="M 0 14 L 100 14 L 92 56 L 8 56 Z" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 0 14 L 100 14" stroke="#8B5CF6" stroke-width="2"/>
            <path d="M 18 14 Q 50 -10 82 14" fill="none" stroke="#8B5CF6" stroke-width="2"/>
            <!-- apple sticker (appears in stage 1) -->
            <g id="apple1" opacity="0">
              <circle cx="32" cy="34" r="9" fill="#F43F5E" stroke="#9F1239" stroke-width="1.5"/>
              <path d="M 32 25 Q 35 21 38 23" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round"/>
            </g>
          </g>
        </g>

        <!-- Call 2 -->
        <g transform="translate(240,16)" id="call2">
          <rect width="220" height="120" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
          <text x="14" y="22" class="mono" font-size="12" fill="#6B7280">call 2</text>
          <text x="14" y="40" class="mono" font-size="13" fill="#1F2937">add('banana')</text>

          <g transform="translate(60,52)">
            <path d="M 0 14 L 100 14 L 92 56 L 8 56 Z" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 0 14 L 100 14" stroke="#8B5CF6" stroke-width="2"/>
            <path d="M 18 14 Q 50 -10 82 14" fill="none" stroke="#8B5CF6" stroke-width="2"/>
            <g id="apple2" opacity="0">
              <circle cx="28" cy="36" r="8" fill="#F43F5E" stroke="#9F1239" stroke-width="1.5"/>
            </g>
            <g id="banana2" opacity="0">
              <path d="M 50 28 Q 60 30 64 42 Q 60 46 52 44 Q 46 40 48 30 Z" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
            </g>
          </g>
        </g>

        <!-- Call 3 -->
        <g transform="translate(480,16)" id="call3">
          <rect width="220" height="120" rx="10" fill="#fff" stroke="#E5E7EB" stroke-width="1.5"/>
          <text x="14" y="22" class="mono" font-size="12" fill="#6B7280">call 3</text>
          <text x="14" y="40" class="mono" font-size="13" fill="#1F2937">add('cherry')</text>

          <g transform="translate(60,52)">
            <path d="M 0 14 L 100 14 L 92 56 L 8 56 Z" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 0 14 L 100 14" stroke="#8B5CF6" stroke-width="2"/>
            <path d="M 18 14 Q 50 -10 82 14" fill="none" stroke="#8B5CF6" stroke-width="2"/>
            <g id="apple3" opacity="0">
              <circle cx="26" cy="38" r="8" fill="#F43F5E" stroke="#9F1239" stroke-width="1.5"/>
            </g>
            <g id="banana3" opacity="0">
              <path d="M 46 30 Q 56 32 60 42 Q 56 46 48 44 Q 42 40 44 32 Z" fill="#F59E0B" stroke="#92400E" stroke-width="1.5"/>
            </g>
            <g id="cherry3" opacity="0">
              <circle cx="72" cy="38" r="6" fill="#F43F5E" stroke="#9F1239" stroke-width="1.5"/>
              <circle cx="78" cy="42" r="6" fill="#F43F5E" stroke="#9F1239" stroke-width="1.5"/>
              <path d="M 72 32 Q 78 24 80 36" fill="none" stroke="#10B981" stroke-width="1.5"/>
            </g>
          </g>
        </g>

        <!-- result captions -->
        <text id="r1" x="110" y="156" text-anchor="middle" font-size="12" class="mono" fill="#1F2937" opacity="0">['apple']</text>
        <text id="r2" x="350" y="156" text-anchor="middle" font-size="12" class="mono" fill="#1F2937" opacity="0">['apple','banana']</text>
        <text id="r3" x="590" y="156" text-anchor="middle" font-size="12" class="mono" fill="#1F2937" opacity="0">['apple','banana','cherry']</text>
      </g>

      <!-- THE FIX -->
      <g transform="translate(40,360)" id="fixGroup" opacity="0">
        <rect width="680" height="98" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/>
        <text x="16" y="26" font-size="13" font-weight="700" fill="#065F46">The fix — sentinel pattern</text>
        <text x="16" y="48" class="mono" font-size="14" fill="#1F2937">def add(item, basket=None):</text>
        <text x="16" y="68" class="mono" font-size="14" fill="#1F2937">&#160;&#160;if basket is None: basket = []</text>
        <text x="16" y="88" class="mono" font-size="14" fill="#1F2937">&#160;&#160;basket.append(item); return basket</text>

        <!-- three independent baskets -->
        <g transform="translate(380,18)">
          <g transform="translate(0,0)">
            <path d="M 0 14 L 80 14 L 74 50 L 6 50 Z" fill="#fff" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 0 14 L 80 14" stroke="#10B981" stroke-width="2"/>
            <circle cx="22" cy="32" r="6" fill="#F43F5E"/>
            <text x="40" y="68" text-anchor="middle" font-size="11" class="mono" fill="#065F46">['apple']</text>
          </g>
          <g transform="translate(100,0)">
            <path d="M 0 14 L 80 14 L 74 50 L 6 50 Z" fill="#fff" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 0 14 L 80 14" stroke="#10B981" stroke-width="2"/>
            <path d="M 30 24 Q 40 26 44 38 Q 40 42 32 40 Z" fill="#F59E0B"/>
            <text x="40" y="68" text-anchor="middle" font-size="11" class="mono" fill="#065F46">['banana']</text>
          </g>
          <g transform="translate(200,0)">
            <path d="M 0 14 L 80 14 L 74 50 L 6 50 Z" fill="#fff" stroke="#10B981" stroke-width="2" stroke-linejoin="round"/>
            <path d="M 0 14 L 80 14" stroke="#10B981" stroke-width="2"/>
            <circle cx="36" cy="32" r="5" fill="#F43F5E"/>
            <circle cx="46" cy="36" r="5" fill="#F43F5E"/>
            <text x="40" y="68" text-anchor="middle" font-size="11" class="mono" fill="#065F46">['cherry']</text>
          </g>
        </g>
      </g>
    </svg>
    <div class="caption">The default value is a single object created once. Mutate it and the mutation outlives the call.</div>
  </div>
</main>
<script>
(function () {
  var prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EASE = 'cubic-bezier(0.22, 0.61, 0.36, 1)';

  var stages = [
    { id: 'apple1', delay: 600 },
    { id: 'r1', delay: 1100 },
    { id: 'apple2', delay: 1900 },
    { id: 'banana2', delay: 2300 },
    { id: 'r2', delay: 2700 },
    { id: 'apple3', delay: 3500 },
    { id: 'banana3', delay: 3800 },
    { id: 'cherry3', delay: 4200 },
    { id: 'r3', delay: 4700 },
    { id: 'fixGroup', delay: 6000 }
  ];

  function show(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.transition = 'opacity 500ms ' + EASE + ', transform 500ms ' + EASE;
    el.style.opacity = '1';
  }

  function hide(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.style.transition = 'none';
    el.style.opacity = '0';
  }

  function reset() {
    stages.forEach(function (s) { hide(s.id); });
  }

  function run() {
    if (prefersReduced) {
      stages.forEach(function (s) { show(s.id); });
      return;
    }
    reset();
    stages.forEach(function (s) {
      setTimeout(function () { show(s.id); }, s.delay);
    });
    setTimeout(run, 11000);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', run);
  } else {
    run();
  }
})();
</script>
</body>
</html>
