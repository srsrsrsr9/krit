<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>for-i vs for-each — count the boxes, count the bugs</title>
<style>
  :root{--bg:#EFF6FF;--ink:#1F2937;--muted:#6B7280;--paper:#FFFFFF;--rule:#E5E7EB;--bad:#F43F5E;--good:#10B981;--warn:#F59E0B;--blue:#0EA5E9;--purple:#8B5CF6;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{position:relative;width:100%;max-width:760px}
  .frame{width:100%;aspect-ratio:16/9;display:block}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:8px;min-height:18px}
  .reset{position:absolute;bottom:8px;right:8px;background:var(--ink);color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font:600 11px system-ui,sans-serif;cursor:pointer;opacity:.78}
  .reset:hover{opacity:1}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.001s !important;transition-duration:0.001s !important}}
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg class="frame" viewBox="0 0 720 405" aria-label="Two loop architectures side by side. The C-style for-i loop has five boxes and three off-by-one bug sites. The Python for-each loop has three boxes and zero bug sites.">
      <defs>
        <marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1F2937"/></marker>
        <marker id="arBad" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#F43F5E"/></marker>
      </defs>

      <!-- title -->
      <rect x="20" y="14" width="680" height="36" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="360" y="38" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">Same job. Five boxes vs three. Count the off-by-ones.</text>

      <!-- divider -->
      <line x1="360" y1="62" x2="360" y2="386" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="3 4"/>

      <!-- LEFT column header -->
      <rect x="32" y="68" width="316" height="28" rx="8" fill="#FEE2E2"/>
      <text x="46" y="86" font-size="12" font-weight="700" fill="#991B1B" font-family="ui-monospace,monospace">for i in range(len(xs)):  # C-style</text>

      <!-- LEFT 5 boxes -->
      <!-- 1 init -->
      <g id="L1">
        <rect x="48" y="108" width="120" height="44" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
        <text x="108" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">1. init</text>
        <text x="108" y="144" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#6B7280">i = 0</text>
      </g>
      <!-- bug pin 1 -->
      <g id="bugL1" opacity="0">
        <circle cx="172" cy="110" r="9" fill="#F43F5E"/>
        <text x="172" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF7ED">!</text>
      </g>

      <!-- 2 check -->
      <g id="L2">
        <rect x="208" y="108" width="120" height="44" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
        <text x="268" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">2. check</text>
        <text x="268" y="144" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#6B7280">i &lt; len(xs)?</text>
      </g>
      <g id="bugL2" opacity="0">
        <circle cx="332" cy="110" r="9" fill="#F43F5E"/>
        <text x="332" y="114" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF7ED">!</text>
      </g>

      <!-- 3 body -->
      <g id="L3">
        <rect x="128" y="170" width="120" height="44" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
        <text x="188" y="190" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">3. body</text>
        <text x="188" y="206" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#6B7280">use xs[i]</text>
      </g>
      <g id="bugL3" opacity="0">
        <circle cx="252" cy="172" r="9" fill="#F43F5E"/>
        <text x="252" y="176" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF7ED">!</text>
      </g>

      <!-- 4 increment -->
      <g id="L4">
        <rect x="48" y="232" width="120" height="44" rx="10" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
        <text x="108" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">4. increment</text>
        <text x="108" y="268" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#6B7280">i = i + 1</text>
      </g>

      <!-- 5 end -->
      <g id="L5">
        <rect x="208" y="232" width="120" height="44" rx="10" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
        <text x="268" y="252" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">5. end</text>
        <text x="268" y="268" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#065F46">done</text>
      </g>

      <!-- LEFT arrows -->
      <path d="M168,130 L208,130" fill="none" stroke="#1F2937" stroke-width="1.8" marker-end="url(#ar)"/>
      <path d="M268,152 Q268,162 248,180" fill="none" stroke="#1F2937" stroke-width="1.8" marker-end="url(#ar)"/>
      <path d="M128,194 Q108,210 108,232" fill="none" stroke="#1F2937" stroke-width="1.8" marker-end="url(#ar)"/>
      <path d="M168,254 Q188,254 268,232" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ar)"/>

      <!-- LEFT bug counter -->
      <g>
        <rect x="48" y="296" width="280" height="60" rx="12" fill="#FFFFFF" stroke="#FECACA"/>
        <text x="64" y="318" font-size="11" font-weight="700" fill="#991B1B">Common off-by-ones</text>
        <text id="bugCount" x="64" y="344" font-size="22" font-weight="700" fill="#F43F5E" font-family="ui-monospace,monospace">0</text>
        <text id="bugLabel" x="100" y="344" font-size="11" fill="#6B7280">bug sites highlighted</text>
        <text x="64" y="358" font-size="10" fill="#991B1B" font-style="italic">i=1? i&lt;=len? skipped last?</text>
      </g>

      <!-- ─── RIGHT side ─── -->
      <rect x="372" y="68" width="316" height="28" rx="8" fill="#D1FAE5"/>
      <text x="386" y="86" font-size="12" font-weight="700" fill="#065F46" font-family="ui-monospace,monospace">for x in xs:  # Pythonic</text>

      <!-- 3 boxes for for-each -->
      <g id="R1">
        <rect x="392" y="130" width="130" height="56" rx="12" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
        <text x="457" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">1. get next</text>
        <text x="457" y="172" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#6B7280">x = next(it)</text>
      </g>
      <g id="R2">
        <rect x="540" y="130" width="130" height="56" rx="12" fill="#FFFFFF" stroke="#1F2937" stroke-width="1.8"/>
        <text x="605" y="154" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">2. body</text>
        <text x="605" y="172" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#6B7280">use x</text>
      </g>
      <g id="R3">
        <rect x="466" y="220" width="130" height="56" rx="12" fill="#ECFDF5" stroke="#10B981" stroke-width="1.8"/>
        <text x="531" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">3. end</text>
        <text x="531" y="262" text-anchor="middle" font-size="10" font-family="ui-monospace,monospace" fill="#065F46">StopIteration</text>
      </g>

      <!-- right arrows -->
      <path d="M522,158 L540,158" fill="none" stroke="#1F2937" stroke-width="1.8" marker-end="url(#ar)"/>
      <path d="M605,186 Q605,200 596,224" fill="none" stroke="#1F2937" stroke-width="1.8" marker-end="url(#ar)"/>
      <path d="M466,250 Q420,210 420,186" fill="none" stroke="#1F2937" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#ar)"/>

      <!-- iterator pointer (animated) -->
      <g id="cursor" opacity="0">
        <circle cx="0" cy="0" r="10" fill="#0EA5E9"/>
        <text x="0" y="4" text-anchor="middle" font-size="10" font-weight="700" fill="#FFF7ED" font-family="ui-monospace,monospace">x</text>
      </g>

      <!-- right counter -->
      <rect x="392" y="296" width="278" height="60" rx="12" fill="#FFFFFF" stroke="#A7F3D0"/>
      <text x="408" y="318" font-size="11" font-weight="700" fill="#065F46">Common off-by-ones</text>
      <text x="408" y="344" font-size="22" font-weight="700" fill="#10B981" font-family="ui-monospace,monospace">0</text>
      <text x="444" y="344" font-size="11" fill="#6B7280">bug sites possible</text>
      <text x="408" y="358" font-size="10" fill="#065F46" font-style="italic">no index, no bound, no sequel</text>

      <!-- score band -->
      <rect x="20" y="370" width="680" height="22" rx="11" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text id="score" x="360" y="385" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937" font-family="ui-monospace,monospace">5 boxes  ·  3 bug sites      vs      3 boxes  ·  0 bug sites</text>
    </svg>
    <div class="caption" id="cap">Same loop. Two architectures. Fewer boxes, fewer bugs.</div>
    <button class="reset" id="reset" type="button" aria-label="Replay animation">replay</button>
  </div>
</main>
<script>
(function(){
  'use strict';
  var prm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(id){return document.getElementById(id);};
  var timers=[]; function after(ms,fn){timers.push(setTimeout(fn, prm?0:ms));}
  function clearAll(){timers.forEach(clearTimeout); timers=[];}

  function fade(id,from,to,dur){
    var el=$(id); if(!el) return;
    if(prm){el.setAttribute('opacity',String(to));return;}
    var t0=performance.now();
    function step(now){var t=Math.min(1,(now-t0)/dur),k=1-Math.pow(1-t,3);
      el.setAttribute('opacity',String(from+(to-from)*k));
      if(t<1) requestAnimationFrame(step);}
    requestAnimationFrame(step);
  }
  function highlight(id, on){
    var el=$(id); if(!el) return;
    var rect = el.querySelector('rect');
    if(!rect) return;
    if(on){ rect.setAttribute('fill','#FEF3C7'); rect.setAttribute('stroke','#F59E0B'); }
    else { rect.setAttribute('fill','#FFFFFF'); rect.setAttribute('stroke','#1F2937'); }
  }
  function moveCursor(x,y,dur){
    var el=$('cursor'); if(!el) return;
    if(prm){ el.setAttribute('transform','translate('+x+','+y+')'); return; }
    var cur = el.getAttribute('transform') || 'translate(0,0)';
    var m = /translate\(([-0-9.]+),\s*([-0-9.]+)\)/.exec(cur);
    var x0 = m?parseFloat(m[1]):0, y0 = m?parseFloat(m[2]):0;
    var t0 = performance.now();
    function step(now){
      var t=Math.min(1,(now-t0)/dur),k=1-Math.pow(1-t,3);
      el.setAttribute('transform','translate('+(x0+(x-x0)*k)+','+(y0+(y-y0)*k)+')');
      if(t<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }
  function setBugCount(n){
    $('bugCount').textContent = String(n);
    $('bugLabel').textContent = n===1 ? 'bug site highlighted' : 'bug sites highlighted';
  }

  function reset(){
    clearAll();
    ['bugL1','bugL2','bugL3','cursor'].forEach(function(id){ $(id).setAttribute('opacity',0); });
    ['L1','L2','L3','L4','L5','R1','R2','R3'].forEach(function(id){ highlight(id,false); });
    var L5 = $('L5'); L5.querySelector('rect').setAttribute('fill','#ECFDF5'); L5.querySelector('rect').setAttribute('stroke','#10B981');
    var R3 = $('R3'); R3.querySelector('rect').setAttribute('fill','#ECFDF5'); R3.querySelector('rect').setAttribute('stroke','#10B981');
    setBugCount(0);
    $('cap').textContent = 'Same loop. Two architectures. Fewer boxes, fewer bugs.';
  }

  function run(){
    reset();

    // Pass 1 — left side, 3 iterations stepping through boxes
    var boxes = ['L1','L2','L3','L4','L2','L3','L4','L2','L3','L4','L2','L5'];
    var dwell = 360;
    boxes.forEach(function(id, i){
      after(300 + i*dwell, function(){
        // un-highlight previous
        if(i>0) highlight(boxes[i-1], false);
        if(id!=='L5') highlight(id, true);
      });
    });
    after(300 + boxes.length*dwell + 200, function(){
      highlight(boxes[boxes.length-2], false);
    });

    // pop the bug pins as we pass i=0/check/body
    after(900, function(){ fade('bugL1',0,1,300); setBugCount(1); $('cap').textContent='Bug site #1 — init: did you start at 0 or 1?'; });
    after(1700, function(){ fade('bugL2',0,1,300); setBugCount(2); $('cap').textContent='Bug site #2 — check: < len or <= len?'; });
    after(2500, function(){ fade('bugL3',0,1,300); setBugCount(3); $('cap').textContent='Bug site #3 — body: xs[i] or xs[i-1]?'; });

    // Pass 2 — right side, 3 iterations stepping through boxes
    var rstart = 300 + boxes.length*dwell + 600;
    after(rstart-300, function(){ $('cap').textContent='Now the for-each version. Get-next, body, end. That is it.'; });
    fade('cursor', 0, 0, 0); // ensure starts hidden
    var rseq = ['R1','R2','R1','R2','R1','R2','R3'];
    var positions = [
      [457,158],[605,158],[457,158],[605,158],[457,158],[605,158],[531,248]
    ];
    rseq.forEach(function(id, i){
      after(rstart + i*420, function(){
        if(i===0){ fade('cursor',0,1,260); }
        if(i>0) highlight(rseq[i-1], false);
        if(id!=='R3') highlight(id, true);
        moveCursor(positions[i][0], positions[i][1], 320);
      });
    });
    after(rstart + rseq.length*420 + 80, function(){
      highlight(rseq[rseq.length-2], false);
      $('cap').textContent='Three boxes. Zero off-by-ones. Same job, half the surface area.';
    });

    // hold + loop
    after(rstart + rseq.length*420 + 2000, function(){ run(); });
  }

  $('reset').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
