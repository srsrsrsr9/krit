<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Function call as a stack frame</title>
<style>
  :root{--bg:#ECFDF5;--ink:#1F2937;--muted:#6B7280;--paper:#FFFFFF;--rule:#E5E7EB;--good:#10B981;--bad:#F43F5E;--warn:#F59E0B;--blue:#0EA5E9;--purple:#8B5CF6;}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{position:relative;width:100%;max-width:760px}
  .frame{width:100%;aspect-ratio:16/9;display:block}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:8px;min-height:18px}
  .reset{position:absolute;bottom:8px;right:8px;background:var(--ink);color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font:600 11px system-ui,sans-serif;cursor:pointer;opacity:.78}
  .reset:hover{opacity:1}
  @media (prefers-reduced-motion: reduce){*{animation-duration:0.001s !important;transition-duration:0.001s !important}}
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg class="frame" viewBox="0 0 720 405" aria-label="A function call animated as a stack frame opening with arguments, executing a body, and closing with a return value. A second scene shows an UnboundLocalError when an inner function reads a variable that is later assigned in the same scope.">
      <defs>
        <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1F2937"/></marker>
        <marker id="arrG" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#10B981"/></marker>
        <marker id="arrR" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#F43F5E"/></marker>
      </defs>

      <!-- title -->
      <rect x="20" y="14" width="680" height="32" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text id="title" x="360" y="36" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2937">A call is a frame: it opens, runs, returns, and closes.</text>

      <!-- step chip -->
      <g id="chip">
        <rect x="20" y="56" width="120" height="22" rx="11" fill="#1F2937"/>
        <text id="chipT" x="80" y="72" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF7ED" font-family="ui-monospace,monospace">step 1 / 5</text>
      </g>

      <!-- code call site -->
      <rect x="160" y="56" width="540" height="32" rx="8" fill="#1F2937"/>
      <text id="codeT" x="178" y="76" font-family="ui-monospace,monospace" font-size="13" fill="#FBBF24"></text>

      <!-- LEFT panel: call site / caller -->
      <rect x="20" y="100" width="240" height="270" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="140" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">caller scope</text>

      <!-- Args bubble (animated outward into frame) -->
      <g id="argsBubble">
        <rect x="40" y="138" width="200" height="60" rx="10" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.6"/>
        <text x="140" y="160" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">args</text>
        <text id="argsT" x="140" y="184" text-anchor="middle" font-family="ui-monospace,monospace" font-size="13" fill="#1F2937">3, 4</text>
      </g>

      <!-- Returned value box, hidden until step 4 -->
      <g id="retBox" opacity="0">
        <rect x="40" y="290" width="200" height="60" rx="10" fill="#D1FAE5" stroke="#10B981" stroke-width="1.6"/>
        <text x="140" y="312" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">returned</text>
        <text id="retT" x="140" y="336" text-anchor="middle" font-family="ui-monospace,monospace" font-size="14" font-weight="700" fill="#065F46">7</text>
      </g>

      <!-- carrier dot for arg flying into frame -->
      <g id="argDot" opacity="0">
        <circle cx="0" cy="0" r="9" fill="#F59E0B"/>
        <text x="0" y="3" text-anchor="middle" font-size="9" font-weight="700" fill="#FFF7ED" font-family="ui-monospace,monospace">x,y</text>
      </g>
      <!-- carrier dot for return flying out -->
      <g id="retDot" opacity="0">
        <circle cx="0" cy="0" r="9" fill="#10B981"/>
        <text x="0" y="3" text-anchor="middle" font-size="9" font-weight="700" fill="#FFF7ED" font-family="ui-monospace,monospace">7</text>
      </g>

      <!-- RIGHT panel: stack -->
      <rect x="280" y="100" width="420" height="270" rx="12" fill="#FFFFFF" stroke="#E5E7EB"/>
      <text x="490" y="120" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">call stack (grows up)</text>

      <!-- baseline frame: __main__ -->
      <g id="mainFrame">
        <rect x="298" y="320" width="384" height="42" rx="8" fill="#EEF2FF" stroke="#A5B4FC"/>
        <text x="316" y="346" font-size="11" font-weight="700" fill="#3730A3" font-family="ui-monospace,monospace">__main__</text>
        <text x="664" y="346" text-anchor="end" font-size="10" fill="#6B7280" font-style="italic">caller waits…</text>
      </g>

      <!-- function frame (slides up from below baseline) -->
      <g id="fnFrame" opacity="0" transform="translate(0,40)">
        <rect x="298" y="220" width="384" height="92" rx="10" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="1.8"/>
        <text x="316" y="240" font-size="11" font-weight="700" fill="#075985" font-family="ui-monospace,monospace">add(x, y)  ← new frame</text>
        <!-- locals row -->
        <g font-family="ui-monospace,monospace" font-size="12">
          <rect x="316" y="252" width="68" height="24" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
          <text x="350" y="269" text-anchor="middle" fill="#1F2937">x = <tspan id="xVal" font-weight="700" fill="#075985">3</tspan></text>
          <rect x="394" y="252" width="68" height="24" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
          <text x="428" y="269" text-anchor="middle" fill="#1F2937">y = <tspan id="yVal" font-weight="700" fill="#075985">4</tspan></text>
          <rect x="472" y="252" width="100" height="24" rx="6" fill="#FFFFFF" stroke="#0EA5E9"/>
          <text x="522" y="269" text-anchor="middle" fill="#1F2937">total = <tspan id="totVal" font-weight="700" fill="#075985">…</tspan></text>
        </g>
        <text x="316" y="296" font-size="11" font-style="italic" fill="#075985" font-family="ui-monospace,monospace">return total</text>
      </g>

      <!-- ─── ERROR scene (hidden until late) ─── -->
      <g id="errScene" opacity="0">
        <rect x="20" y="100" width="680" height="270" rx="12" fill="#FFF7ED" stroke="#FECACA"/>
        <text x="360" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B" font-family="ui-monospace,monospace">def total(xs):</text>
        <text x="360" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B" font-family="ui-monospace,monospace">    print(n)         # ← read n</text>
        <text x="360" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#991B1B" font-family="ui-monospace,monospace">    n = len(xs)      # ← assigned later in same scope</text>

        <!-- frame schematic -->
        <rect x="120" y="186" width="480" height="124" rx="12" fill="#FFFFFF" stroke="#FCA5A5"/>
        <text x="360" y="206" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B">total() frame — Python pre-scans the body</text>
        <!-- name slot -->
        <g>
          <rect x="220" y="222" width="120" height="56" rx="10" fill="#FEE2E2" stroke="#F43F5E" stroke-width="1.6"/>
          <text x="280" y="244" text-anchor="middle" font-size="11" font-weight="700" fill="#991B1B" font-family="ui-monospace,monospace">n</text>
          <text x="280" y="262" text-anchor="middle" font-size="10" fill="#991B1B">slot reserved as local</text>
          <text x="280" y="274" text-anchor="middle" font-size="10" font-style="italic" fill="#991B1B">(but not yet assigned)</text>
        </g>
        <!-- read arrow -->
        <g id="readArrow" opacity="0">
          <path d="M380,250 L460,250" fill="none" stroke="#F43F5E" stroke-width="2.2" marker-end="url(#arrR)"/>
          <text x="468" y="245" font-size="11" font-weight="700" fill="#991B1B">read?</text>
          <text x="468" y="260" font-size="10" fill="#991B1B" font-family="ui-monospace,monospace">→ empty</text>
        </g>
        <!-- error box -->
        <g id="errBox" opacity="0">
          <rect x="60" y="320" width="600" height="36" rx="10" fill="#F43F5E"/>
          <text x="360" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#FFF7ED" font-family="ui-monospace,monospace">UnboundLocalError: local variable 'n' referenced before assignment</text>
        </g>
      </g>

      <!-- ground line -->
      <line x1="280" y1="362" x2="700" y2="362" stroke="#CBD5E1" stroke-width="1.2"/>
      <text x="490" y="378" text-anchor="middle" font-size="10" font-style="italic" fill="#9CA3AF">stack baseline</text>
    </svg>
    <div class="caption" id="cap">A call opens a frame. Args in. Body runs. Value out. Frame gone.</div>
    <button class="reset" id="reset" type="button" aria-label="Replay animation">replay</button>
  </div>
</main>
<script>
(function(){
  'use strict';
  var prm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var $ = function(id){return document.getElementById(id);};
  var timers=[]; function after(ms,fn){timers.push(setTimeout(fn, prm?0:ms));}
  function clearAll(){timers.forEach(clearTimeout); timers=[];}

  function fade(id,from,to,dur){
    var el=$(id); if(!el) return;
    if(prm){el.setAttribute('opacity',String(to));return;}
    var t0=performance.now();
    function step(now){var t=Math.min(1,(now-t0)/dur),k=1-Math.pow(1-t,3);
      el.setAttribute('opacity',String(from+(to-from)*k));
      if(t<1) requestAnimationFrame(step);}
    requestAnimationFrame(step);
  }
  function move(id, x0,y0, x1,y1, dur, cb){
    var el=$(id); if(!el) return;
    if(prm){el.setAttribute('transform','translate('+x1+','+y1+')'); if(cb) cb(); return;}
    var t0=performance.now();
    function step(now){var t=Math.min(1,(now-t0)/dur),k=1-Math.pow(1-t,3);
      el.setAttribute('transform','translate('+(x0+(x1-x0)*k)+','+(y0+(y1-y0)*k)+')');
      if(t<1) requestAnimationFrame(step); else if(cb) cb();}
    requestAnimationFrame(step);
  }
  function setText(id, t){ var el=$(id); if(el) el.textContent=t; }
  function setChip(t){ setText('chipT', t); }

  function reset(){
    clearAll();
    $('argsBubble').setAttribute('opacity',1);
    $('retBox').setAttribute('opacity',0);
    $('fnFrame').setAttribute('opacity',0);
    $('fnFrame').setAttribute('transform','translate(0,40)');
    $('argDot').setAttribute('opacity',0);
    $('retDot').setAttribute('opacity',0);
    $('errScene').setAttribute('opacity',0);
    $('readArrow').setAttribute('opacity',0);
    $('errBox').setAttribute('opacity',0);
    setText('xVal','3'); setText('yVal','4'); setText('totVal','…');
    setText('codeT','>>> add(3, 4)');
    setText('title','A call is a frame: it opens, runs, returns, and closes.');
    setText('cap','A call opens a frame. Args in. Body runs. Value out. Frame gone.');
    setChip('step 1 / 5');
  }

  function run(){
    reset();

    // Step 1 — call site
    after(300, function(){
      setChip('step 1 / 5');
      setText('cap','Call site: name + args, just sitting there.');
    });

    // Step 2 — frame opens, args fly in
    after(1700, function(){
      setChip('step 2 / 5');
      setText('cap','Frame opens above main. Args become local x and y.');
      fade('fnFrame',0,1,300);
      move('fnFrame', 0,40, 0,0, 600);
      // arg dot
      $('argDot').setAttribute('transform','translate(140,168)');
      fade('argDot',0,1,200);
      move('argDot', 140,168, 380,266, 700, function(){
        fade('argDot',1,0,200);
      });
    });

    // Step 3 — body runs
    after(3700, function(){
      setChip('step 3 / 5');
      setText('cap','Body runs in the frame. total = x + y.');
      setText('totVal','7');
    });

    // Step 4 — return
    after(5100, function(){
      setChip('step 4 / 5');
      setText('cap','return total — value travels back to caller.');
      $('retDot').setAttribute('transform','translate(522,266)');
      fade('retDot',0,1,200);
      move('retDot', 522,266, 140,318, 700, function(){
        fade('retDot',1,0,200);
        fade('retBox',0,1,300);
      });
    });

    // Step 5 — frame collapses
    after(6900, function(){
      setChip('step 5 / 5');
      setText('cap','Frame is gone. Locals collected. main carries on.');
      move('fnFrame', 0,0, 0,40, 500);
      fade('fnFrame',1,0,500);
    });

    // ── Bonus: UnboundLocalError ──
    after(8400, function(){
      setText('title','Bonus: read first, assign later → UnboundLocalError');
      setChip('bonus');
      fade('errScene',0,1,400);
      setText('cap','Python pre-scans the body. Any name you assign is local — even if you read it first.');
    });
    after(9800, function(){ fade('readArrow',0,1,300); });
    after(11000, function(){
      fade('errBox',0,1,400);
      setText('cap','Local n exists in the slot, but nothing has been put in it yet. Boom.');
    });

    // hold and loop
    after(14200, run);
  }

  $('reset').addEventListener('click', run);
  run();
})();
</script>
</body>
</html>
