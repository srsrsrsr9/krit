<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: AI signs Form 3CD</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.bad-step{animation:fade .4s ease both}
.icai{animation:pop .5s ease 4s both,flash 1s ease 4.8s 2 both}
.fix-step{animation:fade .4s ease both}
.sign-fail{animation:pop .5s ease 2s both}
.sign-ok{animation:pop .5s ease 9.5s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="An AI auto-signing Form 3CD with no senior review triggers ICAI inquiry, vs the four-eye fix where AI processes and CA signs at stage 4">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- BAD: AI auto-signs -->
<g transform="translate(40 30)">
<rect width="320" height="180" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">BEFORE · AI auto-signs Form 3CD</text>

<g class="bad-step" style="animation-delay:.3s" transform="translate(20 38)">
<rect width="80" height="40" rx="4" fill="#7F1D1D"/>
<text x="40" y="20" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">AI generates</text>
<text x="40" y="32" text-anchor="middle" font-size="9" fill="#fff">Form 3CD</text>
</g>
<g class="bad-step" style="animation-delay:.7s" transform="translate(110 38)">
<rect width="80" height="40" rx="4" fill="#9CA3AF"/>
<text x="40" y="20" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">no review</text>
<text x="40" y="32" text-anchor="middle" font-size="9" fill="#fff" font-style="italic">"AI is fast"</text>
</g>
<g class="bad-step" style="animation-delay:1.1s" transform="translate(200 38)">
<rect width="80" height="40" rx="4" fill="#9CA3AF"/>
<text x="40" y="20" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">no logging</text>
<text x="40" y="32" text-anchor="middle" font-size="9" fill="#fff" font-style="italic">"who needs it"</text>
</g>

<g class="sign-fail" transform="translate(20 90)">
<rect width="280" height="50" rx="6" fill="#7F1D1D"/>
<text x="140" y="22" text-anchor="middle" font-size="11" fill="#fff" font-weight="bold">→ AI submits with CA's UDIN</text>
<text x="140" y="40" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">no human reviewed · no log of decisions</text>
</g>

<text x="160" y="160" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">11 SME clients filed this way · 6 months</text>
</g>

<!-- ICAI INQUIRY -->
<g class="icai" transform="translate(40 230)">
<rect width="320" height="60" rx="10" fill="#7F1D1D" stroke="#000" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="13" fill="#FCA5A5" font-weight="bold">ICAI inquiry · "who signed off?"</text>
<text x="160" y="42" text-anchor="middle" font-size="11" fill="#FCA5A5">CA can't show audit trail · disciplinary action</text>
<text x="160" y="56" text-anchor="middle" font-size="9" fill="#FCA5A5" font-style="italic">UDIN cancelled · 6-month suspension</text>
</g>

<!-- FIX: 4-eye -->
<g transform="translate(380 30)">
<rect width="300" height="180" rx="8" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">AFTER · 4-eye AI audit trail</text>

<g class="fix-step" style="animation-delay:5.5s" transform="translate(20 38)">
<rect width="120" height="32" rx="4" fill="#10B981"/>
<text x="60" y="14" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">1. AI processes</text>
<text x="60" y="26" text-anchor="middle" font-size="8" fill="#fff">draft + classify</text>
</g>
<g class="fix-step" style="animation-delay:6s" transform="translate(160 38)">
<rect width="120" height="32" rx="4" fill="#10B981"/>
<text x="60" y="14" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">2. AI logs decisions</text>
<text x="60" y="26" text-anchor="middle" font-size="8" fill="#fff">rationale per line</text>
</g>
<g class="fix-step" style="animation-delay:6.5s" transform="translate(20 78)">
<rect width="120" height="32" rx="4" fill="#10B981"/>
<text x="60" y="14" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">3. Senior CA reviews</text>
<text x="60" y="26" text-anchor="middle" font-size="8" fill="#fff">all flagged + 10% sample</text>
</g>
<g class="fix-step" style="animation-delay:7s" transform="translate(160 78)">
<rect width="120" height="32" rx="4" fill="#065F46" stroke="#10B981" stroke-width="2"/>
<text x="60" y="14" text-anchor="middle" font-size="9" fill="#fff" font-weight="bold">4. CA signs</text>
<text x="60" y="26" text-anchor="middle" font-size="8" fill="#fff">UDIN attached</text>
</g>

<!-- signature only at stage 4 -->
<g class="sign-ok" transform="translate(20 130)">
<rect width="260" height="36" rx="6" fill="#fff" stroke="#10B981" stroke-width="2"/>
<text x="130" y="14" text-anchor="middle" font-size="9" fill="#065F46" font-weight="bold">UDIN signature</text>
<text x="130" y="26" text-anchor="middle" font-size="9" fill="#065F46" font-style="italic">only valid at stage 4 · never stage 1</text>
</g>
</g>

<g transform="translate(380 230)">
<rect width="300" height="60" rx="10" fill="#065F46"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#A7F3D0" font-weight="bold">ICAI accepts trail · zero issues</text>
<text x="150" y="42" text-anchor="middle" font-size="10" fill="#A7F3D0">audit trail clean · responsibility clear</text>
</g>

<g transform="translate(40 310)">
<rect width="640" height="80" rx="10" fill="#1F2937"/>
<text x="320" y="24" text-anchor="middle" font-size="13" fill="#FCD34D" font-weight="bold">AI cannot sign Form 3CD · the CA signs · the AI assists</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#9CA3AF">UDIN is not a model output · it is a regulated act</text>
<text x="320" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">automation has a ceiling · the signature is the ceiling</text>
</g>
</svg>
<div class="caption">AI assists. CA signs. The signature is the boundary, not a workflow step.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
