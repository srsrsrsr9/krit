<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GST query: with vs without RAG</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--muted:#6B7280;--good:#10B981;--bad:#F43F5E;--blue:#0EA5E9;--violet:#8B5CF6}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:880px;position:relative}
svg{width:100%;height:auto;display:block}
.cap{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;min-height:18px}
.rb{position:absolute;bottom:6px;right:6px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit;opacity:.7}
.rb:hover{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
<div class="frame">
<svg viewBox="0 0 880 560" aria-label="GST question asked of an LLM. Without RAG the model invents a fake section number, shown in red. With RAG against the GST act it retrieves a real section and cites it, shown in green.">
  <rect width="880" height="560" fill="#FFF7ED"/>
  <text x="440" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">Same question. With and without the law in front of it.</text>

  <!-- The shared question -->
  <g transform="translate(180,52)">
    <rect x="0" y="0" width="520" height="46" rx="10" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
    <text x="14" y="20" font-size="11" font-weight="700" fill="#0369A1" letter-spacing="1">QUERY</text>
    <text x="14" y="38" font-size="12" font-family="ui-monospace,monospace" fill="#1F2937">"Under which GST section can input tax credit be reversed?"</text>
  </g>

  <!-- Divider -->
  <line x1="440" y1="118" x2="440" y2="510" stroke="#E7E5E4" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT: NO RAG -->
  <g>
    <text x="220" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#F43F5E" letter-spacing="1.5">LLM · NO RAG</text>
    <g transform="translate(80,150)">
      <rect x="0" y="0" width="280" height="40" rx="8" fill="#FFE4E6" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="140" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#9F1239">model answers from memory</text>
    </g>

    <!-- Library shelf with PADLOCK to indicate it can't read -->
    <g transform="translate(80,200)" opacity="0.6">
      <rect x="0" y="0" width="280" height="38" rx="6" fill="#FAFAF9" stroke="#D6D3D1" stroke-width="1" stroke-dasharray="4 3"/>
      <text x="14" y="22" font-size="10" font-weight="700" fill="#9CA3AF" letter-spacing="1">GST ACT 2017</text>
      <g transform="translate(248,8)">
        <rect x="0" y="6" width="20" height="16" rx="3" fill="#9CA3AF"/>
        <path d="M4 6 V3 a6 6 0 0 1 12 0 V6" fill="none" stroke="#9CA3AF" stroke-width="2"/>
      </g>
      <text x="14" y="32" font-size="9" fill="#9CA3AF" font-style="italic">not consulted</text>
    </g>

    <!-- arrow down -->
    <path d="M220 246 L220 268" stroke="#F43F5E" stroke-width="2" marker-end="url(#arrR)"/>

    <!-- bad answer card -->
    <rect x="60" y="278" width="320" height="180" rx="10" fill="#FFFFFF" stroke="#FECDD3" stroke-width="2"/>
    <text x="76" y="298" font-size="11" font-weight="700" fill="#9F1239" letter-spacing="1">ANSWER</text>
    <line x1="60" y1="306" x2="380" y2="306" stroke="#FECDD3"/>

    <g id="badAns" font-family="ui-monospace,monospace" font-size="11" fill="#1F2937">
      <text x="76" y="328" id="ba1" opacity="0">ITC reversal is governed by</text>
      <text x="76" y="346" id="ba2" opacity="0"><tspan font-weight="700" fill="#F43F5E">Section 19A(2)(c)</tspan> of the CGST</text>
      <text x="76" y="364" id="ba3" opacity="0">Act, 2017.</text>
    </g>

    <g id="badCallout" opacity="0">
      <rect x="76" y="384" width="288" height="64" rx="8" fill="#FFE4E6" stroke="#F43F5E" stroke-width="1.5"/>
      <text x="88" y="402" font-size="11" font-weight="700" fill="#9F1239">⚠ HALLUCINATED CITATION</text>
      <text x="88" y="418" font-size="10" fill="#1F2937">Section 19A(2)(c) does not exist.</text>
      <text x="88" y="432" font-size="10" fill="#1F2937">Real provision is Section 17(5).</text>
      <text x="88" y="445" font-size="10" fill="#1F2937">Filing this is professional negligence.</text>
    </g>
  </g>

  <!-- RIGHT: WITH RAG -->
  <g>
    <text x="660" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#10B981" letter-spacing="1.5">LLM · WITH RAG</text>
    <g transform="translate(520,150)">
      <rect x="0" y="0" width="280" height="40" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
      <text x="140" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#065F46">retrieve → ground → answer</text>
    </g>

    <!-- Library shelf with the act open -->
    <g transform="translate(520,200)">
      <rect x="0" y="0" width="280" height="38" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <text x="14" y="22" font-size="10" font-weight="700" fill="#065F46" letter-spacing="1">GST ACT 2017</text>
      <text x="14" y="32" font-size="9" fill="#065F46" font-style="italic">indexed · searched · cited</text>
      <!-- highlighted chunk -->
      <g transform="translate(180,8)">
        <rect x="0" y="0" width="84" height="22" rx="4" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
        <text x="42" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#7C2D12" font-family="ui-monospace,monospace">§17(5)</text>
      </g>
    </g>

    <!-- arrow with retrieval badge -->
    <path d="M660 246 L660 268" stroke="#10B981" stroke-width="2" marker-end="url(#arrG)"/>
    <g id="retrievalBadge" opacity="0" transform="translate(700,250)">
      <rect x="0" y="0" width="86" height="14" rx="7" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1"/>
      <text x="43" y="10" text-anchor="middle" font-size="9" font-weight="700" fill="#7C2D12">retrieved 3 chunks</text>
    </g>

    <!-- good answer card -->
    <rect x="500" y="278" width="320" height="180" rx="10" fill="#FFFFFF" stroke="#A7F3D0" stroke-width="2"/>
    <text x="516" y="298" font-size="11" font-weight="700" fill="#065F46" letter-spacing="1">ANSWER</text>
    <line x1="500" y1="306" x2="820" y2="306" stroke="#A7F3D0"/>

    <g id="goodAns" font-family="ui-monospace,monospace" font-size="11" fill="#1F2937">
      <text x="516" y="328" id="ga1" opacity="0">ITC reversal is governed by</text>
      <text x="516" y="346" id="ga2" opacity="0"><tspan font-weight="700" fill="#10B981">Section 17(5)</tspan> of the CGST Act</text>
      <text x="516" y="364" id="ga3" opacity="0">— blocked credits.</text>
      <text x="516" y="386" id="ga4" opacity="0" font-size="10" fill="#0EA5E9">[ src: GST_Act_2017.pdf · p.42 ]</text>
    </g>

    <g id="goodCallout" opacity="0">
      <rect x="516" y="402" width="288" height="48" rx="8" fill="#D1FAE5" stroke="#10B981" stroke-width="1.5"/>
      <text x="528" y="420" font-size="11" font-weight="700" fill="#065F46">✓ GROUNDED + CITED</text>
      <text x="528" y="436" font-size="10" fill="#1F2937">Section exists. Page reference verifies.</text>
      <text x="528" y="448" font-size="10" fill="#1F2937">A junior can confirm in 60 seconds.</text>
    </g>
  </g>

  <defs>
    <marker id="arrR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#F43F5E"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#10B981"/>
    </marker>
  </defs>

  <!-- bottom rule -->
  <rect x="40" y="524" width="800" height="26" rx="13" fill="#1F2937"/>
  <text x="440" y="541" text-anchor="middle" font-size="12" fill="#FFF7ED" font-weight="700">Never ship a tax filing without RAG citations. Ever.</text>
</svg>
<div class="cap" id="cap">A model that confidently invents a section number is more dangerous than one that says "I don't know."</div>
<button class="rb" id="reset">restart</button>
</div>
</main>
<script>
(function(){
'use strict';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const bad=['ba1','ba2','ba3'];
const good=['ga1','ga2','ga3','ga4'];
let timers=[];
function later(ms,fn){const t=setTimeout(fn,ms);timers.push(t);return t;}
function clearAll(){timers.forEach(clearTimeout);timers=[];}
function fade(id,from,to,dur){
  const el=document.getElementById(id); if(!el) return;
  if(reduced){el.setAttribute('opacity',to);return;}
  const start=performance.now();
  function tick(now){
    const t=Math.min((now-start)/dur,1);
    const e=1-Math.pow(1-t,3);
    el.setAttribute('opacity',(from+(to-from)*e).toFixed(3));
    if(t<1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
function reset(){
  bad.forEach(i=>document.getElementById(i).setAttribute('opacity',0));
  good.forEach(i=>document.getElementById(i).setAttribute('opacity',0));
  document.getElementById('badCallout').setAttribute('opacity',0);
  document.getElementById('goodCallout').setAttribute('opacity',0);
  document.getElementById('retrievalBadge').setAttribute('opacity',0);
}
function run(){
  clearAll();reset();
  if(reduced){
    bad.forEach(i=>document.getElementById(i).setAttribute('opacity',1));
    good.forEach(i=>document.getElementById(i).setAttribute('opacity',1));
    document.getElementById('badCallout').setAttribute('opacity',1);
    document.getElementById('goodCallout').setAttribute('opacity',1);
    document.getElementById('retrievalBadge').setAttribute('opacity',1);
    return;
  }
  // Bad side fills first
  bad.forEach((id,k)=>later(500+k*450,()=>fade(id,0,1,400)));
  later(500+bad.length*450+200,()=>fade('badCallout',0,1,500));
  // Good side starts in parallel; retrieval badge then answer
  later(700,()=>fade('retrievalBadge',0,1,400));
  good.forEach((id,k)=>later(1200+k*450,()=>fade(id,0,1,400)));
  later(1200+good.length*450+200,()=>fade('goodCallout',0,1,500));
  later(11500,run);
}
document.getElementById('reset').addEventListener('click',run);
run();
})();
</script>
</body>
</html>
