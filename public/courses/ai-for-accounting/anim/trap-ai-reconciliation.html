<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: 100% AI auto-match</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}
*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:720px}
.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}
.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important}}
.match{animation:fade .25s ease both}
.fraud-row{animation:fade .4s ease 4.5s both,flash 1.2s ease 5.5s 2 both}
.fix-tier{animation:fade .5s ease 8s both}
</style></head>
<body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="100% AI auto-match hides a payroll fraud pattern; a confidence-scored tiered approach surfaces it for human review">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>

<!-- BAD: 100% auto -->
<g transform="translate(40 30)">
<rect width="320" height="180" rx="8" fill="#FECACA" stroke="#7F1D1D" stroke-width="2"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#7F1D1D" font-weight="bold">BEFORE · 100% auto-match</text>

<g font-family="ui-monospace,monospace" font-size="9">
<g class="match" style="animation-delay:.5s"><line x1="20" y1="42" x2="200" y2="42" stroke="#10B981" stroke-width="2"/><circle cx="20" cy="42" r="3" fill="#10B981"/><circle cx="200" cy="42" r="3" fill="#10B981"/><text x="220" y="46" fill="#065F46">₹4.2L · ✓ matched</text></g>
<g class="match" style="animation-delay:.9s"><line x1="20" y1="56" x2="200" y2="56" stroke="#10B981" stroke-width="2"/><circle cx="20" cy="56" r="3" fill="#10B981"/><circle cx="200" cy="56" r="3" fill="#10B981"/><text x="220" y="60" fill="#065F46">₹1.8L · ✓ matched</text></g>
<g class="fraud-row"><line x1="20" y1="70" x2="200" y2="70" stroke="#10B981" stroke-width="2"/><circle cx="20" cy="70" r="3" fill="#10B981"/><circle cx="200" cy="70" r="3" fill="#10B981"/><text x="220" y="74" fill="#065F46">₹47K · ✓ matched</text></g>
<g class="match" style="animation-delay:1.7s"><line x1="20" y1="84" x2="200" y2="84" stroke="#10B981" stroke-width="2"/><circle cx="20" cy="84" r="3" fill="#10B981"/><circle cx="200" cy="84" r="3" fill="#10B981"/><text x="220" y="88" fill="#065F46">₹3.1L · ✓ matched</text></g>
<g class="fraud-row" style="animation-delay:5s"><line x1="20" y1="98" x2="200" y2="98" stroke="#10B981" stroke-width="2"/><circle cx="20" cy="98" r="3" fill="#10B981"/><circle cx="200" cy="98" r="3" fill="#10B981"/><text x="220" y="102" fill="#065F46">₹47K · ✓ matched</text></g>
<g class="fraud-row" style="animation-delay:5.5s"><line x1="20" y1="112" x2="200" y2="112" stroke="#10B981" stroke-width="2"/><circle cx="20" cy="112" r="3" fill="#10B981"/><circle cx="200" cy="112" r="3" fill="#10B981"/><text x="220" y="116" fill="#065F46">₹47K · ✓ matched</text></g>
<g class="match" style="animation-delay:2.5s"><line x1="20" y1="126" x2="200" y2="126" stroke="#10B981" stroke-width="2"/><circle cx="20" cy="126" r="3" fill="#10B981"/><circle cx="200" cy="126" r="3" fill="#10B981"/><text x="220" y="130" fill="#065F46">₹2.4L · ✓ matched</text></g>
</g>

<text x="160" y="160" text-anchor="middle" font-size="10" fill="#7F1D1D" font-weight="bold">100% auto · 0 to human queue</text>
<text x="160" y="174" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">payroll fraud pattern hidden in plain sight</text>
</g>

<g class="fraud-row" style="animation-delay:6.5s" transform="translate(40 230)">
<rect width="320" height="50" rx="8" fill="#7F1D1D"/>
<text x="160" y="22" text-anchor="middle" font-size="12" fill="#FCA5A5" font-weight="bold">3 × ₹47K to same vendor name</text>
<text x="160" y="40" text-anchor="middle" font-size="10" fill="#FCA5A5">never flagged · not detected</text>
</g>

<!-- FIX: tiered -->
<g class="fix-tier" transform="translate(380 30)">
<rect width="300" height="250" rx="8" fill="#A7F3D0" stroke="#065F46" stroke-width="2"/>
<text x="150" y="22" text-anchor="middle" font-size="12" fill="#065F46" font-weight="bold">AFTER · confidence-scored tiers</text>

<g transform="translate(20 40)">
<rect width="260" height="60" rx="6" fill="#10B981"/>
<text x="14" y="20" font-size="11" fill="#fff" font-weight="bold">≥ 0.95 · auto-pass (94% of rows)</text>
<text x="14" y="36" font-size="10" fill="#fff">name + amount + date all match</text>
<text x="14" y="50" font-size="9" fill="#fff" font-style="italic">CA review = 0 · zero waste</text>
</g>

<g transform="translate(20 110)">
<rect width="260" height="60" rx="6" fill="#F59E0B"/>
<text x="14" y="20" font-size="11" fill="#fff" font-weight="bold">0.7 - 0.95 · review queue (5%)</text>
<text x="14" y="36" font-size="10" fill="#fff">small mismatch · needs human eye</text>
<text x="14" y="50" font-size="9" fill="#fff" font-style="italic">3 × ₹47K vendor flagged</text>
</g>

<g transform="translate(20 180)">
<rect width="260" height="60" rx="6" fill="#7F1D1D"/>
<text x="14" y="20" font-size="11" fill="#fff" font-weight="bold">&lt; 0.7 · escalate (1%)</text>
<text x="14" y="36" font-size="10" fill="#fff">no plausible match · partner alerted</text>
<text x="14" y="50" font-size="9" fill="#fff" font-style="italic">fraud surfaced same day</text>
</g>
</g>

<g transform="translate(40 305)">
<rect width="640" height="80" rx="10" fill="#1F2937"/>
<text x="320" y="24" text-anchor="middle" font-size="12" fill="#FCD34D" font-weight="bold">Reconciliation is fuzzy matching · confidence-scored tiers are non-optional</text>
<text x="320" y="46" text-anchor="middle" font-size="11" fill="#9CA3AF">100% auto = 0 review = zero learning</text>
<text x="320" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">the review queue is the AI's most valuable output, not a failure mode</text>
</g>
</svg>
<div class="caption">A perfect match rate isn't quality. It's the absence of evidence that anything was found.</div>
</div></main>
<button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
