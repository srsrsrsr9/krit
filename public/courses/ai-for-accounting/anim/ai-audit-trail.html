<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI audit trail — who signs?</title>
<style>
:root{--bg:#FFF7ED;--ink:#1F2937;--muted:#6B7280;--good:#10B981;--amber:#F59E0B;--blue:#0EA5E9;--violet:#8B5CF6;--bad:#F43F5E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
.stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.frame{width:100%;max-width:880px;position:relative}
svg{width:100%;height:auto;display:block}
.cap{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;min-height:18px}
.rb{position:absolute;bottom:6px;right:6px;background:#1F2937;color:#FFF7ED;border:none;border-radius:8px;padding:6px 12px;font-size:11px;cursor:pointer;font-family:inherit;opacity:.7}
.rb:hover{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="stage">
<div class="frame">
<svg viewBox="0 0 880 540" aria-label="Four-stage audit trail. AI processes 1000 transactions, AI logs decisions with rationale, senior CA samples and reviews, CA signs off. Sign-off only at stage 4.">
  <rect width="880" height="540" fill="#FFF7ED"/>
  <text x="440" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">AI does the work. The CA owns the signature.</text>
  <text x="440" y="48" text-anchor="middle" font-size="11" fill="#6B7280" font-style="italic">A defensible audit trail has four stages. The pen only comes out at stage four.</text>

  <!-- Track line -->
  <line x1="80" y1="220" x2="800" y2="220" stroke="#E7E5E4" stroke-width="3" stroke-dasharray="5 5"/>
  <line id="trackFill" x1="80" y1="220" x2="80" y2="220" stroke="#10B981" stroke-width="3"/>

  <!-- STAGE COMMON GEOMETRY: centers at x = 140, 340, 540, 740 ; y=220 -->
  <!-- Stage card layout: rect 160x230 centered on stage x ; top=88 -->

  <!-- STAGE 1 -->
  <g id="s1">
    <rect x="60" y="88" width="160" height="230" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="140" y="108" text-anchor="middle" font-size="11" font-weight="800" fill="#8B5CF6" letter-spacing="1.5">STAGE 1</text>
    <text x="140" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">PROCESS</text>
    <!-- icon: AI brain over transactions -->
    <g transform="translate(140,178)">
      <rect x="-44" y="-26" width="88" height="48" rx="8" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.5"/>
      <g stroke="#8B5CF6" stroke-width="1.2" fill="#FFFFFF">
        <circle cx="-22" cy="-6" r="6"/><circle cx="0" cy="-12" r="6"/><circle cx="22" cy="-6" r="6"/>
        <circle cx="-12" cy="12" r="6"/><circle cx="12" cy="12" r="6"/>
        <line x1="-22" y1="-6" x2="0" y2="-12"/><line x1="0" y1="-12" x2="22" y2="-6"/>
        <line x1="-22" y1="-6" x2="-12" y2="12"/><line x1="22" y1="-6" x2="12" y2="12"/>
      </g>
    </g>
    <text x="140" y="240" text-anchor="middle" font-size="11" fill="#1F2937"><tspan id="txnCount" font-family="ui-monospace,monospace" font-weight="700" fill="#8B5CF6">0</tspan> / 1000 transactions</text>
    <!-- responsibility tag -->
    <g transform="translate(76,266)">
      <rect x="0" y="0" width="128" height="22" rx="11" fill="#FAF5FF" stroke="#8B5CF6" stroke-width="1.2"/>
      <text x="64" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#6D28D9">owner: AI</text>
    </g>
    <text x="140" y="306" text-anchor="middle" font-size="9" fill="#9CA3AF">no signature here</text>
  </g>

  <!-- STAGE 2 -->
  <g id="s2">
    <rect x="260" y="88" width="160" height="230" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="340" y="108" text-anchor="middle" font-size="11" font-weight="800" fill="#0EA5E9" letter-spacing="1.5">STAGE 2</text>
    <text x="340" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">LOG + RATIONALE</text>
    <!-- icon: log sheet -->
    <g transform="translate(340,180)">
      <rect x="-42" y="-32" width="84" height="60" rx="6" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.5"/>
      <line x1="-32" y1="-20" x2="32" y2="-20" stroke="#0EA5E9" stroke-width="1.2" id="log1" opacity="0"/>
      <line x1="-32" y1="-10" x2="20" y2="-10" stroke="#0EA5E9" stroke-width="1.2" id="log2" opacity="0"/>
      <line x1="-32" y1="0" x2="28" y2="0" stroke="#0EA5E9" stroke-width="1.2" id="log3" opacity="0"/>
      <line x1="-32" y1="10" x2="14" y2="10" stroke="#0EA5E9" stroke-width="1.2" id="log4" opacity="0"/>
      <line x1="-32" y1="20" x2="24" y2="20" stroke="#0EA5E9" stroke-width="1.2" id="log5" opacity="0"/>
    </g>
    <text x="340" y="240" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">why each tag was chosen</text>
    <g transform="translate(276,266)">
      <rect x="0" y="0" width="128" height="22" rx="11" fill="#F0F9FF" stroke="#0EA5E9" stroke-width="1.2"/>
      <text x="64" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#0369A1">owner: AI (logged)</text>
    </g>
    <text x="340" y="306" text-anchor="middle" font-size="9" fill="#9CA3AF">no signature here</text>
  </g>

  <!-- STAGE 3 -->
  <g id="s3">
    <rect x="460" y="88" width="160" height="230" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="540" y="108" text-anchor="middle" font-size="11" font-weight="800" fill="#F59E0B" letter-spacing="1.5">STAGE 3</text>
    <text x="540" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">SAMPLE REVIEW</text>
    <!-- icon: human reviewer with magnifier -->
    <g transform="translate(540,180)">
      <!-- person -->
      <circle cx="-14" cy="-8" r="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
      <circle cx="-14" cy="-12" r="3.5" fill="#F59E0B"/>
      <path d="M-26 12 Q-14 0 -2 12" fill="#F59E0B"/>
      <!-- magnifier -->
      <g id="mag" transform="translate(14,-2) rotate(0)">
        <circle cx="0" cy="0" r="13" fill="none" stroke="#F59E0B" stroke-width="2.2"/>
        <line x1="9" y1="9" x2="20" y2="20" stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round"/>
      </g>
    </g>
    <text x="540" y="240" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">10% sample · all flagged rows</text>
    <g transform="translate(476,266)">
      <rect x="0" y="0" width="128" height="22" rx="11" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="64" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#7C2D12">owner: senior CA</text>
    </g>
    <text x="540" y="306" text-anchor="middle" font-size="9" fill="#9CA3AF">no signature yet</text>
  </g>

  <!-- STAGE 4 -->
  <g id="s4">
    <rect x="660" y="88" width="160" height="230" rx="12" fill="#FFFFFF" stroke="#E7E5E4" stroke-width="2"/>
    <text x="740" y="108" text-anchor="middle" font-size="11" font-weight="800" fill="#10B981" letter-spacing="1.5">STAGE 4</text>
    <text x="740" y="125" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">SIGN OFF</text>
    <!-- icon: pen + signature card -->
    <g transform="translate(740,180)">
      <rect x="-42" y="-26" width="84" height="52" rx="6" fill="#ECFDF5" stroke="#10B981" stroke-width="1.5"/>
      <line x1="-32" y1="-12" x2="32" y2="-12" stroke="#A7F3D0" stroke-width="1"/>
      <!-- signature path drawn with stroke-dashoffset -->
      <path id="sigPath" d="M-26 8 Q-18 -8 -10 4 T 6 4 Q14 12 22 -2" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
      <!-- pen -->
      <g id="pen" transform="translate(-26,-30)">
        <line x1="0" y1="0" x2="14" y2="-14" stroke="#1F2937" stroke-width="2" stroke-linecap="round"/>
        <polygon points="-2,2 4,-4 0,-8 -6,-2" fill="#F59E0B"/>
      </g>
    </g>
    <text x="740" y="240" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">accountable · auditable · final</text>
    <g transform="translate(676,266)">
      <rect x="0" y="0" width="128" height="22" rx="11" fill="#ECFDF5" stroke="#10B981" stroke-width="1.2"/>
      <text x="64" y="15" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">owner: senior CA</text>
    </g>
    <text x="740" y="306" text-anchor="middle" font-size="10" fill="#10B981" font-weight="700" id="sigOk" opacity="0">✓ signed</text>
  </g>

  <!-- Stage circle markers on track -->
  <g>
    <circle cx="140" cy="220" r="7" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="2.5" id="dot1"/>
    <circle cx="340" cy="220" r="7" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.5" id="dot2"/>
    <circle cx="540" cy="220" r="7" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2.5" id="dot3"/>
    <circle cx="740" cy="220" r="7" fill="#FFFFFF" stroke="#10B981" stroke-width="2.5" id="dot4"/>
  </g>

  <!-- "no sign" stamps that briefly appear over stages 1-3 to drive home the rule -->
  <g id="noStamp1" opacity="0" transform="translate(140,200) rotate(-12)">
    <rect x="-50" y="-12" width="100" height="24" rx="4" fill="none" stroke="#F43F5E" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="800" fill="#F43F5E" letter-spacing="2">NO SIGN</text>
  </g>
  <g id="noStamp2" opacity="0" transform="translate(340,200) rotate(-12)">
    <rect x="-50" y="-12" width="100" height="24" rx="4" fill="none" stroke="#F43F5E" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="800" fill="#F43F5E" letter-spacing="2">NO SIGN</text>
  </g>
  <g id="noStamp3" opacity="0" transform="translate(540,200) rotate(-12)">
    <rect x="-50" y="-12" width="100" height="24" rx="4" fill="none" stroke="#F43F5E" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-size="11" font-weight="800" fill="#F43F5E" letter-spacing="2">NO SIGN</text>
  </g>

  <!-- "SIGNED" stamp on stage 4 -->
  <g id="signedStamp" opacity="0" transform="translate(740,200) rotate(-12)">
    <rect x="-52" y="-13" width="104" height="26" rx="4" fill="none" stroke="#10B981" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-size="12" font-weight="800" fill="#10B981" letter-spacing="2">SIGNED</text>
  </g>

  <!-- Bottom rule -->
  <rect x="40" y="494" width="800" height="34" rx="14" fill="#1F2937"/>
  <text x="440" y="514" text-anchor="middle" font-size="12" fill="#FFF7ED" font-weight="700">RULE</text>
  <text x="440" y="525" text-anchor="middle" font-size="11" fill="#FCD34D" font-style="italic">a signature at stage 1 is not a workflow. it is a misconduct charge.</text>
</svg>
<div class="cap" id="cap">AI is your fastest junior. The signature is still yours.</div>
<button class="rb" id="reset">restart</button>
</div>
</main>
<script>
(function(){
'use strict';
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;

let timers=[],rafs=[];
function later(ms,fn){const t=setTimeout(fn,ms);timers.push(t);return t;}
function clearAll(){timers.forEach(clearTimeout);timers=[];rafs.forEach(cancelAnimationFrame);rafs=[];}

function fade(id,from,to,dur,cb){
  const el=document.getElementById(id); if(!el){if(cb)cb();return;}
  if(reduced){el.setAttribute('opacity',to);if(cb)cb();return;}
  const start=performance.now();
  function tick(now){
    const t=Math.min((now-start)/dur,1);
    const e=1-Math.pow(1-t,3);
    el.setAttribute('opacity',(from+(to-from)*e).toFixed(3));
    if(t<1) rafs.push(requestAnimationFrame(tick));
    else if(cb) cb();
  }
  rafs.push(requestAnimationFrame(tick));
}

function fillTrack(toX,dur){
  const el=document.getElementById('trackFill');
  if(reduced){el.setAttribute('x2',toX);return;}
  const fromX=parseFloat(el.getAttribute('x2'));
  const start=performance.now();
  function tick(now){
    const t=Math.min((now-start)/dur,1);
    const e=1-Math.pow(1-t,3);
    el.setAttribute('x2', (fromX+(toX-fromX)*e).toFixed(1));
    if(t<1) rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}

function pulseDot(id){
  const el=document.getElementById(id);if(!el)return;
  el.setAttribute('fill', el.getAttribute('stroke'));
}

function countTo(target,dur){
  const el=document.getElementById('txnCount');
  if(reduced){el.textContent=target;return;}
  const start=performance.now();
  function tick(now){
    const t=Math.min((now-start)/dur,1);
    const e=1-Math.pow(1-t,3);
    el.textContent=Math.floor(target*e);
    if(t<1) rafs.push(requestAnimationFrame(tick));
    else el.textContent=target;
  }
  rafs.push(requestAnimationFrame(tick));
}

function wiggleMag(){
  const el=document.getElementById('mag');
  if(reduced) return;
  const start=performance.now();
  const dur=1600;
  function tick(now){
    const t=(now-start)/dur;
    if(t>=1){el.setAttribute('transform','translate(14,-2) rotate(0)');return;}
    const a=Math.sin(t*Math.PI*4)*8;
    const x=14+Math.sin(t*Math.PI*2)*4;
    el.setAttribute('transform',`translate(${x.toFixed(1)},-2) rotate(${a.toFixed(1)})`);
    rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}

function drawSignature(){
  const path=document.getElementById('sigPath');
  const len=path.getTotalLength?path.getTotalLength():80;
  path.setAttribute('stroke-dasharray', len);
  path.setAttribute('stroke-dashoffset', len);
  if(reduced){path.setAttribute('stroke-dashoffset',0);return;}
  // animate pen along the curve
  const pen=document.getElementById('pen');
  const start=performance.now();
  const dur=900;
  function tick(now){
    const t=Math.min((now-start)/dur,1);
    const e=1-Math.pow(1-t,3);
    path.setAttribute('stroke-dashoffset', (len*(1-e)).toFixed(1));
    const pt=path.getPointAtLength(len*e);
    pen.setAttribute('transform',`translate(${(pt.x-14).toFixed(1)},${(pt.y-14).toFixed(1)})`);
    if(t<1) rafs.push(requestAnimationFrame(tick));
  }
  rafs.push(requestAnimationFrame(tick));
}

function reset(){
  ['log1','log2','log3','log4','log5','noStamp1','noStamp2','noStamp3','signedStamp','sigOk'].forEach(id=>{
    const el=document.getElementById(id);if(el)el.setAttribute('opacity',0);
  });
  document.getElementById('txnCount').textContent='0';
  document.getElementById('trackFill').setAttribute('x2','80');
  ['dot1','dot2','dot3','dot4'].forEach(id=>document.getElementById(id).setAttribute('fill','#FFFFFF'));
  const path=document.getElementById('sigPath');
  const len=path.getTotalLength?path.getTotalLength():80;
  path.setAttribute('stroke-dasharray', len);
  path.setAttribute('stroke-dashoffset', len);
  document.getElementById('pen').setAttribute('transform','translate(-26,-30)');
}

function run(){
  clearAll();
  reset();

  if(reduced){
    countTo(1000,0);
    ['log1','log2','log3','log4','log5'].forEach(id=>fade(id,0,1,0));
    fade('noStamp1',0,1,0);fade('noStamp2',0,1,0);fade('noStamp3',0,1,0);
    fade('signedStamp',0,1,0);fade('sigOk',0,1,0);
    pulseDot('dot1');pulseDot('dot2');pulseDot('dot3');pulseDot('dot4');
    drawSignature();
    document.getElementById('trackFill').setAttribute('x2',740);
    return;
  }

  // Stage 1: AI processes
  later(300,()=>{
    pulseDot('dot1');
    countTo(1000,1300);
    fade('noStamp1',0,1,400);
  });
  later(1700,()=>fillTrack(340,500));

  // Stage 2: log lines stream in
  later(2300,()=>{
    pulseDot('dot2');
    fade('noStamp2',0,1,400);
    ['log1','log2','log3','log4','log5'].forEach((id,k)=>later(k*180,()=>fade(id,0,1,250)));
  });
  later(3700,()=>fillTrack(540,500));

  // Stage 3: human review
  later(4300,()=>{
    pulseDot('dot3');
    fade('noStamp3',0,1,400);
    wiggleMag();
  });
  later(5900,()=>fillTrack(740,500));

  // Stage 4: signature
  later(6500,()=>{
    pulseDot('dot4');
    drawSignature();
  });
  later(7500,()=>{
    fade('signedStamp',0,1,500);
    fade('sigOk',0,1,500);
    // fade out the NO SIGN stamps to settle
    later(800,()=>{
      fade('noStamp1',1,0.55,400);fade('noStamp2',1,0.55,400);fade('noStamp3',1,0.55,400);
    });
  });

  later(13000,run);
}

document.getElementById('reset').addEventListener('click',run);
run();
})();
</script>
</body>
</html>
