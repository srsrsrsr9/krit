<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Funnel and its Math</title>
<style>
  :root{
    --bg:#FFF7ED; --ink:#1F2937; --muted:#6B7280;
    --awareness:#0EA5E9; --consideration:#8B5CF6; --purchase:#F59E0B; --retention:#10B981;
    --bad:#F43F5E; --paper:#FFFDF8; --line:#1F2937;
    --ai:#8B5CF6;
    --ease:cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .frame{width:100%;max-width:820px;display:block;}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;max-width:780px;line-height:1.5;}
  .reset{position:fixed;bottom:14px;right:14px;background:#1F2937;color:#FFF7ED;border:none;border-radius:999px;
    font:600 12px system-ui;padding:8px 14px;cursor:pointer;letter-spacing:.02em}
  .reset:hover{background:#374151}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* stages controlled by class on root */
  [data-s] .layer{opacity:0;transition:opacity .5s var(--ease);}
  [data-s="0"] .l-0,[data-s="1"] .l-0,[data-s="1"] .l-1,
  [data-s="2"] .l-0,[data-s="2"] .l-1,[data-s="2"] .l-2,
  [data-s="3"] .l-0,[data-s="3"] .l-1,[data-s="3"] .l-2,[data-s="3"] .l-3,
  [data-s="4"] .l-0,[data-s="4"] .l-1,[data-s="4"] .l-2,[data-s="4"] .l-3,[data-s="4"] .l-4,
  [data-s="5"] .layer{opacity:1;}

  .pulse-ai{transform-origin:center;animation:pulseAI 1.6s var(--ease) infinite;}
  @keyframes pulseAI{
    0%,100%{transform:scale(1);opacity:.95}
    50%{transform:scale(1.06);opacity:1}
  }

  .flow{stroke-dasharray:6 6;animation:flowLine 1.4s linear infinite;}
  @keyframes flowLine{to{stroke-dashoffset:-24}}

  .countup .digit{display:inline-block;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<main class="stage">
  <div>
    <svg id="root" class="frame" viewBox="0 0 820 500" data-s="5"
      aria-label="A funnel showing awareness, consideration, purchase, and retention with CAC of 847 rupees and LTV of 4200 rupees, plus AI applied at top and bottom of funnel.">

      <!-- Title -->
      <text x="410" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1F2937">The funnel — and where AI earns its keep</text>
      <text x="410" y="56" text-anchor="middle" font-size="13" fill="#6B7280">CAC at the top. LTV at the bottom. The math has to work.</text>

      <!-- FUNNEL: 4 trapezoidal slabs -->
      <!-- Awareness (widest) -->
      <g class="layer l-1">
        <path d="M120 100 L700 100 L640 170 L180 170 Z" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="410" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#0C4A6E">AWARENESS</text>
        <text x="410" y="156" text-anchor="middle" font-size="11" fill="#0C4A6E" opacity=".8">top of funnel — strangers</text>
      </g>

      <!-- Consideration -->
      <g class="layer l-2">
        <path d="M180 175 L640 175 L580 245 L240 245 Z" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="410" y="213" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">CONSIDERATION</text>
        <text x="410" y="231" text-anchor="middle" font-size="11" fill="#5B21B6" opacity=".8">they're listening</text>
      </g>

      <!-- Purchase -->
      <g class="layer l-3">
        <path d="M240 250 L580 250 L520 320 L300 320 Z" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="410" y="288" text-anchor="middle" font-size="15" font-weight="700" fill="#92400E">PURCHASE</text>
        <text x="410" y="306" text-anchor="middle" font-size="11" fill="#92400E" opacity=".8">first transaction</text>
      </g>

      <!-- Retention -->
      <g class="layer l-4">
        <path d="M300 325 L520 325 L460 395 L360 395 Z" fill="#D1FAE5" stroke="#10B981" stroke-width="2.5" stroke-linejoin="round"/>
        <text x="410" y="363" text-anchor="middle" font-size="15" font-weight="700" fill="#065F46">RETENTION</text>
        <text x="410" y="381" text-anchor="middle" font-size="11" fill="#065F46" opacity=".8">they come back</text>
      </g>

      <!-- LEFT side: CAC math at top -->
      <g class="layer l-1">
        <line x1="78" y1="135" x2="118" y2="135" stroke="#0EA5E9" stroke-width="2"/>
        <rect x="14" y="100" width="64" height="70" rx="10" fill="#FFFDF8" stroke="#0EA5E9" stroke-width="2"/>
        <text x="46" y="120" text-anchor="middle" font-size="10" font-weight="700" fill="#0C4A6E">CAC</text>
        <text x="46" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#0C4A6E" class="num">₹847</text>
        <text x="46" y="160" text-anchor="middle" font-size="9" fill="#0C4A6E" opacity=".8">cost to acquire</text>
      </g>

      <!-- RIGHT side: LTV math at bottom -->
      <g class="layer l-4">
        <line x1="520" y1="360" x2="560" y2="360" stroke="#10B981" stroke-width="2"/>
        <rect x="560" y="325" width="78" height="70" rx="10" fill="#FFFDF8" stroke="#10B981" stroke-width="2"/>
        <text x="599" y="345" text-anchor="middle" font-size="10" font-weight="700" fill="#065F46">LTV</text>
        <text x="599" y="367" text-anchor="middle" font-size="14" font-weight="700" fill="#065F46" class="num">₹4,200</text>
        <text x="599" y="385" text-anchor="middle" font-size="9" fill="#065F46" opacity=".8">lifetime value</text>
      </g>

      <!-- AI ROBOT @ top: programmatic ads + content -->
      <g class="layer l-1" id="aiTop">
        <g class="pulse-ai" transform="translate(720, 105)">
          <rect x="-26" y="-22" width="52" height="44" rx="10" fill="#8B5CF6" stroke="#1F2937" stroke-width="2"/>
          <circle cx="-9" cy="-4" r="3.5" fill="#FFF7ED"/>
          <circle cx="9" cy="-4" r="3.5" fill="#FFF7ED"/>
          <rect x="-9" y="8" width="18" height="3" rx="1.5" fill="#FFF7ED"/>
          <line x1="0" y1="-22" x2="0" y2="-30" stroke="#1F2937" stroke-width="2"/>
          <circle cx="0" cy="-32" r="2.5" fill="#F59E0B"/>
        </g>
        <text x="720" y="160" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">AI here</text>
        <text x="720" y="174" text-anchor="middle" font-size="9.5" fill="#6B7280">programmatic ads,</text>
        <text x="720" y="186" text-anchor="middle" font-size="9.5" fill="#6B7280">content at scale</text>
        <!-- arrow into funnel -->
        <line class="flow" x1="694" y1="135" x2="640" y2="135" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="640,135 648,131 648,139" fill="#8B5CF6"/>
      </g>

      <!-- AI ROBOT @ bottom: personalization + churn -->
      <g class="layer l-4" id="aiBot">
        <g class="pulse-ai" transform="translate(110, 360)">
          <rect x="-26" y="-22" width="52" height="44" rx="10" fill="#8B5CF6" stroke="#1F2937" stroke-width="2"/>
          <circle cx="-9" cy="-4" r="3.5" fill="#FFF7ED"/>
          <circle cx="9" cy="-4" r="3.5" fill="#FFF7ED"/>
          <path d="M-9 9 Q0 14 9 9" stroke="#FFF7ED" stroke-width="2" fill="none" stroke-linecap="round"/>
          <line x1="0" y1="-22" x2="0" y2="-30" stroke="#1F2937" stroke-width="2"/>
          <circle cx="0" cy="-32" r="2.5" fill="#10B981"/>
        </g>
        <text x="110" y="406" text-anchor="middle" font-size="10" font-weight="700" fill="#5B21B6">AI here too</text>
        <text x="110" y="420" text-anchor="middle" font-size="9.5" fill="#6B7280">personalization,</text>
        <text x="110" y="432" text-anchor="middle" font-size="9.5" fill="#6B7280">churn prediction</text>
        <!-- arrow into retention -->
        <line class="flow" x1="138" y1="360" x2="358" y2="360" stroke="#8B5CF6" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="358,360 350,356 350,364" fill="#8B5CF6"/>
      </g>

      <!-- Bottom verdict band -->
      <g class="layer l-5">
        <rect x="120" y="430" width="580" height="48" rx="12" fill="#FFFDF8" stroke="#1F2937" stroke-width="2"/>
        <text x="138" y="450" font-size="12" font-weight="700" fill="#1F2937">The math:</text>
        <text x="200" y="450" font-size="12.5" fill="#1F2937" class="num">₹847 in</text>
        <text x="263" y="450" font-size="12.5" fill="#6B7280"> →</text>
        <text x="280" y="450" font-size="12.5" fill="#1F2937" class="num">₹4,200 out</text>
        <text x="362" y="450" font-size="12.5" fill="#6B7280">  =</text>
        <text x="385" y="450" font-size="12.5" font-weight="700" fill="#10B981" class="num">5.0× ratio</text>
        <text x="138" y="468" font-size="11" fill="#6B7280">healthy unit economics. AI's job is to make this ratio bigger — not just to look busy.</text>
      </g>

      <!-- Tiny stage indicator -->
      <g transform="translate(740, 470)">
        <circle cx="0" cy="0" r="3.5" fill="#0EA5E9" id="d1"/>
        <circle cx="12" cy="0" r="3.5" fill="#8B5CF6" id="d2"/>
        <circle cx="24" cy="0" r="3.5" fill="#F59E0B" id="d3"/>
        <circle cx="36" cy="0" r="3.5" fill="#10B981" id="d4"/>
        <circle cx="48" cy="0" r="3.5" fill="#1F2937" id="d5"/>
      </g>
    </svg>
    <div class="caption">Awareness and retention are where AI pays. The middle is mostly the same craft as before.</div>
  </div>
</main>
<button class="reset" id="reset" aria-label="Restart animation">Restart</button>

<script>
(function(){
  const root = document.getElementById('root');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const stages = [0,1,2,3,4,5];
  let i = 0, t;
  function step(){
    root.dataset.s = stages[i];
    i = (i+1) % stages.length;
    const dwell = (stages[i-1<0?stages.length-1:i-1]===5) ? 2400 : 1500;
    t = setTimeout(step, dwell);
  }
  function start(){
    if(reduced){ root.dataset.s = 5; return; }
    clearTimeout(t); i = 0; step();
  }
  document.getElementById('reset').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
