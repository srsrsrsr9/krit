<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trap: AI tactics without metrics</title>
<style>
  :root{
    --bg:#FFF7ED; --ink:#1F2937; --muted:#6B7280;
    --amber:#F59E0B; --good:#10B981; --sky:#0EA5E9; --violet:#8B5CF6; --rose:#F43F5E;
    --paper:#FFFFFF;
    --ease:cubic-bezier(0.22,0.61,0.36,1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:820px}
  .frame{width:100%;aspect-ratio:16/10;display:block}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;line-height:1.45}
  .reset{position:fixed;right:14px;bottom:14px;background:var(--paper);border:1.5px solid #E5E7EB;color:var(--ink);
    font:600 12px/1 system-ui,sans-serif;padding:8px 12px;border-radius:999px;cursor:pointer}
  .reset:hover{border-color:var(--ink)}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important}
  }
</style>
</head>
<body>
<main class="stage">
  <div class="wrap">
    <svg id="svg" class="frame" viewBox="0 0 820 510" aria-label="A marketer floods their funnel with AI tactics, but the success metric stays flat. The fix: pin the metric first, then choose the AI move that moves it.">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F1E7D4" stroke-width="1"/>
        </pattern>
        <clipPath id="chartClip"><rect x="470" y="100" width="320" height="200" rx="10"/></clipPath>
      </defs>

      <rect x="0" y="0" width="820" height="510" fill="var(--bg)"/>
      <rect x="20" y="20" width="780" height="470" rx="14" fill="#FFFDF8" stroke="#EADFCB" stroke-width="1.5"/>

      <!-- Title -->
      <text x="40" y="58" font-size="18" font-weight="700" fill="var(--ink)">More AI ≠ more growth</text>
      <text x="40" y="78" font-size="12" fill="var(--muted)">Q2 dashboard — 14 weeks</text>

      <!-- LEFT: Marketer + funnel -->
      <g id="leftPanel">
        <!-- Marketer -->
        <g transform="translate(80,200)">
          <ellipse cx="0" cy="56" rx="42" ry="14" fill="#F1E7D4" opacity="0.7"/>
          <circle cx="0" cy="-22" r="20" fill="#FCD9B6" stroke="#1F2937" stroke-width="2"/>
          <path d="M-20,-30 q20,-22 40,0" fill="#1F2937"/>
          <circle cx="-7" cy="-22" r="2" fill="#1F2937"/><circle cx="7" cy="-22" r="2" fill="#1F2937"/>
          <path d="M-6,-15 q6,4 12,0" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-linecap="round"/>
          <rect x="-22" y="2" width="44" height="44" rx="10" fill="var(--violet)" stroke="#1F2937" stroke-width="2"/>
          <path d="M-12,18 l8,8 l16,-16" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- Funnel -->
        <g transform="translate(220,150)">
          <path d="M 0 20 L 200 20 L 150 130 L 50 130 Z" fill="#FEF3C7" stroke="#1F2937" stroke-width="2"/>
          <path d="M 50 130 L 150 130 L 130 175 L 70 175 Z" fill="#FCD9B6" stroke="#1F2937" stroke-width="2"/>
          <text x="100" y="200" text-anchor="middle" font-size="11" fill="var(--muted)">funnel</text>
        </g>

        <!-- Tactic chips that fly into the funnel -->
        <g id="chips">
          <g class="chip" id="c1" transform="translate(60,150)">
            <rect x="-46" y="-14" width="92" height="28" rx="14" fill="var(--sky)" stroke="#1F2937" stroke-width="1.5"/>
            <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">AI ads</text>
          </g>
          <g class="chip" id="c2" transform="translate(60,150)">
            <rect x="-58" y="-14" width="116" height="28" rx="14" fill="var(--amber)" stroke="#1F2937" stroke-width="1.5"/>
            <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#1F2937">AI emails (1:1)</text>
          </g>
          <g class="chip" id="c3" transform="translate(60,150)">
            <rect x="-50" y="-14" width="100" height="28" rx="14" fill="var(--good)" stroke="#1F2937" stroke-width="1.5"/>
            <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">AI chatbot</text>
          </g>
          <g class="chip" id="c4" transform="translate(60,150)">
            <rect x="-60" y="-14" width="120" height="28" rx="14" fill="var(--violet)" stroke="#1F2937" stroke-width="1.5"/>
            <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">AI subject lines</text>
          </g>
          <g class="chip" id="c5" transform="translate(60,150)">
            <rect x="-54" y="-14" width="108" height="28" rx="14" fill="var(--rose)" stroke="#1F2937" stroke-width="1.5"/>
            <text x="0" y="4" text-anchor="middle" font-size="11" font-weight="700" fill="#FFF">AI retargeting</text>
          </g>
        </g>
      </g>

      <!-- RIGHT: Chart -->
      <g id="chartPanel">
        <rect x="470" y="100" width="320" height="200" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1.5"/>
        <rect x="470" y="100" width="320" height="200" rx="10" fill="url(#grid)" opacity="0.6"/>
        <text x="486" y="124" font-size="12" font-weight="700" fill="var(--ink)">ROAS</text>
        <text x="486" y="140" font-size="10" fill="var(--muted)" class="num">target 3.0×</text>

        <!-- y-axis -->
        <line x1="486" y1="150" x2="486" y2="284" stroke="#9CA3AF" stroke-width="1"/>
        <line x1="486" y1="284" x2="780" y2="284" stroke="#9CA3AF" stroke-width="1"/>

        <!-- target line -->
        <line x1="486" y1="190" x2="780" y2="190" stroke="#10B981" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.7"/>
        <text x="784" y="194" font-size="10" fill="var(--good)" class="num">3.0×</text>

        <!-- flat ROAS line, animates draw -->
        <g clip-path="url(#chartClip)">
          <path id="roas" d="M 490 232 L 540 230 L 590 234 L 640 231 L 690 233 L 740 232 L 778 233"
                fill="none" stroke="#1F2937" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
                stroke-dasharray="600" stroke-dashoffset="600"/>
        </g>
        <text x="486" y="312" font-size="10" fill="var(--muted)">wk 1</text>
        <text x="755" y="312" font-size="10" fill="var(--muted)">wk 14</text>

        <!-- CAC tag -->
        <g id="cacTag" opacity="0">
          <rect x="600" y="155" width="160" height="34" rx="8" fill="#FEE2E2" stroke="var(--rose)" stroke-width="1.5"/>
          <text x="612" y="170" font-size="10" fill="var(--rose)" font-weight="700">CAC vs Q1</text>
          <text x="612" y="184" font-size="13" fill="var(--rose)" font-weight="700" class="num">+14%</text>
          <path d="M745,180 l8,-10 l-4,0 l0,-8 l-8,0 l0,8 l-4,0 z" fill="var(--rose)"/>
        </g>

        <!-- Flat label -->
        <g id="flatLabel" opacity="0">
          <rect x="540" y="200" width="200" height="26" rx="13" fill="#FEF3C7" stroke="var(--amber)" stroke-width="1.5"/>
          <text x="640" y="218" text-anchor="middle" font-size="11" font-weight="700" fill="#92400E">metric flat. AI ≠ outcome.</text>
        </g>
      </g>

      <!-- BOTTOM FIX banner (revealed in stage 4) -->
      <g id="fix" opacity="0">
        <rect x="40" y="380" width="740" height="92" rx="14" fill="#ECFDF5" stroke="var(--good)" stroke-width="2"/>
        <text x="60" y="408" font-size="13" font-weight="700" fill="#065F46">The fix — pin the metric first.</text>

        <g transform="translate(60,420)">
          <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--good)"/>
          <text x="22" y="11" font-size="12" fill="var(--ink)">1. Pin the metric → ROAS ≥ 3.0× by wk 14</text>
        </g>
        <g transform="translate(60,442)">
          <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--good)"/>
          <text x="22" y="11" font-size="12" fill="var(--ink)">2. Ask: "what's the AI move that moves IT?"</text>
        </g>
        <g transform="translate(420,420)">
          <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--amber)"/>
          <text x="22" y="11" font-size="12" fill="var(--ink)">3. One bet at a time. Measure. Then add.</text>
        </g>
        <g transform="translate(420,442)">
          <rect x="0" y="0" width="14" height="14" rx="3" fill="var(--amber)"/>
          <text x="22" y="11" font-size="12" fill="var(--ink)">4. Cut what doesn't move the number.</text>
        </g>
      </g>

      <!-- Stage caption -->
      <text id="stageLabel" x="410" y="496" text-anchor="middle" font-size="12" fill="var(--muted)" font-style="italic">Stage 1 — adding AI everywhere</text>
    </svg>
    <div class="caption">"More AI" is a tactic. "Move the number" is a strategy. Pin the metric, then pick the AI bet that moves it.</div>
    <button class="reset" id="resetBtn" type="button" aria-label="Replay animation">Replay</button>
  </div>
</main>
<script>
(function(){
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const svg = document.getElementById('svg');
  const chips = ['c1','c2','c3','c4','c5'].map(id=>document.getElementById(id));
  const roas = document.getElementById('roas');
  const cacTag = document.getElementById('cacTag');
  const flatLabel = document.getElementById('flatLabel');
  const fix = document.getElementById('fix');
  const stageLabel = document.getElementById('stageLabel');
  const resetBtn = document.getElementById('resetBtn');

  // Funnel mouth target (rough): center around (320,170)
  const targets = [
    {x:300,y:175}, {x:320,y:175}, {x:340,y:175}, {x:310,y:172}, {x:330,y:178}
  ];
  const starts = [
    {x:80,y:140}, {x:80,y:180}, {x:80,y:220}, {x:80,y:260}, {x:80,y:300}
  ];

  let timers = [];
  function schedule(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); }
  function clearAll(){ timers.forEach(clearTimeout); timers = []; }

  function setChip(i, x, y, scale, opacity){
    const el = chips[i];
    el.setAttribute('transform', `translate(${x},${y}) scale(${scale})`);
    el.style.opacity = opacity;
  }

  function reset(){
    clearAll();
    chips.forEach((el,i)=>{
      el.style.transition='none';
      el.style.opacity = 0;
      el.setAttribute('transform', `translate(${starts[i].x},${starts[i].y}) scale(0.6)`);
    });
    roas.style.transition='none';
    roas.setAttribute('stroke-dashoffset','600');
    cacTag.style.transition='none'; cacTag.style.opacity=0;
    flatLabel.style.transition='none'; flatLabel.style.opacity=0;
    fix.style.transition='none'; fix.style.opacity=0;
    stageLabel.textContent='Stage 1 — adding AI everywhere';
    // force reflow
    void svg.getBoundingClientRect();
    if(reduce){ runReduced(); } else { run(); }
  }

  function runReduced(){
    chips.forEach((el,i)=>{
      el.style.opacity = 1;
      el.setAttribute('transform', `translate(${targets[i].x},${targets[i].y}) scale(0.9)`);
    });
    roas.setAttribute('stroke-dashoffset','0');
    cacTag.style.opacity = 1;
    flatLabel.style.opacity = 1;
    fix.style.opacity = 1;
    stageLabel.textContent='Pin the metric first.';
  }

  function run(){
    const ease = 'cubic-bezier(0.22,0.61,0.36,1)';
    // Stage 1: chips fly in (0–3.5s)
    chips.forEach((el,i)=>{
      schedule(()=>{
        el.style.transition = `transform 900ms ${ease}, opacity 350ms ${ease}`;
        el.style.opacity = 1;
        el.setAttribute('transform', `translate(${targets[i].x},${targets[i].y}) scale(0.9)`);
      }, 250 + i*450);
    });

    // Stage 2: chart line draws (3.5s –> 6.0s)
    schedule(()=>{
      stageLabel.textContent='Stage 2 — Q2 results land';
      roas.style.transition = 'stroke-dashoffset 2200ms cubic-bezier(0.22,0.61,0.36,1)';
      roas.setAttribute('stroke-dashoffset','0');
    }, 3300);

    // Stage 3: flat label + CAC tag (6.0s –> 8.5s)
    schedule(()=>{
      flatLabel.style.transition='opacity 500ms ease';
      flatLabel.style.opacity=1;
    }, 5800);
    schedule(()=>{
      cacTag.style.transition='opacity 500ms ease, transform 500ms ease';
      cacTag.style.opacity=1;
      stageLabel.textContent='ROAS flat. CAC up 14%.';
    }, 6500);

    // Stage 4: Fix banner (8.5s –> 11s)
    schedule(()=>{
      fix.style.transition='opacity 700ms ease';
      fix.style.opacity=1;
      stageLabel.textContent='Pin the metric. Then pick the AI move that moves it.';
    }, 8800);

    // Loop reset (~13s)
    schedule(()=>{ reset(); }, 13500);
  }

  resetBtn.addEventListener('click', reset);
  reset();
})();
</script>
</body>
</html>
