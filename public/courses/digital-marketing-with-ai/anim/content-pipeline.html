<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Content Pipeline: brief → AI → human → ship</title>
<style>
  :root{
    --bg:#FFF7ED; --ink:#1F2937; --muted:#6B7280;
    --paper:#FFFDF8; --line:#1F2937;
    --brief:#0EA5E9; --ai:#8B5CF6; --human:#F59E0B; --ship:#10B981;
    --reject:#F43F5E; --edit:#F59E0B; --approve:#10B981;
    --ease:cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .frame{width:100%;max-width:860px;display:block;}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;max-width:780px;line-height:1.5;}
  .reset{position:fixed;bottom:14px;right:14px;background:#1F2937;color:#FFF7ED;border:none;border-radius:999px;
    font:600 12px system-ui;padding:8px 14px;cursor:pointer;letter-spacing:.02em}
  .reset:hover{background:#374151}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  [data-s] .layer{opacity:0;transition:opacity .5s var(--ease);}
  [data-s="0"] .l-0,
  [data-s="1"] .l-0,[data-s="1"] .l-1,
  [data-s="2"] .l-0,[data-s="2"] .l-1,[data-s="2"] .l-2,
  [data-s="3"] .l-0,[data-s="3"] .l-1,[data-s="3"] .l-2,[data-s="3"] .l-3,
  [data-s="4"] .layer{opacity:1;}

  .draft{transform-origin:center;transition:transform .6s var(--ease), opacity .5s var(--ease);}
  [data-s="3"] .verdict{opacity:1 !important; transition:opacity .5s var(--ease) .2s;}
  .verdict{opacity:0}

  .stamp{transform-origin:center; transform:scale(0); opacity:0;}
  [data-s="3"] .stamp{ animation: stampIn .5s var(--ease) forwards; animation-delay: var(--d, 0s); }
  @keyframes stampIn { 0%{transform:scale(2.4) rotate(-12deg); opacity:0} 70%{transform:scale(.92) rotate(-6deg); opacity:1} 100%{transform:scale(1) rotate(-6deg); opacity:1}}

  .arrow.flow{stroke-dasharray:6 6;animation:flowLine 1.4s linear infinite;}
  @keyframes flowLine{to{stroke-dashoffset:-24}}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>
<body>
<main class="stage">
  <div>
    <svg id="root" class="frame" viewBox="0 0 860 480" data-s="4"
      aria-label="A four-stage content pipeline: brief, AI draft, human review, ship. Five drafts produced, two rejected as off-brand, two edited, one approved.">

      <text x="430" y="32" text-anchor="middle" font-size="20" font-weight="700">The pipeline that doesn't make slop</text>
      <text x="430" y="54" text-anchor="middle" font-size="13" fill="#6B7280">brief → AI drafts → human filter → ship. Rejection rate is the point, not the bug.</text>

      <!-- ============ STAGE 1: BRIEF ============ -->
      <g class="layer l-0" transform="translate(20,90)">
        <rect x="0" y="0" width="170" height="280" rx="14" fill="#E0F2FE" stroke="#0EA5E9" stroke-width="2"/>
        <text x="85" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#0C4A6E">1 · BRIEF</text>
        <text x="85" y="40" text-anchor="middle" font-size="10" fill="#0C4A6E" opacity=".8">brand voice + 3 anchors</text>

        <!-- Anchor card 1 -->
        <rect x="14" y="56" width="142" height="60" rx="8" fill="#FFFDF8" stroke="#0C4A6E" stroke-width="1.5"/>
        <text x="22" y="74" font-size="10" font-weight="700" fill="#0C4A6E">anchor 01</text>
        <line x1="22" y1="82" x2="148" y2="82" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="92" x2="138" y2="92" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="100" x2="120" y2="100" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="108" x2="100" y2="108" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>

        <!-- Anchor 2 -->
        <rect x="14" y="124" width="142" height="60" rx="8" fill="#FFFDF8" stroke="#0C4A6E" stroke-width="1.5"/>
        <text x="22" y="142" font-size="10" font-weight="700" fill="#0C4A6E">anchor 02</text>
        <line x1="22" y1="150" x2="148" y2="150" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="160" x2="130" y2="160" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="168" x2="142" y2="168" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="176" x2="92" y2="176" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>

        <!-- Anchor 3 -->
        <rect x="14" y="192" width="142" height="60" rx="8" fill="#FFFDF8" stroke="#0C4A6E" stroke-width="1.5"/>
        <text x="22" y="210" font-size="10" font-weight="700" fill="#0C4A6E">anchor 03</text>
        <line x1="22" y1="218" x2="140" y2="218" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="226" x2="120" y2="226" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="234" x2="148" y2="234" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>
        <line x1="22" y1="242" x2="100" y2="242" stroke="#0C4A6E" stroke-width=".7" opacity=".3"/>

        <text x="85" y="270" text-anchor="middle" font-size="9.5" fill="#0C4A6E" font-style="italic">"this is what we sound like"</text>
      </g>

      <!-- arrow brief -> ai -->
      <g class="layer l-0" transform="translate(195, 230)">
        <line class="arrow flow" x1="0" y1="0" x2="28" y2="0" stroke="#0C4A6E" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="28,0 22,-4 22,4" fill="#0C4A6E"/>
      </g>

      <!-- ============ STAGE 2: AI ============ -->
      <g class="layer l-1" transform="translate(232,90)">
        <rect x="0" y="0" width="170" height="280" rx="14" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="2"/>
        <text x="85" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#5B21B6">2 · AI DRAFTS</text>
        <text x="85" y="40" text-anchor="middle" font-size="10" fill="#5B21B6" opacity=".8">5 variants in 30 seconds</text>

        <!-- robot -->
        <g transform="translate(85,82)">
          <rect x="-22" y="-18" width="44" height="36" rx="8" fill="#8B5CF6" stroke="#1F2937" stroke-width="2"/>
          <circle cx="-7" cy="-3" r="3" fill="#FFF7ED"/>
          <circle cx="7" cy="-3" r="3" fill="#FFF7ED"/>
          <rect x="-7" y="6" width="14" height="2.6" rx="1.3" fill="#FFF7ED"/>
          <line x1="0" y1="-18" x2="0" y2="-25" stroke="#1F2937" stroke-width="2"/>
          <circle cx="0" cy="-27" r="2.2" fill="#F59E0B"/>
        </g>

        <!-- 5 mini drafts in a small grid -->
        <g font-family="ui-monospace,monospace" font-size="9">
          <!-- d1 -->
          <rect x="14" y="120" width="68" height="50" rx="6" fill="#FFFDF8" stroke="#5B21B6" stroke-width="1.2"/>
          <text x="20" y="134" font-weight="700" fill="#5B21B6">draft 01</text>
          <line x1="20" y1="140" x2="76" y2="140" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="20" y1="148" x2="68" y2="148" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="20" y1="156" x2="60" y2="156" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>

          <!-- d2 -->
          <rect x="88" y="120" width="68" height="50" rx="6" fill="#FFFDF8" stroke="#5B21B6" stroke-width="1.2"/>
          <text x="94" y="134" font-weight="700" fill="#5B21B6">draft 02</text>
          <line x1="94" y1="140" x2="150" y2="140" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="94" y1="148" x2="142" y2="148" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="94" y1="156" x2="130" y2="156" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>

          <!-- d3 -->
          <rect x="14" y="178" width="68" height="50" rx="6" fill="#FFFDF8" stroke="#5B21B6" stroke-width="1.2"/>
          <text x="20" y="192" font-weight="700" fill="#5B21B6">draft 03</text>
          <line x1="20" y1="198" x2="76" y2="198" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="20" y1="206" x2="64" y2="206" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="20" y1="214" x2="58" y2="214" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>

          <!-- d4 -->
          <rect x="88" y="178" width="68" height="50" rx="6" fill="#FFFDF8" stroke="#5B21B6" stroke-width="1.2"/>
          <text x="94" y="192" font-weight="700" fill="#5B21B6">draft 04</text>
          <line x1="94" y1="198" x2="150" y2="198" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="94" y1="206" x2="138" y2="206" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="94" y1="214" x2="124" y2="214" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>

          <!-- d5 -->
          <rect x="51" y="236" width="68" height="32" rx="6" fill="#FFFDF8" stroke="#5B21B6" stroke-width="1.2"/>
          <text x="57" y="250" font-weight="700" fill="#5B21B6">draft 05</text>
          <line x1="57" y1="256" x2="113" y2="256" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
          <line x1="57" y1="262" x2="100" y2="262" stroke="#5B21B6" stroke-width=".6" opacity=".4"/>
        </g>
      </g>

      <!-- arrow ai -> review -->
      <g class="layer l-1" transform="translate(407, 230)">
        <line class="arrow flow" x1="0" y1="0" x2="28" y2="0" stroke="#5B21B6" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="28,0 22,-4 22,4" fill="#5B21B6"/>
      </g>

      <!-- ============ STAGE 3: HUMAN REVIEW ============ -->
      <g class="layer l-2" transform="translate(444,90)">
        <rect x="0" y="0" width="220" height="280" rx="14" fill="#FEF3C7" stroke="#F59E0B" stroke-width="2"/>
        <text x="110" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#92400E">3 · HUMAN REVIEW</text>
        <text x="110" y="40" text-anchor="middle" font-size="10" fill="#92400E" opacity=".8">the filter that earns the wage</text>

        <!-- reviewer head -->
        <g transform="translate(36,80)">
          <circle cx="0" cy="0" r="14" fill="#FFFDF8" stroke="#1F2937" stroke-width="2"/>
          <circle cx="-4" cy="-2" r="1.7" fill="#1F2937"/>
          <circle cx="4" cy="-2" r="1.7" fill="#1F2937"/>
          <path d="M-5 5 Q0 8 5 5" stroke="#1F2937" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        </g>

        <!-- the 5 drafts arranged with verdict stamps -->
        <g font-family="ui-monospace,monospace" font-size="9.5">
          <!-- 1 reject -->
          <g class="draft" transform="translate(70,68)">
            <rect x="0" y="0" width="130" height="36" rx="6" fill="#FFFDF8" stroke="#92400E" stroke-width="1.2"/>
            <text x="8" y="14" font-weight="700" fill="#92400E">draft 01</text>
            <line x1="8" y1="20" x2="120" y2="20" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <line x1="8" y1="26" x2="100" y2="26" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <g class="stamp verdict" style="--d:.0s" transform="translate(108,18)">
              <circle r="13" fill="#FECDD3" stroke="#F43F5E" stroke-width="1.6"/>
              <text text-anchor="middle" y="3.5" font-size="9.5" font-weight="700" fill="#9F1239">REJECT</text>
            </g>
          </g>

          <!-- 2 reject -->
          <g class="draft" transform="translate(70,108)">
            <rect x="0" y="0" width="130" height="36" rx="6" fill="#FFFDF8" stroke="#92400E" stroke-width="1.2"/>
            <text x="8" y="14" font-weight="700" fill="#92400E">draft 02</text>
            <line x1="8" y1="20" x2="120" y2="20" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <line x1="8" y1="26" x2="100" y2="26" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <g class="stamp verdict" style="--d:.15s" transform="translate(108,18)">
              <circle r="13" fill="#FECDD3" stroke="#F43F5E" stroke-width="1.6"/>
              <text text-anchor="middle" y="3.5" font-size="9.5" font-weight="700" fill="#9F1239">REJECT</text>
            </g>
          </g>

          <!-- 3 edit -->
          <g class="draft" transform="translate(70,148)">
            <rect x="0" y="0" width="130" height="36" rx="6" fill="#FFFDF8" stroke="#92400E" stroke-width="1.2"/>
            <text x="8" y="14" font-weight="700" fill="#92400E">draft 03</text>
            <line x1="8" y1="20" x2="120" y2="20" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <line x1="8" y1="26" x2="100" y2="26" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <g class="stamp verdict" style="--d:.30s" transform="translate(108,18)">
              <circle r="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.6"/>
              <text text-anchor="middle" y="3.5" font-size="11" font-weight="700" fill="#92400E">EDIT</text>
            </g>
          </g>

          <!-- 4 edit -->
          <g class="draft" transform="translate(70,188)">
            <rect x="0" y="0" width="130" height="36" rx="6" fill="#FFFDF8" stroke="#92400E" stroke-width="1.2"/>
            <text x="8" y="14" font-weight="700" fill="#92400E">draft 04</text>
            <line x1="8" y1="20" x2="120" y2="20" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <line x1="8" y1="26" x2="100" y2="26" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <g class="stamp verdict" style="--d:.45s" transform="translate(108,18)">
              <circle r="13" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.6"/>
              <text text-anchor="middle" y="3.5" font-size="11" font-weight="700" fill="#92400E">EDIT</text>
            </g>
          </g>

          <!-- 5 approve -->
          <g class="draft" transform="translate(70,228)">
            <rect x="0" y="0" width="130" height="36" rx="6" fill="#FFFDF8" stroke="#92400E" stroke-width="1.2"/>
            <text x="8" y="14" font-weight="700" fill="#92400E">draft 05</text>
            <line x1="8" y1="20" x2="120" y2="20" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <line x1="8" y1="26" x2="100" y2="26" stroke="#92400E" stroke-width=".6" opacity=".4"/>
            <g class="stamp verdict" style="--d:.60s" transform="translate(108,18)">
              <circle r="13" fill="#D1FAE5" stroke="#10B981" stroke-width="1.6"/>
              <text text-anchor="middle" y="3.5" font-size="9" font-weight="700" fill="#065F46">SHIP</text>
            </g>
          </g>
        </g>
      </g>

      <!-- arrow review -> ship -->
      <g class="layer l-3" transform="translate(670, 230)">
        <line class="arrow flow" x1="0" y1="0" x2="28" y2="0" stroke="#92400E" stroke-width="2.5" stroke-linecap="round"/>
        <polygon points="28,0 22,-4 22,4" fill="#92400E"/>
      </g>

      <!-- ============ STAGE 4: SHIP ============ -->
      <g class="layer l-3" transform="translate(706,90)">
        <rect x="0" y="0" width="138" height="280" rx="14" fill="#D1FAE5" stroke="#10B981" stroke-width="2"/>
        <text x="69" y="24" text-anchor="middle" font-size="13" font-weight="700" fill="#065F46">4 · SHIP</text>
        <text x="69" y="40" text-anchor="middle" font-size="10" fill="#065F46" opacity=".8">on-brand. only.</text>

        <!-- the survivor -->
        <rect x="18" y="60" width="102" height="120" rx="10" fill="#FFFDF8" stroke="#10B981" stroke-width="1.6"/>
        <text x="26" y="78" font-size="10" font-weight="700" fill="#065F46">final post</text>
        <line x1="26" y1="86" x2="112" y2="86" stroke="#065F46" stroke-width=".7" opacity=".4"/>
        <line x1="26" y1="94" x2="100" y2="94" stroke="#065F46" stroke-width=".7" opacity=".4"/>
        <line x1="26" y1="102" x2="108" y2="102" stroke="#065F46" stroke-width=".7" opacity=".4"/>
        <line x1="26" y1="110" x2="86" y2="110" stroke="#065F46" stroke-width=".7" opacity=".4"/>
        <line x1="26" y1="118" x2="104" y2="118" stroke="#065F46" stroke-width=".7" opacity=".4"/>
        <line x1="26" y1="126" x2="90" y2="126" stroke="#065F46" stroke-width=".7" opacity=".4"/>
        <line x1="26" y1="134" x2="106" y2="134" stroke="#065F46" stroke-width=".7" opacity=".4"/>
        <line x1="26" y1="142" x2="80" y2="142" stroke="#065F46" stroke-width=".7" opacity=".4"/>
        <text x="69" y="166" text-anchor="middle" font-size="9" fill="#065F46" font-style="italic">edited by a human</text>
        <text x="69" y="176" text-anchor="middle" font-size="9" fill="#065F46" font-style="italic">who knows the brand</text>

        <!-- megaphone -->
        <g transform="translate(69,222)">
          <path d="M-22 0 L10 -14 L10 14 Z" fill="#10B981" stroke="#1F2937" stroke-width="2"/>
          <rect x="10" y="-7" width="14" height="14" rx="2" fill="#FFFDF8" stroke="#1F2937" stroke-width="2"/>
          <line x1="-26" y1="-8" x2="-32" y2="-12" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
          <line x1="-26" y1="0" x2="-34" y2="0" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
          <line x1="-26" y1="8" x2="-32" y2="12" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
        </g>
      </g>

      <!-- ============ BOTTOM: REJECTION RATE ============ -->
      <g class="layer l-3" transform="translate(20, 410)">
        <rect x="0" y="0" width="824" height="50" rx="12" fill="#FFFDF8" stroke="#1F2937" stroke-width="2"/>
        <text x="20" y="22" font-size="12" font-weight="700">Rejection rate:</text>
        <!-- bar -->
        <rect x="120" y="14" width="200" height="14" rx="7" fill="#F3E8FF" stroke="#8B5CF6" stroke-width="1.2"/>
        <rect x="120" y="14" width="80" height="14" rx="7" fill="#F43F5E"/>
        <text x="208" y="24" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFDF8">2 / 5</text>
        <text x="334" y="25" font-size="13" font-weight="700" fill="#F43F5E" class="num">~40%</text>
        <text x="20" y="40" font-size="11" fill="#6B7280">that's the human filter doing its job. if rejection rate goes to 0, the AI is writing your brand. if it stays at 100, your brief is broken.</text>
      </g>
    </svg>
    <div class="caption">Two rejected, two edited, one shipped. The 40% rejection rate is what keeps your voice yours.</div>
  </div>
</main>
<button class="reset" id="reset" aria-label="Restart animation">Restart</button>

<script>
(function(){
  const root = document.getElementById('root');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const seq = [0,1,2,3,4];
  let i = 0, t;
  function step(){
    root.dataset.s = seq[i];
    const dwell = (seq[i]===3 || seq[i]===4) ? 2800 : 1400;
    i = (i+1) % seq.length;
    t = setTimeout(step, dwell);
  }
  function start(){
    if(reduced){ root.dataset.s = 4; return; }
    clearTimeout(t); i = 0; step();
  }
  document.getElementById('reset').addEventListener('click', start);
  start();
})();
</script>
</body>
</html>
