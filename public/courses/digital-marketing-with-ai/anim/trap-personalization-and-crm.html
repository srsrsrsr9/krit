<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trap: creepy 1:1 personalization</title>
<style>:root{--bg:#FFF7ED;--ink:#1F2937;--bad:#F43F5E;--good:#10B981}*{box-sizing:border-box}html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Inter",sans-serif;overflow:hidden}.stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}.frame{width:100%;max-width:720px}.caption{text-align:center;font-size:13px;font-style:italic;color:#6B7280;margin-top:8px}.reset{position:fixed;right:12px;bottom:12px;padding:6px 10px;font-size:11px;background:#fff;border:1px solid #d1d5db;border-radius:6px;cursor:pointer}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}.creepy{animation:fade .5s ease .3s both}.spam{animation:pop .5s ease 3s both}.segment{animation:fade .5s ease 5s both}.click{animation:pop .5s ease 7s both}</style>
</head><body><main class="stage"><div>
<svg class="frame" viewBox="0 0 720 405" aria-label="A creepy 1-to-1 personalized email triggering 23% spam-flag rate vs a segment-based email getting clicked happily">
<rect width="720" height="405" rx="14" fill="#FFF7ED"/>
<g class="creepy" transform="translate(40 30)"><rect width="320" height="160" rx="8" fill="#FFFFFF" stroke="#7F1D1D" stroke-width="2"/><text x="160" y="22" text-anchor="middle" font-size="11" fill="#7F1D1D" font-weight="bold">BEFORE · 1:1 personalization (creepy)</text>
<line x1="14" y1="32" x2="306" y2="32" stroke="#7F1D1D"/>
<g font-family="ui-monospace,monospace" font-size="10" fill="#1F2937"><text x="14" y="50">From: kurta@brand.com</text><text x="14" y="64">To: priya@gmail.com</text><text x="14" y="86" font-weight="bold" fill="#7F1D1D">"Hi Priya, we noticed you</text><text x="14" y="100" font-weight="bold" fill="#7F1D1D">spent 47 minutes on the</text><text x="14" y="114" font-weight="bold" fill="#7F1D1D">kurta-with-dupatta page</text><text x="14" y="128" font-weight="bold" fill="#7F1D1D">on Tuesday at 9 PM..."</text></g>
<text x="160" y="150" text-anchor="middle" font-size="10" fill="#7F1D1D" font-style="italic">user reaction: revulsion</text>
</g>
<g class="spam" transform="translate(40 210)"><rect width="320" height="80" rx="10" fill="#7F1D1D"/><text x="160" y="22" text-anchor="middle" font-size="13" fill="#FCA5A5" font-weight="bold">23% spam-flag rate</text><text x="160" y="40" text-anchor="middle" font-size="10" fill="#FCA5A5">(industry avg: 0.3%)</text><text x="160" y="60" text-anchor="middle" font-size="10" fill="#FCA5A5">14 customers contacted support: "felt watched"</text><text x="160" y="76" text-anchor="middle" font-size="10" fill="#FCA5A5" font-style="italic">brand-trust score: −18 points</text></g>
<g class="segment" transform="translate(380 30)"><rect width="300" height="160" rx="8" fill="#FFFFFF" stroke="#065F46" stroke-width="2"/><text x="150" y="22" text-anchor="middle" font-size="11" fill="#065F46" font-weight="bold">AFTER · segment-based (clean)</text>
<line x1="14" y1="32" x2="286" y2="32" stroke="#065F46"/>
<g font-family="ui-monospace,monospace" font-size="10" fill="#1F2937"><text x="14" y="50">From: hello@brand.com</text><text x="14" y="64">To: priya@gmail.com</text><text x="14" y="86" font-weight="bold" fill="#065F46">"Hi from your favorite</text><text x="14" y="100" font-weight="bold" fill="#065F46">kurta brand — based on</text><text x="14" y="114" font-weight="bold" fill="#065F46">your recent visits, here</text><text x="14" y="128" font-weight="bold" fill="#065F46">are 3 you might like..."</text></g>
<text x="150" y="150" text-anchor="middle" font-size="10" fill="#065F46" font-style="italic">same intent · zero creep</text>
</g>
<g class="click" transform="translate(380 210)"><rect width="300" height="80" rx="10" fill="#065F46"/><text x="150" y="22" text-anchor="middle" font-size="13" fill="#A7F3D0" font-weight="bold">spam-flag: 0.4%</text><text x="150" y="40" text-anchor="middle" font-size="10" fill="#A7F3D0">click-through ABOVE baseline</text><text x="150" y="60" text-anchor="middle" font-size="10" fill="#A7F3D0">deliverability protected</text><text x="150" y="76" text-anchor="middle" font-size="10" fill="#A7F3D0" font-style="italic">user reaction: delight</text></g>
<g class="click" transform="translate(40 310)"><rect width="640" height="70" rx="10" fill="#1F2937"/><text x="320" y="24" text-anchor="middle" font-size="13" fill="#FCD34D" font-weight="bold">The "would you tell the user we know this?" test</text><text x="320" y="46" text-anchor="middle" font-size="11" fill="#9CA3AF">If saying it aloud is creepy, sending it via email is creepy</text><text x="320" y="64" text-anchor="middle" font-size="10" fill="#9CA3AF" font-style="italic">Segments hide that the watching is happening · 1:1 advertises it</text></g>
</svg>
<div class="caption">1:1 specifics in customer-facing copy advertise the surveillance. Segments achieve the same intent without the creepiness.</div>
</div></main><button class="reset" onclick="location.reload()">↺ Replay</button>
</body></html>
