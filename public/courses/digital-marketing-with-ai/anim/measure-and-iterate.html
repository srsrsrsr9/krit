<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vanity vs decision: two dashboards</title>
<style>
  :root{
    --bg:#FFF7ED; --ink:#1F2937; --muted:#6B7280;
    --paper:#FFFDF8;
    --vanity:#F43F5E;
    --signal:#10B981;
    --warn:#F59E0B;
    --info:#0EA5E9;
    --ease:cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,"Inter",sans-serif;}
  .stage{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;}
  .frame{width:100%;max-width:880px;display:block;}
  .caption{text-align:center;font-size:13px;font-style:italic;color:var(--muted);margin-top:10px;max-width:780px;line-height:1.5;}
  .reset{position:fixed;bottom:14px;right:14px;background:#1F2937;color:#FFF7ED;border:none;border-radius:999px;
    font:600 12px system-ui;padding:8px 14px;cursor:pointer;letter-spacing:.02em}
  .reset:hover{background:#374151}
  .num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;}

  /* vanity dashboard noise: random twitching numbers */
  .twitch{animation: twitch 1.6s steps(5, end) infinite;}
  @keyframes twitch{
    0%{opacity:.95}
    20%{opacity:.55}
    40%{opacity:1}
    60%{opacity:.7}
    80%{opacity:.95}
    100%{opacity:.85}
  }

  .blink{animation: blink 1.1s ease-in-out infinite;}
  @keyframes blink{
    0%,100%{opacity:1}
    50%{opacity:.45}
  }

  /* decision card highlight */
  [data-s] .decision{opacity:0; transform: translateY(6px); transition: opacity .55s var(--ease), transform .55s var(--ease);}
  [data-s="2"] .decision-cac, [data-s="3"] .decision-cac, [data-s="4"] .decision-cac, [data-s="5"] .decision-cac{opacity:1; transform:translateY(0);}
  [data-s="3"] .decision-d7, [data-s="4"] .decision-d7, [data-s="5"] .decision-d7{opacity:1; transform:translateY(0);}
  [data-s="4"] .decision-roas, [data-s="5"] .decision-roas{opacity:1; transform:translateY(0);}

  [data-s] .verdict{opacity:0; transition: opacity .55s var(--ease) .15s;}
  [data-s="5"] .verdict{opacity:1;}

  /* "kill" stamp */
  .kill-stamp{transform-origin:center; transform:scale(0); opacity:0;}
  [data-s="4"] .kill-stamp, [data-s="5"] .kill-stamp{ animation: stampIn .55s var(--ease) forwards;}
  @keyframes stampIn{ 0%{transform:scale(2.4) rotate(-10deg); opacity:0} 70%{transform:scale(.92) rotate(-6deg); opacity:1} 100%{transform:scale(1) rotate(-6deg); opacity:1}}

  .theatre-curtain{transform-origin:center top; transition: transform 1s var(--ease), opacity .8s var(--ease);}
  [data-s="5"] .theatre-curtain{ opacity:.6;}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>
</head>

<button class="reset" id="reset" aria-label="Restart animation">Restart</button>

<script>
(function(){
  const root = document.getElementById('root');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const seq = [0,1,2,3,4,5];
  let i = 0, t;
  function step(){
    root.dataset.s = seq[i];
    const dwell = (seq[i]===5) ? 3500 : (seq[i]===0 ? 1800 : 1500);
    i = (i+1) % seq.length;
    t = setTimeout(step, dwell);
  }
  function start(){
    if(reduced){ root.dataset.s = 5; return; }
    clearTimeout(t); i = 0; step();
  }
  document.getElementById('reset').addEventListener('click', start);
  start();
})();
</script>
