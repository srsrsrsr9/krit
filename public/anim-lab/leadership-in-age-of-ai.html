<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anim Lab · Leadership in the Age of AI</title>
<link rel="stylesheet" href="_shell.css">
<style>:root{--accent:#b25e0c;--accent-soft:#f3d9b8;--accent-strong:#854506;}</style>
</head><body>
<header class="topbar">
  <span class="logo"><span class="dot"></span>Anim Lab</span><span class="course-name">Leadership in the Age of AI</span>
  <div class="right">
    <select id="lessonFilter"><option value="">All lessons</option><option value="L1">L1 · The new leader job</option><option value="L2">L2 · Teams that change shape</option><option value="L3">L3 · Decisions worth keeping</option><option value="L4">L4 · Trust & psychological safety</option><option value="L5">L5 · Your edge</option></select>
    <button class="toggle" id="soundToggle" aria-pressed="false">♪ Sound</button>
  </div>
</header>
<main>
  <p class="lede">"AI for leaders" trains you to <em>fund things</em>. This is different. What you'll own: who to hire vs upskill, the decisions you keep, and the team message that holds trust when 8 roles change.</p>
  <div class="grid" id="grid"></div>
</main>
<dialog class="focus" id="focus">
  <header><div class="meta"><span class="id-tag" id="focusId">—</span><h2 id="focusTitle">—</h2></div>
    <nav><button class="nav-btn" id="prevBtn">←</button><button class="nav-btn" id="nextBtn">→</button><button class="nav-btn" id="closeBtn">✕</button></nav></header>
  <div class="stage" id="stage"></div><footer id="focusFooter"></footer>
</dialog>
<script>
const COURSE = { lessons: { L1:'New job', L2:'Team shape', L3:'Decisions', L4:'Trust', L5:'Your edge' } };
const ART = [
{ id:'L1-a01',type:'anim',lesson:'L1',title:'What "leader" used to mean, vs now',what:'Watch: 6 skills, before and after.',footer:'Pre-AI leader job: assign, supervise, review, decide, communicate, develop. Post-AI: assign more, supervise less, review faster, decide same, communicate MORE, develop differently. The job is realigning, not disappearing.',scaffold:1,runtime:'<30s',mechanic:'compare-reveal',
  mount(s){s.innerHTML=`<h3>Leader skill demand: pre vs post-AI</h3>
  <div class="stat-grid">${[['Assign work','same','amber'],['Supervise tactically','-60%','red'],['Review output','-40%','red'],['Make judgement calls','same','amber'],['Communicate clearly','+50%','green'],['Develop people','+90%','green']].map(([n,v,c])=>`<div class="stat"><div class="stat-label">${n}</div><div class="stat-value ${c}">${v}</div></div>`).join('')}</div>
  <p class="panel" style="margin-top:8px">Leaders whose value was "supervise + review" are exposed. Leaders whose value was "communicate + develop" are amplified.</p>`;}},

{ id:'L1-a02',type:'anim',lesson:'L1',title:'The hours, redistributed',what:'Watch: 40-hr week, two scenarios.',footer:'Pre-AI: 25hr tactical (review, status, fix) + 15hr strategic. Post-AI: 8hr tactical + 32hr strategic IF you let go. Most leaders default to filling the saved time with more meetings.',scaffold:1,runtime:'<30s',mechanic:'bar-grow',
  mount(s){s.innerHTML=`<h3>40-hr week, before and after</h3>
  <svg viewBox="0 0 500 220">
  <text x="80" y="20" font-family="ui-monospace" font-size="11">Pre-AI</text>
  <rect x="80" y="30" width="0" height="30" fill="var(--accent-strong)"><animate attributeName="width" from="0" to="250" dur=".7s" fill="freeze"/></rect>
  <rect x="330" y="30" width="0" height="30" fill="var(--accent)"><animate attributeName="width" from="0" to="150" dur=".7s" begin=".3s" fill="freeze"/></rect>
  <text x="200" y="50" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="var(--paper)">tactical 25h</text>
  <text x="405" y="50" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="var(--paper)">strategic 15h</text>
  <text x="80" y="100" font-family="ui-monospace" font-size="11">Post-AI (if you let go)</text>
  <rect x="80" y="110" width="0" height="30" fill="var(--accent-strong)"><animate attributeName="width" from="0" to="80" dur=".7s" begin=".8s" fill="freeze"/></rect>
  <rect x="160" y="110" width="0" height="30" fill="var(--accent)"><animate attributeName="width" from="0" to="320" dur=".7s" begin="1.1s" fill="freeze"/></rect>
  <text x="120" y="130" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="var(--paper)">8h</text>
  <text x="320" y="130" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="var(--paper)">strategic 32h</text>
  <text x="80" y="180" font-family="ui-monospace" font-size="11">Post-AI (default)</text>
  <rect x="80" y="190" width="0" height="20" fill="var(--accent-strong)"><animate attributeName="width" from="0" to="80" dur=".7s" begin="1.4s" fill="freeze"/></rect>
  <rect x="160" y="190" width="0" height="20" fill="var(--saffron)"><animate attributeName="width" from="0" to="240" dur=".7s" begin="1.7s" fill="freeze"/></rect>
  <rect x="400" y="190" width="0" height="20" fill="var(--accent)"><animate attributeName="width" from="0" to="80" dur=".7s" begin="2s" fill="freeze"/></rect>
  <text x="280" y="205" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="var(--paper)">more meetings 24h</text></svg>`;}},

{ id:'L1-i01',type:'inter',lesson:'L1',title:'Where are YOUR 40 hours going?',what:'Try: rate 6 buckets.',footer:'If supervision + review > 50% of your week, you\'re in the at-risk zone. Strategic + developing-people < 25% means AI will eat your job, not just your tools.',scaffold:3,runtime:'30-60s',mechanic:'slider-with-verdict',
  mount(s){s.innerHTML=`<h3>Your week (40 hours)</h3>
  ${[['Tactical supervision','t',10],['Reviews / approvals','r',8],['Status meetings','m',6],['Strategic thinking','s',6],['Developing people','d',5],['Real work yourself','w',5]].map(([n,k,d])=>`<label style="display:block;margin:6px 0"><span style="display:inline-block;width:200px;font-family:ui-monospace,monospace;font-size:11px">${n}</span><input type="range" id="L1i01_${k}" min="0" max="20" value="${d}" style="width:40%"><span class="v" id="L1i01_v${k}" style="margin-left:8px;color:var(--ink);font-weight:700">${d}h</span></label>`).join('')}
  <div class="stat-grid" style="margin-top:14px"><div class="stat"><div class="stat-label">Total</div><div class="stat-value" id="L1i01_t">—</div></div><div class="stat"><div class="stat-label">Risk-zone %</div><div class="stat-value" id="L1i01_x">—</div></div></div>`;
  const u=()=>{const v=['t','r','m','s','d','w'].map(k=>+s.querySelector('#L1i01_'+k).value);['t','r','m','s','d','w'].forEach(k=>s.querySelector('#L1i01_v'+k).textContent=s.querySelector('#L1i01_'+k).value+'h');const tot=v.reduce((a,b)=>a+b,0);s.querySelector('#L1i01_t').textContent=tot+'h';const risk=Math.round(((v[0]+v[1]+v[2])/tot)*100);s.querySelector('#L1i01_x').textContent=risk+'%';s.querySelector('#L1i01_x').className='stat-value '+(risk<35?'green':risk<55?'amber':'red');};
  ['t','r','m','s','d','w'].forEach(k=>s.querySelector('#L1i01_'+k).oninput=()=>{SFX.hover();u();});u();}},

{ id:'L1-i02',type:'inter',lesson:'L1',title:'The cuts that actually buy hours',what:'Try: pick 5 with the highest hours/wk impact.',footer:'You can\'t add strategic time without removing tactical time. The right 5 cuts buy ~10hr/wk; the wrong 5 buy ~3hr and look defensive. Cut by leverage, not by comfort.',scaffold:3,runtime:'30-60s',mechanic:'checklist-score',
  mount(s){const items=[{t:'Weekly status meetings (replace with a Loom)',h:3,why:'High: meetings are the biggest single sink for most leaders.'},{t:'Final-approver on routine work',h:2.5,why:'High: scales delegation; signals trust.'},{t:'First-line code review',h:2,why:'High: senior eng can do this; you review the architectural calls.'},{t:'First-line draft review',h:2,why:'High: copy edits aren\\'t the leader job.'},{t:'Mid-week 1:1s with everyone',h:-1,why:'Trap: 1:1s ARE the leader job. Cutting them ruins trust. Keep.'},{t:'"Catch me up" reviews',h:1.5,why:'Medium: shifts to async write-ups.'},{t:'Hand-holding async PRs',h:1,why:'Medium: trains the team to self-serve.'},{t:'Reviewing PowerPoint formatting',h:.5,why:'Low: feels like work but few hours saved.'},{t:'Forwarding emails as commentary',h:.3,why:'Low: cosmetic.'},{t:'Joining every external call',h:1.5,why:'Medium: depends on the team\\'s sales maturity.'}];s.innerHTML=`<h3>Pick 5 to stop doing</h3>
  ${items.map((it,i)=>`<label class="panel" style="display:block;margin:4px 0;cursor:pointer"><input type="checkbox" data-i="${i}"> ${it.t}</label>`).join('')}
  <div class="stat-grid" style="margin-top:14px"><div class="stat"><div class="stat-label">Picked</div><div class="stat-value" id="L1i02_n">0</div></div><div class="stat"><div class="stat-label">Hours bought back/wk</div><div class="stat-value amber" id="L1i02_h">—</div></div></div>
  <button class="btn" id="L1i02_c" style="margin-top:8px">Check the cut</button>
  <div class="reveal" id="L1i02_r" style="display:none;margin-top:10px"></div>`;
  const u=()=>{const ids=[...s.querySelectorAll('input:checked')].map(c=>+c.dataset.i);const hrs=ids.reduce((a,i)=>a+items[i].h,0);s.querySelector('#L1i02_n').textContent=ids.length;s.querySelector('#L1i02_h').textContent=hrs.toFixed(1)+'h';s.querySelector('#L1i02_h').className='stat-value '+(hrs>=8?'green':hrs>=5?'amber':'red');};
  s.querySelectorAll('input').forEach(i=>i.onchange=()=>{SFX.click();u();});
  s.querySelector('#L1i02_c').onclick=()=>{const ids=[...s.querySelectorAll('input:checked')].map(c=>+c.dataset.i);const hrs=ids.reduce((a,i)=>a+items[i].h,0);const trap=ids.includes(4);const r=s.querySelector('#L1i02_r');r.style.display='block';r.className='reveal '+(hrs>=8&&!trap?'win':'bad');r.innerHTML=trap?`<strong>You cut the 1:1s.</strong> That's the leadership job, not the overhead. Keep them. Real hours bought back: ${(hrs-(-1)).toFixed(1)}h.`:hrs>=8?`<strong>${hrs.toFixed(1)}h/wk reclaimed.</strong> The high-leverage cuts are status meetings + final-approver routine + first-line reviews. You picked them.`:`<strong>Only ${hrs.toFixed(1)}h/wk.</strong> You're cutting the cosmetic items (forwarding, PowerPoint formatting) and keeping the real time-sinks. Re-pick: status meetings + approver-routine + first-line review = 7.5h alone.`;SFX.click();};u();}},

/* L2 — teams */
{ id:'L2-a01',type:'anim',lesson:'L2',title:'The pod that used to be a department',what:'Watch: 25 people → 8 people, same output.',footer:'Marketing dept of 25 (writer + designer + analyst + ops × 6 each) → 8-person pod (1 designer, 1 analyst, 3 generalists, 1 ops, 2 leads) with AI does same output. Headcount math is real. Don\'t let HR redesign it on a 12-month timeline.',scaffold:1,runtime:'<30s',mechanic:'compare-reveal',
  mount(s){s.innerHTML=`<h3>Headcount compression: marketing function</h3>
  <svg viewBox="0 0 500 200"><g><text x="80" y="20" font-family="ui-monospace" font-size="11" text-anchor="middle">Old: 25 people</text>${Array.from({length:25},(_,i)=>`<circle cx="${30+(i%5)*22}" cy="${40+Math.floor(i/5)*22}" r="8" fill="var(--accent)" opacity=".6"/>`).join('')}</g>
  <g transform="translate(280,0)"><text x="80" y="20" font-family="ui-monospace" font-size="11" text-anchor="middle">New: 8 people + AI</text>${Array.from({length:8},(_,i)=>`<circle cx="${30+(i%4)*22}" cy="${40+Math.floor(i/4)*22}" r="10" fill="var(--accent-strong)"/>`).join('')}<text x="80" y="120" font-family="ui-monospace" font-size="11" text-anchor="middle" fill="var(--accent-strong)">+ AI tools</text></g>
  <text x="250" y="190" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="var(--muted)">68% smaller. Same output.</text></svg>`;}},

{ id:'L2-a02',type:'anim',lesson:'L2',title:'Roles that grow, roles that shrink',what:'Watch: 12 role demands, 2 years out.',footer:'Growing: PM, designer, ML eng, security, sales. Shrinking: junior analyst, copy editor, junior dev, customer service tier-1. Plan headcount with this in mind, not by org-chart inertia.',scaffold:1,runtime:'<30s',mechanic:'bar-grow',
  mount(s){s.innerHTML=`<h3>2026-2028 role demand (industry composite)</h3>
  <svg viewBox="0 0 500 240">${[['Product manager',45,'green'],['Designer (full-stack)',38,'green'],['ML engineer',82,'green'],['Security eng',31,'green'],['Sales',24,'green'],['QA',5,'amber'],['Senior dev',12,'green'],['Junior dev',-32,'red'],['Junior analyst',-41,'red'],['Copy editor',-58,'red'],['Tier-1 support',-67,'red'],['Admin coordinator',-44,'red']].map(([n,v,c],i)=>{const w=Math.abs(v)*2;const x=v>=0?250:250-w;return `<rect x="${x}" y="${15+i*17}" width="${w}" height="14" fill="${c==='green'?'#1d8a52':c==='amber'?'var(--saffron)':'#a4123f'}"><animate attributeName="width" from="0" to="${w}" dur=".6s" begin="${i*.08}s" fill="freeze"/></rect><text x="${v>=0?245:255}" y="${26+i*17}" text-anchor="${v>=0?'end':'start'}" font-family="ui-monospace" font-size="10">${n}</text><text x="${v>=0?252+w:248-w}" y="${26+i*17}" text-anchor="${v>=0?'start':'end'}" font-family="ui-monospace" font-size="10" font-weight="700">${v>0?'+':''}${v}%</text>`;}).join('')}</svg>`;}},

{ id:'L2-i01',type:'inter',lesson:'L2',title:'Redesign a 25-person dept',what:'Try: pick 8 roles to keep.',footer:'Most teams over-keep mid-level reviewers. Under-keep generalists. The pod thrives when 60% are full-stack (do-and-think) and 40% are deep specialists. Inverted, you ship slowly.',scaffold:3,runtime:'30-60s',mechanic:'drag-bucket',
  mount(s){const items=[{r:'Senior Designer',keep:true},{r:'Junior Designer',keep:false},{r:'Brand Specialist',keep:false},{r:'Sr. Content Strategist',keep:true},{r:'Junior Copywriter',keep:false},{r:'Editor (cleanup)',keep:false},{r:'Performance Marketer',keep:true},{r:'Marketing Analyst',keep:true},{r:'Junior Analyst',keep:false},{r:'PR Coordinator',keep:false},{r:'Customer Insights Lead',keep:true},{r:'Marketing Ops',keep:true},{r:'Project Coord',keep:false},{r:'Generalist PMM',keep:true},{r:'Junior PMM',keep:false},{r:'VP Marketing',keep:true}];s.innerHTML=`<h3>Mark 8 to keep</h3>
  ${items.map((it,i)=>`<label class="panel" style="display:block;margin:4px 0;cursor:pointer"><input type="checkbox" data-i="${i}"> ${it.r}</label>`).join('')}
  <div class="stat" style="margin-top:14px"><div class="stat-label">Selected</div><div class="stat-value amber" id="L2i01_r">0/8</div></div>
  <button class="btn" id="L2i01_c" style="margin-top:8px">Grade</button>
  <div class="reveal" id="L2i01_g" style="display:none;margin-top:10px"></div>`;
  s.querySelectorAll('input').forEach(i=>i.onchange=()=>{SFX.click();const n=s.querySelectorAll('input:checked').length;s.querySelector('#L2i01_r').textContent=n+'/8';s.querySelector('#L2i01_r').className='stat-value '+(n===8?'green':'amber');});
  s.querySelector('#L2i01_c').onclick=()=>{const picked=[...s.querySelectorAll('input:checked')].map(c=>+c.dataset.i);const correct=items.map((_,i)=>i).filter(i=>items[i].keep);const hits=picked.filter(p=>correct.includes(p)).length;const r=s.querySelector('#L2i01_g');r.style.display='block';r.className='reveal '+(hits>=6?'win':'bad');r.innerHTML=`<strong>${hits}/8 right.</strong> Keep: senior designer, sr content strategist, performance marketer, analyst (sr), insights lead, ops, generalist PMM, VP. Drop juniors and pure-cleanup roles — AI handles them now.`;};}},

{ id:'L2-i02',type:'inter',lesson:'L2',title:'Hire vs upskill?',what:'Try: 4 gaps; pick hire-or-upskill.',footer:'Upskill if the person already has the judgement and only lacks the tool. Hire if you need new judgement. Most companies upskill when they should hire, and hire when they should upskill.',scaffold:3,runtime:'30-60s',mechanic:'predict-reveal',
  mount(s){const cs=[{q:'You need a Designer who can run AI workflows. Current designer is senior, won\'t touch AI tools.',a:'hire',why:'Won\\'t touch ≠ can\\'t learn. But if you\\'ve given runway and they refuse, you need new judgement. Hire.'},{q:'You need analytics ability. Current analyst is sharp but only uses spreadsheets.',a:'upskill',why:'Sharp judgement is the hard part. SQL + AI tooling is 6 weeks. Upskill.'},{q:'You need an ML engineer. Closest internal: backend engineer with no ML.',a:'hire',why:'ML eng is a different discipline. 18-month upskill at best. Hire.'},{q:'You need a faster product manager. Current PM ships slow but understands customers deeply.',a:'upskill',why:'Customer understanding is the moat. Velocity is process. Upskill.'}];let i=0;const r=()=>{const c=cs[i];s.innerHTML=`<h3>${i+1}/${cs.length}. ${c.q}</h3>
  <div class="row" style="margin:14px 0"><button class="btn ghost" data-p="hire">Hire</button><button class="btn ghost" data-p="upskill">Upskill</button></div>
  <div class="reveal" id="r" style="display:none"></div>`;
  s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{SFX.click();const ok=b.dataset.p===c.a;const r2=s.querySelector('#r');r2.style.display='block';r2.className='reveal '+(ok?'win':'bad');r2.innerHTML=`<strong>${c.a==='hire'?'Hire.':'Upskill.'}</strong> ${c.why}<br><button class="btn" id="nx" style="margin-top:8px">Next</button>`;s.querySelector('#nx').onclick=()=>{i=(i+1)%cs.length;r();};});};r();}},

/* L3 — decisions */
{ id:'L3-a01',type:'anim',lesson:'L3',title:'Decisions that move to AI; decisions that don\'t',what:'Watch: 6 decision types.',footer:'AI takes: routing, tactical pricing, content variants, ticket triage, code style review. AI doesn\'t take: hire/fire, strategy, ethics calls. Map yours; protect the boundary.',scaffold:1,runtime:'<30s',mechanic:'compare-reveal',
  mount(s){s.innerHTML=`<h3>What AI decides (yes/no/hybrid)</h3>
  <div class="stat-grid">${[['Customer routing','AI','amber'],['Tactical pricing','AI','amber'],['Content variants','AI','amber'],['Hire/promote/fire','Human','green'],['Strategic direction','Human','green'],['Ethics calls','Human','green']].map(([n,v,c])=>`<div class="stat"><div class="stat-label">${n}</div><div class="stat-value ${c}" style="font-size:14px">${v}</div></div>`).join('')}</div>`;}},

{ id:'L3-a02',type:'anim',lesson:'L3',title:'The cost of a wrong AI decision',what:'Watch: 1 mis-route, 12 cascade effects.',footer:'A single wrong AI decision compounds: wrong route → wrong service tier → wrong escalation → wrong reporting → wrong board metric. Logging matters; reversal capacity matters more.',scaffold:1,runtime:'<30s',mechanic:'compare-reveal',
  mount(s){s.innerHTML=`<h3>Compounding from one mis-decision</h3>
  <svg viewBox="0 0 500 200"><circle cx="60" cy="100" r="20" fill="#a4123f"/><text x="60" y="105" text-anchor="middle" font-family="ui-monospace" font-size="11" fill="var(--paper)">1×</text>
  ${[[170,80,1.4,'4×'],[280,60,2.0,'9×'],[380,40,2.5,'18×']].map(([x,y,s2,l],i)=>`<circle cx="${x}" cy="${y}" r="0" fill="#a4123f" opacity=".6"><animate attributeName="r" from="0" to="${20*s2}" dur=".5s" begin="${.3+i*.3}s" fill="freeze"/></circle><text x="${x}" y="${y+5}" text-anchor="middle" font-family="ui-monospace" font-size="13" fill="var(--paper)" font-weight="700" opacity="0"><animate attributeName="opacity" from="0" to="1" dur=".3s" begin="${.6+i*.3}s" fill="freeze"/>${l}</text>`).join('')}
  <text x="250" y="180" text-anchor="middle" font-family="ui-monospace" font-size="11">cascade through downstream systems</text></svg>`;}},

{ id:'L3-i01',type:'inter',lesson:'L3',title:'Draw your decision-rights map',what:'Try: drag 8 decisions into 3 zones.',footer:'A documented decision-rights map prevents the worst AI failure: an LLM made a strategy call because no one said it couldn\'t. Make the boundary explicit before deployment.',scaffold:3,runtime:'30-60s',mechanic:'drag-bucket',
  mount(s){const dec=[{t:'Refund a customer ₹500',a:'ai'},{t:'Refund a customer ₹50,000',a:'review'},{t:'Re-route inbound ticket',a:'ai'},{t:'Fire an underperformer',a:'human'},{t:'Approve a vendor contract',a:'review'},{t:'Change board-reported metric definition',a:'human'},{t:'Pick top-of-funnel ad creative',a:'ai'},{t:'Re-org a team',a:'human'}];s.innerHTML=`<h3>Place each in the right zone</h3>
  <div class="row" id="L3i01_p" style="margin:10px 0">${dec.map((d,i)=>`<span class="chip" data-i="${i}" data-a="${d.a}">${d.t}</span>`).join('')}</div>
  <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px">
    <div class="lane" data-l="ai"><h4>AI decides</h4><div class="drop"></div></div>
    <div class="lane" data-l="review"><h4>AI suggests, human reviews</h4><div class="drop"></div></div>
    <div class="lane" data-l="human"><h4>Human decides</h4><div class="drop"></div></div>
  </div>
  <button class="btn" id="L3i01_c" style="margin-top:10px">Check</button>
  <div class="reveal" id="L3i01_r" style="display:none;margin-top:10px"></div>`;
  s.querySelectorAll('.chip').forEach(c=>Lab.makeDraggable(c));s.querySelectorAll('.lane').forEach(l=>Lab.makeDropZone(l,t=>{const i=t?.dataset?.i;if(i==null)return;const cl=t.cloneNode(true);cl.style.cursor='default';cl.dataset.placed=l.dataset.l;l.querySelector('.drop').appendChild(cl);t.style.opacity='.2';}));
  s.querySelector('#L3i01_c').onclick=()=>{const placed=[...s.querySelectorAll('[data-placed]')];let ok=0;placed.forEach(p=>{if(p.dataset.a===p.dataset.placed)ok++;});const r=s.querySelector('#L3i01_r');r.style.display='block';r.className='reveal '+(ok>=7?'win':'bad');r.innerHTML=`<strong>${ok}/${dec.length} placed right.</strong> Rule: AI for low-stakes + reversible; review for medium-stakes; human for irreversible/identity calls.`;SFX.click();};}},

{ id:'L3-i02',type:'inter',lesson:'L3',title:'When AI disagrees with you',what:'Try: 4 disagreements; what do you do?',footer:'AI disagreement is signal, not insult. Investigate when the model is confident and you\'re not, OR when it sees data you don\'t. Override when you have private context.',scaffold:3,runtime:'30-60s',mechanic:'predict-reveal',
  mount(s){const cs=[{q:'AI scores candidate 6/10. You met them and they nailed the case. You think 9/10.',a:'override',w:'You have private context (the interview). AI didn\\'t see it. Override, document why.'},{q:'AI flags ad spend wasted on Channel A; you think it\\'s a brand-build move.',a:'investigate',w:'Investigate. AI has the conversion data; you have the brand thesis. Reconcile both before deciding.'},{q:'AI predicts customer X will churn 88% confident. Your gut says no.',a:'investigate',w:'High confidence + your hunch = call the customer. Resolve it directly, don\\'t guess.'},{q:'AI suggests pricing change to a top customer based on usage patterns alone.',a:'override',w:'Override. Pricing decisions for top customers are relationship-shaped, not just usage-shaped.'}];let i=0;const r=()=>{const c=cs[i];s.innerHTML=`<h3>${i+1}/${cs.length}. ${c.q}</h3>
  <div class="row" style="margin:14px 0"><button class="btn ghost" data-p="accept">Accept AI</button><button class="btn ghost" data-p="investigate">Investigate</button><button class="btn ghost" data-p="override">Override</button></div>
  <div class="reveal" id="r" style="display:none"></div>`;
  s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{SFX.click();const ok=b.dataset.p===c.a;const r2=s.querySelector('#r');r2.style.display='block';r2.className='reveal '+(ok?'win':'bad');r2.innerHTML=`<strong>${c.a[0].toUpperCase()+c.a.slice(1)}.</strong> ${c.w}<br><button class="btn" id="nx" style="margin-top:8px">Next</button>`;s.querySelector('#nx').onclick=()=>{i=(i+1)%cs.length;r();};});};r();}},

/* L4 — trust */
{ id:'L4-a01',type:'anim',lesson:'L4',title:'What your team is actually scared of',what:'Watch: 5 fears, ranked honestly.',footer:'Team survey across 18 companies (2025): #1 fear is "boss will replace me, but won\'t tell me when." Trust collapses NOT on the layoff but on the silence before. Leaders that name the timeline see retention hold.',scaffold:1,runtime:'<30s',mechanic:'bar-grow',
  mount(s){s.innerHTML=`<h3>What your team won\'t tell you they\'re scared of</h3>
  <svg viewBox="0 0 500 200">${[['"Will I be replaced — and would they tell me?"',71],['"Will I be retrained or sidelined?"',62],['"Will the new tools embarrass me?"',54],['"Will my expertise still matter?"',48],['"Will I have to work harder for less?"',43]].map(([n,v],i)=>`<rect x="280" y="${15+i*30}" width="${v*2.5}" height="22" fill="var(--accent)"><animate attributeName="width" from="0" to="${v*2.5}" dur=".7s" begin="${i*.15}s" fill="freeze"/></rect><text x="275" y="${31+i*30}" text-anchor="end" font-family="ui-monospace" font-size="11">${n}</text><text x="${285+v*2.5}" y="${31+i*30}" font-family="ui-monospace" font-size="11" font-weight="700">${v}%</text>`).join('')}</svg>`;}},

{ id:'L4-a02',type:'anim',lesson:'L4',title:'The all-hands that goes wrong',what:'Watch: 3 announcement patterns.',footer:'"We\'re excited to embrace AI!" → team panics. "We\'re moving 40% headcount in 18 months and here\'s who/why" → team trusts. Specificity reads as respect; vagueness reads as cowardice.',scaffold:1,runtime:'<30s',mechanic:'compare-reveal',
  mount(s){s.innerHTML=`<h3>3 AI announcement patterns</h3>
  ${[['Vague enthusiasm','"We\\'re embracing AI to unlock potential!"','red','Reads as: something bad is coming and they don\\'t want to say it.'],['Reassurance with no plan','"No one will lose their job — we\\'ll all grow together!"','red','Reads as: they don\\'t know yet, but they promised. Promise will break.'],['Specific, named, time-bound','"Over 18 months we\\'re reshaping marketing. 8 roles are at risk; 5 new roles open. Here\\'s the plan, here\\'s the support."','green','Reads as: respect. Trust holds.']].map(([n,t,c,r])=>`<div class="panel" style="margin:6px 0;border-left:4px solid ${c==='red'?'#a4123f':'#1d8a52'}"><strong>${n}.</strong> ${t}<br><span style="color:var(--muted);font-size:12px">${r}</span></div>`).join('')}`;}},

{ id:'L4-i01',type:'inter',lesson:'L4',title:'Write the message to your team',what:'Try: name a change, on a date, with a why.',footer:'A trust-preserving message has 4 parts: what changes, when, why now, what happens to people. Most messages miss "what happens to people". That\'s the part they remember.',scaffold:4,runtime:'30-60s',mechanic:'compose-build',
  mount(s){s.innerHTML=`<h3>Write your team message (max 200 words)</h3>
  <textarea id="L4i01_t" style="width:100%;min-height:180px" placeholder="Team — over the next [WHEN], we\\'re going to [WHAT]. The reason is [WHY]. For you specifically: [WHAT FOR PEOPLE]..."></textarea>
  <button class="btn" id="L4i01_c" style="margin-top:8px">Grade</button>
  <div class="reveal" id="L4i01_r" style="display:none;margin-top:10px"></div>`;
  s.querySelector('#L4i01_c').onclick=()=>{const t=s.querySelector('#L4i01_t').value.toLowerCase();const checks=[['names a time/date',/month|week|day|quarter|year|by|over|in.*next|\d/],['names what changes',/restructur|reorg|change|move|shift|tool|workflow|process|role/],['names why',/because|since|in order|so that|driven by|customer|market|cost|growth/],['names what happens to people',/you|your|team|individuals|jobs|roles|retrain|support|new opportunities/]];const passed=checks.filter(([_,re])=>re.test(t)).length;const r=s.querySelector('#L4i01_r');r.style.display='block';r.className='reveal '+(passed===4?'win':'bad');r.innerHTML=`<strong>${passed}/4 elements present.</strong><br>${checks.map(([n,re])=>(re.test(t)?'✓ ':'✗ ')+n).join('<br>')}<br><br>${passed===4?'Trust-preserving message.':'Missing pieces = team fills them in with worst-case assumptions.'}`;SFX.click();};}},

{ id:'L4-i02',type:'inter',lesson:'L4',title:'Respond to a team fear',what:'Try: 4 scenarios; pick the best response.',footer:'Three rules: name the fear honestly, share what you know AND don\'t know, give a date for the next update. Skipping any one is what your team will remember.',scaffold:3,runtime:'30-60s',mechanic:'predict-reveal',
  mount(s){const cs=[{q:'In 1:1, "Am I going to be replaced by AI?"',o:['"No, we\\'ll always need you."','"I don\\'t know yet. Here\\'s what I\\'m looking at. I\\'ll have an answer by Aug 15."','"Let\\'s focus on what you can control."'],a:1,why:'#1 is a promise you might break. #3 deflects. #2 is what trust looks like.'},{q:'Team chat: "Why are we even still doing weekly status meetings?"',o:['"Process is process."','"Try harder to engage."','"Fair point. Let\\'s drop it next week and try async. Review in a month."'],a:2,why:'Acknowledge the friction. Run a small experiment with a review date.'},{q:'Engineer: "I learned this tool for 4 years. Now AI does it in 10s. What was the point?"',o:['"Things change."','"You\\'re grieving 4 years of identity-as-skill. That\\'s real. The skill underneath the tool is still rare. Let\\'s map what that is for you."','"AI doesn\\'t replace experience."'],a:1,why:'Name the grief. Don\\'t dismiss or platitude. Then move to what\\'s still rare.'}];let i=0;const r=()=>{const c=cs[i];s.innerHTML=`<h3>${i+1}/${cs.length}. ${c.q}</h3>
  ${c.o.map((t,j)=>`<button class="panel" data-p="${j}" style="display:block;width:100%;text-align:left;cursor:pointer;margin:6px 0">${String.fromCharCode(65+j)}. ${t}</button>`).join('')}
  <div class="reveal" id="r" style="display:none"></div>`;
  s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{SFX.click();const ok=+b.dataset.p===c.a;const r2=s.querySelector('#r');r2.style.display='block';r2.className='reveal '+(ok?'win':'bad');r2.innerHTML=`<strong>${ok?'Right.':'Best was '+String.fromCharCode(65+c.a)+'.'}</strong> ${c.why}<br><button class="btn" id="nx" style="margin-top:8px">Next</button>`;s.querySelector('#nx').onclick=()=>{i=(i+1)%cs.length;r();};});};r();}},

/* L5 — your edge */
{ id:'L5-a01',type:'anim',lesson:'L5',title:'What stays rare',what:'Watch: 6 skills, scarcity-over-time.',footer:'Will stay rare 5 years out: taste, judgement under ambiguity, customer empathy, network, ability to start. Will commoditise: tool fluency, summarisation, drafting, basic analysis. Invest where scarcity holds.',scaffold:1,runtime:'<30s',mechanic:'compare-reveal',
  mount(s){s.innerHTML=`<h3>Scarcity, 5 years out</h3>
  <div class="stat-grid">${[['Taste / judgement','still rare','green'],['Ambiguity tolerance','still rare','green'],['Customer empathy','still rare','green'],['Network depth','still rare','green'],['Tool fluency','commodity','red'],['Summarising / drafting','commodity','red']].map(([n,v,c])=>`<div class="stat"><div class="stat-label">${n}</div><div class="stat-value ${c}" style="font-size:13px">${v}</div></div>`).join('')}</div>`;}},

{ id:'L5-a02',type:'anim',lesson:'L5',title:'Your skill stack, refactored',what:'Watch: where to invest the next 12 mo.',footer:'Best leadership skill investments next 12mo: deep customer interviewing, judgement frameworks, network density, communication clarity. Worst: chasing the latest model.',scaffold:1,runtime:'<30s',mechanic:'compare-reveal',
  mount(s){s.innerHTML=`<h3>Investment priority for the next 12 months</h3>
  <svg viewBox="0 0 500 200">${[['Customer interviewing',95],['Judgement under uncertainty',90],['Network density',85],['Communication clarity',80],['AI tool fluency',55],['Chasing latest model',15]].map(([n,v],i)=>`<rect x="220" y="${15+i*30}" width="${v*2.5}" height="22" fill="${v>=70?'#1d8a52':v>=50?'var(--saffron)':'#a4123f'}"><animate attributeName="width" from="0" to="${v*2.5}" dur=".7s" begin="${i*.15}s" fill="freeze"/></rect><text x="215" y="${31+i*30}" text-anchor="end" font-family="ui-monospace" font-size="11">${n}</text><text x="${225+v*2.5}" y="${31+i*30}" font-family="ui-monospace" font-size="11" font-weight="700">${v}</text>`).join('')}</svg>`;}},

{ id:'L5-i01',type:'inter',lesson:'L5',title:'Audit your edge',what:'Try: score 6 dimensions; spot the gap.',footer:'Leaders are usually strong in 2-3 of the 6 dimensions. The work is to know which ones and double down — not to be average in all 6.',scaffold:3,runtime:'30-60s',mechanic:'slider-with-verdict',
  mount(s){s.innerHTML=`<h3>Self-rate 1-10</h3>
  ${['Taste / judgement','Customer empathy','Network depth','Communication clarity','Ambiguity tolerance','Speed of starting'].map((n,i)=>`<label style="display:block;margin:4px 0"><span style="display:inline-block;width:200px;font-family:ui-monospace,monospace;font-size:11px">${n}</span><input type="range" id="L5i01_${i}" min="1" max="10" value="6" style="width:30%"><span class="v" id="L5i01_v${i}" style="margin-left:8px;color:var(--ink);font-weight:700">6</span></label>`).join('')}
  <div class="reveal" id="L5i01_r" style="margin-top:14px"></div>`;
  const u=()=>{const v=[0,1,2,3,4,5].map(i=>+s.querySelector('#L5i01_'+i).value);[0,1,2,3,4,5].forEach(i=>s.querySelector('#L5i01_v'+i).textContent=v[i]);const max=Math.max(...v);const top=v.indexOf(max);const names=['Taste','Empathy','Network','Communication','Ambiguity','Speed'];const r=s.querySelector('#L5i01_r');r.className='reveal '+(max>=8?'win':max<=5?'bad':'');r.innerHTML=`<strong>Your edge: ${names[top]} (${max}/10).</strong> Stack the next 12mo on this. Don\\'t try to fix the weakest — average-everywhere leaders are commodities.`;};
  [0,1,2,3,4,5].forEach(i=>s.querySelector('#L5i01_'+i).oninput=()=>{SFX.hover();u();});u();}},

{ id:'L5-i02',type:'inter',lesson:'L5',title:'Commit to 1 thing for 12 months',what:'Try: pick the bet that compounds.',footer:'One real bet, made loudly, beats ten polite ambitions. Your team learns from where you visibly invest your weeks. Pick something they can describe in 6 months: "they spent 2026 on X."',scaffold:4,runtime:'30-60s',mechanic:'compose-build',
  mount(s){s.innerHTML=`<h3>Your 2026 commitment</h3>
  <p class="desc">Fill in: <strong>I will spend the next 12 months getting visibly better at ____ by doing ____ weekly, measured by ____.</strong></p>
  ${[['Get visibly better at','a','customer interviewing'],['By doing weekly','b','3 customer calls + transcript review'],['Measured by','c','30 new customer insights in my notes by Dec 2026']].map(([n,k,ex])=>`<label style="display:block;margin:6px 0"><span style="display:inline-block;width:180px;font-family:ui-monospace,monospace;font-size:11px">${n}</span><input type="text" id="L5i02_${k}" placeholder="${ex}" style="width:55%"></label>`).join('')}
  <button class="btn" id="L5i02_c" style="margin-top:8px">Lock it</button>
  <div class="reveal" id="L5i02_r" style="display:none;margin-top:10px"></div>`;
  s.querySelector('#L5i02_c').onclick=()=>{const f=['a','b','c'].map(k=>s.querySelector('#L5i02_'+k).value.trim());const ok=f.every(v=>v.length>=8);const r=s.querySelector('#L5i02_r');r.style.display='block';r.className='reveal '+(ok?'win':'bad');r.innerHTML=ok?'<strong>Your 2026 spec.</strong><br>I\\'ll spend the year getting better at <em>'+f[0]+'</em> by doing <em>'+f[1]+'</em>, measured by <em>'+f[2]+'</em>.<br><br>Print this. Share with your team next 1:1. Public bets compound — private ones quietly die.':'<strong>Each field needs to be specific.</strong> "Be a better leader" is not a 12-month bet. "Run 3 customer calls a week" is.';SFX.click();};}},
];
</script>
