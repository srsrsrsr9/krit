<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anim Lab · Claude Pro</title>
<link rel="stylesheet" href="_shell.css">
<style>:root{--accent:#0284c7;--accent-soft:#cfe6f5;}</style>
</head><body>
<header class="topbar">
  <span class="logo"><span class="dot"></span>Anim Lab</span><span class="course-name">Claude Pro</span>
  <div class="right">
    <select id="lessonFilter"><option value="">All lessons</option>
      <option value="L1">L1 · What Claude is good at</option><option value="L2">L2 · Claude Code</option><option value="L3">L3 · Claude as coworker</option><option value="L4">L4 · Claude Design</option><option value="L5">L5 · Subagents & Memory</option>
    </select>
    <button class="toggle" id="soundToggle" aria-pressed="false">♪ Sound</button>
  </div>
</header>
<main>
  <p class="lede">Twenty drop-ins for <em>Claude Pro</em>. Each artifact shows a specific Claude capability or workflow — the kind of thing you\'d demo to a teammate before asking them to try it.</p>
  <div class="grid" id="grid"></div>
</main>
<dialog class="focus" id="focus">
  <header><div class="meta"><span class="id-tag" id="focusId">—</span><h2 id="focusTitle">—</h2></div>
    <nav><button class="nav-btn" id="prevBtn">←</button><button class="nav-btn" id="nextBtn">→</button><button class="nav-btn" id="closeBtn">✕</button></nav></header>
  <div class="stage" id="stage"></div><footer id="focusFooter"></footer>
</dialog>
<script>
const COURSE = { lessons: { L1:'What Claude is good at', L2:'Claude Code', L3:'Coworker', L4:'Design', L5:'Subagents & Memory' } };
const ART = [
  { id:'L1-a01',type:'anim',lesson:'L1',title:'Capability map',what:'Where Claude is strong and where it isn\'t, in one chart.',footer:'Stylized capability radar — informed by 2026 evals. Use as a "when to reach for Claude" reminder.',mount(s){s.innerHTML=`<h3>Claude\'s sweet spots, 2026</h3><svg viewBox="0 0 400 400"><g transform="translate(200,200)">${[0,1,2,3,4,5,6,7].map(i=>{const a=i/8*Math.PI*2-Math.PI/2;const r=[140,130,80,150,90,120,135,70][i];const x1=Math.cos(a)*150,y1=Math.sin(a)*150;const x2=Math.cos(a)*r,y2=Math.sin(a)*r;return `<line x1="0" y1="0" x2="${x1}" y2="${y1}" stroke="var(--rule)" stroke-dasharray="2 2"/><circle cx="${x2}" cy="${y2}" r="6" fill="var(--accent)"/><text x="${x1*1.15}" y="${y1*1.15}" text-anchor="middle" font-family="ui-monospace" font-size="10" fill="var(--ink)">${['reading','reasoning','code','math','tool use','memory','vision','speed'][i]}</text>`;}).join('')}<polygon points="${[0,1,2,3,4,5,6,7].map(i=>{const a=i/8*Math.PI*2-Math.PI/2;const r=[140,130,80,150,90,120,135,70][i];return Math.cos(a)*r+','+Math.sin(a)*r;}).join(' ')}" fill="var(--accent)" fill-opacity="0.2" stroke="var(--accent)" stroke-width="2"/></g></svg>`;}},
  { id:'L1-a02',type:'anim',lesson:'L1',title:'Long-context advantage',what:'Why a 200k-token window changes the playbook.',footer:'Drop a whole codebase / RFC / dataset in the prompt; Claude reads it. Smaller-context models can\'t.',mount(s){s.innerHTML=`<h3>200k tokens of context</h3><div class="panel"><strong>Translates to:</strong><ul><li>~150,000 English words (a novel)</li><li>~12,000 lines of code (a medium project)</li><li>~500 PDF pages</li></ul></div><p class="panel" style="margin-top:8px">The unlock: stop chunking + RAG-ing for the first iteration. Drop it all in.</p>`;}},
  { id:'L1-i01',type:'inter',lesson:'L1',title:'Reach for Claude — or don\'t',what:'5 task descriptions; pick yes/no/maybe.',footer:'Calibration drill for when Claude is the right tool.',mount(s){const qs=[{q:'Refactor a 4k-line Python module',a:'yes'},{q:'Match a face in a video to a name',a:'no'},{q:'Summarize 20 customer emails',a:'yes'},{q:'Real-time chat response under 200ms',a:'no'},{q:'Write a board memo from a notes doc',a:'yes'}];let i=0;const r=()=>{const q=qs[i];s.innerHTML=`<h3>${i+1}/${qs.length}. ${q.q}</h3><div class="row" style="margin:14px 0"><button class="btn ghost" data-p="yes">Yes</button><button class="btn ghost" data-p="maybe">Maybe</button><button class="btn ghost" data-p="no">No</button></div><div class="reveal" id="r" style="display:none"></div>`;s.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{SFX.click();const r2=s.querySelector('#r');const ok=b.dataset.p===q.a;r2.style.display='block';r2.className='reveal '+(ok?'win':'bad');r2.innerHTML=`<strong>Best: ${q.a}.</strong> ${q.a==='yes'?'Claude shines: long context, written output, judgment-based.':'Out of Claude\'s sweet spot — wrong shape or wrong latency budget.'}<br><button class="btn" id="nx" style="margin-top:8px">Next</button>`;s.querySelector('#nx').onclick=()=>{i=(i+1)%qs.length;r();};});};r();}},
  { id:'L1-i02',type:'inter',lesson:'L1',title:'Hallucination probability',what:'Toggle context provided; see hallucination risk.',footer:'Heuristic: more grounded context → lower hallucination. Source-cited prompts beat free-form prompts every time.',mount(s){s.innerHTML=`<h3>What lowers hallucination?</h3><div class="row" style="flex-direction:column;align-items:stretch;gap:6px">${['Source documents in prompt','Explicit "say I don\'t know"','Few-shot examples','Tool to verify','Vague open question'].map((t,i)=>`<label class="panel" style="cursor:pointer"><input type="checkbox" data-w="${[20,15,10,30,-40][i]}"> ${t}</label>`).join('')}</div><div class="stat" style="margin-top:14px"><div class="stat-label">Hallucination risk</div><div class="stat-value red" id="L1i02_r">HIGH</div></div>`;const u=()=>{let r=60;s.querySelectorAll('[data-w]:checked').forEach(c=>r-=+c.dataset.w);r=Math.max(0,Math.min(100,r));const e=s.querySelector('#L1i02_r');e.textContent=r>50?'HIGH':r>25?'MED':'LOW';e.className='stat-value '+(r>50?'red':r>25?'amber':'green');};s.querySelectorAll('input').forEach(i=>i.onchange=()=>{SFX.click();u();});u();}},
  /* L2 Claude Code */
  { id:'L2-a01',type:'anim',lesson:'L2',title:'Pair-engineer loop',what:'You write prose → Claude writes code → you review → loop.',footer:'The Claude Code workflow is conversational. Each round narrows the spec.',mount(s){s.innerHTML=`<h3>The loop</h3><svg viewBox="0 0 500 200"><g><circle cx="100" cy="100" r="40" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="100" y="105" text-anchor="middle" font-family="ui-monospace" font-size="11">YOU</text></g><g><circle cx="400" cy="100" r="40" fill="var(--paper-2)" stroke="var(--ink)"/><text x="400" y="105" text-anchor="middle" font-family="ui-monospace" font-size="11">CLAUDE</text></g><path d="M 140 80 Q 250 30 360 80" fill="none" stroke="var(--accent)" stroke-width="2" marker-end="url(#a1)"/><path d="M 360 130 Q 250 180 140 130" fill="none" stroke="var(--emerald)" stroke-width="2" marker-end="url(#a2)"/><text x="250" y="50" text-anchor="middle" font-family="ui-monospace" font-size="10">prose</text><text x="250" y="175" text-anchor="middle" font-family="ui-monospace" font-size="10">code + Qs</text><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--accent)"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--emerald)"/></marker></defs></svg>`;}},
  { id:'L2-a02',type:'anim',lesson:'L2',title:'Diff over time',what:'Watch a function evolve across three rounds.',footer:'Three rounds. Spec gets sharper. Code gets shorter. The conversation IS the documentation.',mount(s){s.innerHTML=`<h3>Three rounds, same function</h3>${['<strong>Round 1:</strong> "add a search function"\n→ 80 lines, handles 4 edge cases','<strong>Round 2:</strong> "narrow to fuzzy match"\n→ 35 lines, removes regex','<strong>Round 3:</strong> "make it case-insensitive"\n→ 32 lines, one liner added'].map((t,i)=>`<div class="panel" style="margin:8px 0;font-family:ui-monospace,monospace;font-size:13px;white-space:pre-line">${t}</div>`).join('')}`;}},
  { id:'L2-i01',type:'inter',lesson:'L2',title:'Prompt tightener',what:'Edit a vague request into a tight spec; see Claude\'s plausible response shift.',footer:'The single biggest skill in Claude Code: writing prompts that close the underspecification.',mount(s){s.innerHTML=`<h3>Tighten this prompt</h3><textarea id="L2i01_p" style="width:100%;height:80px">make a search function</textarea><button class="btn" id="L2i01_g" style="margin:10px 0">Send</button><div class="panel" id="L2i01_o" style="font-family:ui-monospace,monospace;font-size:13px">—</div>`;s.querySelector('#L2i01_g').onclick=()=>{const p=s.querySelector('#L2i01_p').value.toLowerCase();let out='';if(p.length<25)out='I need more — search what? fuzzy match? case-sensitive? what does the data look like?';else if(p.includes('fuzzy'))out='Here\'s a Levenshtein-based fuzzy match. Want it in JS or Python?';else if(p.includes('case'))out='Got it — case-insensitive substring match in JS:\nfunction find(q, xs){...}';else out='Will write basic substring search. If you mean fuzzy/semantic, say so.';s.querySelector('#L2i01_o').textContent=out;SFX.click();};}},
  { id:'L2-i02',type:'inter',lesson:'L2',title:'Spec checklist',what:'Score your prompt against a checklist before sending.',footer:'Five items to check: input shape, output shape, edge cases, constraints, example.',mount(s){s.innerHTML=`<h3>Did you include...</h3>${['Input shape (types, fields, examples)','Output shape (return type, error mode)','Edge cases that matter','Constraints (perf, style, deps)','One concrete example end-to-end'].map(t=>`<label class="panel" style="display:block;margin:6px 0;cursor:pointer"><input type="checkbox"> ${t}</label>`).join('')}<div class="stat" style="margin-top:14px"><div class="stat-label">Quality score</div><div class="stat-value amber" id="L2i02_s">0/5</div></div>`;const u=()=>{const n=s.querySelectorAll('input:checked').length;const e=s.querySelector('#L2i02_s');e.textContent=n+'/5';e.className='stat-value '+(n>=4?'green':n>=2?'amber':'red');};s.querySelectorAll('input').forEach(i=>i.onchange=()=>{SFX.click();u();});}},
  /* L3 coworker */
  { id:'L3-a01',type:'anim',lesson:'L3',title:'Meeting → minutes → action items',what:'Audio in, structured artifact out.',footer:'A 45-min meeting collapsed into a 6-bullet summary + 4 action items, in 90 seconds.',mount(s){s.innerHTML=`<h3>From recording to artifact</h3><svg viewBox="0 0 500 160"><rect x="20" y="60" width="100" height="40" rx="6" fill="var(--paper-2)" stroke="var(--ink)"/><text x="70" y="85" text-anchor="middle" font-family="ui-monospace" font-size="11">audio 45m</text><line x1="120" y1="80" x2="180" y2="80" stroke="var(--ink)" stroke-width="2" marker-end="url(#a3)"/><rect x="180" y="60" width="120" height="40" rx="6" fill="var(--accent-soft)" stroke="var(--accent)"/><text x="240" y="85" text-anchor="middle" font-family="ui-monospace" font-size="11">transcribe</text><line x1="300" y1="80" x2="360" y2="80" stroke="var(--ink)" stroke-width="2" marker-end="url(#a3)"/><rect x="360" y="60" width="120" height="40" rx="6" fill="var(--emerald-soft)" stroke="var(--emerald)"/><text x="420" y="85" text-anchor="middle" font-family="ui-monospace" font-size="11">summary + AIs</text><defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="var(--ink)"/></marker></defs></svg>`;}},
  { id:'L3-a02',type:'anim',lesson:'L3',title:'Email triage',what:'30 inbox emails → 3 reply-needed.',footer:'Triage is a great Claude task: read the email, classify (reply needed / FYI / spam), draft reply for the first bucket.',mount(s){s.innerHTML=`<h3>30 → 3</h3><div class="stat-grid">${[['30','Inbox in'],['8','Filtered as FYI'],['19','Auto-archived'],['3','Need reply'],['3','Drafted'],['0','Manual work']].map(([n,l])=>`<div class="stat"><div class="stat-label">${l}</div><div class="stat-value">${n}</div></div>`).join('')}</div>`;}},
  { id:'L3-i01',type:'inter',lesson:'L3',title:'Coworker task budget',what:'Allocate 8 weekly hours of Claude time across tasks.',footer:'Forces prioritization: not everything is worth delegating. Pick what bores you most.',mount(s){const tasks=['Status updates','Email triage','Doc summaries','PRD drafts','Code reviews','Meeting prep','Recruiting follow-ups'];s.innerHTML=`<h3>8 hrs/week — where do they go?</h3>${tasks.map(t=>`<label style="display:flex;align-items:center;gap:10px;margin:6px 0"><span style="width:160px;font-family:ui-monospace,monospace;font-size:11px">${t}</span><input type="range" min="0" max="4" value="1" data-t="${t}"><span class="v">1h</span></label>`).join('')}<div class="stat" style="margin-top:14px"><div class="stat-label">Total</div><div class="stat-value amber" id="L3i01_t">—</div></div>`;const u=()=>{let t=0;s.querySelectorAll('input').forEach(i=>{const v=+i.value;t+=v;i.nextElementSibling.textContent=v+'h';});s.querySelector('#L3i01_t').textContent=t+' / 8 hrs';s.querySelector('#L3i01_t').className='stat-value '+(t===8?'green':t>8?'red':'amber');};s.querySelectorAll('input').forEach(i=>i.oninput=()=>{SFX.hover();u();});u();}},
  { id:'L3-i02',type:'inter',lesson:'L3',title:'Tone tuner',what:'Adjust formality + brevity dials; see the email rewrite.',footer:'Tone hyperparameters that you ALREADY have intuitions for — make them visible.',mount(s){s.innerHTML=`<h3>Rewrite this email</h3><div class="row" style="margin-bottom:10px"><label>Formality<input type="range" id="L3i02_f" min="0" max="10" value="5" style="margin-left:8px"></label><label style="margin-left:18px">Brevity<input type="range" id="L3i02_b" min="0" max="10" value="5" style="margin-left:8px"></label></div><div class="panel" id="L3i02_o" style="font-family:ui-monospace,monospace;font-size:13px">—</div>`;const u=()=>{const f=+s.querySelector('#L3i02_f').value,b=+s.querySelector('#L3i02_b').value;let out;if(b>7&&f<3)out='hey, can\'t make it. cool?';else if(b>7&&f>7)out='Regrets, must decline. — S';else if(f>7)out='Dear team, I regret to inform you that I will be unable to attend the meeting tomorrow. Please proceed without me; I will review minutes asynchronously. Best regards, S.';else out='Hi all — I won\'t make the meeting tomorrow. Carry on without me and I\'ll catch up on minutes. Thanks!';s.querySelector('#L3i02_o').textContent=out;};s.querySelectorAll('input').forEach(i=>i.oninput=()=>{SFX.hover();u();});u();}},
  /* L4 design */
  { id:'L4-a01',type:'anim',lesson:'L4',title:'Wireframe → mockup',what:'Boxes become pixels.',footer:'Claude is great at low-fidelity mockups + copy. Less great at production design systems.',mount(s){s.innerHTML=`<h3>The hand-off</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:14px"><div class="panel"><strong>Wireframe</strong><svg viewBox="0 0 200 140"><rect x="10" y="10" width="180" height="20" fill="none" stroke="var(--muted)"/><rect x="10" y="40" width="120" height="80" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/><rect x="140" y="40" width="50" height="20" fill="var(--muted)"/></svg></div><div class="panel" style="border-color:var(--accent)"><strong>Mockup</strong><svg viewBox="0 0 200 140"><rect x="10" y="10" width="180" height="20" fill="var(--ink)" rx="2"/><text x="100" y="24" text-anchor="middle" font-family="ui-monospace" font-size="9" fill="var(--paper)">NAV</text><rect x="10" y="40" width="120" height="80" rx="4" fill="var(--accent-soft)" stroke="var(--accent)"/><rect x="140" y="40" width="50" height="20" fill="var(--accent)" rx="2"/></svg></div></div>`;}},
  { id:'L4-i01',type:'inter',lesson:'L4',title:'Critique a screen',what:'Click hotspots; see Claude\'s critique.',footer:'Targeted critique on visual design — Claude can spot hierarchy, contrast, and copy issues. Less great at brand fit.',mount(s){s.innerHTML=`<h3>Click any hotspot</h3><svg viewBox="0 0 500 280" style="background:var(--paper-2);border-radius:6px"><rect x="20" y="20" width="460" height="50" fill="var(--ink)"/><text x="40" y="50" font-family="ui-monospace" font-size="16" fill="var(--paper)">My Cool App</text><rect x="20" y="90" width="460" height="80" fill="var(--paper)" stroke="var(--rule)"/><text x="40" y="120" font-family="'Iowan Old Style',Georgia,serif" font-size="22" font-weight="800">Welcome.</text><text x="40" y="155" font-family="'Iowan Old Style',Georgia,serif" font-size="14" fill="var(--muted)">Lorem ipsum dolor sit amet, consectetur.</text><circle cx="450" cy="50" r="14" fill="var(--accent)" data-c="title" style="cursor:pointer"/><circle cx="450" cy="130" r="14" fill="var(--accent)" data-c="lede" style="cursor:pointer"/></svg><div class="panel" id="L4i01_o" style="margin-top:14px;min-height:60px">Click a saffron hotspot.</div>`;const critique={title:'Generic title. "My Cool App" gives no audience cue. Try "[Tool] for [audience]".',lede:'Lorem ipsum still here. Even a one-line real value prop ("Quickly draft client invoices") beats placeholder.'};s.querySelectorAll('[data-c]').forEach(c=>c.onclick=()=>{SFX.click();s.querySelector('#L4i01_o').innerHTML=`<strong>Critique:</strong> ${critique[c.dataset.c]}`;});}},
  { id:'L4-i02',type:'inter',lesson:'L4',title:'Generate variants',what:'Pick brand traits; see headline variants.',footer:'Brand-attribute prompting gets you decent variants fast. Pick traits, get copy.',mount(s){s.innerHTML=`<h3>Headline generator</h3><div class="row" style="margin-bottom:10px"><label><input type="checkbox" data-t="playful">playful</label><label style="margin-left:8px"><input type="checkbox" data-t="technical">technical</label><label style="margin-left:8px"><input type="checkbox" data-t="urgent">urgent</label><label style="margin-left:8px"><input type="checkbox" data-t="warm">warm</label></div><button class="btn" id="L4i02_g">Generate 3</button><div id="L4i02_o" style="margin-top:14px"></div>`;const lib={playful:['Ship things. Skip meetings.','Your inbox, finally on a diet.','Make Mondays optional.'],technical:['Sub-200ms cold starts, every region.','Type-safe ORM with zero boilerplate.','Query 100M rows in 80ms.'],urgent:['Stop losing leads at 2 AM.','Your competitor just shipped this.','30 days until your savings need this.'],warm:['Built for teams who actually like each other.','Learn at your pace.','Made for the curious.']};s.querySelector('#L4i02_g').onclick=()=>{SFX.click();const traits=[...s.querySelectorAll('input:checked')].map(c=>c.dataset.t);if(!traits.length){s.querySelector('#L4i02_o').innerHTML='<em>Pick at least one trait.</em>';return;}const out=traits.flatMap(t=>lib[t]).sort(()=>Math.random()-.5).slice(0,3);s.querySelector('#L4i02_o').innerHTML=out.map(h=>`<div class="panel" style="margin:6px 0">${h}</div>`).join('');};}},
  /* L5 subagents */
  { id:'L5-a01',type:'anim',lesson:'L5',title:'Subagent fan-out',what:'One task → three subagents in parallel.',footer:'Subagents (or "agents-as-tools") let one orchestrator dispatch parallel work. Each subagent has its own context window.',mount(s){s.innerHTML=`<h3>Orchestrator + 3 subagents</h3><svg viewBox="0 0 500 240"><circle cx="250" cy="60" r="30" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="2"/><text x="250" y="65" text-anchor="middle" font-family="ui-monospace" font-size="11" font-weight="700">main</text>${[100,250,400].map((x,i)=>`<circle cx="${x}" cy="180" r="25" fill="var(--paper-2)" stroke="var(--ink)"/><text x="${x}" y="184" text-anchor="middle" font-family="ui-monospace" font-size="10">sub${i+1}</text><line x1="250" y1="92" x2="${x}" y2="155" stroke="var(--ink)" stroke-width="1.5"/>`).join('')}</svg>`;}},
  { id:'L5-a02',type:'anim',lesson:'L5',title:'Memory persistence',what:'Conversation 1 → memory → conversation 2 starts where it left off.',footer:'Persisted state means workflows continue. Without memory, every conversation restarts.',mount(s){s.innerHTML=`<h3>Memory = continuity</h3><pre class="code">Mon 9:00 → user: "Drafting Q1 plan"
Mon 9:15 → user: "Save: target = ₹2cr ARR"
              <span class="anno">[memory write]</span>

Wed 14:00 → user: "What was the Q1 target?"
              <span class="anno">[memory recall]</span>
Wed 14:00 → claude: "₹2cr ARR, per our Monday note"</pre>`;}},
  { id:'L5-i01',type:'inter',lesson:'L5',title:'Build a workflow',what:'Chain steps; see if it terminates.',footer:'Quick sanity check on agent loops. Steps with no terminator = runaway agent.',mount(s){s.innerHTML=`<h3>Compose a 3-step workflow</h3>${[1,2,3].map(i=>`<label style="display:block;margin:6px 0;font-family:ui-monospace,monospace;font-size:11px">Step ${i}<select data-s="${i}" style="margin-left:8px"><option>read_email</option><option>summarize</option><option>send_reply</option><option>wait_for_reply</option><option>archive</option></select></label>`).join('')}<button class="btn" id="L5i01_c">Check</button><div class="reveal" id="L5i01_r" style="display:none;margin-top:10px"></div>`;s.querySelector('#L5i01_c').onclick=()=>{const steps=[1,2,3].map(i=>s.querySelector(`[data-s="${i}"]`).value);const r=s.querySelector('#L5i01_r');r.style.display='block';if(steps.includes('wait_for_reply')&&!steps.includes('archive')){r.className='reveal bad';r.innerHTML='<strong>Possible runaway.</strong> wait_for_reply with no terminator can loop forever if the reply never comes. Add a timeout or archive.';}else{r.className='reveal win';r.innerHTML='<strong>Terminates.</strong> No open-ended waits.';}SFX.success();};}},
  { id:'L5-i02',type:'inter',lesson:'L5',title:'Memory key chooser',what:'Pick what goes in long-term vs session memory.',footer:'Memory hygiene: not everything belongs in long-term. Project facts yes; ephemeral state no.',mount(s){s.innerHTML=`<h3>Long-term or session?</h3>${['Q1 revenue target = ₹2cr','Currently editing slide 3','User\'s preferred coding style','Login token expiry','Project codename = "lighthouse"','Last error message','Team list','Search cache from 5 min ago'].map(t=>`<div class="panel" style="margin:6px 0;display:flex;justify-content:space-between;align-items:center"><span>${t}</span><div><button class="btn ghost" data-t="${t}" data-c="lt">long-term</button><button class="btn ghost" data-t="${t}" data-c="ses">session</button></div></div>`).join('')}<p class="panel" style="margin-top:12px;font-size:13px;color:var(--muted)"><em>Heuristic: if it changes within a session, it\'s session memory. If it\'s a fact about the work, long-term.</em></p>`;s.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{SFX.click();b.style.background=b.dataset.c==='lt'?'var(--accent-soft)':'var(--paper-2)';});}},
];
</script>
<script src="_shell.js"></script>
</body></html>
