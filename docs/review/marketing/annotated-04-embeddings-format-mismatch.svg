<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" width="1440" height="900">
  <title>Annotated: Embeddings prototype — course-shell chrome vs essay-shell of the other three</title>
  <image href="../screenshots/01-embeddings-top.png" xlink:href="../screenshots/01-embeddings-top.png"
         x="0" y="0" width="1440" height="900" preserveAspectRatio="xMidYMid meet"/>

  <!-- 1 (red) — section nav (8 stages) makes this read like a course chapter, not a "deep dive" -->
  <g>
    <rect x="0" y="0" width="1440" height="48" fill="rgba(193,39,45,0.10)" stroke="#c1272d" stroke-width="3"/>
    <circle cx="22" cy="24" r="14" fill="white" stroke="#c1272d" stroke-width="2"/>
    <text x="22" y="30" font-family="Helvetica, Arial, sans-serif" font-weight="bold"
          font-size="18" fill="#c1272d" text-anchor="middle" dominant-baseline="middle">1</text>
    <rect x="50" y="60" width="540" height="100" fill="white" stroke="#c1272d" stroke-width="2"/>
    <text x="60" y="84" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c1272d" font-weight="bold">1. WRONG FORMAT FOR THE GALLERY.</text>
    <text x="60" y="104" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">Course-shell (8 sections, points counter, "DEEP DIVE")</text>
    <text x="60" y="120" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">vs essay-shell on the other three tabs.</text>
    <text x="60" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">The gallery sells "what reading-with-practice looks like" —</text>
    <text x="60" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">this artifact says "we built half a Coursera."</text>
  </g>

  <!-- 2 (red) — 30-45 min is a different unit than the other tabs' 5-12 min -->
  <g>
    <rect x="395" y="92" width="320" height="32" fill="rgba(193,39,45,0.10)" stroke="#c1272d" stroke-width="3"/>
    <circle cx="395" cy="92" r="14" fill="white" stroke="#c1272d" stroke-width="2"/>
    <text x="395" y="98" font-family="Helvetica, Arial, sans-serif" font-weight="bold"
          font-size="18" fill="#c1272d" text-anchor="middle" dominant-baseline="middle">2</text>
    <rect x="760" y="92" width="400" height="100" fill="white" stroke="#c1272d" stroke-width="2"/>
    <text x="770" y="116" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c1272d" font-weight="bold">2. UNIT-OF-CONSUMPTION DRIFT.</text>
    <text x="770" y="136" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">Tab metadata says "Tech · 30 min" — but other tabs</text>
    <text x="770" y="152" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">are 5-12 min essays. If $10 buys "a deep dive,"</text>
    <text x="770" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">pick one duration and price unit. Don't show both.</text>
  </g>
</svg>
