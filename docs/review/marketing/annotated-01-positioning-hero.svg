<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 1440 900" width="1440" height="900">
  <title>Annotated: Positioning prototype hero — opening hook + audience anchor</title>
  <image href="../screenshots/03-marketing-top.png" xlink:href="../screenshots/03-marketing-top.png"
         x="0" y="0" width="1440" height="900" preserveAspectRatio="xMidYMid meet"/>

  <!-- 1 (green) — "Same drink, different question" is a strong primer for the three-slot frame -->
  <g>
    <rect x="380" y="180" width="700" height="180" fill="rgba(20,85,74,0.10)" stroke="#14554a" stroke-width="3"/>
    <circle cx="380" cy="180" r="16" fill="white" stroke="#14554a" stroke-width="2"/>
    <text x="380" y="187" font-family="Helvetica, Arial, sans-serif" font-weight="bold"
          font-size="20" fill="#14554a" text-anchor="middle" dominant-baseline="middle">1</text>
    <rect x="1085" y="180" width="320" height="80" fill="white" stroke="#14554a" stroke-width="2"/>
    <text x="1095" y="205" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#14554a" font-weight="bold">1. STRONG.</text>
    <text x="1095" y="225" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#14554a">"Same drink, different question"</text>
    <text x="1095" y="240" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#14554a">primes the audience/alt/angle</text>
    <text x="1095" y="255" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#14554a">slot structure 30 lines early.</text>
  </g>

  <!-- 2 (red) — Brooklyn corner store / Mumbai luxury hotel anchor is audience-mismatched for ₹ pricing -->
  <g>
    <rect x="380" y="380" width="700" height="240" fill="rgba(193,39,45,0.10)" stroke="#c1272d" stroke-width="3"/>
    <circle cx="380" cy="380" r="16" fill="white" stroke="#c1272d" stroke-width="2"/>
    <text x="380" y="387" font-family="Helvetica, Arial, sans-serif" font-weight="bold"
          font-size="20" fill="#c1272d" text-anchor="middle" dominant-baseline="middle">2</text>
    <rect x="1085" y="380" width="340" height="120" fill="white" stroke="#c1272d" stroke-width="2"/>
    <text x="1095" y="405" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c1272d" font-weight="bold">2. AUDIENCE-AMBIGUOUS HOOK.</text>
    <text x="1095" y="425" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">Prices in ₹ but the story</text>
    <text x="1095" y="440" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">anchors in Brooklyn. Indian</text>
    <text x="1095" y="455" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">readers may not know Liquid</text>
    <text x="1095" y="470" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">Death; expat readers don't</text>
    <text x="1095" y="485" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c1272d">price-anchor on Bisleri ₹20.</text>
  </g>
</svg>
